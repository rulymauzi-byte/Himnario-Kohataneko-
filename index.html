"id":3,"tag":null,"isDisplayed":null,"text":"3     Kaw tzaljk’ojlal tzex jaw tiknek, hex to xchekb’ hex ki Mam Dios. Yujto kaw ay he te’nal jun, yujto yik hex sakk’inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzaljk’ojlal tzex jaw tiknek, hex to schekb’ hex ki Mam Dios. Tzonh tzalj pax he yet’ tiknek jun, yujto wach’ x’aj he jawi."},{"id":4,"tag":null,"isDisplayed":null,"text":"4       Kaw junxnhej tzkutjek ki nab’en, munljkoyk a tzaljk’ojlal. Sek ha kajlil a satcha’anh, tz’och kajn a spixn heb’ anma’."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzaljk’ojlal tzex jaw tiknek, hex to schekb’ hex ki Mam Dios. Tzonh tzalj pax he yet’ tiknek jun, yujto wach’ x’aj he jawi."}]}];</script><script>
(() => {
  const hymns = Array.isArray(window.HYMNS) ? window.HYMNS : [];
  // Claro es el tema oficial inicial; luego se respeta siempre la preferencia guardada.
  const savedTheme = safeLSGet('hymnal-view-theme');
  const initialTheme = savedTheme === 'dark' ? 'dark' : 'light';
  const state = { view:'list', currentId:null, query:'', searchMode:'', fontSize:Number(safeLSGet('hymnal-font-size')) || 24, viewTheme:initialTheme };
  const $ = (s) => document.querySelector(s);
  const listView = $('#listView'), readerView = $('#readerView'), results = $('#results');
  const numberSearch = $('#numberSearch'), nameSearch = $('#nameSearch'), resultCount = $('#resultCount');
  const numberClear = $('#numberClear'), nameClear = $('#nameClear');
  const searchByTitleBtn = $('#searchByTitleBtn'), searchByNumberBtn = $('#searchByNumberBtn');
  const nameBrowse = searchByTitleBtn;
  const titleSearchPanel = $('#titleSearchPanel'), numberSearchPanel = $('#numberSearchPanel');
  const themeMenuBtn = $('#themeMenuBtn'), themeMenuPanel = $('#themeMenuPanel');
  const installAppBtn = $('#installAppBtn');
  let deferredInstallPrompt = null;
  const numberDisplay = $('#numberDisplay');
  const numberPadClear = $('#numberPadClear');
  const numberPadKeys = Array.from(document.querySelectorAll('[data-number-key]'));
  const backBtn = $('#backBtn'), homeBtn = $('#homeBtn');
  const readerTitle = $('#readerTitle'), readerNumber = $('#readerNumber'), readerBody = $('#readerBody');
  const sizeLabel = $('#sizeLabel');

  function norm(s){
    return String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/\s+/g,' ').trim();
  }
  function escapeHtml(s){return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
  function renderText(text){
    let s = String(text ?? '');
    s = s.replace(/<f[^>]*>/gi,'').replace(/<\/f>/gi,'').replace(/<c[^>]*>/gi,'').replace(/<\/c>/gi,'');
    s = s.replace(/<i>/gi,'@@ITALIC_OPEN@@').replace(/<\/i>/gi,'@@ITALIC_CLOSE@@');
    s = escapeHtml(s);
    s = s.replace(/@@ITALIC_OPEN@@/g,'<em>').replace(/@@ITALIC_CLOSE@@/g,'</em>');
    return s.replace(/\r?\n/g,'<br>');
  }
  hymns.forEach(h => h._titleSearch = norm(h.title || ''));

  function closeThemeMenu(){
    if(!themeMenuBtn || !themeMenuPanel) return;
    themeMenuPanel.classList.add('hidden');
    themeMenuBtn.classList.remove('active');
    themeMenuBtn.setAttribute('aria-expanded','false');
  }

  function toggleThemeMenu(){
    if(!themeMenuBtn || !themeMenuPanel) return;
    const willOpen = themeMenuPanel.classList.contains('hidden');
    themeMenuPanel.classList.toggle('hidden', !willOpen);
    themeMenuBtn.classList.toggle('active', willOpen);
    themeMenuBtn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
  }

  function applyViewTheme(theme){
    const allowed = ['light','dark'];
    state.viewTheme = allowed.includes(theme) ? theme : 'light';
    document.body.setAttribute('data-view-theme', state.viewTheme);
    safeLSSet('hymnal-view-theme', state.viewTheme);
    document.querySelectorAll('.display-color-btn').forEach(btn=>btn.classList.toggle('active', btn.dataset.theme===state.viewTheme));
  }

  function updateFont(){
    state.fontSize = Math.max(16, Math.min(44, state.fontSize));
    document.documentElement.style.setProperty('--reader-size', state.fontSize+'px');
    sizeLabel.textContent = state.fontSize+' px';
    safeLSSet('hymnal-font-size', String(state.fontSize));
  }

  function filtered(){
    const q = norm(state.query);
    if(!q || !state.searchMode) return [];
    if(state.searchMode === 'number'){
      const digits = q.replace(/\D/g,'');
      if(!digits) return [];
      const exact = hymns.filter(h => String(h.id) === digits);
      const starts = hymns.filter(h => String(h.id).startsWith(digits) && String(h.id)!==digits);
      return [...exact, ...starts];
    }
    if(state.searchMode === 'name') return hymns.filter(h => h._titleSearch.includes(q));
    if(state.searchMode === 'browse') return hymns;
    return hymns;
  }

  function renderList(){
    const browsing = state.searchMode === 'browse';
    const hasQuery = browsing || Boolean(String(state.query || '').trim() && state.searchMode);
    numberClear.classList.toggle('hidden', !numberSearch.value);
    nameClear.classList.toggle('hidden', !nameSearch.value);
    if(numberDisplay) numberDisplay.textContent = numberSearch.value || '0';
    nameBrowse.setAttribute('aria-expanded', browsing ? 'true' : 'false');
    const titleActive = state.searchMode === 'name' || state.searchMode === 'browse';
    const numberActive = state.searchMode === 'number';
    titleSearchPanel.classList.toggle('hidden', !titleActive);
    numberSearchPanel.classList.toggle('hidden', !numberActive);
    searchByTitleBtn.classList.toggle('active', titleActive);
    searchByNumberBtn.classList.toggle('active', numberActive);
    if(!hasQuery){
      resultCount.textContent = '';
      results.innerHTML = '';
      return;
    }
    const arr = filtered();
    resultCount.textContent = `${arr.length} ${arr.length===1?'himno':'himnos'}`;
    if(!arr.length){results.innerHTML='<div class="empty">No se encontró ningún himno.</div>'; return;}
    results.innerHTML = arr.map(h => `
      <button class="hymn-card" data-id="${h.id}" type="button">
        <span class="num">${h.id}</span>
        <span><span class="card-title">${escapeHtml(h.title || ('Himno '+h.id))}</span><span class="card-sub">Abrir himno</span></span>
      </button>`).join('');
  }

  function plainSource(text){
    return String(text ?? '')
      .replace(/<f[^>]*>/gi,'').replace(/<\/f>/gi,'')
      .replace(/<c[^>]*>/gi,'').replace(/<\/c>/gi,'')
      .replace(/<i>/gi,'').replace(/<\/i>/gi,'')
      .replace(/\r/g,'');
  }

  function isStanzaStart(text){
    const s = plainSource(text).trimStart();
    // Reconoce: 1 texto, 2. texto, 3) texto, 4: texto, "Estrofa 5", etc.
    // Esto evita que una estrofa numerada con punto se mezcle dentro del coro.
    return /^(?:estrofa\s*)?\d+\s*[.)º°:\-]?\s+/i.test(s);
  }

  function splitAtCoroMarker(text){
    const raw = String(text ?? '').replace(/\r/g,'');
    const match = /(^|\n)\s*coro\b[^\n]*/i.exec(raw);
    if(!match) return null;
    const markerStart = match.index + match[1].length;
    const lineEnd = raw.indexOf('\n', markerStart);
    const end = lineEnd === -1 ? raw.length : lineEnd;
    const before = raw.slice(0, markerStart).trim();
    const markerLine = raw.slice(markerStart, end).trim();
    const after = lineEnd === -1 ? '' : raw.slice(lineEnd + 1).trim();
    const chorus = [markerLine, after].filter(Boolean).join('\n');
    return {before, chorus};
  }

  function chorusKey(parts){
    let s = parts.join('\n');
    s = plainSource(s)
      .replace(/(^|\n)\s*coro\b\s*[.:;—-]*\s*/gi,'$1')
      .replace(/(^|\n)\s*estrofa\s+\d+\s*/gi,'$1')
      .replace(/[\/]{2,}/g,' ')
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      // Ignora diferencias pequeñas de puntuación/espacios al detectar un coro repetido.
      .replace(/[^\p{L}\p{N}]+/gu,' ')
      .replace(/\s+/g,' ')
      .trim()
      .toLowerCase();
    return s;
  }

  function hymnDisplayBlocks(h){
    const blocks = [];
    const seenChoruses = new Set();
    let chorusParts = null;

    const pushNormal = (text, meta=false) => {
      const value = String(text ?? '').trim();
      if(value) blocks.push({type:'normal', text:value, meta, stanzaStart: !meta && isStanzaStart(value)});
    };

    const flushChorus = () => {
      if(!chorusParts || !chorusParts.length){ chorusParts=null; return; }
      const key = chorusKey(chorusParts);
      if(key && !seenChoruses.has(key)){
        seenChoruses.add(key);
        blocks.push({type:'chorus', text:chorusParts.join('\n')});
      }
      chorusParts = null;
    };

    (h.verses || []).forEach((v,i)=>{
      const raw = String(v.text || '');
      const meta = i===0 || /<i>|<f/i.test(raw);
      if(meta){
        flushChorus();
        pushNormal(raw, true);
        return;
      }

      const split = splitAtCoroMarker(raw);
      if(split){
        if(split.before){
          flushChorus();
          pushNormal(split.before, false);
        } else {
          flushChorus();
        }
        chorusParts = [split.chorus];
        return;
      }

      const taggedChorus = Number(v.tag) === 1;
      if(taggedChorus){
        flushChorus();
        chorusParts = [raw];
        return;
      }

      if(chorusParts){
        if(isStanzaStart(raw)){
          flushChorus();
          pushNormal(raw, false);
        } else {
          chorusParts.push(raw);
        }
        return;
      }

      pushNormal(raw, false);
    });

    flushChorus();
    return blocks;
  }

  function openHymn(id, push=true){
    const h = hymns.find(x => Number(x.id)===Number(id)); if(!h) return;
    state.view='reader'; state.currentId=h.id;
    listView.classList.add('hidden'); readerView.classList.remove('hidden'); backBtn.classList.remove('hidden'); homeBtn.classList.add('hidden');
    readerNumber.textContent = `Himno ${h.id}`; readerTitle.textContent = h.title || `Himno ${h.id}`;
    readerBody.innerHTML = hymnDisplayBlocks(h).map(b=>{
      if(b.type === 'chorus'){
        const chorusText = String(b.text ?? '')
          .replace(/(^|\n)\s*coro\b\s*[.:;—-]*\s*/gi,'$1')
          .trim();
        return `<div class="verse-block chorus"><span class="chorus-label">CORO</span><strong>${renderText(chorusText)}</strong></div>`;
      }
      return `<div class="verse-block${b.meta?' meta':''}${b.stanzaStart?' stanza-start':''}">${renderText(b.text)}</div>`;
    }).join('');
    document.title = `${h.id}. ${h.title} — BIT YIK KI MAM DIOS`;
    window.scrollTo({top:0,behavior:'instant'});
    if(push) history.pushState({hymn:h.id},'',`#himno-${h.id}`);
  }

  function showList(push=true){
    state.view='list'; state.currentId=null;
    readerView.classList.add('hidden'); listView.classList.remove('hidden'); backBtn.classList.add('hidden'); homeBtn.classList.add('hidden');
    document.title='BIT YIK KI MAM DIOS — Himnario';
    if(push) history.pushState({list:true},'',location.pathname+location.search);
    setTimeout(()=>searchByNumberBtn.focus({preventScroll:true}),50);
  }

  results.addEventListener('click', e=>{const b=e.target.closest('[data-id]'); if(b) openHymn(Number(b.dataset.id));});

  function appendNumberDigit(digit){
    const current = String(numberSearch.value || '');
    const next = current === '0' ? String(digit) : (current + String(digit));
    numberSearch.value = next.slice(0, 4);
    useNumberSearch(false);
  }

  function clearNumberSearch(){
    numberSearch.value='';
    state.query='';
    state.searchMode='number';
    renderList();
  }

  function useNumberSearch(openExact=false){
    nameSearch.value='';
    state.searchMode='number';
    state.query=numberSearch.value.trim();
    renderList();
    const q=state.query.replace(/\D/g,'');
    if(openExact && q && hymns.some(h=>String(h.id)===q)) openHymn(Number(q));
  }
  function useNameSearch(openFirst=false){
    numberSearch.value='';
    state.searchMode='name';
    state.query=nameSearch.value.trim();
    renderList();
    if(openFirst){const arr=filtered(); if(arr.length===1) openHymn(arr[0].id);}
  }

  function toggleNameBrowse(){
    numberSearch.value='';
    nameSearch.value='';
    if(state.searchMode === 'browse'){
      state.searchMode='';
      state.query='';
    }else{
      state.searchMode='browse';
      state.query='*';
    }
    renderList();
    if(state.searchMode === 'browse'){
      setTimeout(()=>results.scrollIntoView({behavior:'smooth',block:'start'}),30);
    }
  }

  searchByTitleBtn.addEventListener('click',()=>{
    numberSearch.value='';
    nameSearch.value='';
    if(state.searchMode === 'browse'){
      state.searchMode='name';
      state.query='';
    }else{
      state.searchMode='browse';
      state.query='*';
    }
    renderList();
    if(state.searchMode === 'browse'){
      setTimeout(()=>results.scrollIntoView({behavior:'smooth',block:'start'}),30);
    }
  });
  searchByNumberBtn.addEventListener('click',()=>{
    if(state.searchMode !== 'number'){
      nameSearch.value='';
      state.query='';
      state.searchMode='number';
      renderList();
    }
    setTimeout(()=>numberSearchPanel.scrollIntoView({behavior:'smooth',block:'nearest'}),30);
  });


  numberSearch.addEventListener('input',()=>useNumberSearch(false));
  numberSearch.addEventListener('keydown',e=>{if(e.key==='Enter') useNumberSearch(true);});
  $('#numberGo').addEventListener('click',()=>useNumberSearch(true));
  numberClear.addEventListener('click',()=>{clearNumberSearch(); numberSearch.focus();});
  if(numberPadClear) numberPadClear.addEventListener('click',()=>clearNumberSearch());
  numberPadKeys.forEach(btn=>btn.addEventListener('click',()=>appendNumberDigit(btn.dataset.numberKey)));

  nameSearch.addEventListener('input',()=>useNameSearch(false));
  nameSearch.addEventListener('keydown',e=>{if(e.key==='Enter') useNameSearch(true);});
  $('#nameGo').addEventListener('click',()=>useNameSearch(true));
  nameClear.addEventListener('click',()=>{nameSearch.value='';state.query='';state.searchMode='name';renderList();nameSearch.focus();});
  backBtn.addEventListener('click',()=>history.back());
  homeBtn.addEventListener('click',()=>{searchByNumberBtn.focus();window.scrollTo({top:0,behavior:'smooth'});});
  $('#fontMinus').addEventListener('click',()=>{state.fontSize-=2;updateFont();});
  $('#fontPlus').addEventListener('click',()=>{state.fontSize+=2;updateFont();});
  $('#fontReset').addEventListener('click',()=>{state.fontSize=24;updateFont();});
  window.addEventListener('popstate',()=>{
    const m=location.hash.match(/^#himno-(\d+)$/); if(m) openHymn(Number(m[1]),false); else showList(false);
  });
  window.addEventListener('keydown',e=>{
    if(state.view==='reader'){
      if((e.ctrlKey||e.metaKey) && (e.key==='+'||e.key==='=')){e.preventDefault();$('#fontPlus').click();}
      if((e.ctrlKey||e.metaKey) && e.key==='-'){e.preventDefault();$('#fontMinus').click();}
    }
  });

  document.querySelectorAll('.display-color-btn[data-theme]').forEach(btn=>btn.addEventListener('click',()=>{applyViewTheme(btn.dataset.theme); closeThemeMenu();}));
  if(themeMenuBtn) themeMenuBtn.addEventListener('click',(e)=>{e.stopPropagation(); toggleThemeMenu();});
  document.addEventListener('click',(e)=>{
    if(!themeMenuPanel || themeMenuPanel.classList.contains('hidden')) return;
    if(themeMenuWrapContains(e.target)) return;
    closeThemeMenu();
  });
  document.addEventListener('keydown',(e)=>{ if(e.key==='Escape') closeThemeMenu(); });
  function themeMenuWrapContains(target){

<script id="mauzi-final-fixes-script-v114">
(() => {
  'use strict';

  const readerView = document.getElementById('readerView');
  const topMenuBtn = document.getElementById('themeMenuBtn');
  const topMenuPanel = document.getElementById('themeMenuPanel');
  const installBtn = document.getElementById('installAppBtn');
  const readerMenuBtn = document.getElementById('readerThemeMenuBtn');
  const readerMenuPanel = document.getElementById('readerThemeMenuPanel');
  const installKey = 'hymnal-installed-v2';
  let installPromptV114 = null;

  function savedReaderTheme(){
    return safeLSGet('hymnal-view-theme') === 'dark' ? 'dark' : 'light';
  }

  function applyReaderTheme(theme){
    const value = theme === 'light' ? 'light' : 'dark';
    safeLSSet('hymnal-view-theme', value);
    document.body.setAttribute('data-view-theme', value);
    if(readerView){
      readerView.setAttribute('data-reader-theme', value);
      readerView.style.setProperty('background-color', value === 'light' ? '#ffffff' : '#07131f', 'important');
      readerView.style.setProperty('color', value === 'light' ? '#111111' : '#ffffff', 'important');
    }
    document.querySelectorAll('[data-theme]').forEach(btn => {
      btn.classList.toggle('active', btn.getAttribute('data-theme') === value);
    });
    document.querySelectorAll('[data-reader-theme]').forEach(btn => {
      if(btn === readerView) return;
      btn.classList.toggle('active', btn.getAttribute('data-reader-theme') === value);
    });
  }

  function closeTopMenu(){
    if(!topMenuPanel || !topMenuBtn) return;
    topMenuPanel.classList.add('hidden');
    topMenuBtn.classList.remove('active');
    topMenuBtn.setAttribute('aria-expanded','false');
  }

  function toggleTopMenu(){
    if(!topMenuPanel || !topMenuBtn) return;
    const open = topMenuPanel.classList.contains('hidden');
    topMenuPanel.classList.toggle('hidden', !open);
    topMenuBtn.classList.toggle('active', open);
    topMenuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if(open) closeReaderMenu();
  }

  function closeReaderMenu(){
    if(!readerMenuPanel || !readerMenuBtn) return;
    readerMenuPanel.classList.add('hidden');
    readerMenuBtn.setAttribute('aria-expanded','false');
  }

  function toggleReaderMenu(){
    if(!readerMenuPanel || !readerMenuBtn) return;
    const open = readerMenuPanel.classList.contains('hidden');
    readerMenuPanel.classList.toggle('hidden', !open);
    readerMenuBtn.setAttribute('aria-expanded', open ? 'true' : 'false');
    if(open) closeTopMenu();
  }

  // Captura el menú superior ANTES de los listeners antiguos.
  if(topMenuBtn){
    topMenuBtn.addEventListener('click', e => {
      e.preventDefault();
      e.stopImmediatePropagation();
      toggleTopMenu();
    }, true);
  }

  if(topMenuPanel){
    topMenuPanel.addEventListener('click', e => {
      const themeBtn = e.target.closest('[data-theme]');
      if(!themeBtn) return;
      e.preventDefault();
      e.stopImmediatePropagation();
      applyReaderTheme(themeBtn.getAttribute('data-theme'));
      closeTopMenu();
    }, true);
  }

  if(readerMenuBtn){
    readerMenuBtn.addEventListener('click', e => {
      e.preventDefault();
      e.stopPropagation();
      toggleReaderMenu();
    });
  }

  if(readerMenuPanel){
    readerMenuPanel.addEventListener('click', e => {
      const themeBtn = e.target.closest('[data-reader-theme]');
      if(!themeBtn) return;
      e.preventDefault();
      e.stopPropagation();
      applyReaderTheme(themeBtn.getAttribute('data-reader-theme'));
      closeReaderMenu();
    });
  }

  document.addEventListener('click', e => {
    if(topMenuPanel && !topMenuPanel.classList.contains('hidden')){
      if(!topMenuPanel.contains(e.target) && !topMenuBtn.contains(e.target)) closeTopMenu();
    }
    if(readerMenuPanel && !readerMenuPanel.classList.contains('hidden')){
      if(!readerMenuPanel.contains(e.target) && !readerMenuBtn.contains(e.target)) closeReaderMenu();
    }
  });

  document.addEventListener('keydown', e => {
    if(e.key === 'Escape'){
      closeTopMenu();
      closeReaderMenu();
    }
  });

  // Tema inicial. Se conserva entre aperturas de himnos.
  applyReaderTheme(savedReaderTheme());

  function isStandalone(){
    return !!(
      (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
      window.navigator.standalone === true ||
      document.referrer.startsWith('android-app://')
    );
  }

  function setInstallVisible(show){
    if(!installBtn) return;
    installBtn.classList.toggle('hidden', !show);
  }

  function syncInstallButton(){
    if(!installBtn) return;
    if(isStandalone()){
      safeLSSet(installKey,'1');
      setInstallVisible(false);
      return;
    }
    const knownInstalled = safeLSGet(installKey) === '1';
    setInstallVisible(!knownInstalled);
  }

  // Si Chrome ofrece instalación, eso confirma que NO está instalada.
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    installPromptV114 = e;
    if(!isStandalone()){
      safeLSRemove(installKey);
      setInstallVisible(true);
    }
  });

  // Cuando termina de instalarse, se oculta inmediatamente.
  window.addEventListener('appinstalled', () => {
    safeLSSet(installKey,'1');
    installPromptV114 = null;
    setInstallVisible(false);
    closeTopMenu();
  });

  // Captura el botón de instalación ANTES del listener antiguo.
  if(installBtn){
    installBtn.addEventListener('click', async e => {
      e.preventDefault();
      e.stopImmediatePropagation();
      closeTopMenu();

      if(isStandalone()){
        safeLSSet(installKey,'1');
        setInstallVisible(false);
        return;
      }

      if(installPromptV114){
        try{
          await installPromptV114.prompt();
          const choice = await installPromptV114.userChoice;
          if(choice && choice.outcome === 'accepted'){
            safeLSSet(installKey,'1');
            setInstallVisible(false);
          }
        }catch(_e){}
        installPromptV114 = null;
        return;
      }

      // El botón sigue disponible aunque el evento todavía no haya llegado.
      const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
      if(isIOS){
        alert('Para instalar: abra esta página en Safari, toque Compartir y luego “Agregar a pantalla de inicio”.');
      }else{
        alert('Para instalar: abra esta página desde GitHub Pages en Chrome. Toque el menú ⋮ del navegador y elija “Instalar aplicación” o “Agregar a pantalla principal”.');
      }
    }, true);
  }

  syncInstallButton();
  window.addEventListener('pageshow', syncInstallButton);
  document.addEventListener('visibilitychange', () => {
    if(!document.hidden) syncInstallButton();
  });

  // Actualización PWA sin conservar la versión vieja.
  if('serviceWorker' in navigator && location.protocol !== 'file:'){
    window.addEventListener('load', async () => {
      try{
        const reg = await navigator.serviceWorker.register('./service-worker.js?v=114', {updateViaCache:'none'});
        await reg.update();
        if(reg.waiting) reg.waiting.postMessage({type:'SKIP_WAITING'});
      }catch(_e){}
    });
  }
})();
</script>
