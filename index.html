/ Kaw kojn hin Cristo tztak’ hin skolni."}]},{"id":164,"title":"Tzin Jaw Wal Ayach","guid":"w38Kcwv5okKmuVZYAlfXMw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"164     Tzin Jaw Wal Ayach\n \nC.S.G. # 420  Te Vengo A Decir"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 18:1-6, 46-50;  Dt. 6:4-12; Sal. 116:1-9\n \n Chamk’ojlejk Jehová ki Diosalek yet’ smasnil he k’ojol, yet’ smasnil he nab’en yet’ smasnil he yip.   Dt. 6:5</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Tzin jaw wal ayach tzwul walnok ayach, hach hin wach’ kolmal. Tzach hin chamk’ojlej, tzach hin chamk’ojlej yet’ wal hin pixan. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Tzin jaw wal ayach, tzwul walnok ayach, kaw yel ton tzwala. Tzach hin chamk’ojlej, tzach hin nib’j Mamin wal yet’ hin pixan."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tzin nib’j tzin b’itni, tzin nib’j tzin b’itni, yuj tzaljk’ojlilal. Tzin nib’j tzin ok’i, tzin nib’j tzin ok’i, yuj tzaljk’ojlilal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Tzin jaw wal ayach, tzwul walnok ayach, kaw yel ton tzwala. Tzach hin chamk’ojlej, tzach hin nib’j Mamin, yet’ wal hin pixan."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Tzin och tza’n ho’oj, tzin och tza’n ho’oj, hach hin wach’ Kolmal. Tzwak’ hin pixn ayach, tzwak’ hin pixn ayach, wal aych hin Diosal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw tzwij chanh ha b’i, kaw tzwij chanh ha b’i, hach hin Dios Wajlil.  Tzwak’ hin b’a ayach a smasnil k’inal, kaw chaj hin Mamin."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tzin nib’j tzin b’itni, tzin nib’j tzin b’itni, yuj tzaljk’ojlilal. Tzin nib’j tzin ok’i, tzin nib’j tzin ok’i, yuj tzaljk’ojlilal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Tzin jaw wal ayach, tzwul walnok ayach, kaw yel ton tzwala. Tzach hin chamk’ojlej, tzach hin nib’j Mamin, yet’ wal hin pixan."}]},{"id":165,"title":"Manb'iln Xo Yuj  Schik'l Cristo","guid":"3WBtvh6IR06HugycyoECQw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"165     Manb'iln Xo Yuj  Schik'l Cristo\n \nC. S. G. # 339 Comprado Con Sangre Por Cristo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>I P. 1:13-23; Ef. 1:3-14; Col. 1:9-14 \n \nHax Jesucristo … kaw ay schamk’ojlal aynhek. Ix yi’n el ki mulk yet’ schik’il.  Ap. 1:5</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Manb'iln xo yuj wal schik'l hin Cristo,  tzin tzalj hin at a satcha'anh. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kolb'iln xo yuj swach'k'ojlal Cristo,  wojk xo to kaw yunnal Dios hin."},{"id":0,"tag":1,"isDisplayed":null,"text":"Wojtak,(wojtak) wojtak; (wojtak)manb'iln xo yuj schik'l Jesús."},{"id":4,"tag":null,"isDisplayed":null,"text":" Kaw wojk xo,(wojtak) kaw wojk xo,(wojtak) oj hin at yet’ a satcha'anh."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Hin Diosal xyij el smasnil hin mul,  ix yak' wal tzaljk'ojlal ayin."},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw tzyak' Cristo swach'k'ojlal ayin,  tzin nib'j tzin b'eyk' yet' hin Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"Wojtak,(wojtak) wojtak; (wojtak)manb'iln xo yuj schik'l Jesús."},{"id":5,"tag":null,"isDisplayed":null,"text":" Kaw wojk xo,(wojtak) kaw wojk xo,(wojtak) oj hin at yet’ a satcha'anh."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Kaw matz sat hin k'ojl a hin Cristo,  yujto ix yak’ cham sb’a wu’uj. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Oj wallnhej yab’xil wal hin Cristo,  yuj cha kaw oj hin b’itnok sb’i."},{"id":0,"tag":1,"isDisplayed":null,"text":"Wojtak,(wojtak) wojtak; (wojtak)manb'iln xo yuj schik'l Jesús. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kaw wojk xo,(wojtak) kaw wojk xo,(wojtak) oj hin at yet’ a satcha'anh."},{"id":5,"tag":null,"isDisplayed":null,"text":"4    Kaw yel oj hin cha wal spak wiko',  jun oj yak’ wal a heb’ yiko'."},{"id":6,"tag":null,"isDisplayed":null,"text":"Jesús ayk’nhej wal a satcha’anh, kaw wal yel oj hin k’och yet’ok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Wojtak,(wojtak) wojtak; (wojtak)manb'iln xo yuj schik'l Jesús. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Kaw wojk xo,(wojtak) kaw wojk xo,(wojtak) oj hin at yet’ a satcha'anh."}]},{"id":166,"title":"Manhok Yet' K’en K’en Chanh Stojol","guid":"tBZlFGeWpkGnRsL505U36g","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"166      Manhok Yet' K’en K’en Chanh Stojol\n \nV. C. # 279  El Oro Y La Plata No Me Han Redimido"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Is. 53:6; Jer. 50:6\n \n …Ha k’en tumin, k’en oro, yet’  k’en plata matz tak’ smann ki Kolnb’il. 1 P. 1: 18</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1   Manhok yet' k'en oro, manhok yet' k'en plata, kaw hin sman elt a skal hin maysch'olnilal."},{"id":3,"tag":null,"isDisplayed":null,"text":" Kojxnhej wal yet' schik'l hin Kolmal Jesucristo, yuj cha kaw hin kolchj kan wal yuj hin Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw manh yujok oro x'el hin mul,  (hin kolchj kani manh yujok oro hin kolchj kani,)  kaw hin sman hin wach' Kolmal. (Kaw hin sman hin Kolmal Jesucristo.)  "},{"id":4,"tag":null,"isDisplayed":null,"text":"Manh yujok oro, yujnhej schik'il, (manh yujok oro, kaw yujnhej wal schik'il,) yuj wal cha hin kolchj kani."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Manh yujok k'en oro, manh yujok k'en plata,manh yujok k'e'en hin och wach'l a sat Dios."},{"id":4,"tag":null,"isDisplayed":null,"text":" Kojxnhej wal yet' schik'l hin Kolmal Jesucristo, Kaw yuj hin mul ix cham wal hin wach’ Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw manh yujok oro x'el hin mul,  (hin kolchj kani manh yujok oro hin kolchj kani,)  kaw hin sman hin wach' Kolmal. (Kaw hin sman hin Kolmal Jesucristo.)  "},{"id":5,"tag":null,"isDisplayed":null,"text":"Manh yujok oro, yujnhej schik'il, (manh yujok oro, kaw yujnhej wal schik'il,) yuj wal cha hin kolchj kani."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Manhok yet' k'en oro, manhok yet' k'en plata,manh yujok k'e'en kaw tzkolchj wal heb’ ajmul. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kojxnhej wal yuj schik'l hin Kolmal Jesucristo, yuj cha kaw junk'ojlal waj yet' hin Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw manh yujok oro x'el hin mul,  (hin kolchj kani manh yujok oro hin kolchj kani,)  kaw hin sman hin wach' Kolmal. (Kaw hin sman hin Kolmal Jesucristo.)  "},{"id":6,"tag":null,"isDisplayed":null,"text":"Manh yujok oro, yujnhej schik'il, (manh yujok oro, kaw yujnhej wal schik'il,) yuj wal cha hin kolchj kani."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Manh yujok k'en oro, manh yujok k'en plata,manh yujok k'e'en kaw ay wal hin k’inal. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kojxnhej wal yet' schik'l hin Kolmal Jesucristo, ix hin skolkn elt a skal hin maysch’olnilal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw manh yujok oro x'el hin mul,  (hin kolchj kani manh yujok oro hin kolchj kani,)  kaw hin sman hin wach' Kolmal. (Kaw hin sman hin Kolmal Jesucristo.)  "},{"id":7,"tag":null,"isDisplayed":null,"text":"Manh yujok oro, yujnhej schik'il, (manh yujok oro, kaw yujnhej wal schik'il,) yuj wal cha hin kolchj kani."}]},{"id":167,"title":"Ha Cristo Ki Kolmal","guid":"p0lXEUKrJ064+dVTX0OJkA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"167    Ha Cristo Ki Kolmal\n \nC. S. G. #235  A Cristo Coronad"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Heb. 2:1-9; Fil. 2:1-11;  Ap. 5  \n \nTzya’n ejm sb’a heb’ a jun ayk’ a jun ejmnhej. Ap. 4:10</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Kaw ki'k chanh sb’i Kajlil, jun ki wach’ Kolmalek; ayk’nhej a swach' k'ab' ki Mam Dios jun, smoj ki b'itnank wal sb'i; yujto Kajlil yaji, "},{"id":3,"tag":null,"isDisplayed":null,"text":"smoj tzonh hem kumn ha a. Kalk wach' paxti a ki Mam Dios, wal a smasnil k'inal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Kaw ki'k chanh sb’i Kajlil, kaw tzki chamk'ojlej jun; yujto ha ix cham wal yuj ki mul, yuj cha ay ki k'inal; kaw wal ix techj yu'uj, "},{"id":4,"tag":null,"isDisplayed":null,"text":"Jesús ki wach' Kolmal. Yuj cha junk'ojlal kaj tiknek, yuj ton wal schamk'ojlal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Kaw ki'k chanh sb’i Kajlil, yujto aj k'inl aynhek;yujto ha ix cham a te kulus, smoj ki b'itnank wal sb'i. Kojxnhej wal a Jesús, "},{"id":5,"tag":null,"isDisplayed":null,"text":"oj kalk ki wach' paxti', ki b'itnokek wal sb'i yujto, ha tz'a'n wal ki kolnb'il."}]},{"id":168,"title":"Ha Cristo X'elkn Wal Schik'il","guid":"mDjvi1NfWU+3v2r9GLdauQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"168     Ha Cristo X'elkn Wal Schik'il\n \nH. D. G. # 225 Su Sangre Derramo Jesús"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ro. 5:9; Ap. 1:5\n \n …Oj elkn hin chik’l tik, sek wach’ til wal mach oj ajxok kan lajwk smul yu’uj.  Mt. 26:28</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ha Cristo x'elkn wal schik'il, ha schik'l tztak' hach sb'ikn eli. Ix elkn wal a te kuls ku'uj, ha schik'l tztak' hach sb'ikn eli."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha schik'l tztak' hach sb'ikn eli, ha schik'l tztak' hach sb'ikn eli. Smasnil ha mul tznib'j Dios tzyij eli, ha schik'l tztak' hach sb'ikn eli. "},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Toto tza nib'j tzach b'eyk' yet' Dios, ha schik'l tztak' hach sb'ikn eli. Toto tza nib'j tzab' sjaj ki Dios, ha schik'l tztak' hachsb'ikn eli."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha schik'l tztak' hach sb'ikn eli, ha schik'l tztak' hach sb'ikn eli. Smasnil ha mul tznib'j Dios tzyij eli, ha schik'l tztak' hach sb'ikn eli. "},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Tza nib'j tzach k'och a satcha'anh, ha schik'l tztak' hach sb'ikn eli. Tza nib'j tzach aj a stziktznial, ha schik'l tztak' hach sb'ikn eli."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha schik'l tztak' hach sb'ikn eli, ha schik'l tztak' hach sb'ikn eli. Smasnil ha mul tznib'j Dios tzyij eli, ha schik'l tztak' hach sb'ikn eli. "},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Chaj ha wach’ Komal wal tiknek, ha schik'l tztak' hach sb'ikn eli. Yuj cha oj yak' ha kolnb’il, ha schik'l tztak' hach sb'ikn eli."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha schik'l tztak' hach sb'ikn eli, ha schik'l tztak' hach sb'ikn eli. Smasnil ha mul tznib'j Dios tzyij eli, ha schik'l tztak' hach sb'ikn eli. "}]},{"id":169,"title":"Jesús Tzonh Yawtej","guid":"bEiBfZPFLU2SB8Eu7/Xd9g","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"169     Jesús Tzonh Yawtej\n \nC.S.G. # 541 \tA La Victoria Jesús Nos Llama"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>1 Jn. 5:1-7; Ap. 3:1-7; Ap. 3:8-13\n \n …Ha a yolyib’nhk’inl tik, oj he yab’ ton syail. Palta te’n tzeyutj he b’a    yujto ha jun yolyib’nhk’inl tik, ix kan a yalnh wu’uj, xchi a heb’.  Jn. 16:33</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Jesús tzonh yawtjek yik tzka’nek yajlil, kaw wal ayk’nhej Kajlil ket’ek jun. "},{"id":3,"tag":null,"isDisplayed":null,"text":"//Koyk yet’ Jesús, ka’k wal howal, yet smasnil heb’ yik win ajk’ojol.//"},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Jesús tzonh yawtjek yik tzka'nek yajlil, kaw awtb'ilnhek ki masnil yu'uj. "},{"id":4,"tag":null,"isDisplayed":null,"text":"//Tzkan maysch’olnil a yalnh kujek, yujto ha Kajlil kaw aych ket'ek.//"},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Jesús tzonh yawtjek yik tzka'nek yajlil, manh ki chab’ k’ojlokek ki b'a jun."},{"id":5,"tag":null,"isDisplayed":null,"text":" //Ha smasnil yip win ajk’ojol, masnto oj kan a yalnh kujek.//"},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Jesús tzonh yawtjek yik tzka’nek yajlil,hax heb’ schekab wan yaln el heb’ spaxti’. "},{"id":6,"tag":null,"isDisplayed":null,"text":"//Oj jawk Jesús yuj heb’ schonhab’, hax ki paxk yet’ wal a satcha’anh.//"}]},{"id":170,"title":"Kaw Te'n Tze Yutj He B'a","guid":"/CDOBhnsFE2ahIOwPmaUsQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"170     Kaw Te'n Tze Yutj He B'a\n \nC. S. G. # 533 Estad Por Cristo Firmes"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>2 Ts. 2:13-17; 2 P. 3:8-14; Ef. 6:10-18\n \n …Kaw te’n tzeyutj he b’a. Manh he choyb’tzok he b’a.  1 Cor. 15:58</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Kaw te'n wal tzkutjek ki b'a, junxnhej kajk yet’ Jesús,tza'n honhk a spatkil Cristo, yik tzki ch’oxnek eli. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw  oj kak’ wal yajlil jun, yet’ Jesús ki wach’ Kolmal. Yu’uj oj lajwok kan wal smasnil maysch’olnilal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Kaw te'n wal tzkutjek ki b'a, awtb’ilnhek yuj Jesús,Ha yik tzonh ochk a howal, junxhej tzkutjek ki b’a. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw wal te’n tzkutjek ki b’a, a smasnil maysch’olnilal. Wach’xam ay yip ajk'ojol, smasnil tztak' yuj Jesús."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Kaw te'n wal tzkutjek ki b'a, ha Cristo tz’a’n wal kip,ha wal smasnil heb’ anma’ matz tak’ yuj heb’ sch’okoj. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ka’k och ki k’ojl a Jesús, kaw wal tzonh leslwi hek. wach'xam ay yip ajk'ojol, smasnil tztak' yuj Jesús."}]},{"id":171,"title":"Manhok Yet' Anma Wan Ka'nek Howal","guid":"++Tq0QI0g0KulV333xuBcg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"171    Manhok Yet' Anma Wan Ka'nek Howal\n \nBatalla No Es Batalla"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ef. 6:10-8; I Pe. 5:8-9; Stg. 4:7-10 \n \nYuj cha, kaw te’n tzeyutj he b’a. Kaw tzeya’ch he nab’en a jun ab’x kaw yel. Ef. 6:14</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kaw tzki te'wtzej ki b'a yet’ yipal Jesucristo, yik tzka'nek wal howal, yet' wal win ajk’ojl aynhek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Hach hin Dios kaw ak' hin jelnal, hach ki Dios kaw ak' ki jelnal, kaw ak' ki te'nal tiknek jun, yet' yipal Jesucristo."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Manhok yet' heb' anma',kaw wal wan ka'nek howal. Kaw wal ha yet' jun syajlil, smasnil maysch'olnilal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Hach hin Dios kaw ak' hin jelnal, hach ki Dios kaw ak' ki jelnal, kaw ak' ki te'nal tiknek jun, yet' yipal Jesucristo."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Yuj ha paxti Mamin,yuj wal cha matz honh xiw honh, yuj ha paxti Mamin, tzkan win ajk’ojl a yalanh."},{"id":0,"tag":1,"isDisplayed":null,"text":"Hach hin Dios kaw ak' hin jelnal, hach ki Dios kaw ak' ki jelnal, kaw ak' ki te'nal tiknek jun, yet' yipal Jesucristo."}]},{"id":172,"title":"Manh Ka’k  Ki B’a A Maysch'olnil","guid":"WzJQZonYVkCIGTfaSOhd9A","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"172       Manh Ka’k  Ki B’a A Maysch'olnil\n \nC. S. G. # 431 Tentado, No Cedas"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>1 Cor. 10:6-13; Stg. 1:12-19; Ro. 7:15-8:2 \n \nJantnhej jun tzo’nh tas tzjaw a kib’nhek, lajnnhej yet’ jun tzo’nh tzjaw a yib’nh heb’ anma smasnil1 Cor. 10:13.</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ha yik tzjaw maysch’olnil, te’n tzkutjek ki b’a. Yet' wal Cristo tzka’k kip, sek kaw tztak’ kujek."},{"id":3,"tag":null,"isDisplayed":null,"text":" Kaw te’n tzkutjek ki b’a, a tas maysch’olnil, ha Dios tztak’ honh skolnek a yol sk’ab’ chamel."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw yipk’ojlal yaj Jesús, yujto ha a swach’k’ojlal, kaw oj ilchjok tzaljk’ojlal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Kaktkek kan maysch’olnil, tzki b'ok wal swach'il,hanhj wal Dios tzkijk chanh sb’i a smasnil k’inal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw manh kalk tu paxti', yujto yik honhk xo, ki ya’ilkek ki b’eyb’al a yol sk’ab Dios."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw yipk’ojlal yaj Jesús, yujto ha a swach’k’ojlal, kaw oj ilchjok tzaljk’ojlal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Ki yiklkek spaxti’, te’n tzkutjek ki b’a. Cristo ki wach’k’ojlek, tzka’ch yipk ki k’ojol. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw wach’ tzkutjek ki b’a, yujto yik honhk xo, yujto oj ki chak spak, yuj ki te’nalek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw yipk’ojlal yaj Jesús, yujto ha a swach’k’ojlal, kaw oj ilchjok tzaljk’ojlal."}]},{"id":173,"title":"¿Tzam Ha Nib'j Matz Hach Ajx Lajwok?","guid":"esUPAc7r+ESmCx2YjucZqA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"173    ¿Tzam Ha Nib'j Matz Hach Ajx Lajwok?\n \nV. C. # 172  Quieres Sobre El Mundo Ser Un Vencedor"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ro. 8:22-39; 1 Tes. 4:1-12.\n \n Kojkek,  jantnhej jun tzo’nh tas tzjaw aynhek, ha Dios tza’n koti,  sek kaw wach’ kikek hanh ay ki chamk’ojlal ha a.  Ro. 8:28</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    ¿Aym ha nib’b’en matz hach kan a yalnh ha mul? ¿Tzam ha nib'j tzach b'itni wach'xam ya haji? "},{"id":3,"tag":null,"isDisplayed":null,"text":"¿Aym ha tzaljk'ojlal yujto te'n tzotj ha b'a? Junjn k'u aych ek' yet' Cristo ha kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Junjn k'u aych ek' yet' Cristo ha kolmal, sek wach' matz hach ajx lajwok yuj maysch'olnil. "},{"id":4,"tag":null,"isDisplayed":null,"text":"To ixta' tzaljk’ojlal oj ha b'eyk' b'i'an, toto junjn k'u aych ek' yet' ha Kolmal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Ha yolyib’nhk’inl tik ay heb’ tzkus yuj smul, kaw wal wan s’atkn heb’ a skal jun yailal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Hal yab' heb' jun ab'x tik manh hakt kan halni, junjn k'u aych ek' yet' Cristo ha Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Junjn k'u aych ek' yet' Cristo ha kolmal, sek wach' matz hach ajx lajwok yuj maysch'olnil. "},{"id":5,"tag":null,"isDisplayed":null,"text":"To ixta' tzaljk’ojlal oj ha b'eyk' b'i'an, toto junjn k'u aych ek' yet' ha Kolmal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    ¿Tzam ha nib'j tza k'umj ha b'a yet' ki Mam Dios? ¿Tzam ha nib'j stziktznil Dios aych a junjn k'u?"},{"id":5,"tag":null,"isDisplayed":null,"text":" ¿Tzam ha nib'j tza b'eylb'ej wal sb'eyb'al Jesús? Junjn k’u aych ek’ yet’ Cristo ha kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Junjn k'u aych ek' yet' Cristo ha kolmal, sek wach' matz hach ajx lajwok yuj maysch'olnil. "},{"id":6,"tag":null,"isDisplayed":null,"text":"To ixta' tzaljk’ojlal oj ha b'eyk' b'i'an, toto junjn k'u aych ek' yet' ha Kolmal."},{"id":5,"tag":null,"isDisplayed":null,"text":"4    Ha wal Santo Espíritu kaw aych ayach, ha oj a'nok chamk'ojlal yet' emmkilal. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Leslwanh tza mak wal sjaw ki wach’ Kolmal, junjn k'u aych ek' yet' Cristo ha kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Junjn k'u aych ek' yet' Cristo ha kolmal, sek wach' matz hach ajx lajwok yuj maysch'olnil. "},{"id":7,"tag":null,"isDisplayed":null,"text":"To ixta' tzaljk’ojlal oj ha b'eyk' b'i'an, toto junjn k'u aych ek' yet' ha Kolmal."}]},{"id":174,"title":"Te'n Tzkutjek Ki B'a","guid":"qYSIz0u/MkaR63cSL3Etzw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"174     Te'n Tzkutjek Ki B'a\n \nC. S. G. # 539 Firmes, Y Adelante"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ef. 6:10-18; 1 Ti. 6:11-16; 1 Cor. 9:24-27 \n \nIcha junk soldado,  kaw te’n tzyutj sb’a, ixta tzotj ha’n och ha k’ojl a Kajlil.  1 Ti. 6:12</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Kaw te’n tzkutjek wal ki b’a, yet’ ki jichk’ojlal. Kaw wal matz honh xiwek, kaw tzonh yilk Jesús. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Yajl yaj a heb' yajal, ha tzonh i’n b’eyok. Ha wal sniwkilal ye’lchi ha tzch’oxn el wal yipal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal te’n tze yutj wal he b’a jun, hex ayx he kolnb’il. Kaw wal manh hex xiwok, ilb’ilx yuj Jesús.  (Slajub’: Amén.)"},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Wal a sb'i ki wach' Kolmal, ha tzonh i'n b’eyok, kaw oj xiw chanh smasnil, heb' ajk'ojl aynhek."},{"id":4,"tag":null,"isDisplayed":null,"text":" Kalk wach’ paxti wal a Dios, yuj smasnil yipal. Ha smasnil tas ay smay oj lajwok kan wal ek’i."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal te’n tze yutj wal he b’a jun, hex ayx he kolnb’il. Kaw wal manh hex xiwok, ilb’ilx yuj Jesús.  (Slajub’: Amén.)"},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Kaw wal ka’k ip tiknek jun, hex to yikxo Dios. Kaw te’n tzkutjek ki b’a, och koyk tza’n yu’uj,"},{"id":5,"tag":null,"isDisplayed":null,"text":" junxnhej niwnal kajk a tik, junnhj ki wach' Kolmal. Junnhj tas aych yipk ki k’ojol, junnhj pax ki chamk’ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal te’n tze yutj wal he b’a jun, hex ayx he kolnb’il. Kaw wal manh hex xiwok, ilb’ilx yuj Jesús.  (Slajub’: Amén.)"},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Ha yolyib’nhk’inl tik, oj lajwok smasnil, hanh schonhb’ honhk xo Cristo, te’n tzkutjek ki b’a. "},{"id":6,"tag":null,"isDisplayed":null,"text":"May tas oj ka’nek lajwok, yujto yik honhk xo. Ha wal tas yaljnak kan Dios may wal oj aj yek’i."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal te’n tze yutj wal he b’a jun, hex ayx he kolnb’il. Kaw wal manh hex xiwok, ilb’ilx yuj Jesús.  (Slajub’: Amén.)"}]},{"id":175,"title":"Wan Ka’nek Howl Yet’ Maysch'olnil","guid":"Sy1pvtVrYUmaSkEaUIzS8g","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"175    Wan Ka’nek Howl Yet’ Maysch'olnil\n \nV. C. # 192 Ruge La Batalla"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ef. 6:10-20; 1 P. 5:8 \n \nYuj cha, kaw te’n tze yutj he b’a.  Kaw tzeya’ch he nab’en a jun ab’x kaw yel. Ef. 6:14</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kaw manh hok yet’ komn anma wan ka'nek howal, Yet’ smasnil maysch’olnil, yet’ win ajk’ojol. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ha jun kowlek tik yet’ smasnil maysch’olnilal, ha wal yet’ ki wach’ Kolmal oj ka’k yajlil."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal oj yak’ Jesús ki jelnal, Yujto ha chamel kannk a yalanh. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yujnhej Cristo hax ka’nek wal yajlil. ¡Aleluya! Kaw oj yak’ wal ka’k yajlil."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Yuj wal ki jichk’ojlal tzkab’nek yaln ki Kolmal. Kaw wal manh hex xiwok, maj hex wakkani. "},{"id":4,"tag":null,"isDisplayed":null,"text":"A’k och he k’ojl ayin, yet’ wal a tas waljnak. Sek wach’ oj wak’ he yak’ yajlil wal wet’ok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal oj yak’ Jesús ki jelnal, Yujto ha chamel kannk a yalanh. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yujnhej Cristo hax ka’nek wal yajlil. ¡Aleluya! Kaw oj yak’ wal ka’k yajlil."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Ha wal jun ki Yajlil, smasnil wal tztak’ yu’uj,ha wal jun kajk’ojlek, tox ix lajw eli. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Cristo kaw tztak’ yu’uj, ixta honhk pax tiknek. Och koyk tza’n yuj jun mach to wan ya’n yajlil."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal oj yak’ Jesús ki jelnal, Yujto ha chamel kannk a yalanh. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Yujnhej Cristo hax ka’nek wal yajlil. ¡Aleluya! Kaw oj yak’ wal ka’k yajlil."},{"id":5,"tag":null,"isDisplayed":null,"text":"4    Ka’k wal techjok smasnil jun tzonh yailal tik, hax a skal maysch’olnil, kaw oj honh skolo’. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Masnto oj yojkok el smasnil heb’ anma’, jun Kajlil to kaw wal yel to Kolwjum."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal oj yak’ Jesús ki jelnal, Yujto ha chamel kannk a yalanh. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Yujnhej Cristo hax ka’nek wal yajlil. ¡Aleluya! Kaw oj yak’ wal ka’k yajlil."}]},{"id":176,"title":"A Skal Asn Oj Jawk Cristo","guid":"O60JPzXiyUCybzRnzi63dg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"176       A Skal Asn Oj Jawk Cristo\n \nC. S. G. # 550 Con Las Nubes Viene Cristo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ap. 1:1-8; 1 Tes. 4:13-18; Ap. 7:9-17 \n \nIltek jab’xoj oj jawk Cristo a skal asun. Smasnil anma oj yil sajwi. Ap. 1:7</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      A skal asn oj jawk pax Cristo,  jun ix scham a spenk kulus. Hax smasnil wal heb' yunnal xo, oj sb'itnok wal heb' swach' Kolmal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kalk wach’ paxti’, kalk wach’ paxti’,  kaw kannk chaml a yalnh yu’uj."},{"id":3,"tag":null,"isDisplayed":null,"text":"1    Smasnil anma', kaw oj yil heb',  aych yopiso ya'n Yajlil. Hax heb' ma' ix schaj wal yab'i',  to kaw ha Cristo Yajl xo. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw oj ok' heb', kaw oj ok' heb'  yik oj yilnok heb' Jesús."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ha jun ak' niwnal yet' Cristo, kaw chekl yaj wal slajwel. Ay jun niwkil xajmb'al ix yak', Cristo a spenk te kulus. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Tzaljk'ojlal jun, kaw tzaljk'ojlal, oj yil wal heb' swach' Kolmal."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Ha smasnil tas  b'ob'il ho’oj, kaw oj em kumn heb' ayach. Yet' hepalil, oj hak' Yajlil, Cristo kaw wal ha moj toni. "},{"id":6,"tag":null,"isDisplayed":null,"text":"¡Kalk wach’ paxti’, kalk wach’ paxti’! A ki wach’ Kolmal Jesús."}]},{"id":177,"title":"Ha Jun K'u","guid":"sGexb/bZ802c4fUxNhFsjQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"177    Ha Jun K'u\n \nC. S. G. # 208 Un Día"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Lc. 2:4-20; Hch. 10:34-43; Gl. 4:3-7 \n \nPalta ha yik xk’och sk’ul ya’n kot Dios Yunnal, wul aljnak el a jun ix icha tzonh aj kaljel hanh anmanhek tik.    Gl. 4:4</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Ha jun k'u yik tzb'itn heb' ángel a satcha'anh, kaw wal k'ik'k'inal ajtil ayk' heb' anma'.  "},{"id":3,"tag":null,"isDisplayed":null,"text":"Jesús ix emli, ix alj a jun ix kob's ix, yik xwul sch'oxnok jun kaw wach' b'eyb'al ayin."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzin schamk'ojlej, ya’sb’a pitzn hinto mukb'il hin mul yik xcham a te kulus. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ix k'ewan Cristo, xyak' tojlal ayin, ix yak' sti ayin, to yowlal oj jawok. "},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ha jun k'u ix yij el heb' a sti' el chonhab', ix lawxax kan Cristo yuj heb' a kulus. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Manhx jantkok ix yab' syal yik ix cham hin jelok, yik ix ya'n wal Cristo Jesús hin kolnb'il. "},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzin schamk'ojlej, ya’sb’a pitzn hinto mukb'il hin mul yik xcham a te kulus. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ix k'ewan Cristo, xyak' tojlal ayin, ix yak' sti ayin, to yowlal oj jawok. "},{"id":4,"tag":null,"isDisplayed":null,"text":"3     A skal jun awb’en te’ kaw smukjnak heb’ Jesús. Hata iljnak sniwnal a yik schami. "},{"id":5,"tag":null,"isDisplayed":null,"text":" Ha heb’ ángel tanhwjnak sniwal aj ix mukxi Jun mach to ix yak' cham sb’a yuj ki mulek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzin schamk'ojlej, ya’sb’a pitzn hinto mukb'il hin mul yik xcham a te kulus. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Ix k'ewan Cristo, xyak' tojlal ayin, ix yak' sti ayin, to yowlal oj jawok. "},{"id":5,"tag":null,"isDisplayed":null,"text":"4    Ay jun k'ual oj jawk pax wal Jesucristo, kaw wal oj och b’it, yik jkot a satcha’anh."},{"id":6,"tag":null,"isDisplayed":null,"text":" Kaw satjub'tak wal tas oj b'o a jun k'u cha. Wal a smasnil k’inal oj ijxok chanh sb’i."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzin schamk'ojlej, ya’sb’a pitzn hinto mukb'il hin mul yik xcham a te kulus. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Ix k'ewan Cristo, xyak' tojlal ayin, ix yak' sti ayin, to yowlal oj jawok. "},{"id":6,"tag":null,"isDisplayed":null,"text":"5    Ay jun k’ual oj jawk pax wal Jesucristo, oj ok’ k’en trompeta skot a satcha’anh "},{"id":7,"tag":null,"isDisplayed":null,"text":"Kaw satjb’tak wal tas oj b’o a jun k’u cha. Hax wal heb’ yunnal kaw oj sb’itnok heb’ sb’i."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzin schamk'ojlej, ya’sb’a pitzn hinto mukb'il hin mul yik xcham a te kulus."},{"id":8,"tag":null,"isDisplayed":null,"text":" Ix k'ewan Cristo, xyak' tojlal ayin, ix yak' sti ayin, to yowlal oj jawok. "}]},{"id":178,"title":"Ha Yik Oj Ok' K'en Trompeta","guid":"fDm2D3Sfh0C4HpOu1IpWDw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"178     Ha Yik Oj Ok' K'en Trompeta\n \nC. S. G. # 551 Cuando Anuncie El Arcángel"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>I Tes. 4:13-18; 1 Co. 15:51-58 \n \nOj awtxok jun cheknb’il yuj sat ángel, hax yok’ pax strompeta Dios, hat wal ta oj jawk Kajlilek a satcha’anh.  1 Ts. 4:16</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Ha yik oj ok' k'en trompeta yik oj at heb’ yik xo Dios, oj sakb'ok jun k'u chi a jun ejmnhej. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Smasnil heb' kolb'ilx yuj Jesús, kaw oj k’och wal heb’ yet’ok. Kaw wal tzaljk'ojlal oj hin k'och yet’ heb' ta’."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha a yik oj awtxok sb’i heb’, (kaw wal tzaljk’ojlal oj hin ta’w wiko’) ha a yik oj awtxok sb’i heb’; (kaw wal tzaljk’ojlal oj hin ta’w wiko’) "},{"id":4,"tag":null,"isDisplayed":null,"text":"ha a yik oj awtxok sb’i heb’. (kaw wal yel tzaljk’ojlal  wiko’) Kaw wal tzaljk'ojlal oj hin ta’wk wiko."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Oj pitzwok smasnil heb' chamnak to chab'il Cristo yu'uj. Kaw oj k'och heb' a jun yatut kaw wal wach'."},{"id":4,"tag":null,"isDisplayed":null,"text":" Kaw wal tzaljk'ojlal oj k'och heb' a satchanh yet’ ki Jesús. Kaw wal tzaljk'ojlal oj hin k'och yet' heb' ta'."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha a yik oj awtxok sb’i heb’, (kaw wal tzaljk’ojlal oj hin ta’w wiko’) ha a yik oj awtxok sb’i heb’; (kaw wal tzaljk’ojlal oj hin ta’w wiko’) "},{"id":5,"tag":null,"isDisplayed":null,"text":"ha a yik oj awtxok sb’i heb’. (kaw wal yel tzaljk’ojlal  wiko’) Kaw wal tzaljk'ojlal oj hin ta’wk wiko."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ka'k ip kaln el yab'xil Cristo, yik tzkalnek el schamk'ojlal, ya’sb’a mantzak jaw ki chamlek a kib’anh. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ha yik oj jawk Kajlilek kaw oj ki atk a satcha'anh. Tzaljk'ojlal oj ki k'ochk yet’ ki wach’ Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha a yik oj awtxok sb’i heb’, (kaw wal tzaljk’ojlal oj hin ta’w wiko’) ha a yik oj awtxok sb’i heb’; (kaw wal tzaljk’ojlal oj hin ta’w wiko’) "},{"id":6,"tag":null,"isDisplayed":null,"text":"ha a yik oj awtxok sb’i heb’. (kaw wal yel tzaljk’ojlal  wiko’) Kaw wal tzaljk'ojlal oj hin ta’wk wiko."}]},{"id":179,"title":"Jab'xoj Oj Jawk Jesucristo","guid":"nD2U8GTuIkKALTqw4cI0UQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"179    Jab'xoj Oj Jawk Jesucristo\n \nF. Y. A. # 145 Ya Vislumbro Los Albores\n \nLajn sjajl jun b'it tik yet' himno # 2 a C. S. G."},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 14:1-6; Ap. 19:1-8; 1 Co. 15:51  \n \nIx yaln Jesucristo ixtik: Ab’ek, jab’xoj wal oj hin k’ochxi. Ap. 22:12</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Ay jun katut wach'x yaj sb'o a satcha'an, kaw b'ob'ilx yuj ki wach' Kolmal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Tzaljk'ojlal oj ki k'ochk wal ta ki masnil, kaw oj ki k'ochk yet' ki Mam Dios."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj jawk Jesús a skal asun, kaw tzaljk'ojlal yik jun k'ul cha. Ki b'ok ki b'eyb'al ki masnil, yik tzki chanek sjaw Jesús."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Junxnhej oj kajk a tzaljk'ojlal ki masnil, yet' ki Mam Dios a satcha'anh. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Oj ki chak jun ak' niwnal a ki Mam Dios, jki b'itnokek sb'i ki masnil."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj jawk Jesús a skal asun, kaw tzaljk'ojlal yik jun k'ul cha. Ki b'ok ki b'eyb'al ki masnil, yik tzki chanek sjaw Jesús."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Tzaljk'ojlal oj ki yamk ki b'a ki masnil, kaw junxhej oj kaj ki b'itnek."},{"id":5,"tag":null,"isDisplayed":null,"text":" A satcha'anh oj kalk wach' paxti a Dios, smasnil k’inl oj ki b’itnokek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj jawk Jesús a skal asun, kaw tzaljk'ojlal yik jun k'ul cha. Ki b'ok ki b'eyb'al ki masnil, yik tzki chanek sjaw Jesús."}]},{"id":180,"title":"Kaw Oj Jawk Ki Kolmal","guid":"AvkmW8igpkyWDfFnu2DjOg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"180     Kaw Oj Jawk Ki Kolmal\n \nV. C. # 82  Viene Otra Vez Nuestro Salvador"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>1 Ts. 4:13-18; Ap. 7:11-15; 1 Co. 15:52  \n \nAb’ek, jab’xoj wal oj hin k’ochxi. Ap. 22:12</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kaw oj jawk pax Jesús ki kolmal, kaw wal yel oj jawok. Kaw wal oj yak' yajlil yet' yipal, hoktom wal tzjaw muk’uk. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw oj jawk yuj heb' schonhb' smasnil, oj kan heb' yet' a smasnil k'inal. Kaw makb'il sjaw hin wach' kolmal Jesús, hoktom wal tzjaw tiknek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kalk wach' paxti', a sb'i ki wach' Kolmal, kalk wach' paxti', kaw oj ki chak swach'il."},{"id":4,"tag":null,"isDisplayed":null,"text":" Kalk wach' paxti', yujto kolb'ilnhek xo, kalk wach' paxti' yujto oj jawk Jesús."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Hax Satanás manhxa yipalil, kojn Cristo niwn ye’lchi. Manhxa yailal a jun k'u cha, hoktom wal mu’k tiknek."},{"id":4,"tag":null,"isDisplayed":null,"text":" Smasnil wal heb' yunnal Dios chamnk xo, oj k'ewan heb' wal a jun k'ul cha. Kaw wal oj yil heb' stziktznil ki Kolmal, hoktom wal mu’k tiknek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kalk wach' paxti', a sb'i ki wach' Kolmal, kalk wach' paxti', kaw oj ki chak swach'il. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kalk wach' paxti', yujto kolb'ilnhek xo, kalk wach' paxti' yujto oj jawk Jesús."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Yiklum kab' tzkutjek munljok ki b’a toto tiknek tzjawi. Kaw tzaljk'ojlal yik heb' yunnal Dios, yik wal oj jawk Jesús. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw jab'xoj oj jawk hin wach' Kolmal, ha wal ta oj ok' k'en trompeta jun. Yik oj emlok hin Kolmal a skal asun, hoktom wal mu’k tiknek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kalk wach' paxti', a sb'i ki wach' Kolmal, kalk wach' paxti', kaw oj ki chak swach'il."},{"id":6,"tag":null,"isDisplayed":null,"text":" Kalk wach' paxti', yujto kolb'ilnhek xo, kalk wach' paxti' yujto oj jawk Jesús."}]},{"id":181,"title":"Kaw Tanhb'il Sjaw Jun K'u","guid":"df+gNI7Q10abNfIE0zSZEQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"181    Kaw Tanhb'il Sjaw Jun K'u\n \nV. C. # 76 Yo Espero el Gran día"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Lc. 17:24-37; Ap. 20:1-10; 21: 4; Mt. 24:29-44 \n \nIxta to b’i’an, hax scheklj el jun yechl a satcha’anh, chajtlto han ochnhk hin anmal tik, han tzin jawi… Manhx jantkok wipalil yet’ hin tziktznial, hax hin jawi. Mt. 24:30</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Kaw tanhb'il sjaw jun k'u yik oj jawk Jesús hin wach' Kolmal, ha yik oj jawk Jesucristo hax wul honh yi'nok yet'ok. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Manhx jantkok wal tzaljk'ojlal a hin pixan yujto kaw yel, tzaljk'ojlal oj jawk Jesús a schaejmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha Jesús oj jawk pax wal a scha'ejmal, (xcha'ejmal) kaw wal yel oj jawk Jesús a scha'ejmal. (xcha'ejmal) Satanás oj jalxok mil hab'il, ay junk'ojlal wal ta'."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Yik oj jawk pax Cristo wal a scha'ejmal. Yik oj jawk Jesús ki wach' Kolmal oj lajwok yailal, smasnil kusk'ojlal oj lajwok a yolyib'nk'inl tik."},{"id":4,"tag":null,"isDisplayed":null,"text":" Oj yak' Jesucristo tzaljk'ojlal a heb' ay skusk'ojlal, yik oj jawk ki wach' Kolmal a scha'ejmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha Jesús oj jawk pax wal a scha'ejmal, (xcha'ejmal) kaw wal yel oj jawk Jesús a scha'ejmal. (xcha'ejmal) Satanás oj jalxok mil hab'il, ay junk'ojlal wal ta'."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Smasnil maysch'olnilal oj lajwok kan a yik jun k'ul cha, smasnil heb' yik xo Dios oj yak' heb' yajlil jun mil hab'il. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Junjn mach oj yil tzaljk'ojlal, manhxa yailal pax ta', yik oj jawk ki wach' Kolmal a scha'ejmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha Jesús oj jawk pax wal a scha'ejmal, (xcha'ejmal) kaw wal yel oj jawk Jesús a scha'ejmal. (xcha'ejmal) Satanás oj jalxok mil hab'il, ay junk'ojlal wal ta'."}]},{"id":182,"title":"Kojn Cristo","guid":"8+WzHUP0qUmQFjABU7or8Q","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"182  Kojn Cristo\n \nV. C. # 222. Cristo Solo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ef. 3:14-21; Ro. 5:1-11; 1 P. 2:21-25 \n \n…Ha schamk’ojlal Cristo aynhek, kaw wal niwan, manhx yalnb’ilok.  Ef. 3:18</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ha Jesucristo oj kal yab'xil jun, to ha Jesús tztak' ya'n ki k'inal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Oj kalk wach' paxti a ki wach' Kolmal, yujto kaw smoj yalx Jesús wach'il."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha Jesucristo ki wach' Kolmal jun, kaw yel tzonh yil wal a smasnil k'inal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Tzonh skol a skal smasnil tas kaw wal ay smay, kaw oj jawk Jesús a scha'ejmal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Ha Jesucristo ki wach' Kolmal jun,smasnil ki mul kaw ix yak' lajwok. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw tzonh tzalj yuj swach'k'ojlal ki Mam Dios, yuj wal schik'il ix el ki mulek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha Jesucristo ki wach' Kolmal jun, kaw yel tzonh yil wal a smasnil k'inal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Tzonh skol a skal smasnil tas kaw wal ay smay, kaw oj jawk Jesús a scha'ejmal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Ha Jesucristo aych il honh yilni,yik aynh ek' a yolyib’nhk’inal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yet' wal schamk'ojlal tzyak' ki junk'ojlal, tzyak' ki te'nal yet' wal ki jelnal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha Jesucristo ki wach' Kolmal jun, kaw yel tzonh yil wal a smasnil k'inal. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Tzonh skol a skal smasnil tas kaw wal ay smay, kaw oj jawk Jesús a scha'ejmal."},{"id":5,"tag":null,"isDisplayed":null,"text":"4    Ha Jesucristo tzonh a’nek b’oxok,kaw ix yij el wal smasnil ki mul. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Ha ki wach' Kolmal sman wal ki k'inal, yik ix kulsax wal yuj ki mulek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha Jesucristo ki wach' Kolmal jun, kaw yel tzonh yil wal a smasnil k'inal. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Tzonh skol a skal smasnil tas kaw wal ay smay, kaw oj jawk Jesús a scha'ejmal."},{"id":6,"tag":null,"isDisplayed":null,"text":"5    Ha Jesucristo jawk a scha'ejmal,kaw oj wul yik' smasnil heb' yunnal. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Kaw oj ki k'ochk wal yet' ki Mam Dios jun, oj ka'k yajlil a smasnil k'inal"},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha Jesucristo ki wach' Kolmal jun, kaw yel tzonh yil wal a smasnil k'inal. "},{"id":8,"tag":null,"isDisplayed":null,"text":"Tzonh skol a skal smasnil tas kaw wal ay smay, kaw oj jawk Jesús a scha'ejmal."}]},{"id":183,"title":"Manh Kojkok","guid":"MKys3wOFp0qMuGDaXlq43w","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"183    Manh Kojkok\n \nC. S. G. # 558 Pudiera Bien Ser"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ts. 4:13-18; Ap. 3:8-13; 1 Ts. 5:1-11 \n \nYuj cha, yowlal kaw tojlnhej tzkutjek ki b’eyb’al. Kojxn wal a Dios tzkak och ki nab’en. P. 3:11</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Kaw oj jawk Kajlil yik ham wal sk'ik'b'alil jun, mto yik wan sakb’i oj jawk Jesús Kajlil. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw oj jawk Jesús, a skal asn oj emlok jun, oj jawk yuj heb' yik xo yaji."},{"id":0,"tag":1,"isDisplayed":null,"text":"¿B'anhto wal hach Mamin,  oj kab' wal sb'itnax jun ak' b'it? ¡Aleluya oj jawk Cristo!  ¡Aleluya amén, aleluya amén!"},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Ham yik chimk'ual, mto yik wan xo yem k'u,oj emlok Jesús, hax ki chan a skal asun."},{"id":4,"tag":null,"isDisplayed":null,"text":" Manh jantkok yipal yik oj jawk yet' stziktznial, oj jawk yuj heb' yik xo yaji."},{"id":0,"tag":1,"isDisplayed":null,"text":"¿B'anhto wal hach Mamin,  oj kab' wal sb'itnax jun ak' b'it? ¡Aleluya oj jawk Cristo!  ¡Aleluya amén, aleluya amén!"},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Ha hin wach' Kolmal oj emlok yet’ heb’ yiko,kaw oj jawk Jesús yik wal manh nanok kujek. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw oj jawk Jesús, yet’ yipal yet stziktznial. Oj jawk yuj heb’ yikxo yaji."},{"id":0,"tag":1,"isDisplayed":null,"text":"¿B'anhto wal hach Mamin,  oj kab' wal sb'itnax jun ak' b'it? ¡Aleluya oj jawk Cristo!  ¡Aleluya amén, aleluya amén!"},{"id":5,"tag":null,"isDisplayed":null,"text":"4    Oj hin pax yet’ok, kaw tzaljk’ojlal wal wiko’, manhxa wal ok’el, chamel yet pax xiwk’ojlal. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Ixta oj ajok kaw oj jawk yet’ stziktznial, oj jawk yuj heb' yik xo yaji."},{"id":0,"tag":1,"isDisplayed":null,"text":"¿B'anhto wal hach Mamin,  oj kab' wal sb'itnax jun ak' b'it? ¡Aleluya oj jawk Cristo!  ¡Aleluya amén, aleluya amén!"}]},{"id":184,"title":"Oj Jawk Jun Ejm Xo","guid":"BHE9pxo/CEyUxcOj1IRBDA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"184    Oj Jawk Jun Ejm Xo\n \nV. C. # 74. Viene Otra Vez"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mt. 24:44; Ap. 4:8-9; 1 Ts. 4:13-18; I Co. 15:35-58 \n \nKaw jeln tze yutj he b’a, yujto ha yik tze na’a to matz hin jawi, lemb’il ha ta oj hin jawi. Mt. 24:44</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     To tzb'itn heb' ángel wal a kaw swach'il, b'itnanhk hex anma a tzaljk'ojlilal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Yujto jawk Cristo Kajlil ki Kolmal, yet’ heb yikxo wal yaji."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yowlal oj jawk jun ejm xo, yet' stziktznial oj jawk a skal asun. Yowlal oj jawk jun ejmxo, kaw oj yak’ Yajlil sjawi."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Iltek yoyib’nhk’inal tas yaji, ipn wal yuj icha yaj yalkani. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yel smasnil tas tzch’oxn ayonh to jawok, Cristo oj jawk jun ejmxo. "},{"id":0,"tag":1,"isDisplayed":null,"text":"Yowlal oj jawk jun ejm xo, yet' stziktznial oj jawk a skal asun. Yowlal oj jawk jun ejmxo, kaw oj yak’ Yajlil sjawi."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Oj ki jawk yet’ Jesús a skal asun, Kaw oj ki jawk pax yet’ a sat lum tik. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Hax ka’n yajlil yet’ wal jun mil hab’il, kaw oj ka’k yajlil yet’ok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yowlal oj jawk jun ejm xo, yet' stziktznial oj jawk a skal asun. Yowlal oj jawk jun ejmxo, kaw oj yak’ Yajlil sjawi."}]},{"id":185,"title":"Oj Jawk Pax Kajlil","guid":"HK1f84k9iEO4P5NC9t6ZVQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"185     Oj Jawk Pax Kajlil\n \nV. C. # 79 \tCristo Ya Viene, Fieles Cristianos"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mt. 24:32-44; I Ts. 4:13-18; Mt. 25:1-12 \n \n ...Oj emlok Kajlilek a satcha’anh. 1 Ts. 4:16</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Oj jawk pax Cristo kajlil ki kolmal, kaw makwj koyek yujto jawok. "},{"id":3,"tag":null,"isDisplayed":null,"text":"B’utn ham he pixan yuj spaxti ki Dios, ki tanhwkek sjaw yet’ wal chamk’ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj jawk wal Kajlil, oj jawk wal Kajlil; kaw wal yajnhej hax sjaw ki wach’ Kolmal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw tzaljk'ojlal oj kalk aleluya, oj ki k'ochk wal yet' a jun ejmnhej."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Yaljnak kani to yowlal oj jawok, icha yik tz’unnan xil heb’ te te’;"},{"id":4,"tag":null,"isDisplayed":null,"text":" ixta pax yilx yuj sjawmb’il Cristo. Tzaljk’ojlal wal oj ki k’ochk yet’ok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj jawk wal Kajlil, oj jawk wal Kajlil; kaw wal yajnhej hax sjaw ki wach’ Kolmal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw tzaljk'ojlal oj kalk aleluya, oj ki k'ochk wal yet' a jun ejmnhej."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Yowlal oj jawk wal ki wach’ kolmalek, oj jawk wal kajlil a skal asun."},{"id":5,"tag":null,"isDisplayed":null,"text":" Nak wal he b'a hex to satnkto jun, sek wach’ to ma oj he yab' syail."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj jawk wal Kajlil, oj jawk wal Kajlil; kaw wal yajnhej hax sjaw ki wach’ Kolmal. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kaw tzaljk'ojlal oj kalk aleluya, oj ki k'ochk wal yet' a jun ejmnhej."},{"id":5,"tag":null,"isDisplayed":null,"text":"4    Yelk'ojlal wal to tzex yawtj wal Cristo, wanto wal yaltn ek' sniwn chamk'ojlal. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Oj yak’ Jesús wal ki tzaljk'ojlilal, kotanh yik tza chaj wal schamk’ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj jawk wal Kajlil, oj jawk wal Kajlil; kaw wal yajnhej hax sjaw ki wach’ Kolmal. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Kaw tzaljk'ojlal oj kalk aleluya, oj ki k'ochk wal yet' a jun ejmnhej."}]},{"id":186,"title":"Oj Jawk Wal Jesucristo","guid":"K/zpnsjrJEuB93orXWn5Ag","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"186      Oj Jawk Wal Jesucristo\n  \nC. S. G. # 546 Un Día Cristo Volverá"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>1 Ts. 4:13-18 Lc. 21:25-36; Hch. 1:6-11  \n \n Ix yaln heb’ a heb’ ixtik: Icha xe yil s’at tik, ixta oj jawk paxi, xchi a heb’. Hch. 1:11</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Oj jawk pax Cristo hin Kolmal,icha ton wal yaj yaln kani. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Oj jawk pax icha x'aj spaxi, hax heb' yunnal kaw oj yil heb' swach' Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw yel yowlal oj jawk Jesús,  tzaljk'ojlal wal oj yil heb' yunnal."},{"id":4,"tag":null,"isDisplayed":null,"text":" Makwjanh an, kaw leslwanh;  yujto oj jawk yuj heb’ yunnal. (yuj heb’ yunnal)"},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Ha heb' yalmal el spaxti Dios, tzyall heb' to oj jawk pax Jesús, ayx yechl to jab' xoj jawok. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yik oj jawk wul yik’ smasnil heb’ yunnal xo."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw yel yowlal oj jawk Jesús,  tzaljk'ojlal wal oj yil heb' yunnal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Makwjanh an, kaw leslwanh;  yujto oj jawk yuj heb’ yunnal. (yuj heb’ yunnal)"},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Oj jawk wal wul yik’ heb' yikxo, a skal stziktznil wal oj jawok."},{"id":5,"tag":null,"isDisplayed":null,"text":" Kaw tanhb'il sjaw yuj heb' yikxo', yik oj yal heb' wach' paxti a ki Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw yel yowlal oj jawk Jesús,  tzaljk'ojlal wal oj yil heb' yunnal."},{"id":6,"tag":null,"isDisplayed":null,"text":" Makwjanh an, kaw leslwanh;  yujto oj jawk yuj heb’ yunnal. (yuj heb’ yunnal)"},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Tzaljk'ojlal oj ha jaw Jesús, hax heb' honnal tanhb'ilch yuj heb'. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kaw oj yil heb' ha tziktznial, tzaljk'ojlal oj kan heb' het’ a jun ejmnhej."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw yel yowlal oj jawk Jesús,  tzaljk'ojlal wal oj yil heb' yunnal. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Makwjanh an, kaw leslwanh;  yujto oj jawk yuj heb’ yunnal. (yuj heb’ yunnal)"}]},{"id":187,"title":"Tzin Nib'j Tzwil Hin Diosal","guid":"OCU7wKq9Y0KUgJD5hSWCNA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"187     Tzin Nib'j Tzwil Hin Diosal\n \nB. B. D. # 117."},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Job 19:25-27; Dt. 33:12,27 \n \nWojtak ha jun mach tzin kolni, pitzan, hax a slajb’ k’ual, oj jawk wul hin yi chanh a sat lum tik. Job 19:25 1 </f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Kaw tzin nib'j tzwil hin Diosal, yujto ha Wajlil ton yaji. Tzni nib'j tzwil wal swach'ilal Dios, yet' stziktznil a satcha'anh. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ix sch'ox wal swach'k'ojlal ayin, ix suksat hin maysch'olnil. Yel oj hin at yet' hin Kolmal, yik oj jawk wal hin chamlil."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tzin nib'j tzin (kaw wal tzin nib'j wil hin Diosal) k'och a satcha'anh, (yujto Wajlil ton wal yaji) manhx jantkok (kaw tzin nib'j wil hin Diosal) wal schamk'ojlal Dios. (Kaw ay schamk'ojlal ayin)"},{"id":4,"tag":null,"isDisplayed":null,"text":" Kaw tzin nib'j, (jin k'och yet' a smasnil k'inal,) yajnhej tzin k'och yet' (kaw wal tzin nib'j wil hin Diosal) hin kolmal (yujto Wajlil ton yaji) a satcha'anh."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Kaw wal yel ay hin chamk'ojlal, a Jesús hin wach' Kolmal. Tzin och wal schekb'ok yik mantzak hin pax aj ay hin Kolmal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Heb' anma a sat lum tik, kaw wal o'ltak yaj heb' yuj smul. Kaw ay kolnb'il yuj Jesús, toto tzya'ch wal heb' sk'ojl ha a."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tzin nib'j tzin (kaw wal tzin nib'j wil hin Diosal) k'och a satcha'anh, (yujto Wajlil ton wal yaji) manhx jantkok (kaw tzin nib'j wil hin Diosal) wal schamk'ojlal Dios. (Kaw ay schamk'ojlal ayin)"},{"id":5,"tag":null,"isDisplayed":null,"text":" Kaw tzin nib'j, (jin k'och yet' a smasnil k'inal,) yajnhej tzin k'och yet' (kaw wal tzin nib'j wil hin Diosal) hin kolmal (yujto Wajlil ton yaji) a satcha'anh."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ha Jesús hin wach' Kolmal, yujto kaw hin sman yet’ schik’il. Oj hin at a satcha'anh, kaw oj wil wal yilx Wajlil jun. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Oj hin b'itnok aleluya, a Jesús hin wach' kolmal. Oj wal wach' paxti a Cristo, tiknek a smasnil k’inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tzin nib'j tzin (kaw wal tzin nib'j wil hin Diosal) k'och a satcha'anh, (yujto Wajlil ton wal yaji) manhx jantkok (kaw tzin nib'j wil hin Diosal) wal schamk'ojlal Dios. (Kaw ay schamk'ojlal ayin) "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kaw tzin nib'j, (jin k'och yet' a smasnil k'inal,) yajnhej tzin k'och yet' (kaw wal tzin nib'j wil hin Diosal) hin kolmal (yujto Wajlil ton yaji) a satcha'anh."}]},{"id":188,"title":"Tzin Tanhwj Sjaw Hin Kolmal","guid":"Xz9Hte2Hk0yNLVvXDvpW7w","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"188     Tzin Tanhwj Sjaw Hin Kolmal\n \nC.S.G # 557   Yo Sólo Espero Ese Día"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>1 Ts. 4:13-18; 1 Co. 15:51-58 ;   2 P. 3:8-14. \n \n...Hanhek pitznonhk to ta’, junnhj oj aj kijxek chanh yet’ eb’. 1 Ts. 4:17</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Kaw tanhb'il sjaw jun k'ual, yik oj jawk Cristo ki kolmal. Kaw tzaljk'ojlal wal oj kaji yik oj ya’nok wal yajlil "},{"id":3,"tag":null,"isDisplayed":null,"text":"Smasnil munljel a sat lum tik kaw oj kan ton wal smasnil. // Yik oj jawk pax Cristo, oj ki atk yet' a satcha'anh //"},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Kaw matz hin och il toto tzin chakx el yuj wal heb' anma'.Manh hok a tik oj hin kani, yujto yik hin satcha'anh. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw tanhb'il sjaw jun k'u cha yik oj hin pax yet' hin Kolmal. // Yik oj jawk hin Kolmal, kaw oj hin cha jun ak' niwnal //"},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Yik oj in k'och a satcha'anh, kaw oj in cha wal swach'il. Ha wal in wach' kolmal Cristo, kaw wal yel oj wilch wal ta'."},{"id":5,"tag":null,"isDisplayed":null,"text":" Ha wal ta' manhxa kusk'ojlal, manhxa pax wal munljel ta'. // Yet' smasnil heb' yik xo, oj hin b'itnok hin wach' Kolmal.//"}]},{"id":189,"title":"Tzaljk'ojlal Oj Ki Atk A Satcha'anh","guid":"4ZfoItjjRUeVqoMIS0f7HQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"189      Tzaljk'ojlal Oj Ki Atk A Satcha'anh  \t\n \nV. C. # 83 \tDía De Victoria, Y Gozo Celestial"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>1 Ts. 4:13-18; 1 Co. 15:52; Ap. 19:1-8 \n \nOj awtxok jun cheknb’il yuj jun sat ángel, hax yok’ pax k’en strompeta Dios. Hat wal ta’ oj emlok Kajlilek a sacha’anh.  1Ts. 4: 17</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Kaw tzaljk'ojlal oj ki atk a satcha'anh, yik oj jawk ki wach' Kolmal, (Oj jawok)."},{"id":3,"tag":null,"isDisplayed":null,"text":" Kaw tzaljk'ojlal oj ki chak ki b'a yet'ok, yik oj jawk a skal asun."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj emlok ki wach' Kolmal, (Oj emlok). Yik wal oj jawk jun k'u cha, (Oj jawok); "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha ki wach' Kolmal, kaw yowlal oj jawok, yik oj wul yik' heb' yunnal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Wal a yik jun k'ul cha, kaw ay tzaljk'olal,yik oj jawk pax ki Kolmal, (Oj jawok)."},{"id":4,"tag":null,"isDisplayed":null,"text":" Kaw yel oj ki atk yet' wal a satcha'anh, hax ki k'ochk a yojltak."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj emlok ki wach' Kolmal, (Oj emlok). Yik wal oj jawk jun k'u cha, (Oj jawok); "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ha ki wach' Kolmal, kaw yowlal oj jawok, yik oj wul yik' heb' yunnal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Oj ok' k'en trompeta wal a jun k'u cha,yik oj jawk ki wach' Kolmal, (Oj jawok)."},{"id":5,"tag":null,"isDisplayed":null,"text":" Kaw manhxa kusk'ojlal, manhxa somk'ojlal, aj oj ki k'och yet' Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj emlok ki wach' Kolmal, (Oj emlok). Yik wal oj jawk jun k'u cha, (Oj jawok); "},{"id":6,"tag":null,"isDisplayed":null,"text":"Ha ki wach' Kolmal, kaw yowlal oj jawok, yik oj wul yik' heb' yunnal."}]},{"id":190,"title":"Tzaljk'ojlal Oj Jawk Cristo","guid":"pIYEcRiGJ0u9po4mt/DKcg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"190      Tzaljk'ojlal Oj Jawk Cristo\n \nC. S. G. # 549   La Mañana Gloriosa"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>1 Ts. 4:13-18; Mt. 25:1-13\n \n Ki tanhwkek sjaw jun k’u yik tzaljk’ojlal, yik oj jawk ki Diosal kaw niwn ye’lchi. Tit. 2:13; 1 </f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Kaw ay tzaljk’ojlal a yik jun k’u cha, yik oj jawk pax Jesús a scha ejmal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw junxnhej yaj ki nab'enek ki masnil, tzaljk'ojlal oj ki chak Jesús yemli."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha aj ayk’ ki wach’ Kolmal, manhxa tas oj ki k’ana’, mahnxa yok k’u oj kil ta’, kaw wal manhxa pax sk’ak’il, "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw wal manhxa pax ok’el, kusk’ojlal yet’ yailal.Hax Jesús kaw tzyak’ yajlil a satcha’anh, ha oj a’nok wal sniwnal ki k’ojol."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Kaw wal tanhb’il sjaw jun k’u chi kujek, yik tzki chanek sjaw Jesús ki kolmal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Smasnil kaw wach’ oj aj icha yilx nich te'. Yik oj ki k’ochk a yojltak Kajlil."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha aj ayk’ ki wach’ Kolmal, manhxa tas oj ki k’ana’, mahnxa yok k’u oj kil ta’, kaw wal manhxa pax sk’ak’il, "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw wal manhxa pax ok’el, kusk’ojlal yet’ yailal.Hax Jesús kaw tzyak’ yajlil a satcha’anh, ha oj a’nok wal sniwnal ki k’ojol."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha aj ayk’ ki wach’ Kolmal, manhxa tas oj ki k’ana’, mahnxa yok k’u oj kil ta’, kaw wal manhxa pax sk’ak’il, "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kaw wal manhxa pax ok’el, kusk’ojlal yet’ yailal.Hax Jesús kaw tzyak’ yajlil a satcha’anh, ha oj a’nok wal sniwnal ki k’ojol."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Heb’ yikxo Dios kaw yel te’n tzyutj sb’a jun, yet’ jun chekab’ to kaw yel tzyak’ pax ip. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yet’ pax wal smasnil heb’ to yik xo Cristo, oj k’och heb’ wal a yolsk’ab’ ki Mam Dios."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha aj ayk’ ki wach’ Kolmal, manhxa tas oj ki k’ana’, mahnxa yok k’u oj kil ta’, kaw wal manhxa pax sk’ak’il,"},{"id":6,"tag":null,"isDisplayed":null,"text":" Kaw wal manhxa pax ok’el, kusk’ojlal yet’ yailal.Hax Jesús kaw tzyak’ yajlil a satcha’anh, ha oj a’nok wal sniwnal ki k’ojol."}]},{"id":191,"title":"Yajnhej Oj Meltzjok Jesús","guid":"wO439/eP/UuK0tjNP7ErTg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"191    Yajnhej Oj Meltzjok Jesús \n \nV.C.A.# 52 Pronto Jesús De Los Cielos vendrá"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 14:1-4; 1 Co. 15:51-58; 1 Ts. 4:13-18\n \n ...Oj emlok Kajlilek a satcha’anh... hax ki k’e’chek a skal asn a snanhl satcha’anh. 1 Ts. 4:16-17.</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Oj jawk Jesús oj kot a satcha’anh, kaw tzin tzalji, yujto kaw oj jawok. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Smasnil hin niwnal oj jelmjok yu'uj, ha jun tik kaw yipk’ojlal yaj wu’uj."},{"id":0,"tag":1,"isDisplayed":null,"text":"Icha Jesús, icha Jesús, wal oj kaji, ha yik oj jawk cha. Icha Jesús, icha Jesús, wal oj kaj a satcha'anh."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Junxnhej oj kaj ki masnil yet’ Cristo,yik oj ki k’och yet' Dios a Satcha’anh."},{"id":4,"tag":null,"isDisplayed":null,"text":" Smasnil heb’ chamnak oj pitzwok pax heb’. Icha wal Jesús oj kaj ki masnil."},{"id":0,"tag":1,"isDisplayed":null,"text":"Icha Jesús, icha Jesús, wal oj kaji, ha yik oj jawk cha. Icha Jesús, icha Jesús, wal oj kaj a satcha'anh."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Smasnil asun, oj spuk sb’a yuj Jesús,oj sakb’ok ak’wal, yuj wal stziktznial, "},{"id":5,"tag":null,"isDisplayed":null,"text":"oj ochwan smasnil chak xuxm ik’, manhxa ok’el kojxnhej tzaljk’ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Icha Jesús, icha Jesús, wal oj kaji, ha yik oj jawk cha. Icha Jesús, icha Jesús, wal oj kaj a satcha'anh."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Heb' may ste’nal, j’och ste’nal yuj Jesús,smasnil tas juwnak, oj b'oxok yu'uj. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Oj kan kuslal, kaw oj kil tzaljk'ojlal, oj aj Yiglesia yet' a stziktznial."},{"id":0,"tag":1,"isDisplayed":null,"text":"Icha Jesús, icha Jesús, wal oj kaji, ha yik oj jawk cha. Icha Jesús, icha Jesús, wal oj kaj a satcha'anh."}]},{"id":192,"title":"Hach Ki Dios Aych Ek’ A Smasnil K’inal","guid":"i24UM76ITkuq5yMJGjGx3g","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"192     Hach Ki Dios Aych Ek’ A Smasnil K’inal\n \nC. S. G. # 72 Oh Padre Eterno Dios"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Tit. 3:3-8; Sal. 66:1-8, 2 Cor. 3:14\n \n Han tik ayn ek’ he yet’ a smasnil k’inal, masnto oj lajwk ek’ yolyib’nhk’inl tik, xchi Jesús a heb’. Mt. 28:0</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Hach ki Diosal Kajlil hach, tzki b’itnej wal ha b’i Mamin, tzkak’ yuj diosal, "},{"id":3,"tag":null,"isDisplayed":null,"text":"yuj wal ha wach’k’ojlal yet’ wal ha chamk’ojlal. Yujto ha aych Mamin tz’ilchj junk’ojlal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Hach ki Cristo kolwjum hach, tzkak' ki pixn aych a chamk'olal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Tzonh ha tanhwej, yujto ki Diosal hach, tzonh k´och a hojltak, yet’ smasnil ki k’ojol, tzkij chanh ha b’i."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Hach Santo Espíritu, ab’ tas tzkal wal ha aych tiknek, yet’ ha wach'il ak’ ki nib’k ki b’oni, "},{"id":5,"tag":null,"isDisplayed":null,"text":"smasnil tas kaw wal wach’ sek oj ki b’o smasnil tas tza nib’ej."}]},{"id":193,"title":"Ha Aych Tik Ki Mam Dios","guid":"eKGQvRF7sUKHeHbwFU8vBw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"193   Ha Aych Tik Ki Mam Dios\n \nC. S. G. # 68 A Nuestro Padre Dios\n "},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 119: 54-57; Gl. 1:1-5; 1P. 4:7-16      \n \n Hax heb’ chanhe xcha wink ichm wink cha, ix em kumn heb’, ix yaln sb’a heb a jun ayk’ a jun ejmnhej.  AP. 5:14 1     </f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1   Ha wal a ki Mam Dios,  oj kal ki wach’ paxti’, ijxkab’ chanh sb’i."},{"id":3,"tag":null,"isDisplayed":null,"text":" Yuj schamk'ojlal aynhek,  xya’n cham yunnal Jesús, yik ix wul yi'nok el ki mul; kaw wal ki’k chanh sb’i."},{"id":3,"tag":null,"isDisplayed":null,"text":"2   Ha a ki wach’ Kolmal,  kaw oj kalk wach’ paxti’, kaw ki’k chanh sbi’. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha wal yet’ xchik’l x’eli,  ha honh mannek eli. Yik tzonh yi’n at a satcha’anh, kaw ki’k wal chanh sb’i."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Santo Espíritu,  tzkal wach’ paxti ha a, smoj yijxchanh sb’i. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yet’ stziktznil satcha’anh tzch´oxn el sniwn chamk´ojlal, Cristo Jesús wal ki Kolmal;  smoj wal yijx chanh sb’i."},{"id":5,"tag":null,"isDisplayed":null,"text":"4    Tzaljk’ojlal tzonh b’itnek,  yet’ wal ki chamk’ojlal, a Dios Oxwanh. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Yujto smasnil k’inal, ayx ek' he Yoxwnhil, smasnil k’inal tzach ki b’itnej, ha aych Dios oxwanh."}]},{"id":194,"title":"Ix Mukx Kan Cristo","guid":"BF4RuYiEOUCtFyEqgxlr9w","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"194        Ix Mukx Kan Cristo\n \nC. S. G. # 212 La Tumba Le Encerró"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mt. 28:1-10;  1 Cor. 15:20-26; Jn. 20:1-10 \n \nHax ix k’och heb’, xyiln heb’ elnkxo smak k’e’en…manhxa sniwnal Kajlil Jesús ayk’ ta’. Lc. 24:2-3</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ha Cristo kaw mukxnak, Cristo hin Kolmal. Ha yik ayt sakb’ eli spitzw paxi. "},{"id":0,"tag":1,"isDisplayed":null,"text":"Ix pitzw pax hin Jesús, (Yunnal Dios) Yet’ yipal Dios spitzw pax Jesús."},{"id":3,"tag":null,"isDisplayed":null,"text":" Ha chamel ix kan a yalnh yuj yipalil; tiknek pitzan ha honh koln el a ki mul."},{"id":4,"tag":null,"isDisplayed":null,"text":"¡Yuj wal dios! (¡Yuj wal dios!) ¡A ki Dios! (¡A ki Dios!) Pitzwnak ki wach’ kolmal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Heb' xtanhwni max xyil heb’, yik spitzw Jesús,spoj jun seyoal yuj Cristo kajlil."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ix pitzw pax hin Jesús, (Yunnal Dios) Yet’ yipal Dios spitzw pax Jesús."},{"id":4,"tag":null,"isDisplayed":null,"text":" Ha chamel ix kan a yalnh yuj yipalil; tiknek pitzan ha honh koln el a ki mul."},{"id":5,"tag":null,"isDisplayed":null,"text":"¡Yuj wal dios! (¡Yuj wal dios!) ¡A ki Dios! (¡A ki Dios!) Pitzwnak ki wach’ kolmal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Xkan chaml a yalnh yu’uj, yik wal ix pitzwi. Yet’ yipalil ki Dios spitzw Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ix pitzw pax hin Jesús, (Yunnal Dios) Yet’ yipal Dios spitzw pax Jesús."},{"id":5,"tag":null,"isDisplayed":null,"text":" Ha chamel ix kan a yalnh yuj yipalil; tiknek pitzan ha honh koln el a ki mul."},{"id":6,"tag":null,"isDisplayed":null,"text":"¡Yuj wal dios! (¡Yuj wal dios!) ¡A ki Dios! (¡A ki Dios!) Pitzwnak ki wach’ kolmal."}]},{"id":195,"title":"Ix Pitzw Pax Jesús","guid":"BeC6Pl6V20mQvC/ynZUPcw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"195    Ix Pitzw Pax Jesús \n \nC. S. G. # 215 El Señor Resucitó"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Co. 15:20-26;  Mr. 16:1-7; Hch. 2:29-36 \n \nPalta wal yel, pitzwnak Cristo a skal heb’ chamnak. 1 Co. 15:20 1    </f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"Tox ix pitzw pax hin Kolmal, ¡Aleluya! (¡Aleluya, aleluya!) Tox ix kan chaml a yalnh yu’uj, ¡Aleluya! (¡Aleluya, aleluya!) "},{"id":3,"tag":null,"isDisplayed":null,"text":"Yet’ yipalil Dios xpitzwi, ¡Aleluya! (¡Aleluya, aleluya!) Kaw wal yel pitzn ton Jesucuristo. ¡Aleluya! (¡Aleluya, aleluya!)"},{"id":3,"tag":null,"isDisplayed":null,"text":"Emmkilal yutjnak sb’a Jesús. ¡Aleluya! (¡Aleluya, aleluya!) Ix pitzwi yuj wal ya'n yajlil, ¡Aleluya! (¡Aleluya, aleluya!) "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ki b'itnokek sb'i tiknek. ¡Aleluya! (¡Aleluya, aleluya!) Ayk’ tiknek yet’ Dios a skal stziktznial. ¡Aleluya! (¡Aleluya, aleluya!)"},{"id":4,"tag":null,"isDisplayed":null,"text":"Ix kulsax ki Kolmal kujek, ¡Aleluya! (¡Aleluya, aleluya!) Kaw kusnak yuj yailal jun, ¡Aleluya! (¡Aleluya, aleluya!)"},{"id":5,"tag":null,"isDisplayed":null,"text":" Ayk' Jesús a stziktznial. ¡Aleluya! (¡Aleluya, aleluya!) Yajl yaj Jesús a satchanh tiknek. ¡Aleluya! (¡Aleluya, aleluya!)"},{"id":5,"tag":null,"isDisplayed":null,"text":"Ha Jesús kaw ki wach' Kolmal, ¡Aleluya! (¡Aleluya, aleluya!) Ix k'ewan a skal heb' chamnak, ¡Aleluya! (¡Aleluya, aleluya!) "},{"id":6,"tag":null,"isDisplayed":null,"text":"Oj ki atk a satcha'anh. ¡Aleluya¡ (¡Aleluya, aleluya!) Ki b’itnokek sb’i a smasnil k’inal. ¡Aleluya! (¡Aleluya, aleluya!)"}]},{"id":196,"title":"May Mach A Tik Tox Ix Pitzwi","guid":"ovG3OpRPQkiyjkGfOUHpnQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"196      May Mach A Tik Tox Ix Pitzwi\n \n#171. V. C."},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mat. 28:1-10; Jn. 20:1-10 \n \nManhx ayk’ek’ a tik,  to x ix pitzw paxi. Lc.24:6 1 </f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Ix yal jun yangel Dios a heb' ix: Manh he yak’ somchjok he k'ojol, wojtak mach jun wan he sayn a tik, ha wal Jesús wan he sayni."},{"id":0,"tag":1,"isDisplayed":null,"text":"May mach a tik tox ix pitzwi, iltek nab'an aj ix ek’i. ¿Tas yuj wan he sayn ek' wal Cristo? "},{"id":3,"tag":null,"isDisplayed":null,"text":"manhx ayk ek' a skal heb' chamnak. ¿Tom manhxtzak he na kot sti yaljnak, a yoxl k'u oj hin pitzwi?"},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Tzin tzalji yuj ix pitzw Jesús, kaw tzin b'itnej schamk'ojlilal. Ha spaxti Dios kaw niwn ye’lchi, tzyak' tzaljk'ojlal a hin pixan."},{"id":0,"tag":1,"isDisplayed":null,"text":"May mach a tik tox ix pitzwi, iltek nab'an aj ix ek’i. ¿Tas yuj wan he sayn ek' wal Cristo? "},{"id":4,"tag":null,"isDisplayed":null,"text":"manhx ayk ek' a skal heb' chamnak. ¿Tom manhxtzak he na kot sti yaljnak, a yoxl k'u oj hin pitzwi?"},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Xchi Jesucristo a heb' skuywum: Ixkek at halk el wach' ab'ix. Ha heb' tzya'ch sk'ojl a Jesucristo, oj kolchjok heb' yuj swach’k'ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"May mach a tik tox ix pitzwi, iltek nab'an aj ix ek’i. ¿Tas yuj wan he sayn ek' wal Cristo? "},{"id":5,"tag":null,"isDisplayed":null,"text":"manhx ayk ek' a skal heb' chamnak. ¿Tom manhxtzak he na kot sti yaljnak, a yoxl k'u oj hin pitzwi?"},{"id":5,"tag":null,"isDisplayed":null,"text":"4    Yuj cha kaw wal tzwa'ch yipk hin k'ojol, to oj jawk pax hin wach' Kolmal. Oj yak' wal spak yik junjn heb' yiko', hatn heb' to tzya'ch sk'ojl a Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"May mach a tik tox ix pitzwi, iltek nab'an aj ix ek’i. ¿Tas yuj wan he sayn ek' wal Cristo? "},{"id":6,"tag":null,"isDisplayed":null,"text":"manhx ayk ek' a skal heb' chamnak. ¿Tom manhxtzak he na kot sti yaljnak, a yoxl k'u oj hin pitzwi?"}]},{"id":197,"title":"Tox Ix Pitzw Pax Jesús","guid":"/3Quz1GFWkif7zr2+4RXOA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"197      Tox Ix Pitzw Pax Jesús\n \nV. C. # 59 El Señor Resucitó, Aleluya."},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mt. 28:1-15; Mr. 16:1-13; Ro. 14:8-9 \n \nManhx ayk och a tik, tox ix pitz pax icha yaj yaln kan ayex. Mt. 28:6</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1   Tox ix pitzw pax Jesús ¡Aleluya! Yuj yipalil ki Mam Dios, ¡Aleluya! "},{"id":3,"tag":null,"isDisplayed":null,"text":"Yet’ sjelnal yet’ yipalil ix kan chaml a yalnh yu’uj, yuj to honh sman yet' schik'il. ¡Aleluya!"},{"id":0,"tag":1,"isDisplayed":null,"text":"Aleluya hin kolchji, manb'iln xo yuj wal schik'il; (alelu) Jesucristo hin Kolmal, yuj swach'k'ojlal hin skolni. (hin kolchji) "},{"id":4,"tag":null,"isDisplayed":null,"text":" Manb'iln xo yuj wal schik'il. ¡Aleluya! (Manb'ilin)"},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Ix smuk heb’ sniwnal Jesús aleluya,xk'ewan a skal heb' chamnak, ¡Aleluya! "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ki b’itnokek sb’i Jesús, yujto pitzw nak toni; manb'ilnh xo yuj wal schik'il. ¡Aleluya!"},{"id":0,"tag":1,"isDisplayed":null,"text":"Aleluya hin kolchji, manb'iln xo yuj wal schik'il; (alelu) Jesucristo hin Kolmal, yuj swach'k'ojlal hin skolni. (hin kolchji)  "},{"id":5,"tag":null,"isDisplayed":null,"text":"Manb'iln xo yuj wal schik'il. ¡Aleluya! (Manb'ilin)"},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Cristo xcham a te kulus, ¡Aleluya! Xk’ewan a skal heb’ chamnak, ¡Aleluya! "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ayx ek' a stz'ey ki Mam Dios, ya'n och wal ki ti ha a. Manb'ilnh xo yuj wal schik'il. ¡Aleluya! "},{"id":0,"tag":1,"isDisplayed":null,"text":"Aleluya hin kolchji, manb'iln xo yuj wal schik'il; (alelu) Jesucristo hin Kolmal, yuj swach'k'ojlal hin skolni. (hin kolchji)  "},{"id":6,"tag":null,"isDisplayed":null,"text":"Manb'iln xo yuj wal schik'il. ¡Aleluya! (Manb'ilin)"},{"id":5,"tag":null,"isDisplayed":null,"text":"4    Ix paxk’e a satcha’anh ¡Aleluya! Oj jawk pax a scha ejmal. ¡Aleluya! "},{"id":6,"tag":null,"isDisplayed":null,"text":"jki pax yet’ a satcha’anh, yujto yik xo wal kaji; manb'ilnh xo yuj wal schik'il. ¡Aleluya! "},{"id":0,"tag":1,"isDisplayed":null,"text":"Aleluya hin kolchji, manb'iln xo yuj wal schik'il; (alelu) Jesucristo hin Kolmal, yuj swach'k'ojlal hin skolni. (hin kolchji)"},{"id":7,"tag":null,"isDisplayed":null,"text":"  Manb'iln xo yuj wal schik'il. ¡Aleluya! (Manb'ilin)"}]},{"id":198,"title":"Pitzn Wal Hin Cristo","guid":"nOxQsQGa302Cisnv5S5CFQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"198      Pitzn Wal Hin Cristo\n \nC. S. G. # 222 Porque Él Vive"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 14:12-24; Sal. 18:1-6; 46-50; 2 Cor.13:3-11 \n \n…Yujto pitzn hin a jun ejmnhej, yuj cha, pitzn hex pax a jun ejmnhej junxo.  Jn.14:19</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ha ki Mam Dios ix yak’ kot wal yunnal, ay schamk’ojlal yet’ sniwnk’ojlal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ix cham wu’uj, wal a te kulus, palta yet’ yipalil ix pitzw pax Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw pitzn hin Cristo, yuj cha matz hin xiwi, tanhb’iln yu’uj yujto pitzan. "},{"id":4,"tag":null,"isDisplayed":null,"text":"ha tas tot oj jawok wojtak to yojk smasnil,  kaw yel ay hin k’inal yujto pitzn hin Kolmal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Kaw tzonh tzalji yuj jun nene unin,  siylab’ ki Mam Dios tzyak’ wal ayonh. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw wach’ yik heb’ to tzchan wal Cristo, yujto tzchaj kan sk’inal ay a jun ejmnhej."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw pitzn hin Cristo, yuj cha matz hin xiwi, tanhb’iln yu’uj yujto pitzan. "},{"id":5,"tag":null,"isDisplayed":null,"text":"ha tas tot oj jawok wojtak to yojk smasnil,  kaw yel ay hin k’inal yujto pitzn hin Kolmal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Oj lajwok hin k’inl a sat lum lum tik, oj wil chamel yet’ yailal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"hax yet’ Jesús kaw oj wak’ yajlil, kaw tziktzni yilx aj oj waj yet’ hin wach’ Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw pitzn hin Cristo, yuj cha matz hin xiwi, tanhb’iln yu’uj yujto pitzan. "},{"id":6,"tag":null,"isDisplayed":null,"text":"ha tas tot oj jawok wojtak to yojk smasnil,  kaw yel ay hin k’inal yujto pitzn hin Kolmal."}]},{"id":199,"title":"Jesucristo Wan Sayn Schekab'","guid":"lboqASj9lkCP36GxAvttxw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"199     Jesucristo Wan Sayn Schekab'\n \nV. C. # 249. Cristo Está Buscando Obreros"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mt. 9:35-38; Mt. 10:5-15; Lc. 10:1-2 \n \nHax Jesús, ix atxi. Yik wan sb’eyi, ix yiln jun Mateo sb’i…Ochnh hin kuywumok, xchi Jesús ha a. Yajnhj cha, xk’ewa’an, ix och skuywumok.  Mt. 9:9</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Jesucristo wan sayn ek' mach tiknek jun. Heb’ to tznib’j tzo’ch a smunljel. "},{"id":3,"tag":null,"isDisplayed":null,"text":"¿Mach oj ta'wok Mamin, han tzin at het'ok?, Hantik oj hin ha cheka’."},{"id":0,"tag":1,"isDisplayed":null,"text":"A Mamin manh jantkok ha munljel, Hal ha chekab' jaywnhej heb'. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ak’ ki jelnal yet’ kip kaln el ha paxti’, sek kaw ay heb’ ha chekab'."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Cristo tzsay schekab' yik wach' tzyal heb' wach' ab'x, a skal heb' anma satnak."},{"id":4,"tag":null,"isDisplayed":null,"text":" ¿Mach oj halnok, Mamin han tzin at het'ok, ha tzyal aj tzin ha cheka’?."},{"id":0,"tag":1,"isDisplayed":null,"text":"A Mamin manh jantkok ha munljel, Hal ha chekab' jaywnhej heb'. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ak’ ki jelnal yet’ kip kaln el ha paxti’, sek kaw ay heb’ ha chekab'."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Til wal munljel ay, toto wal tza nib'j, tzach munlj a yik ki Jesús."},{"id":5,"tag":null,"isDisplayed":null,"text":"Hal a heb' anma to yuj swach'k'ojlal Dios, tiknek ay wal kolnb'il."},{"id":0,"tag":1,"isDisplayed":null,"text":"A Mamin manh jantkok ha munljel, Hal ha chekab' jaywnhej heb'. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Ak’ ki jelnal yet’ kip kaln el ha paxti’, sek kaw ay heb’ ha chekab'."},{"id":5,"tag":null,"isDisplayed":null,"text":"4    ¿Tom wal yel kolb’ilch xo a smasnil ha mul? ¿Tom hojk schamk’ojlal Jesús?"},{"id":6,"tag":null,"isDisplayed":null,"text":" Hal jun wach' ab'x tik a heb' anma satnak, sek oj kolchjok kan pax heb'."},{"id":0,"tag":1,"isDisplayed":null,"text":"A Mamin manh jantkok ha munljel, Hal ha chekab' jaywnhej heb'. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Ak’ ki jelnal yet’ kip kaln el ha paxti’, sek kaw ay heb’ ha chekab'."}]},{"id":200,"title":"Wojtak To Pitzan","guid":"4g0VrZDtdkSDHjIg9Kh7tA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"200      Wojtak To Pitzan\n \nC. S. G. # 224  Al Cristo Vivo Sirvo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ap. 1:12-19; Fil. 3:7-14; Gl. 2:16-21\n \n Wojtak to ha jun mach tzin kolni, pitzan. Job 19:25</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kaw tzin munlj a yik Cristo,  ayk'nhej ton wal wet’ok. Ay mach tzalni to chamnak,  hal hin wojtak pitzan. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw tzwil swach’k’ojlal Cristo,  tzyak’ sniwnal hin k’ojol. Ha yik tzin awj a Jesús,  ayk' a hin tz'ey."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw pitzan, (kaw pitzan) kaw pitzan, (kaw pitzan) tiknek pitzn hin wach' Kolmal; ayk' a hin tz'ey, ha tzin molni. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yujto ha hin mann eli. Kaw pitzan, kaw pitzan ha x'a'n hin kolnb'il. Wojtak to pitzn hin wach' Kolmal,  kajn och a hin pixan."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ha a yolyib’nhk’inl tik,  tzwil xchamk’ojlal Jesús. Ha yik tzjaw hin kusk'ojlal,  ha tz'a'n hin tzaljk'ojlal."},{"id":4,"tag":null,"isDisplayed":null,"text":" A junjn k'u tzin sch'ox aja b'e aj tzin b'eyi, wojtak to ha hin Cristo oj jawk paxi."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw pitzan, (kaw pitzan) kaw pitzan, (kaw pitzan) tiknek pitzn hin wach' Kolmal; ayk' a hin tz'ey, ha tzin molni. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yujto ha hin mann eli. Kaw pitzan, kaw pitzan ha x'a'n hin kolnb'il. Wojtak to pitzn hin wach' Kolmal,  kajn och a hin pixan."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Kaw tzaljanhk hex yunnal Dios, b'itnanhk a tzaljk'ojlal. Kalk wach' paxti a Cristo, Yujto Syajlil yaji."},{"id":5,"tag":null,"isDisplayed":null,"text":" Ha Cristo kolwjum a smasnil wal heb' anma', may junk xo ay schamk'ojlal icha Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw pitzan, (kaw pitzan) kaw pitzan, (kaw pitzan) tiknek pitzn hin wach' Kolmal; ayk' a hin tz'ey, ha tzin molni. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Yujto ha hin mann eli. Kaw pitzan, kaw pitzan ha x'a'n hin kolnb'il. Wojtak to pitzn hin wach' Kolmal,  kajn och a hin pixan."}]},{"id":201,"title":"Tzin Munlj A Yik Cristo","guid":"OSgqugwUO0CdMq0FLqUcoQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"201       Tzin Munlj A Yik Cristo \n \nC. S. G. # 500 A Servir A Cristo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mt. 28:16-20; Heb. 13:1-8\n \n Aynnhej och het’ok, hax hach hin tanwni pax a ajtil oj hek’i.  Gn.28:15</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Matz hin xiw hin munlj a hin Kolmal Jesús, smasnil tas tzyala kaw wal oj hin yiklok. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Toto hin ch'okoj kaw wal matz tak' wu'uj, yujnhej Jesucristo kaw matz hin xiwi. "},{"id":0,"tag":1,"isDisplayed":null,"text":"Yet' Jesús tzanj ajtil oj hin at yet’ok. Yujto ha tzin ch’oxni, kaw matz hin xiwi."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Kaw matz hin xiw hin at wal yet' hin Kolmal, yik tzin b’eyk’ yet’ Jesús kaw te’n tzwutj hin b’a."},{"id":4,"tag":null,"isDisplayed":null,"text":" Toxnhej may hin mam hin nun ayk' wal wet'ok, palta Jesucristo matz hin yaktj kani."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yet' Jesús tzanj ajtil oj hin at yet’ok. Yujto ha tzin ch’oxni, kaw matz hin xiwi."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Toxnhej yib'nh ha mar, mto a sat lum tik, a smasnil k’inal oj hin ch’oxl hin Jesús. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Toxnhej kusltak lum ajtil tzin b’eyi, palta Jesucristo kaw ha tzin molni."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yet' Jesús tzanj ajtil oj hin at yet’ok. Yujto ha tzin ch’oxni, kaw matz hin xiwi."}]},{"id":202,"title":"Tzin Nib’j Tzin Munlj A Yik Kajlil","guid":"ANfsdrK3mU2YSN7tovhGGg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"202 Tzin Nib’j Tzin Munlj A Yik Kajlil\n \nC. S. G. # 472  Anhelo Trabajar Por El Señor"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>1 Cor. 15:7-14; Col. 1:24-29; Ap.2: 1-7 \n \nKaw tzwak’ ip wal a smasnil hin k’ojol, yujto ha Cristo tzyak’ yipalil ayin.  Col. 1:29</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Hin nib’b’en kaw tzin munlj a hin Diosal, tzin yipk’ojlej spaxti’ yet’ schamk’ojlal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Tzin b'itni tzin leslwi, tzwa’n pax witz’nb’ok hin b’a, wal a smunljel hin Yajlil."},{"id":0,"tag":1,"isDisplayed":null,"text":"Munljahn, leslwanh, (leslwanh munljanh a yik ki Mam Dios) yuj wal smunljel ki wach' Kolmal Jesús. (a yik Dios) "},{"id":4,"tag":null,"isDisplayed":null,"text":"Tzin nib'j wal tzin leslwi, tzwa’n pax witz’nb’ok hin b’a, yuj wal smunljel ki Mam Dios."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Tzin nib'j to junjn k'u tzwalnk el spaxti', yik tzwaln a heb' anma ayk' a skal mul. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Tzwi’n at heb’ wal a Jesús, jun tzonh ch'oxn a sakk’inal. Yujto tzin munlj a smunljel."},{"id":0,"tag":1,"isDisplayed":null,"text":
