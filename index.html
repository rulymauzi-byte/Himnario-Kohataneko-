isDisplayed":null,"text":"Tza'n hin nhej yuj Jesús, yuj wal hin jichk'ojlal. Kaw yel jun tza'n hinnhej, junxnhej waj yet' Cristo."},{"id":6,"tag":null,"isDisplayed":null,"text":"5     Tzin nib'j tzin b'eyk’ yet' Jesucristo, yujto jab'xoj ayn ek'i. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Ha wal smasnil maysch’olnilal jun, Kaw wal yowlal oj lajwok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tza'n hin nhej yuj Jesús, yuj wal hin jichk'ojlal. Kaw yel jun tza'n hinnhej, junxnhej waj yet' Cristo."},{"id":7,"tag":null,"isDisplayed":null,"text":"6     Kaw tzin hel wal hach Jesucristo, yik tzin ek’ a junjn k’u. "},{"id":8,"tag":null,"isDisplayed":null,"text":"Ha het' Mamin kaw wal tzin kani, junjn k'u ayn ek' het'ok. "},{"id":0,"tag":1,"isDisplayed":null,"text":"Tza'n hin nhej yuj Jesús, yuj wal hin jichk'ojlal. Kaw yel jun tza'n hinnhej, junxnhej waj yet' Cristo."}]},{"id":119,"title":"Kaw Najt Waj A Stz’ey Dios","guid":"GkHZtDH2r0SeKilmbda83A","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"119    Kaw Najt Waj A Stz’ey Dios\n \nC.S.G. 323 Lejos De Mi Padre Dios"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>1 Co. 1:17-24; Ro. 5:1-11; Ef. 2:11-23 \n \nYuj Cristo, ay kalnek kik ki chan swach’k’ojlal Dios, yuj to tzka’k och ki k’ojl ha a. Ro.5:2</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kaw najt waj a stz’ey hin Dios, hin chax yuj hin Cristo. Hin kolchjkan yuj schamk’ojlal, yet’ pax yuj swach’k’ojlal."},{"id":3,"tag":null,"isDisplayed":null,"text":"Coro.\nOj hin b’itnok Jesús wal a smanil k’inal. Hin kolchj kan yuj schamk’ojlal, yuj kaw niwn swach’k’ojlal."},{"id":4,"tag":null,"isDisplayed":null,"text":"2     Kaw wal ay hin jichk’ojlal, a hin kolmal Cristo. Yujto ha wal tz’a’n smasnil, tas kaw ay tz’och wu’uj. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Coro.\nOj hin b’itnok Jesús wal a smanil k’inal. Hin kolchj kan yuj schamk’ojlal, yuj kaw niwn swach’k’ojlal."},{"id":5,"tag":null,"isDisplayed":null,"text":"3     Tzin b’eyk’ yet’ hin wach’ ilmal, tiknek molb’iln yu’uj.  Smasnil swach’k’ojlal hin Dios, tz’ilchj wal yuj hin pixan."},{"id":6,"tag":null,"isDisplayed":null,"text":"Coro.\nOj hin b’itnok Jesús wal a smanil k’inal. Hin kolchj kan yuj schamk’ojlal, yuj kaw niwn swach’k’ojlal."}]},{"id":120,"title":"Kaw Yel Xwak Kan Maysch’olnil","guid":"B3HfqGksd0CK4NEHdxdZFg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"120       Kaw Yel Xwak Kan Maysch’olnil\n \n Kaw Yel Xwak Kan Maysch’olnil"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Lc. 4:18-19;  Lc. 7:22; Ef. 2:1-10 \n \n…Ha a yik yalanh, chamnk honhk a sat yuj ki mulek, yuj pax ki may sch’olnilal. Ef. 2:1</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kaw kusk'ojlal yaj hin pixn a yik pekti', yujto mantzak hin chaj Jesús. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Yik xwab'n spaxti hin wach' Kolmal Jesús, xjaw jun sakk'inl a hin pixan."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw yel xwakkan smasnil maysch'olnilal, kaw wal ayn xo ek' a sakk'inal."},{"id":4,"tag":null,"isDisplayed":null,"text":" Kaw oj woch tza'n yuj hin wach' Kolmal Jesús, kaw tzaljk'ojlal yaj hin pixan."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Hin Kolmal Jesús kaw yel hin wach'k'ojol, xyak' junk'ojlal a hin pixan. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw ayx ek' sakk'inlal Dios aynhek tiknek, yuj Jesús ki wach' Kolmal jun."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw yel xwakkan smasnil maysch'olnilal, kaw wal ayn xo ek' a sakk'inal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw oj woch tza'n yuj hin wach' Kolmal Jesús, kaw tzaljk'ojlal yaj hin pixan."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Kaw wal tzin nib’j tzin k’och ton yet’ hin Jesús,yujto ha xcham a te kulus. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yujto ha hin sakb'tzan yet’ yipalil, yujto ix el ton wal schik’il"},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw yel xwakkan smasnil maysch'olnilal, kaw wal ayn xo ek' a sakk'inal."},{"id":6,"tag":null,"isDisplayed":null,"text":" Kaw oj woch tza'n yuj hin wach' Kolmal Jesús, kaw tzaljk'ojlal yaj hin pixan."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Hex anma chajek Jesús he Kolmalok. ¿Tas yuj matz he chaj wal tiknek? "},{"id":6,"tag":null,"isDisplayed":null,"text":"Ha wal heb' tzjaw a ki wach' Kolmal Jesús, kaw yel oj scha heb' jun sk'inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw yel xwakkan smasnil maysch'olnilal, kaw wal ayn xo ek' a sakk'inal. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Kaw oj woch tza'n yuj hin wach' Kolmal Jesús, kaw tzaljk'ojlal yaj hin pixan."}]},{"id":121,"title":"Manhx A Ye'lch Snib'b'en","guid":"5k9bTMYLS0+W7bUZqOI39w","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"121    Manhx A Ye'lch Snib'b'en Yolyib’nhk’inl Tik \n \nV. C. # 268 \tNo Me Importan Riquezas"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>1 P. 1:13-25; Ap. 3:5 \n \n…Ha a yik yalanh, til wal tas he nib’jnak ochi’, yuj to mant he yojkok Dios ta’.  1  P. 1:14</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Kaw wal manhxa ye'lch snib'b'en smasnil maysch'olnilal, kaw yel ay jun ki chonhab', wal aj ayk' ki Diosal."},{"id":3,"tag":null,"isDisplayed":null,"text":" Ha wal spaxti ki Diosal ayk' a smasnil k'inal, tzaljk'ojlal waj tiknek jun, yujto tz'ib'b'il hin b'i."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wach' yaln spaxti ki Dios, kaw wach' ton hin skuyni. Tzaljk'ojlal waj tiknek jun, yujto tz'ib'b'il hin b'i."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Kaw maysch’olnil wilx yuj mul, kaw may jak hin wach'il,hax wal ha chik'l hach Cristo ha ix b'ikn el hin mul. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yujto haljnakkan Mamin to aychnhej ek’ wet’ok, toxnhej tu wilx yuj hin mul palta hejnak eli."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wach' yaln spaxti ki Dios, kaw wach' ton hin skuyni. Tzaljk'ojlal waj tiknek jun, yujto tz'ib'b'il hin b'i."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Kaw wal wach’ yilx jun watut, kaw wal tziktzni yilxi. Kaw wach’ yik heb’ ayx ek’ ta’, kaw tzalj heb’ yet’ Jesús. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ma oj och maysch’olnil ta’, kaw may pax kusk’ojlal. Kaw wal tzin tzalji, yujto tz’ib’b’il xo hin b’i ta'."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wach' yaln spaxti ki Dios, kaw wach' ton hin skuyni. Tzaljk'ojlal waj tiknek jun, yujto tz'ib'b'il hin b'i."}]},{"id":122,"title":"Matz Tztak’ Yoch Yolyib’nhk’inl Tik Watutok.","guid":"0HHzzvdn3EetPhrzIPNxRQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"122      Matz Tztak’ Yoch Yolyib’nhk’inl Tik Watutok.\n \nH. de G. 118 El Mundo No Es Mi Hogar."},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mt. 7:13-14; Jn. 14:6-7, \n \nHa jun b’e tzwal tik, hanton tik.  Kojn hin tztak’ hex wi’n at aj ayk’ ki Mam Dios. Jn. 14:6</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Ix wakkan wal jun niwn b’e, tiknek tzin b’ey a utzn b’e. Tok wal tznachj el yuj heb’ anma’, to a satchanh oj hin k’ochi."},{"id":0,"tag":1,"isDisplayed":null,"text":"//Ma oj hin kan a sat lum tik. // A stziktznil oj hin k’och kajan, Ma oj hin kan a sat lum tik."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Ay mach tznib’j to tzin at yet’ok, a b’eyb’al to kaw manh wach’ok, matz hin chaj wal wab’ tas tzyal heb’, yujto jin at a satcha’anh."},{"id":0,"tag":1,"isDisplayed":null,"text":"//Ma oj hin kan a sat lum tik. // A stziktznil oj hin k’och kajan, Ma oj hin kan a sat lum tik."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Ochnh a jun b’e tik hach ajmul, och konh tza’n yuj ki wach’ kolmal. ¿Tas yuj ma tza chaj wal Jesús? Yujto ha tztak’ hach skoln eli. "},{"id":0,"tag":1,"isDisplayed":null,"text":"//Ma oj hin kan a sat lum tik. // A stziktznil oj hin k’och kajan, Ma oj hin kan a sat lum tik."}]},{"id":123,"title":"Tzwakkan Yolyib’nhk’inl Tik Yuj Cristo","guid":"8LzPivlpn0Sy+KuqYt5gcg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"123     Tzwakkan Yolyib’nhk’inl Tik Yuj Cristo\n \nC.S.G. # 424  Dejo El Mundo Y Sigo A Cristo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mt. 19:16-24; Jn. 1:40-50; Mt. 9:9-13 \n \nHax Jesús ix atxi…ix yil jun Mateo sb’i.. Ochnh hin kuywumok, xchi Jesús ha a, yajnhj cha xk’ewa’an ix och tza’n yu’uj.    Mt. 9:9</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Tzwakkan maysch’olnil yuj Cristo, yujto kaw wal oj ek’ok. Hax wal schamk’ojlal hin Cristo, ayk’nhej a smasnil k’inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal niwn tz’o’ch sk’ojl hin Cristo, kaw niwn schamk’ojlal ayin. Kaw ix yak’ ton wal hin k’inal, yuj ix cham a te kulus."},{"id":4,"tag":null,"isDisplayed":null,"text":"2    Tzwakkan maysch’olnil yuj Cristo, ix ilchj junk’ojlal wu’uj. Ha a yik xilchj Jesús wu’uj, wojtak ha oj hin kolni."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal niwn tz’o’ch sk’ojl hin Cristo, kaw niwn schamk’ojlal ayin. Kaw ix yak’ ton wal hin k’inal, yuj ix cham a te kulus."},{"id":5,"tag":null,"isDisplayed":null,"text":"3     Tzwakkan maysch’olnil yuj Cristo, Tzin nib’j tzwil sat hin Kolmal. Kaw tzyak’ sakk’inl a yol hin b’e, cheklj kab’ wal sakk’inlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal niwn tz’o’ch sk’ojl hin Cristo, kaw niwn schamk’ojlal ayin. Kaw ix yak’ ton wal hin k’inal, yuj ix cham a te kulus."},{"id":6,"tag":null,"isDisplayed":null,"text":"4      Tzwakkan maysch’olnil yuj Cristo, ha wal Cristo tzin kolni. Kaw oj at wil yilx hin Cristo, yet’ stziktznil a jun ejmnhej."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal niwn tz’o’ch sk’ojl hin Cristo, kaw niwn schamk’ojlal ayin. Kaw ix yak’ ton wal hin k’inal, yuj ix cham a te kulus."}]},{"id":124,"title":"Tza'n Hin Och Yuj Cristo","guid":"4vDmjwR0o0qoXCUEYHP1OA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"124       Tza'n Hin Och Yuj Cristo\n \nC. S. G. # 413. He Decidido Seguir A Cristo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 12:20-32; Hch. 26:15-29; Sal. 119:25-34 \n \nIx yawtn kot heb’, yuj cha, ix yaktkan heb’, smam chi yet’ he win smajn a yol te barco cha, ix at heb’ yet’ok.  Mr.1:20</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Kaw tza'n hin och yuj hin wach' Kolmal jun,kaw tza'n hin och yuj hin wach' Kolmal jun, "},{"id":3,"tag":null,"isDisplayed":null,"text":"kaw tza'n hin och yuj hin wach' Kolmal jun, manhx oj hin meltzj a hin patik."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Kaw ix wakkan wal jun ichmb’eyb’al,kaw ix wakkan wal jun ichmb’eyb’al, "},{"id":4,"tag":null,"isDisplayed":null,"text":"kaw ix wakkan wal jun ichmb’eyb’al, manhx oj hin b’o maysch’olnilal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Ha hin wach' Kolmal xb'on hin nab'en jun,ha hin wach' Kolmal xb'on hin nab'en jun,"},{"id":5,"tag":null,"isDisplayed":null,"text":" ha hin wach' Kolmal xb'on hin nab'en jun, manhx oj hin meltzj a hin patik."}]},{"id":125,"title":"X’ilchj Jun Ak’ K’inl Wu'uj","guid":"UHJHalivKkOKO6V74ypXCA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"125     X’ilchj Jun Ak’ K’inl Wu'uj\n \nC.S.G. 314 Vida Nueva Encontré"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ro. 4:6-8; Ap. 2:1-7;  Jn. 10:1-15 \n \nPalta xyak’ ki k’inlek yet’ Cristo. Yuj wal swach’k’ojlal Dios tzonh kolchjek. Ef. 2:5</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     // Kaw ix wak’ hin niwnal a Jesús hin wach’ Kolmal, yujto ha xcham a te kuls wu’uj. //"},{"id":0,"tag":1,"isDisplayed":null,"text":"// Kaw ix ilchj jun ak’ k’inl a Jesús hin Kolmal, yujto kaw wal ha hin mann eli. //"},{"id":3,"tag":null,"isDisplayed":null,"text":"2     // Ha tiknek tzwak’ hin b’a a Jesús hin wach’ Kolmal, ha pekti kaw wal may hin ch’olnil. //"},{"id":0,"tag":1,"isDisplayed":null,"text":"// Kaw ix ilchj jun ak’ k’inl a Jesús hin Kolmal, yujto kaw wal ha hin mann eli. //"},{"id":4,"tag":null,"isDisplayed":null,"text":"3     // Ha Yespíritu Dios kaw wan hach yawtn hach ajmul, kotnh a Cristo oj ha kolchj eli. //"},{"id":0,"tag":1,"isDisplayed":null,"text":"// Kaw ix ilchj jun ak’ k’inl a Jesús hin Kolmal, yujto kaw wal ha hin mann eli. //"}]},{"id":126,"title":"Kaw Tzin Nib’j Tzin B'eyk' Yet' Jesús","guid":"rUsie39SQkqebdKOQepuGw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"126     Kaw Tzin Nib’j Tzin B'eyk' Yet' Jesús\n \nC. S. G. # 412 Oh, Yo Quiero Andar Con Cristo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>2 P. 3:8-14; Ef. 5:1-10; 1 Jn. 1 \n \n…Yel xo wal tzalj Jehová toto tzyiklx tas tzyala, a yib’nh to tz’a no xajmb’al ha a. 1 S. 15:22</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kaw tzin nib’j tzin b'eyk' yet' Jesús,kaw tzin nib’j pax tzwab' yol sjaj. Ha wal spaxti Dios tzin na yujto tzin nib'j tzin och tzak'an. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Tzwak’ hin k’inl a Jesucristo, tzin b’on icha wal tznib’ej. Ay jun k'u oj hin k'och kajn yet' Jesús a satcha'anh."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzin nib’j tzin, b'eyk' wal yet' Cristo. Kaw tzin nib’j pitzn hin, wal yet’ Cristo. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw tzin nib’j tzin, cham wal yet’ Cristo. Kaw tzin nib’j tzin, ch’oxl wal Jesús"},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Kaw tzin nib’j tzin b’eyk’ yet' Cristo, may xon jab’ok tu sb’o’o. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha a spaxti Dios tzwila, yuj cha wojtak to kaw wal yel. Cristo wach’nhj tas sb’o’o, palta ix cham a te kulus."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzin nib’j tzin, b'eyk' wal yet' Cristo. Kaw tzin nib’j pitzn hin, wal yet’ Cristo. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw tzin nib’j tzin, cham wal yet’ Cristo. Kaw tzin nib’j tzin, ch’oxl wal Jesús"},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Tzin nib’j yiklum hin a Jesús, tzin och tza’n yuj hin Kolmal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw tzin nib’j tzin b’eyk’ yet’ Cristo, sakk’inl yaj aj tzin b’eyi."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzin nib’j tzin, b'eyk' wal yet' Cristo. Kaw tzin nib’j pitzn hin, wal yet’ Cristo. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kaw tzin nib’j tzin, cham wal yet’ Cristo. Kaw tzin nib’j tzin, ch’oxl wal Jesús"},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Kaw tzkan yolyib’nhk’il tik, tzin och tza’n yuj jun hin wach’ Kolmal. "},{"id":6,"tag":null,"isDisplayed":null,"text":"May xon jab’ok wach’ tzyak’a, palta Jesús tzyak’ ki k’inal. Ha tas tanhb’il wal wu’uj, to oj hin at a satcha’anh."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzin nib’j tzin, b'eyk' wal yet' Cristo. Kaw tzin nib’j pitzn hin, wal yet’ Cristo."},{"id":7,"tag":null,"isDisplayed":null,"text":" Kaw tzin nib’j tzin, cham wal yet’ Cristo. Kaw tzin nib’j tzin, ch’oxl wal Jesús"}]},{"id":127,"title":"Tzach Hin Chamk’ojlej Jesús","guid":"AAodJLCKJUORF3T+zT3AJQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"127  Tzach Hin Chamk’ojlej Jesús\n \nC. S. G. # 395 Oh Cristo, Yo Te Amo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 4:10-19; Fil. 1:21-26; Fil. 3:7-14\n \n …Mamin, kaw ojkt xoni, to tzach  hin chamk’ojlej, xchi Pedro cha. Jn.21:15</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1   Cristo tzach hin chamk’ojlej, wojtak hek hin xo. Ha wal smasnil hin mul jun, tzwakkan hoj smasnil."},{"id":3,"tag":null,"isDisplayed":null,"text":" Kaw wach’ hach Wajlil Jesús, hin kolchj kan wal el ho’oj. Yuj cha tzach hin chamk'ojlej, yuj cha kaw tzin tzalji."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Mamin hin ha chamk’ojlej, chaj hin chamkojlal. Hach cham wal a te kulus, yuj hin mayscholnil. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yujto ix hab’ syal Mamin, yuj cha tzwa’n hin b’a ayach, yuj cha tzach hin chamk'ojlej, yuj cha kaw tzin tzalji."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ya'sb'a pitzn hin hoj Mamin,  a sat jun lum tik, hat yik oj jawk jun k'u cha, yik oj hin chami."},{"id":5,"tag":null,"isDisplayed":null,"text":" Aychnhej wal hin k'ojl ayach, oj hach hin b'itnok Mamin, yuj cha tzach hin chamk'ojlej, tzwaln wach' paxti ayach."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Mamin yuj ha wach’k’ojlal, oj hin k’och het’ok,ha yet’ smasnil heb’ heko’, oj wal wach’ paxti’."},{"id":6,"tag":null,"isDisplayed":null,"text":" Ha ta oj hach hin b'itnok, yet' wal jun hin b'it tik jun, Jesús tzach hin chamk'ojlej, wal a smasnil k'inal."}]},{"id":128,"title":"Tzwak’ Hin K’inl Ayach.","guid":"+eHey9i/6EqM8qUdait+ew","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"128    Tzwak’ Hin K’inl Ayach.\n \nC.S.G. 410  Que Mi Vida Entera Esté."},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ro. 6:3-14; 1 Co. 6:12-20; 1 P. 1:13-23\n \n …Yuj cha, kaw ka’k och ki niwnal tik a yol sk’ab’ Dios, sek wach’ kojxn jun tzo’nh tas wach’ tzki b’ok yet’ok. Ro. 6:13</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kaw ix wak’ hin k’inl ayach, kaw heknhej wal tz’aj Mamin. Ketzn a stojlal hach Wajlil, yet’ wal ha chamk’ojlilal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Sakx waj yuj ha chik’l hach hin kolmal (Hach hin kolmal). Tox ix hej el hin maysch’olnilal (Maysch’olnilal). "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw xwak’ hin k’inl ayach to hek xo Mamin. Heknhej a smasnil k’inal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Tza’n hin och hoj hach Mamin, hanhj a stojlal jin b’eyi. Oj wal wach’l yet’ hin ti’, ha aych Cristo hin Kolmal ."},{"id":0,"tag":1,"isDisplayed":null,"text":"Sakx waj yuj ha chik’l hach hin kolmal (Hach hin kolmal). Tox ix hej el hin maysch’olnilal (Maysch’olnilal). "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw xwak’ hin k’inl ayach to hek xo Mamin. Heknhej a smasnil k’inal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Junjn k’u oj hach hin na’, yuj wal smasnil ha wach’il. Hax wal yik tzin paxtini, kaw oj wal ha chamk’ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Sakx waj yuj ha chik’l hach hin kolmal (Hach hin kolmal). Tox ix hej el hin maysch’olnilal (Maysch’olnilal). "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw xwak’ hin k’inl ayach to hek xo Mamin. Heknhej a smasnil k’inal."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Tzwak’ hin nib’b’en aych Mamin, yujto heknhej ton yaji. Kaw wal tzwak’ hin pixn ayach, kaw tzin nib’j ha tziktznial."},{"id":0,"tag":1,"isDisplayed":null,"text":"Sakx waj yuj ha chik’l hach hin kolmal (Hach hin kolmal). Tox ix hej el hin maysch’olnilal (Maysch’olnilal)."},{"id":6,"tag":null,"isDisplayed":null,"text":" Kaw xwak’ hin k’inl ayach to hek xo Mamin. Heknhej a smasnil k’inal."},{"id":6,"tag":null,"isDisplayed":null,"text":"5    kaw wal tzach hin chamk’ojlej, yuj cha tzwak’ hin b’a ayach. Chaj hin wal hach hin Kolmal, heknhej tzin nib’j tzin aji. "},{"id":0,"tag":1,"isDisplayed":null,"text":"Sakx waj yuj ha chik’l hach hin kolmal (Hach hin kolmal). Tox ix hej el hin maysch’olnilal (Maysch’olnilal)."},{"id":7,"tag":null,"isDisplayed":null,"text":" Kaw xwak’ hin k’inl ayach to hek xo Mamin. Heknhej a smasnil k’inal."}]},{"id":129,"title":"Kolb'ilnhek Xo El Yuj Dios","guid":"JmQsx+fIHkq3ZcAmKSrnHA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"129      Kolb'ilnhek Xo El Yuj Dios\n \nV. C. # 272 Libres Estamos, Dios Nos Absuelve"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Gá. 5:1-15; Ef. 4:17-32\n \n Yuj cha, toto han tzex hin Kolkn el a yalnh he mul, kaw yel oj he kolchjkani, yujto Yunnaln Dios. Jn. 8:36</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Yuj ki wach' Kolmal tzaljk'ojlal aynhek, kaw ayx ki kolnb'il yuj swach'k'ojlal b'i'an."},{"id":3,"tag":null,"isDisplayed":null,"text":" Ix yak' niwnk'ojlal yuj wal ki mul, chamk'ojlab'il nhek yuj Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"Manb'ilnhek yu'uj tzaljk'ojlal aynhek, yuj smasnil ki mul kaw ix el schik'il."},{"id":4,"tag":null,"isDisplayed":null,"text":" Kolb'ilnhek xo yuj ki wach' Kolmal, yujto ix o'ch wal sk'ojl aynhek."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ha a pekti' ki b'ojnak maysch'olnil, kojxnhej maysch'olnil kaw tzki chamk'ojlej. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw o’ltaknhek yuj wal ki tu'al, kaw wal may jab'ok ki wach'il."},{"id":0,"tag":1,"isDisplayed":null,"text":"Manb'ilnhek yu'uj tzaljk'ojlal aynhek, yuj smasnil ki mul kaw ix el schik'il. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kolb'ilnhek xo yuj ki wach' Kolmal, yujto ix o'ch wal sk'ojl aynhek."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Kaw kolb'ilnhek xo yuj Jesucristo, kaw ix cham wal yuj ki maysch'olnilal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ha ki wach' Kolmal kaw x'el schik'il, kaw manb'ilnhek xo yuj Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"Manb'ilnhek yu'uj tzaljk'ojlal aynhek, yuj smasnil ki mul kaw ix el schik'il. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kolb'ilnhek xo yuj ki wach' Kolmal, yujto ix o'ch wal sk'ojl aynhek."}]},{"id":130,"title":"Kolchj Nakn Xo","guid":"nVG6myT6WEy5Isn0kUwtPA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"130    Kolchj Nakn Xo\n \nH. D. G. # 68 Libre Estoy"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Is. 1:16-19; Ap. 7:9-17; 1:12-19\n \n …Yuj yipalil Yespíritu,  honh kolchjek elt a yol sk’ab’ maysch’olnil, yet’ a yol sk’ab’ chamel. Ro. 8:2</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Najtl e'nk hin wal a skal hin tu'al, e'nk hin ton wal ajun tzo’nh maysch'olnil. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw ix b'o wal hin b'eyb'al, yuj spaxti xyak' wal ayin. Hin yij kan el wal a jun tzo'nh maysch'olnil."},{"id":0,"tag":1,"isDisplayed":null,"text":"Hin kolchji,( hin kolchji)hin kolchji, (hin kolchji)yuj swach'k'ojlal hin Jesús, kolchjnak hin. (kaw koljnak hin) "},{"id":4,"tag":null,"isDisplayed":null,"text":"Hin kolchji,(kolchjnak hin) hin kolchji,(hin kolchji) tiknek tzin tzalji, yujto kolchjnak hin"},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Najtl e'nk hin wal a skal hin tu'al, manh nanok wal schamk'ojlal Jesús wu’uj."},{"id":4,"tag":null,"isDisplayed":null,"text":" Kaw wal satnk hin nab'en, tok ay wal jak tas wojtak. Hal tiknek ayx wal hin kolnb'il yu'uj."},{"id":0,"tag":1,"isDisplayed":null,"text":"Hin kolchji,( hin kolchji)hin kolchji, (hin kolchji)yuj swach'k'ojlal hin Jesús, kolchjnak hin. (kaw koljnak hin) "},{"id":5,"tag":null,"isDisplayed":null,"text":"Hin kolchji,(kolchjnak hin) hin kolchji,(hin kolchji) tiknek tzin tzalji, yujto kolchjnak hin"},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Najtl e'nk hin wal a skal hin tu'al, hax tiknek ayn xo wal och a swach'ilal."},{"id":5,"tag":null,"isDisplayed":null,"text":" Wan wal hin chamk'ojlani, kaw wal tanhb’il sjaw wu’uj. Halxkab wach’ paxti wal a ki Wach’ ilmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Hin kolchji,( hin kolchji)hin kolchji, (hin kolchji)yuj swach'k'ojlal hin Jesús, kolchjnak hin. (kaw koljnak hin) "},{"id":6,"tag":null,"isDisplayed":null,"text":"Hin kolchji,(kolchjnak hin) hin kolchji,(hin kolchji) tiknek tzin tzalji, yujto kolchjnak hin"}]},{"id":131,"title":"Ayk' Jesús Wet'ok","guid":"300BWFVHmUWYe9mKMN8YjQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"131         Ayk' Jesús Wet'ok\n \nC. S. G. # 362. Solo No Estoy"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mt. 28:16-20; Sal. 44:1-8; Jn. 14:15-26\n \n …Yujto han Jehová hin, tztak’ wuj smasnil, ayn ek’ he yet’ok. Hag. 2:4</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Manh hin ch’okjok, Jesús kaw ayk’ a hin tz'ey. Hin wach’ k’ojol, may aj tzin yak kani."},{"id":3,"tag":null,"isDisplayed":null,"text":" A xiwk’ojlal, yet’ pax yik junk’ojlal jun, ha wal Jesús kaw ayk’nhej wal wet’ok."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Wach’xam ay smay tas tzjaw a wib’anh toxnhej tzin xchakl heb’ anma’, "},{"id":4,"tag":null,"isDisplayed":null,"text":"ma oj hin xiw hin ch’oxn el Jesús, tzin sketz wal yet’ schamk’ojlal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Yik tzin b’eyk’i, kaw wal ay hin tzaljk’ojlal. Manh hin ch’okjok, Jesús ayk’ wal wet’ok."}]},{"id":132,"title":"Ha Jesús Hin Wach' k'ojol","guid":"LclKD+95wEC0qr3bOWBk/w","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"132    Ha Jesús Hin Wach' k'ojol \n \nV. C. # 114 ¡Tengo Un Amigo!"},{"id":3,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 15:9-17; Gn. 15:1-19;  Stg. 2:14-26\n \n Icha tzin schamk’ojlej ki Mam Dios, ixta tzex wutj hex hin chamk’ojlan jun xo. Jn. 15:9</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Jun hin wach' k'ojol hatn hin Jesús, tzwal wach' paxti a hin wach' Kolmal."},{"id":3,"tag":null,"isDisplayed":null,"text":" A sat lum tik kaw wal may junk xo, kojxnhej wal Jesús tz'a'n hin k'inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Cristo hin wach'k'ojol, hin Kolmal. Kaw wal yik hin a smasnil k'inal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Icha nha k’e’en ixta Jesús, ha wal ta', kaw wach’ tzki kol ki b’a. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Matz hin xiwi yujto ayk' wet'ok, kaw ilb'iln yuj a smasnil k'inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Cristo hin wach'k'ojol, hin Kolmal. Kaw wal yik hin a smasnil k'inal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Tza'n hin och yuj jun hin wach' Kuymal,tzin skuy a sb'eyb'al yet' a spaxti'. Manhx oj hin at a skal maysch’olnil, yujto ayn xo ek’ a sakk’inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Cristo hin wach'k'ojol, hin Kolmal. Kaw wal yik hin a smasnil k'inal."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Ha Cristo kaw wal hin wach'k'ojol, ix yak' tzaljk'ojlal a hin pixan. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Yuj cha kaw junk'ojlal xo waji, kaw manhxa hin kusk'ojlal tiknek. "},{"id":0,"tag":1,"isDisplayed":null,"text":"Cristo hin wach'k'ojol, hin Kolmal. Kaw wal yik hin a smasnil k'inal."}]},{"id":133,"title":"Ix Ilchj Wal Jun Hin Wach’k’ojol","guid":"V5nIN6Q+rUyehabJ1tpZAw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"133       Ix Ilchj Wal Jun Hin Wach’k’ojol\n \nC.S.G # 327  Hallé Un Buen Amigo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 15:5-15; Stg. 2:18-23; 1 P. 1: 13-23\n \n Hax tik, toto tze yiklj jun tzo’nh hin cheknhb’il, to ixta’, hin wachk’ojl hex.   Jn.15:14</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Tox ix ilchj jun hin wach’ k’ojol, ha Cristo hin Kolmal;oj hin b’itnok smasnil swach’k’ojklal ayin. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ix yak' wal niwnk'ojlal ayin, tikni kaw ajmul hin, manhxa mach ixta wal schamk'ojlal ayin."},{"id":3,"tag":null,"isDisplayed":null,"text":" Tox ix yij kan el hin mul, tzin skol a Satanás; ya'jnak kan wal sti to ayk'nhej wal wet'ok. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yuj cha kajn ek' ton wal wet'ok, tox ix yij el hin mul, manhx halchjb'enok schamk'ojlal Jesús ayin."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Manhxa tas tzyak' palta ayin, may aj tzin yak kani;  yujto kaw wal ha tzin iln a junjn k’u."},{"id":4,"tag":null,"isDisplayed":null,"text":" Wach'xam ay tas ay wal a tik, may waln wik wal ha a, yujto kaw yik xo Jesús wal waj tiknek. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Wach'xam kaw matz hin snib'j heb' anma ayk' wal a  tik; palta maj hin b'eylb'ok wal sb'eyb'al heb'. "},{"id":5,"tag":null,"isDisplayed":null,"text":" Sek maj och wal hin mul a Dios, yowlal oj hin yiklok, yujto yik xo wal waj a smasnil k'inal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Wojtak to ha Jesucristo, kaw tox oj jawk paxi, ixta yaj yaln kan wal a yik spaxk'e'i."},{"id":5,"tag":null,"isDisplayed":null,"text":" Ha wal a yatut ki Mam Dios, hata ay sak k’inal, hata oj kan kajn heb’ to yikxo yaji. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ha yik oj hin k’och yet’ok, manhxa yailal ta’, kaw oj wil wal sat Jesús hin wach’ kolmal."},{"id":6,"tag":null,"isDisplayed":null,"text":" Yet’ heb’ manb’ilx yuj wal schik’il, oj hin b’itnok wal sb’i. Manhx halchjb'enok schamk'ojlal Jesús ayin."}]},{"id":134,"title":"Ha Jesús Ki Wach' K'ojol","guid":"1tY71/Vbk0ivuKvX+hhyRA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"134     Ha Jesús Ki Wach' K'ojol\n \nV. C. # 117. Es Jesús El Mejor Amigo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 11:1-16; Mt. 11:11-19; Mt. 20:1-16\n \n Jantknhej kilk’ojlalek ka’k och a yol sk’ab’ Dios, yujto ha aych il honh yilnek. 1 P. 5:7</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Ha Jesús kaw wal yel wach' toni, yik aych ek' wal a skal kusk'ojlal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Oj yak' syaxilal ayach, kaw tanhb'ilchnhej wal yu'uj. Ha Jesús kaw wal yel wach' toni."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha Jesús kaw wal yel wach' toni.(hin  wach’ kolmal) Ha Jesús kaw wal yel wach' toni.(kaw wach’ toni) "},{"id":4,"tag":null,"isDisplayed":null,"text":"Oj yab' tas oj hal ha a, kaw oj kolwjok het'ok. Ha Jesús kaw yel ki wach' k'ojol."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Ha Jesús kaw wal yel wach’ toni kaw tzyak' junk'ojlal a hin pixan. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw tzwa'ch ton yipk hin k'ojol, yuj cha tzwak’ hin b’a ha a. Ha Jesús kaw wal yel wach' toni."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha Jesús kaw wal yel wach' toni.(hin  wach’ kolmal) Ha Jesús kaw wal yel wach' toni.(kaw wach’ toni) "},{"id":5,"tag":null,"isDisplayed":null,"text":"Oj yab' tas oj hal ha a, kaw oj kolwjok het'ok. Ha Jesús kaw yel ki wach' k'ojol."},{"id":4,"tag":null,"isDisplayed":null,"text":"3  Wach'xam kaw ay smay aj ayn ek'i, wach’ xam tzin ek’ a yenhl chamel."},{"id":5,"tag":null,"isDisplayed":null,"text":" May xon wal tas oj wi’ni, ha Jesús oj hin kolni. Ha Jesús kaw wal hin wach' kojol."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha Jesús kaw wal yel wach' toni.(hin  wach’ kolmal) Ha Jesús kaw wal yel wach' toni.(kaw wach’ toni)"},{"id":6,"tag":null,"isDisplayed":null,"text":" Oj yab' tas oj hal ha a, kaw oj kolwjok het'ok. Ha Jesús kaw yel ki wach' k'ojol."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Ha a yik oj ki yamnk ki b'a jun, yet' smasnil heb' to schajnak Jesús. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Oj ki b'itn a tzaljk'ojlal, wal a yojltak Jesús. Ha Jesús kaw wal hin wach' kojol."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha Jesús kaw wal yel wach' toni.(hin  wach’ kolmal) Ha Jesús kaw wal yel wach' toni.(kaw wach’ toni) "},{"id":7,"tag":null,"isDisplayed":null,"text":"Oj yab' tas oj hal ha a, kaw oj kolwjok het'ok. Ha Jesús kaw yel ki wach' k'ojol."}]},{"id":135,"title":"Kaw Ki Wach' K'ojl Cristo","guid":"1B6DwDkAqUi7SLTsH/k8Cw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"135      Kaw Ki Wach' K'ojl Cristo\n \nC. S. G. # 482  ¡Oh Que Amigo Nos Es Cristo!"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Fil. 4:4-9; Jn. 15:5-15; Mr. 14:32-42\n \n Manh honh ochk il yuj junk tas. Jantknhej tas tzki na’ek, kalk a Dios tzonh leslwi’ek. Fil. 4:6</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Kaw wal ki wach’k’ojl Cristo,ha ix i’n el ki yail, kaw wal tzonh schek leslwok jun, kalk wal smasnil tas a Dios. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ay aj may ki junk'ojlal b'i'an,  kaw ay ilk'ojlal ayonh, ixta wal kaj hanh tik tiknek jun,  yuj matz kal smasnil a Dios."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     ¿Tom ay kusk'ojlal wal ayach, b'isk'ojlal yet' xiwk'ojlal? Hal ha kusk'ojlal a Cristo,  hatn wal ha wach'k'ojol. "},{"id":4,"tag":null,"isDisplayed":null,"text":"¿Tom kaw tzach sb'uch wal heb' anma'? hal a Cristo ha Kolmal, a yol sk'ab' ay junk'ojlal b'i'an, hal ha b'a a ki Kolmal.."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ha Jesús kaw ki wach' k'ojol, kaw ix sch'ox wal swach'k'ojlal; sek wach' tzkolchj heb' ajmul smasnil,  ha ix ya'ch sb'a anmail."},{"id":5,"tag":null,"isDisplayed":null,"text":" Ha ix cham a spatk te kulus,  ha ix i'n el ki yail; smasnil k'inal kaw ayk'  Cristo, hanhj wal aj tzwa'ch hin nab'en. "}]},{"id":136,"title":"May Aj Tzin Yaktj Kan Dios","guid":"I26Mb2i2+U23/r6BDrPbrA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"136      May Aj Tzin Yaktj Kan Dios\n \nV. C. # 180  Nada Puede Ya Faltarme"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 121; Mt. 28:16-20; 18:20.\n \n Ha Jehová ki tanhmalek yaji, ha a yenhul hata aynhek ek’i, yik tzonh skolnek. Sal. 121:5</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kaw may aj tzin yaktj kan Dios jun, kaw wal aych wet' aj tzin b'eyk’i. Ha sat lum lum kaw wach’ yilxi, yet aj ay te sat awb’en wach’. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw wal wach’ ajtil tzin ilji, wal aj ay jun ha kaw wal wach’. Ha wal tz’a’n wach’ a hin pixan, kaw tzyak’ tzaljk’ojlal wal ayin."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ha wal spaxti Dios tzin kuyni, kaw tzin sch'ox wal aj tzin b'ey jun. Kaw tzin schamk'ojlej hin Kolmal, yujto kaw ix yak' hin k’inal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha wal hin wach' kolmal Jesús, hin koln el a yol sk'ab' chamel. kaw wal manhxa hin xiwk'ojlal, yujto ha hin Dios aych wet'ok."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Ha wal in wach' kolmal Jesús, kaw ix yij el hin maysch'olnil. Kaw matz hin xiw yuj tas ay smay, yujto aych wal Cristo wet'ok. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ha hin wach' kolmal Jesucristo, ix yij el hin kusk'ojlal jun. Tzaljk'ojlal xo yaj hin pixan, yuj wal swach'k'ojlal hin kolmal."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Kaw tzin schamk'ojlej wal Jesús, oj hin b'eylb'ok wal sb'eyb'al jun. Yik oj hin k'och a satcha'anh, oj hin kan yet' a jun ejmnhej."},{"id":6,"tag":null,"isDisplayed":null,"text":" Manhxa jak tas tzin na tiknek, yujto ha Dios tzin ketzn b'eyok. Hax wiln och hin kolmal Jesús, yik oj hin k'och a satcha'anh."}]},{"id":137,"title":"May Junk Xo","guid":"MVjszK93ZEOx6aPWakt1Nw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"137      May Junk Xo\n \nH. D. G. # 157  No Lo Hay"},{"id":3,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 14:15-18; Hch. 10:43; 1 P. 5:7\n \n Toto tzin he chamk’ojlej,  yikljek jun tzonh hin cheknhb’il.  Jn. 14:15</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      May junk ki wach’ k’ojl icha wal Cristo, may junk xo, may junk xo. "},{"id":3,"tag":null,"isDisplayed":null,"text":"May junk xo tztak' ya'n niwnk'ojlal ayonh, may junk xo, may junk xo."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yojk Cristo smasnil ki kusk'ojlal, kaw tzonh skol a smasnil k'inal. May junk ki wach’ k’ojl icha wal Cristo, may junk xo, may junk xo."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     May jun ejmok tzsat sk'ojl Cristo ayonh,  manh jab'ok, manh jab'ok.  "},{"id":4,"tag":null,"isDisplayed":null,"text":"May junk k'u matz honh yil Jesucristo, may junk k'u, may junk k'u."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yojk Cristo smasnil ki kusk'ojlal, kaw tzonh skol a smasnil k'inal. May junk ki wach’ k’ojl icha wal Cristo, may junk xo, may junk xo."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     May jun ejmok tzyij el sat wal ayonh, may b’ak’inh, may b’ak’inh.  "},{"id":5,"tag":null,"isDisplayed":null,"text":"¿Aym junk k'u matz honh yil wal ki Cristo? May junk k'u, may junk k'u."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yojk Cristo smasnil ki kusk'ojlal, kaw tzonh skol a smasnil k'inal. May junk ki wach’ k’ojl icha wal Cristo, may junk xo, may junk xo."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     ¿Aym ajtil matz e’lch icha tzyal Cristo?  Kaw tz’elchnhej tas tzyala. "},{"id":6,"tag":null,"isDisplayed":null,"text":"¿Aym ajtil tzpatkilj kan el heb’ ajmul? Kaw ma’ay, kaw ma’ay."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yojk Cristo smasnil ki kusk'ojlal, kaw tzonh skol a smasnil k'inal. May junk ki wach’ k’ojl icha wal Cristo, may junk xo, may junk xo."},{"id":6,"tag":null,"isDisplayed":null,"text":"5     ¿Aym junk xo siylab’ wach’ icha Cristo? May junk xo, may junk xo. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Ya’jnak wal sti, to ayk’nhej wal ket’ek,  kaw ayk’nhej, wal ket’ek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yojk Cristo smasnil ki kusk'ojlal, kaw tzonh skol a smasnil k'inal. May junk ki wach’ k’ojl icha wal Cristo, may junk xo, may junk xo."}]},{"id":138,"title":"Cristo Tzyijkot Heb' Ajmul","guid":"pXSY9rvyQkmqvY6X1FBLUQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"138    Cristo Tzyijkot Heb' Ajmul\n \nV. C. # 289 Cristo Acoge Al Pecador"},{"id":3,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Luc. 1:67-80; Jn. 8:12-20;   3:1-36\n \n Ix yaln pax Jesús ixtk a skal heb’ anma cha:  hantik, icha sakk’iln waj a heb’ anma ay a yolyib’nhk’inl tik. Jn. 8:12</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ha heb' ay a k'ik'k'inal,  wan sayn ek' heb' sak k'inal. Ha Jesús kaw sakk’inal,  toto tzka'ch ki k'ojl ha a."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj ki b'itkek sb'i ki wach' Kolmal, (kaw oj ki b'itkek sb'i ki wach' Kolmal,) ay schamk'ojlal Jesús aynhek. (ay schamk'ojlal Jesús aynhek.) "},{"id":3,"tag":null,"isDisplayed":null,"text":"B'itnejek wal sb'i ki wach' Kolmal, (b'itnejek wal sb'i ki Kolmal Jesús,) ayx ki kolnb'il yuj Jesús."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     A’ch ha k'ojl a ki Kolmal,  ha Jesús yunnal ki Dios.Oj yak' wal ha junk'ojlal,  oj yak' tzaljk'ojlal ayach."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj ki b'itkek sb'i ki wach' Kolmal, (kaw oj ki b'itkek sb'i ki wach' Kolmal,) ay schamk'ojlal Jesús aynhek. (ay schamk'ojlal Jesús aynhek.) "},{"id":4,"tag":null,"isDisplayed":null,"text":"B'itnejek wal sb'i ki wach' Kolmal, (b'itnejek wal sb'i ki Kolmal Jesús,) ayx ki kolnb'il yuj Jesús."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     A'ch ha k'ojl a ki Kolmal,  hax ha chan wal ha k'inal.Oj ha kan a tzaljk'ojlal,  xchi Jesús ki wach' Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj ki b'itkek sb'i ki wach' Kolmal, (kaw oj ki b'itkek sb'i ki wach' Kolmal,) ay schamk'ojlal Jesús aynhek. (ay schamk'ojlal Jesús aynhek.)"},{"id":5,"tag":null,"isDisplayed":null,"text":" B'itnejek wal sb'i ki wach' Kolmal, (b'itnejek wal sb'i ki Kolmal Jesús,) ayx ki kolnb'il yuj Jesús."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Na ha b'a yuj wal ha mul,  xchi Jesús wal aych tiknek. Ha wal heb' tzya'ch sk'ojl ayin,  oj k'och heb' a satcha'anh."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj ki b'itkek sb'i ki wach' Kolmal, (kaw oj ki b'itkek sb'i ki wach' Kolmal,) ay schamk'ojlal Jesús aynhek. (ay schamk'ojlal Jesús aynhek.)"},{"id":6,"tag":null,"isDisplayed":null,"text":" B'itnejek wal sb'i ki wach' Kolmal, (b'itnejek wal sb'i ki Kolmal Jesús,) ayx ki kolnb'il yuj Jesús."}]},{"id":139,"title":"Ha Mach  Tzya'ch Dios Yipk Sk'ojol","guid":"j948HnsTAEOgnK2GmuKtkw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"139 Ha Mach  Tzya'ch Dios Yipk Sk'ojol\n \nC. S. G. # 365  Los Que Esperan En Jehová"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Is. 40:27-31; Sal. 103:1-5; 2 Cor. 4:5-16\n \n Hax pax heb’ kojn Jehová tzya’ch yipk sk’ojol, kaw tzwach’ och yip heb’.  Is. 40: 31</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ha heb’ ha Dios tzya'ch yipk sk'ojol, kaw oj ajxok yip heb’ yu’uj. Kaw oj b’ey heb’ yet’ skolwal Dios, kaw may b’a’nh oj k’unb’ok heb’."},{"id":0,"tag":1,"isDisplayed":null,"text":"//Icha wal no salt’iw tzjenhwi, yuj yipalil Cristo Kajlil. Kaw ay yip sk’axl no sjenhwi, ixta heb' tzya'ch Dios yipk sk'ojol.//"},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ha wal a ki kolmal Jesús, ay niwnk’ojlal yet’ sakk’inal. Tzyak' tzaljk'ojlal yet' junk'ojlal, ha aj oj ki k’och kajan."},{"id":0,"tag":1,"isDisplayed":null,"text":"//Icha wal no salt’iw tzjenhwi, yuj yipalil Cristo Kajlil. Kaw ay yip sk’axl no sjenhwi, ixta heb' tzya'ch Dios yipk sk'ojol.//"}]},{"id":140,"title":"A Yatut Jairo","guid":"TiD2pTwlJ0yO61pMRhqiBw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"140     A Yatut Jairo\n \nC. S. G. # 179. A La Casa De Jairo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Lc. 8:41-49; Mr. 5:22-34; Mt. 9:18-26\n \n Palta yik ix yab’n Jesús jun cha, ix yaln ixtk a winak: Man ha na’, kojn wal to tza’ch ha k’ojl a Dios, hax sb’ox sk’ojl ix hesl cha, xchi a winak. Lc. 8:50</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ha wal a yatut Jairo tzb’eyt Jesús. Kaw wal niwn heb’ anma tza’n och a winak. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ay wal jun meb’a ix, yuj sjichk'ojlal, stzayn och sk’ab’ a Jesús yuj cha ix b’ox kani."},{"id":0,"tag":1,"isDisplayed":null,"text":"A’ch wal ha jichk’ojlal a ki Kolmal, icha wal jun ix tik x’och t’unhn ha a, ix elt sjelnal Jesús yuj cha xb’o ix, toto tza chaj Jesús oj ha kolchji."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Smasnil heb' anma ix hab'xni wal heb', kaw jaywnhej heb’ ix ya’ch sk’ojl a Jesús."},{"id":4,"tag":null,"isDisplayed":null,"text":" Hax wal nanhlxo heb’ anma, ma ix chaj heb’, ha Jesús tzch’oxn el sniwn chamk’ojlal ki Dios."},{"id":0,"tag":1,"isDisplayed":null,"text":"A’ch wal ha jichk’ojlal a ki Kolmal, icha wal jun ix tik x’och t’unhn ha a, ix elt sjelnal Jesús yuj cha xb’o ix, toto tza chaj Jesús oj ha kolchji."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Kaw ix wa’ch wal hin k’ojl aych hin Kolmal, may junhk mach ix i’n el wal hin maysch’olnil."},{"id":5,"tag":null,"isDisplayed":null,"text":" Kojn hach ix hin hanhtj wal a hin tual. Yaj wal hin niwnal tiknek yet’ hin pixan."},{"id":0,"tag":1,"isDisplayed":null,"text":"A’ch wal ha jichk’ojlal a ki Kolmal, icha wal jun ix tik x’och t’unhn ha a, ix elt sjelnal Jesús yuj cha xb’o ix, toto tza chaj Jesús oj ha kolchji."}]},{"id":141,"title":"Kaw Wach Yik Tzka’ch Ki K’ojl A Cristo","guid":"AOXvNEVarkWuzDtfa01dug","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"141     Kaw  Wach Yik Tzka’ch Ki K’ojl A Cristo\n \nC.S.G. 371  Cuán Dulce Es Confiar En Cristo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 86:1-10; Ap. 22:1-7\n \n Hex Israel meltzjanhk a ki Diosal. Yiklum tze yutj heb’a ha a, tojlb’tzejk he b’eyb’al. Aychnhej kab’ Dios yipk he k’ojol. Os. 12:6</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Wach’ yik tzka’ch ki k’ojl a Cristo, tzka’n ki b’a a ki Kolmal. Tzki chan kab’ smasnil tas yaljnak, tzki b’on icha wal tznib’ej."},{"id":0,"tag":1,"isDisplayed":null,"text":"Jesucristo, Jesucristo, tox ix wil ha chamk’ojlal. Jesucristo, Jesucristo. Tzach wa’chnhej yipk hin k’ojol."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Wach’ yik tzka’ch ki k’ojl a Cristo, tzki b’on icha wal tznib’ej. Matz ki chab’k’ojlej wal spaxti’, yujto yel, sakk’inl paxi."},{"id":0,"tag":1,"isDisplayed":null,"text":"Jesucristo, Jesucristo, tox ix wil ha chamk’ojlal. Jesucristo, Jesucristo. Tzach wa’chnhej yipk hin k’ojol."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Kojn hach tzach wa’ch yipk hin k’ojol, hach hin Kolmal kaw wach’ hach. Toxnhej tzjaw tas ay smay ayin, tzin skol wal ha chamk’ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Jesucristo, Jesucristo, tox ix wil ha chamk’ojlal. Jesucristo, Jesucristo. Tzach wa’chnhej yipk hin k’ojol."}]},{"id":142,"title":"Tzwa'ch Hin K'ojl A Jesús","guid":"bgQF9weHIUyAX+FaWngh1g","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"142       Tzwa'ch Hin K'ojl A Jesús\n \nC.S. G. # 374  Sigo Confiando En Jesús"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 125; Sal. 11; Sal. 54:1-4\n \n  Ha Jehová ha tzwa’ch yipk hin k’ojol. Sal. 11:1</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Kaw tzwa'ch hin k'ojl a hin Jesús, hin wach' Kolmal. Kaw tzwa'ch hin k'ojl a hin Jesús, kaw ma tzin xiwi. "},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Wach'xam tzjaw kuslal yail, kaw tzin b'itni. Kaw tzwa'ch hin k'ojl a hin Jesús, kaw ayk’nhej wet’ok’."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Hatn hin wach'k'ojol, kaw yel tzyal ayin. Kaw tzkolwj ayn a smasnil k'inal."},{"id":5,"tag":null,"isDisplayed":null,"text":"4    Wach'xam tzjaw kuslal yet' yail, kaw tzin b'itni. Kaw tzwa'ch hin k'ojl a hin Jesús, kaw ayk’nhej wet’ok’."}]},{"id":143,"title":"Yel Ix Wa'ch Hin K'ojl A Dios","guid":"fQtuXVxIi06wz+7bP2Zqqw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"143     Yel Ix Wa'ch Hin K'ojl A Dios\n \nSi Yo Sé, Yo Tengo Fe."},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ro. 3:21-31; Ef. 4:17-32; Ro. 8:1-27\n \n Yujnhej to tzka’k och ki k’ojl a Jesucristo, wach’nhek a sat Dios.  Ro. 3:22</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ha pekti' kaw may hin ch'olnil, hin b’ojnak smasnil tu'al. Kaw wal maysch'olnil hin b'eyb'al, hax Jesús hin koln eli."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yel ix wa'ch hin k'ojl a Dios, yel ix wa'ch hin k'ojl a Dios; hax Jesús ix a'n hin tzaljk'ojlal tiknek. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Yel ix wa'ch hin k'ojl a Dios, yel ix wa'ch hin k'ojl a Dios; ha schik'l hin wach' Kolmal ix i'n el hin mul."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Yunnal hin xo Dios tiknek jun, yuj Jesús hin kolchj kani. Yuj schamk'ojlal kaw tzin tzalji, Kaw ix yak' hin junk'ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yel ix wa'ch hin k'ojl a Dios, yel ix wa'ch hin k'ojl a Dios; hax Jesús ix a'n hin tzaljk'ojlal tiknek. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yel ix wa'ch hin k'ojl a Dios, yel ix wa'ch hin k'ojl a Dios; ha schik'l hin wach' Kolmal ix i'n el hin mul."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Hach anma’, tzach yawtj ki Kolmal, kaw wal tznib'j tzach kolchj kani. Tznib'j wal tzyak', swach'k'ojlal ayach, chaj Jesús ha kolmalok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yel ix wa'ch hin k'ojl a Dios, yel ix wa'ch hin k'ojl a Dios; hax Jesús ix a'n hin tzaljk'ojlal tiknek. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yel ix wa'ch hin k'ojl a Dios, yel ix wa'ch hin k'ojl a Dios; ha schik'l hin wach' Kolmal ix i'n el hin mul."}]},{"id":144,"title":"Yuj Jichk'ojlal Hin Kolchj Kani","guid":"/IV9RYqPN06PjYn28VqwgQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"144    Yuj Jichk'ojlal Hin Kolchj Kani\n \nC. S. G. # 299 Por Fe Contemplo Redención"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Is. 1:16-19; Ap. 7:9-17; 1:12-19\n \n …Hax heb’ tojl snab’en, pitznnhej heb’, yujto tzin ya’ch heb’ a sk’ojol,  xchi Dios.  Hab. 2:4</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Yuj jichk'ojlal hin kolchjkani, yuj xwa’ch hin k’ojl ha a’, ha Jesús tz’a’n hin kolnb’il, yujto ha xcham wu’uj."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ix chax wal jun spak'b'a wu'uj, ha hin b'ikni, hin b'o yu'uj. Kaw wach’ hin Dios, xyij el hin mul, xyij el hin mul, hin kolchj kani."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Ha yik xin chan wal hin Jesús, ix el hin chab’k’ojlal.Tzaljk’ojlal waj a sakk’inal, hin mul ix stojkn eli."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ix chax wal jun spak'b'a wu'uj, ha hin b'ikni, hin b'o yu'uj. Kaw wach’ hin Dios, xyij el hin mul, xyij el hin mul, hin kolchj kani."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Kaw wal yel ay hin tzaljk’ojlal, yujto tox hin skolo.Kaw ha Jesús Wajlil yaji, oj hin k’och wal yet’ok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ix chax wal jun spak'b'a wu'uj, ha hin b'ikni, hin b'o yu'uj. Kaw wach’ hin Dios, xyij el hin mul, xyij el hin mul, hin kolchj kani."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Kaw niwn swach'k'ojlal hin Diosal, yuj cha hin snan koti;ix yak' kot yunnal chamk wu'uj, kaw niwn wal syal xyab'i."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ix chax wal jun spak'b'a wu'uj, ha hin b'ikni, hin b'o yu'uj. Kaw wach’ hin Dios, xyij el hin mul, xyij el hin mul, hin kolchj kani."}]},{"id":145,"title":"Yuj Jichk'ojlal Wal A Jesús Ki Kolmal","guid":"U1Q7xtu0WkqjNaou98dVKw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"145      Yuj Jichk'ojlal Wal A Jesús Ki Kolmal\n \nC. S. G. # 287  Por Fe En Jesús, El Salvador"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ro. 3:21-28; Is. 35; 2 P. 3:8-14\n \n A’ch ha k’ojl a Kajlil Jesucristo, sek oj ha kolchji, yet’ jantknhej heb’ jun haj yet’ a yol hatut. Hch. 16:31</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Yuj jichk'ojlal a ki Kolmal, yuj cha tzkolchjkan el heb' ajmul. Yujto matnil tzyak’ jun kolnb’il, sek tzjaw heb’ ajmul a Jesús"},{"id":0,"tag":1,"isDisplayed":null,"text":"Yel niwn swach'c'ojlal ki Mam Dios, a heb' anma kaw maysch'olnil. Toto tzyal heb' smul a Jesús, oj ajxok niwnk'ojlal a heb'. "},{"id":3,"tag":null,"isDisplayed":null,"text":"May junk xo mach tz’a’n kolnb'il, kojn Jesús tzonh koln eli."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ha ichm b'eyb'al ix ek’i, yuj Jesucristo ki Kolmal. Ix a'tb'i a smasnil k'inal, manh katutok wal sat lum tik,"},{"id":0,"tag":1,"isDisplayed":null,"text":"Yel niwn swach'c'ojlal ki Mam Dios, a heb' anma kaw maysch'olnil. Toto tzyal heb' smul a Jesús, oj ajxok niwnk'ojlal a heb'."},{"id":4,"tag":null,"isDisplayed":null,"text":" May junk xo mach tz’a’n kolnb'il, kojn Jesús tzonh koln eli."}]},{"id":146,"title":"Yuj Jichk’ojlal Hax Sta’n Kujek","guid":"nxCVseOXhk68+tA6hJOdWw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"146     Yuj Jichk’ojlal Hax Sta’n Kujek\n \nC.S.G. # 530 Fe la Victoria Es"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ro. 8:28-39; 1 Jn. 5:1-7; Ap. 12:10-12\n \n Palta kaw ka’k yuj diosal a Dios, yujto ha Kajlil Jesucristo tz’och ket’ek. 1 Cor. 15:57</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Hex to scheb’ hex ki wach’ Kolmal kaw te’n tze yutj he b’a, may kab’ pax he chab’k’ojlal yik tzex at a howal."},{"id":3,"tag":null,"isDisplayed":null,"text":" Oj kak’ lajwok win ajk’ojol, yet’ yipal ki Mam Dios. Kaw wal oj stak’ ka’nek howal yuj wal ki jichk’ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yuj ki jichk’ojlalek, oj stak’ ka’nek howal. Ma oj ki lajwek eli yujnhej ki jichk’ojlal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ki ch’oxk el schamk’ojlal ki Dios, yet’ yipalil spaxti’,Kaw tza’nonhk wal yuj ki Kolmal, yujto ha tz’och ket’ek. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ki b’eylb’okek wal sb’eyb’al heb’, wach’ yutjnak sb’a a Dios, to yujnhej wal sjichk’ojlal heb’, ayk’ heb’ yet ki Mam Dios."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yuj ki jichk’ojlalek, oj stak’ ka’nek howal. Ma oj ki lajwek eli yujnhej ki jichk’ojlal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ha mach kaw te’n wal oj yutk sb’a, oj ijxok chanh yuj Dios,Jesús oj yal a Dios yu’uj, to manb’ilx yuj schik’il. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw oj sb’itnok heb’ sb’i Syajlil wal a smasnil k’inal, Hata oj kan heb’ yet’ Jesús, yujnhej wal sjichk’ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yuj ki jichk’ojlalek, oj stak’ ka’nek howal. Ma oj ki lajwek eli yujnhej ki jichk’ojlal."}]},{"id":147,"title":"Ha Aych Hin Cristo","guid":"MMUyfkaGU0eUXfa1GFf/Uw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"147      Ha Aych Hin Cristo\n \nV. C. # 107   Oh, Cristo En Tí"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 32:6-7; Jer. 16:19-21; Jn. 15:4-8\n \n …Ha heb’ junnhj tz’ajkn wet’ok, junnhj tzin ajkn yet’ heb’ junxo. Jn. 15:5</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ha aych hin Jesús yel hanhj aych Jesús, xchax junk'ojlal yuj hin pixan. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Til wal ilk'ojlal ay a hin pixan, yik tzin say junk'ojlal a pekti'."},{"id":0,"tag":1,"isDisplayed":null,"text":"To may Jesús, yel may junk xo wach'il, yujnhej Cristo ay hin tzajk'ojlal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha swach'il ki Mam Dios kaw tzin cha'aj, yuj Jesucristo hin Kolmal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Kaw wal yelk'ojlal ayn och a yol sk'ab', smasnil snib'b'en maysch’olnilal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Palta kusk'ojlal nhej wal waj yu'uj, may jab'ok tzaljk'ojlal xyak' ayin."},{"id":0,"tag":1,"isDisplayed":null,"text":"To may Jesús, yel may junk xo wach'il, yujnhej Cristo ay hin tzajk'ojlal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ha swach'il ki Mam Dios kaw tzin cha'aj, yuj Jesucristo hin Kolmal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Xin sayk’ junk’ojlal yet’ pax tzaljk’ojlal, kojn ha aych ix ilchj wal wu’uj "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ha a yik ix yak' Jesús hin kolnb'il, kaw yel manhxa tas tzin na tiknek."},{"id":0,"tag":1,"isDisplayed":null,"text":"To may Jesús, yel may junk xo wach'il, yujnhej Cristo ay hin tzajk'ojlal. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Ha swach'il ki Mam Dios kaw tzin cha'aj, yuj Jesucristo hin Kolmal."}]},{"id":148,"title":"!Hach Hin Cristo!","guid":"/nxQVnOugEGsHWmrcQFPew","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"148    !Hach Hin Cristo!\n \nV.C.166 ¡Oh, Cristo Mio!"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>2 Cor. 5:1-10; Sal. 4:1-5\n \n Ha yik tzonh ek’ a yolyibnhk’inl tik, kojxn Dios tzka’k och a ki k’ojol.   2 Cor. 5:7</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Hek hin xo Cristo, hin wach’k’ojl hach wal toni, hin Kolmal wal haj a smasnil k’inal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ha yik aych hin yail, kojxnhej aych tzwa’ch hin nab’en, ha wal aych oj ilchjok sniwnal hin k’ojol."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw yel aych ek’ wet’ Cristo, yuj cha ay hin junk’ojlal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw aych ek’ wal a hin tz’ey, yet’ a hin pixan. Ha wal yik tzk’ik’b’i, kaw wal tziktzni yilx k’anal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Ha wal sjelnal Dios kaw wal may slajub’. Kaw ay hin tzajk’ojlal a yik tzwiln wal schamk’ojlal, oj wal hin wach’ paxti’, wal a tzaljk’ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw yel aych ek’ wet’ Cristo, yuj cha ay hin junk’ojlal."},{"id":4,"tag":null,"isDisplayed":null,"text":" Kaw aych ek’ wal a hin tz’ey, yet’ a hin pixan. Ha wal yik tzk’ik’b’i, kaw wal tziktzni yilx k’anal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Oj jawk jun k’ual, kaw oj wak kan watut tik, ha spak wiko’ oj hak’ wal ayin. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw oj hach hin b’itnok, yik oj hin k’och wal het’ok, kaw oj hin kan het’ ta a smasnil k’inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw yel aych ek’ wet’ Cristo, yuj cha ay hin junk’ojlal. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kaw aych ek’ wal a hin tz’ey, yet’ a hin pixan. Ha wal yik tzk’ik’b’i, kaw wal tziktzni yilx k’anal.\n "}]},{"id":149,"title":"Hin Wach’Kolmal Ayk’ A Smasnil K’inal","guid":"VS4pN9WcNkyfMmfepeAxsQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"149    Hin Wach’Kolmal Ayk’ A Smasnil K’inal\n \nV.C. 167  Salvador, Mi Bien Eterno."},{"id":3,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 139:1-12; Ro. 11: 33-36; Is. 44:1-8 \n \n …Kaw aych Dios ket’ek. Yuj cha, ¿tom ay junk mach tztak’ ste’wtzan sb’a ya’n howl ket’ek?  Ro. 8:31</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Ha wal hin wach’ kolmal Jesús, ayk’nhej a smasnil k’inal, ha wal a yik kaw tz’el wip, wojtak to aych ek’ nhej wet’ok. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ha a tz’ey ayn ek’i, a hin tz’ey aych ek’i. Ha wal a yik tz’el wal wip jun, wojtak to aych ek’ wet’ok."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ma tzin nib’j och tas wach’ yilxi, Matz hin sayk’ b’inab’ilal. Toxnhej tzjaw kusk’ojlal ayin, wojtak to aych ek’ wet’ok. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha a tz’ey ayn ek’i, a hin tz’ey aych ek’i. Toxnhej tzjaw kusk’ojlal ayin, wojtak to aych ek’ wet’ok."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Kaw matz hin hakkan hin ch’okVoj, wach’xam tzjaw chaml a wib’anh. Yik mantzak jaw hin kusk’ojlal, wojtak to aych ek’ wet’ok. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ha a tz’ey ayn ek’i, a hin tz’ey aych ek’i. Yik mantzak jaw hin kusk’ojlal, wojtak to aych ek’ wet’ok. "}]},{"id":150,"title":"Tiknek Ay Hin Junk'ojlal","guid":"1HkY2cupdU6bvca3ssaNYw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"150    Tiknek Ay Hin Junk'ojlal\n \n C. S. G. # 321  Paz Con Dios"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 14: 23-29; Ro. 5:1-11; Col. 3:12-17 \n</f></i> \n<i><fMicrosoft Himalaya>Ha tiknek, tzwa’kn junk’ojlal a he pixan. Jn. 14:27</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ha wal junk'ojlal yet' Dios jun, ix hin say a junjn k'u. Wach'xam to tzin b'o wal wach'il, palta ma hin kolchj yu'uj."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tiknek ay hin junk'ojlal, kaw teb’il xwojkej eli. Smasnil tas tox ix a'tb'i, yuj cha junk'ojlal waji."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Pekti kaw ay hin chab'k'ojlal, kaw wal xiwnk hin a chamel. Kaw wal aych b’isk’ojlal ayin, yuj tzin xiw yuj yik k’ik’anh."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tiknek ay hin junk'ojlal, kaw teb’il xwojkej eli. Smasnil tas tox ix a'tb'i, yuj cha junk'ojlal waji."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ha yik kaw ay hin kusk'ojlal, manhx tzak stak’ wuj hin nani. Hat yik xwab' jun kaw wach’ ab’x tik, smasnil tas ix b’o yu’uj."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tiknek ay hin junk'ojlal, kaw teb’il xwojkej eli. Smasnil tas tox ix a'tb'i, yuj cha junk'ojlal waji."},{"id":5,"tag":null,"isDisplayed":null,"text":"4    Yuj wal smasnil tas hin b'ojnak, ma xin chaj hin kolnb'il. Palta yuj x'el schik'l hin Kolmal, ha tiknek kolb'iln yu'uj."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tiknek ay hin junk'ojlal, kaw teb’il xwojkej eli. Smasnil tas tox ix a'tb'i, yuj cha junk'ojlal waji."}]},{"id":151,"title":"Wal A Sla’nil Dios","guid":"HZM/PfAaHU65KLdmsUKiwA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"151      Wal A Sla’nil Dios\n \nV.C. 165  Cerca, Más Cerca"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>2 Cor. 2:14-17;  2 Cor. 4:7-18; Jn. 15:4-5 \n \nHatn Cristo pitzn yaj aynhek.  Haxnhej sb’eyb’al tzki b’eylb’ejk tiknek, yujto tzka’k och ki k’ojl a Yunnal Dios.  Gal. 2:20</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kaw wal ha a tz’ey tzin b’ey Mamin, yel tzin nib’j tzin kan wal het’ hach Mamin. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw wal ha a tz’ey tzin b’ey Mamin. //A stz’ey ha wach’k’ojlilal ayn ek’i.//"},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ilt wilx Mamin kaw may tas ayin, kaw hek smasnil, may tas wach’ tzwak’ ayach. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Tzwak’ hin niwnal aych yet’ hin pixan. //Kojn aych oj ilchjok junk’ojlal wu’uj.//"},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Tzin nib’j ha a tz’ey tzin aj Mamin, oj wi’l hin b’a a skal masch’olnilal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"A sat lum tik kaw ay maysch’olnil. //Tzin nib’j Mamin tzwakkan smasnil stual.//"},{"id":5,"tag":null,"isDisplayed":null,"text":"4    Yel wal ha a tz’ey ayn ek’ Mamin, tzin hak’ b’ut’jok yet’ ha junk’ojlilal. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Tzin nib’j tzin pax ha aj aych ek’i. //Tzin kan ha a tz’ey a jun ejmnhej.// "}]},{"id":152,"title":"Ay Junk'ojlal A Jesús","guid":"YDsaJtxsp0apFwVKX+hoJA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"152    Ay Junk'ojlal A Jesús\n \nB. B. D. #138."},{"id":3,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ro. 5:1-11; Sal. 125:1-5 \n \nHa tiknek, tzwa’kn junk’ojlal a he pixan. Hatn wal hin junk’ojlal tik tzwa’kn ayex.   Jn. 14:27</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kaw yel ix wak' hin niwnal yet' hin nab'en a Jesús. Yik oj jawk wal hin yailal, ilb'iln yuj hin Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ay hin junk'ojlal a hin Jesús, (a Jesús) kaw aych hin k'ojl a hin wach' Kolmal. (a Jesús) Ha Yespíritu kajn och wal ayin, junk'ojlal yaj hin pixan."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    A smasnil hin yailal ayk’nhej hin wach' Kolmal wet'ok. Kaw matz hin xiw yuj yailal, ha Jesús tzin kolni."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ay hin junk'ojlal a hin Jesús, (a Jesús) kaw aych hin k'ojl a hin wach' Kolmal. (a Jesús) Ha Yespíritu kajn och wal ayin, junk'ojlal yaj hin pixan."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Kaw ix yab' syal hin wach' Kolmal, yik ix cham wal wu'uj. Kaw ix kulsax hin wach' Kolmal, yuj cha hin kolchj kani."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ay hin junk'ojlal a hin Jesús, (a Jesús) kaw aych hin k'ojl a hin wach' Kolmal. (a Jesús) Ha Yespíritu kajn och wal ayin, junk'ojlal yaj hin pixan."}]},{"id":153,"title":"A Jesucristo Tz’ilch Junk’ojlal","guid":"0OzlkQXvm06YoZieVYAxcg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"153      A Jesucristo Tz’ilch Junk’ojlal\n \nC.S.G. 366 En Jesucristo."},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mar. 6: 45-51; Lc. 10:3-7; Lc. 19:37–40 \n \nHa Kajlilek a’m junk’olal.  Tzin nib’ej, k’uxn tzyak’ sjunk’ojl ayx a smasnil k’inal.  2 Ts. 3:16</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    A Jesucristo tz’ilchj junk’ojlal, a skal k’ik’k’inal yet’ xiwk’ojlal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Tzyak’ junk’ojlal wal a ki pixan, sniwnal ki k’ojol yet’ tzaljk’ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ki b’itnokek wal ki wach’ Kolmal. Yujto ix yak’ cham sb’a wal kujek. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Hax kab’ swach’k’ojlal ki wach’ Kolmal, masnil k’inal ha tzonh i’n b’eyok."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ha wal yik tz’el kip a skal yail, yik tzkus ki pixan yuj b’ilk’ojlal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Tzyak’ ki junk’ojlal, yet’ pax wal kip, kaw tzyak’ a’tb’ok pax wal ki pixan."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ki b’itnokek wal ki wach’ Kolmal. Yujto ix yak’ cham sb’a wal kujek. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Hax kab’ swach’k’ojlal ki wach’ Kolmal, masnil k’inal ha tzonh i’n b’eyok."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Ha wal a yik may ki jichk’ojlal, Hax ki pixan kaw wal tz’el chanh yip. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Palta tzyal Cristo ha aynh ixtik: Oj wak’ he yip yet’ hin wach’k’ojlal. "},{"id":0,"tag":1,"isDisplayed":null,"text":"Ki b’itnokek wal ki wach’ Kolmal. Yujto ix yak’ cham sb’a wal kujek."},{"id":6,"tag":null,"isDisplayed":null,"text":" Hax kab’ swach’k’ojlal ki wach’ Kolmal, masnil k’inal ha tzonh i’n b’eyok."}]},{"id":154,"title":"Tzaljk'ojlal Tzin Leslwi","guid":"+oD8MGIlu0ufHraQp9t3pw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"154      Tzaljk'ojlal Tzin Leslwi\n \nC. S. G. # 493 Dulce Oración"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 63:1-18; Sal. 91; 143\n \n Ha yik oj he yawj ayin, oj hin ta’w ayex; han wal kaw ayn ek’ heyet’ok. Sal. 91:15</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Tzaljk'ojlal yik tzin leslwi, a yik tzin k'an skolwal hin Diosal. Kaw yet' wal smasnil hin pixan, tzin leslwi a hin Kolmal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw yipk'ojlal yaj hin lesal, yik tzjaw maysch’olnilal ayin, til wal wach'il tzin chaj ayach, yuj cha kaw tzin tzalj hin leslwi."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Tzaljk'ojlal wal tzin leslwi,  yik tzin k’och a yojltak hin Dios. Yujto ixta tzwutj waln hin b’a,  yik tzyab’n Dios wal hin lesal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yuj hin jichk’ojlal wal a Dios, oj hin cha spak wal hin lesal. Kaw hanhj Dios oj wi’chanh wal sb’i,  yik wal tzin leslwi a hin Dios. "},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Tzaljk’ojlal yik tzin leslwi,  yik tzin k'an hin te'nal wal a Dios. A sat lum tik ay kusk’ojlal,  hin Kolmal yipk’ojlal yaj wu’uj. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Hat yik oj jawk wal jun k'ual, hax woch wan wal hin leslwi. Yajnhej oj wil sat hin Kolmal,  tzaljk'ojlal oj waj yet' hin Jesús."}]},{"id":155,"title":"Hal Wal A Cristo","guid":"f7K6vpRqnku2kur22+L75w","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"155     Hal Wal A Cristo\n \nS. C. G. 490  Dilo A Cristo."},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 73; Mt. 11: 25-30; Heb. 4:11-16 \n \nPitzk el he wayanh, leslwanhehk, sek tok’e maj he yixtx paxti’  Mr.14:38</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Ha yik kaw ay wal ha k’unb’nakil jun. //Hal wal a Cristo. // "},{"id":3,"tag":null,"isDisplayed":null,"text":"Yik may ha te’nal yet’ yik tzach somchji, hal a Jesús ki Kolmal. //Hal a ki Kolmal. //"},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha wach’k’ojol yaj Jesús. May junk xo ki wach’k’ojl icha Cristo, hal a Jesús ki Kolmal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ha yik tzjaw wal maysch’olnilal ayach, te’n tzotj ha b’a wal a Jesucristo. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha yik kaw tzniwtj maysch’olnilal ayach, te’n tzotj ha b’a a Jesús."},{"id":4,"tag":null,"isDisplayed":null,"text":"Coro: Te’n tzotj ha b’a wal a Jesucristo "},{"id":5,"tag":null,"isDisplayed":null,"text":"3     Hach to mantzak ha chaj Jesucristo, chaj ha a pixan sek oj ha kolchji. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Oj ha chax och a satchanh yuj Jesús, a’ch wal ha k’ojl a tiknek."},{"id":6,"tag":null,"isDisplayed":null,"text":"Coro: Kaw tza’ch wal ha k’ojl a Jesucristo… "}]},{"id":156,"title":"Hin Ch’okj Ayn Ek' Yet' Jesús","guid":"n6PSn4PI3kCd0MgvaJaMaA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"156     Hin Ch’okj Ayn Ek' Yet' Jesús\n \nC. S. G. # 485  A Solas Al Huerto Yo Voy"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 20:11-18; Lc. 22:39-46; Mr. 14:32-42 \n \nHa a yik sk’inb’ial, oj hab’ wawj ayach; yik kaw sk’inhb’ilto hax waln hin b’a ayach. Sal. 5:3</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Ha yik tzin at a skal awb'en, yik siktak yaj smasnil te nichte'. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Junk'ojlal tzin aj yet' Jesús Wajlil, yik tzwab'ni tas wal tzyal ayin."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yel ayk' a hin tz'ey tzwab' sjaj spaxtini, tzyal ayin to tzin schamk'ojlej. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw wal sja'l hin k'umn hin b'a yet' hin Dios, yik ayn ek'yet' hin ch'okoj."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Kaw chi yoch Spaxti hin Kolmal, jantnhej no ch'ik kaw siktak tz'aj no'."},{"id":4,"tag":null,"isDisplayed":null,"text":" Kojxnhej sjaj tzwab'i yet' wal schamk'ojlal, junk'ojlal tzyak' a hin pixan."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yel ayk' a hin tz'ey tzwab' sjaj spaxtini, tzyal ayin to tzin schamk'ojlej. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw wal sja'l hin k'umn hin b'a yet' hin Dios, yik ayn ek'yet' hin ch'okoj."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Wach' tzwab' yik ayn ek' hin ch'okoj, yik tzin leslwi wal a Cristo. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Palta tzin scheka yik tz'at walnk eli, jun wach' ab'x yik wal schamk'ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yel ayk' a hin tz'ey tzwab' sjaj spaxtini, tzyal ayin to tzin schamk'ojlej. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kaw wal sja'l hin k'umn hin b'a yet' hin Dios, yik ayn ek'yet' hin ch'okoj."}]},{"id":157,"title":"Ix Leslwi Jesús A Tzaln Getsemaní","guid":"xuS8Rc7yTkOhCetu9CDrwQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"157   Ix Leslwi Jesús A Tzaln Getsemaní\n \n263 B. E. Y. D. #193. Briadmans Hymnal"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mt. 26:36-46; Mr. 14:32-42; Lc. 22:39-46 \n \nXk’och Jesús yet’ heb’ skuywum a jun lugar Getsemaní sb’i… kannhek a tik to oj hin at leslwok a cha xchi a heb’. Mt. 26:36</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Xleslwi hin Kolmal wal a jun ak'wl cha, wal a jun stzalnil Getsemaní. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw o’ltak x'aj Jesús yik ix leslwi ta', wal a skal k'ik'k’inl ix em kuman.."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal ay schamk'ojlal hin wach' Kolmal Jesús, tzin schamk'ojlej a smasnil k'inal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yuj wal cha kaw tzwal wach' paxti a hin Kolmal, yujto kaw hin sman wal yet' schik'il."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Xleslwi hin Kolmal wal a jun ak'wl cha, kaw ix leslwi a ki Mam Dios. "},{"id":4,"tag":null,"isDisplayed":null,"text":"B'o kab' icha tza nib'j hach Mamin xchi Jesús, kaw oj hin b'o icha tza nib'ej."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal ay schamk'ojlal hin wach' Kolmal Jesús, tzin schamk'ojlej a smasnil k'inal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yuj wal cha kaw tzwal wach' paxti a hin Kolmal, yujto kaw hin sman wal yet' schik'il."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Kaw kusk'ojlal yaji yik ix leslwi ta', yujto ya tas ix jaw a yib'anh. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yujto kaw jab'xoj wal sjaw jun chaml a yib'anh, yuj hin mul ix cham a te kulus."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal ay schamk'ojlal hin wach' Kolmal Jesús, tzin schamk'ojlej a smasnil k'inal. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Yuj wal cha kaw tzwal wach' paxti a hin Kolmal, yujto kaw hin sman wal yet' schik'il."}]},{"id":158,"title":"Jak Wal Hin Sat","guid":"YSbaSVBWrUu/vF5K7lE5ng","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"158     Jak Wal Hin Sat\n \nC.S.G. 267 Abre Mis Ojos"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 119:9-18; Jn. 15:26; 16:14 ; Jn. 4:31-38; \n \nHa a yik oj jawk Yespíritu Dios kaw yel, hat oj a’nk nachjk el smasnil tas yel he yu’uj. Jn. 16:13</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Jak wal hin sat a sakk’inal, Kaw tzin nib’j wil ha sat Jesús. A’ch ha wach’ilal a hin pixan, yet’ jun k’ojlal yet’ wal stojlal "},{"id":3,"tag":null,"isDisplayed":null,"text":"Tzin jaw wal aych a emmkilal, yujto ix wab’ wal yoch ha jaj Tzin hej b’ey hach Espíritu a’m Niwnk’ojlal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Jak wal hin chikn a tas kaw yel, tzin nib’j to kaw wach’ tzwutj wab’ni wach’ paxti yik wal ha chamk’ojlal, hach tik hach hin wach’ kolmal jun."},{"id":4,"tag":null,"isDisplayed":null,"text":" Kaw tzwak’ wal hin k’inl tik ayach, tzin nib’j tzinb’o wal ha nib’b’en. B’ut hin pixn hach Espíritu, a’m Niwnk’ojlal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Jak wal hin ti yik oj walnok, a smasnil heb’ anma satnak Yujto ix hach wulk’ ha kolkn el heb’, smasnil wal heb’ to kaw ajmul. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw niwn ha munljel hach Mamin, hax heb’ ha munljum jaywnhej heb’. Waji chek hin Espíritu, a’m Niwnk’ojlal."},{"id":5,"tag":null,"isDisplayed":null,"text":"4    Jak hin nab’en sek tznachj wu’uj, ha chamk’ojal yet’ hepalil. Ak’ ha wach’ k’ojlal ayin sek wach’, oj wak’ lajwok wal maysch’olnil. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Ha aych wal aj tzin kol hin b’a, ak’ hin te’nal yet’ jichk’ojlal. Tzin ha ketz hach Espíritu, a’m Niwnk’ojlal."}]},{"id":159,"title":"Kaw Wal Tzab' Hin Lesl Hach Hin Kolmal","guid":"vIxmWD2Ht0mEhuUp0RwvFQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"159     Kaw Wal Tzab' Hin Lesl Hach Hin Kolmal\n \nC. S. G. # 496. ¿Has Oido Señor?"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ap. 1:9-10; Sal. 116:1-9; Sal. 18:1-6, 46-50 \n \nTzin chamk’ojlej Jehová, yuto xyab’ tas xwal a hin lesal. Sal. 116:1</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Kaw wal tzab' wal hin lesl hach hin wach' Kolmal, yujto kaw wach' ha'n spak wal hin lesal. Yujto wach' ha'n ha yaxilal a wib'anh, tza'n hin jichk'ojlal yet' hin tzaljk'ojlal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw may ye’lch smasnil wach'ilal ay a tik, yujto kaw e'lb'anhej wal yek' smasnil. // Kaw tzin nib'j tzak' wal sjelnal hin nab'en jun, icha x'aj wal sjelnal heb' ha chekab'. //"},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Manhx oj hin b'o wal smasnil tas tzin nib'ej,haxnhej smasnil ha nib'b'en oj hin b'o'. Tzin nib'j tzin ha ch'ox a smasnil tas wach' jun, Tzak' hin te'nal wal a smasnil k'inal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw may hin chab'k'ojlal hin leslwi jun, yujto wach' hab'nnhej wal hin lesal. // Kaw may hin chab'k'ojlal hin leslwi b'i'an, yujto kaw wach' wal hin ha'n niwnk'ojlal. //"},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Kaw wojtak to ha emmkilal tza nib’ej,yik manhxa maysch'olnil a hin pixan. Matz a nib'j b’anhkinal yet’ tu nab’enal, hanhj wal heb' wach' sb'eyb'al kaw tza nib'ej."},{"id":5,"tag":null,"isDisplayed":null,"text":" Hach Wajlil kaw niwkil ha chamk'ojlal jun, kaw wojtak to kaw manhxa wal hin mul. // Kaw wojtak aych ek' wet' a smasnil k'inal, kaw manhx b'a'nh oj hin telw a skal tual. //"},{"id":5,"tag":null,"isDisplayed":null,"text":"4    Kaw tzin nib'j manhx tok tzin b'o wal maysch'olnil,yujto kaw tox xin hak' wal niwnk'ojlal. Kaw tzin nib'j oj hin k'och wal a satcha'anh, yik oj hin chank wal spak tas xin b'o'o."},{"id":6,"tag":null,"isDisplayed":null,"text":" Kaw tzin leslwi aych hach hin wach' Kolmal, sek kaw manhx oj hin telw wal a stual. // Yuj cha kaw oj hin k'och wal a satcha'anh, hax hin kan kajn het' a smasnil k'inal. // "}]},{"id":160,"title":"Kolwjanh Wet' Wajlil","guid":"3k+794Iookqov2p7QGgXSQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"160       Kolwjanh Wet' Wajlil\n \nAyúdame Señor"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 25:1-22;  51:1-19\n \n Kuyn wal yet’ ha paxti kaw yel, sek tzin b’ey a swach’il, yujto hin Diosal hach.  Sal. 25:5</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Kolwjanh wet'ok, kaw kolwjanh; kolwjanh wet' hach Mamin. "},{"id":3,"tag":null,"isDisplayed":null,"text":"E’lch kab' icha tzyal ha paxti’, kolwjanh wet'ok, kolwjanh wet' hach Mamin."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Kuyn wal Mamin, ochnh wal wet'ok, kuyn wal a hek Mamin. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Oj hin yiklk wal ha paxti', kuyn wal Mamin, kuyn wal a hek Mamin."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    A'n niwnk'ojlal, yuj wal hin mul, a'n niwnk'ojlal Mamin. "},{"id":5,"tag":null,"isDisplayed":null,"text":"E’lch kab' icha tzyal ha paxti', a'n niwnk'ojlal, a'n niwnk'ojlal Mamin."}]},{"id":161,"title":"Leslwanh","guid":"rdGP6tjb00W3EX23pa82Rw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"161     Leslwanh \n \nV.C. 128  Siempre Orad."},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>I Ts.  5; 17; Mt. 24:42-44 \n \nYuj cha, kaw jeln tze yutj he b’a, makwjanhek, leslwanhek, yujto manh he yojkok b’a’nh oj hin jawi.  Mr. 13:33</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Leslwanh tox oj meltzjok ki Cristo, kaw tza ya ilj ha b’eyb’al, yamch wan smasnil tas ix yak’ Dios ayach, sek wach’ oj ha cha wal spak."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw leslwanh xchi kajlil Cristo, makwjanh a junjn k’u. Jab’xoj oj jawk wal a skal asun, yik oj ki atk wal yet’ok."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Leslwanh, toto tiknek tzjaw Cristokaw tzak’ hep a yik ki Dios. K’anlb’ej wal Spaxti Dios a swach’il, te’n tzotj ha b’a a sb’e."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw leslwanh xchi kajlil Cristo, makwjanh a junjn k’u. Jab’xoj oj jawk wal a skal asun, yik oj ki atk wal yet’ok."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Leslwanh, kaw wal tzach makwj paxi, yujto scheknb’il Kajlil. Xyak' wal sti ya’n skolwal a heb’ yiko', hatn jun a’m Niwnk’ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw leslwanh xchi kajlil Cristo, makwjanh a junjn k’u. Jab’xoj oj jawk wal a skal asun, yik oj ki atk wal yet’ok."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Kaw wal leslwanh a smasnil k’inal, a’ch ha k’ojl a ki Kolmal. B’eylb’ej wal sb’eyb’al kajlil Cristo. Sek wach’ ay ha tzaljk’ojlal. "},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw leslwanh xchi kajlil Cristo, makwjanh a junjn k’u. Jab’xoj oj jawk wal a skal asun, yik oj ki atk wal yet’ok."}]},{"id":162,"title":"Leswanh A Sk'inhb'ial","guid":"WOkhR0T+OkqP8asInRiilg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"162     Leswanh A Sk'inhb'ial\n \n99 C. D. S. # 2 Orad Al Amanecer"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>1 R. 9:1-4; Sal. 39:12-13; Sal. 88:13-18\n \n Ha yik sk’inhb’i’al, oj hab’ wawj ayach; yik kaw sk’inb’ilto hax waln hin b’a ayach. Sal. 5:3</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Tzonh leslwiek yik tzsakb'i, wal yel oj yab' Dios ki lesal. Leslw koyk a Dios yik tz'em k'u, tzonh schamk'ojlej ki Mam Dios."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Tzyab' ki Mam Dios wal ki lesal, may jun ejmok to matz yab'i. Leslwkoyk a tzaljk'ojlal jun, sek oj yab' Dios ki lesal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Oj jawk Jesús yuj heb' yunnal, wal yel oj yak' Yajlil sjawi. Jun mutz' satil oj jawk Jesús, hax ki atk a satcha'anh."}]},{"id":163,"title":"Oj Wal A Cristo","guid":"zj8hDqrPHEKtq7TB3VN3MQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"163     Oj Wal A Cristo\n \nV. C. # 125 Diré a cristo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>2 Cr 5; 7; Flp 4; 6, 7\n \n Manh honh ochk il yuj junk tas. Jantknhej tas tzki na’ek, kalk a Dios tzonh leslwi’ek. Fil. 4:6</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    A Jesucristo oj wal hin yail, a hin ch’okoj kaw matz tztechj wu’uj. "},{"id":3,"tag":null,"isDisplayed":null,"text":"A skal hin kuslal, Cristo tzin kolni. A junjn k’u tzmol smasnil yunnal."},{"id":0,"tag":1,"isDisplayed":null,"text":"//Oj wal a Cristo, // Kaw matz techj jun  ilk’ojlal wu’uj, //Oj wal a Cristo, // Kaw kojn hin Cristo tztak’ hin skolni."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Hin somk’jlal oj wal a hin Kolmal, til wach’k’ojlal tzyak' Cristo ayin. "},{"id":4,"tag":null,"isDisplayed":null,"text":"To tzin k’an a hin Kolmal tzin ilni, smasnil yail oj lajwok yu’uj."},{"id":0,"tag":1,"isDisplayed":null,"text":"//Oj wal a Cristo, // Kaw matz techj jun  ilk’ojlal wu’uj, //Oj wal a Cristo, // Kaw kojn hin Cristo tztak’ hin skolni."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Kaw ay yip Jesucristo hin Kolmal, kaw tztechj hin b’isk’ojlal yuj smasnil. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw may junk hin wach’k’ojl icha Cristo Kaw tzin skol wal a smasnil k’inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"//Oj wal a Cristo, // Kaw matz techj jun  ilk’ojlal wu’uj, //Oj wal a Cristo, // Kaw kojn hin Cristo tztak’ hin skolni."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Ha maysch’olnil manh jantkok tzin yawtej, a junjn k’u tznib'j tzin yak' lajwok. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Palta yuj yip hin wach’ kolmal Cristo, ma jin telwi yuj jun tzo’nh cha."},{"id":0,"tag":1,"isDisplayed":null,"text":"//Oj wal a Cristo, // Kaw matz techj jun  ilk’ojlal wu’uj, //Oj wal a Cristo, /
