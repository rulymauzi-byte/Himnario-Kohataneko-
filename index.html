 jun. Mun wal tzach k’un kusi, may ha tzaljk’ojlal. Ha tiknek hach anma, kaw tzaljanh wal b'ia'n,"},{"id":5,"tag":null,"isDisplayed":null,"text":" yujto ay ha kolnb’il wal a Jesucristo. Tzyak’ sakk’inl ayach, toxnhej skal maysch’olnil mto skal mul ayach. Ha wal Jesucristo, kaw tz’o’ch sk’ojl ayach, "},{"id":6,"tag":null,"isDisplayed":null,"text":"tznib’j wal tzach skol elt yik tzya’n ha tzaljk’ojlal jun.  Oj yak’ ha niwnk’ojlal yet’ wal ha junk’ojlal, chaj ha Kolmalok. "}]},{"id":75,"title":"Yab’xil Noé","guid":"NYht9so5j0KY2YkqwD/klg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"75       Yab’xil Noé"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Gn. 6:1-22, 7:1-24; Mt. 24:29-39  \n \nYa’jnak kot Dios jun howl yaxnhab’ a yib’nh heb’ maysch’olnil cha.</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Wal a stiempoal Noé, ix yal Dios: Kaw wal maysch’olnil heb’ anma’. Kaw matz xiw heb a ki Mam Dios, maysch’olnil heb’, matz na sb’a heb’, "},{"id":3,"tag":null,"isDisplayed":null,"text":"yuj ton wal cha, how ki Mam Dios, maysch’olnil heb’. Kaw yuj wal cha, yowlal oj cham heb’ smasnil."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ix yal Dios a win Noé, to tza b’o jun te arca niwkil tz’aji.  Kaw oj kot jun niwkil yaxnhab’. Xyab’ Noé jun; xyij kot ste’al, xyij kot spollab’, "},{"id":4,"tag":null,"isDisplayed":null,"text":"xyij elt yechel, xya’n och slawxil, ix b’o yu’uj, icha ix yutj Dios yalni."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Nak he b’a wal hex chonhab’, xchi Noé yik ix yaln el spaxti Dios jun, kaw oj jawk jun niwkil yaxnhab’.  "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yuj wal he mul, kaw wal kusk’ojlal he yiko’, kaw may Dios wal a he pixan, kaw o’ltak hex, jab’xoj wal oj he chami."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Kaw tonhj ix tzewj heb’ chonhab’, kaw ix sb’uch heb’ Noé, yujto kaw pit heb’. Kaw wal ma ix chaj heb’ yab’i. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kaw tonhj tzala ja, ja, ja, ja, in may asun, ja, ja, ja, ja, may mach ojtnak, ja, ja, ja, ja. Kaw tonhj ix tzewj heb’ chonhab."},{"id":6,"tag":null,"isDisplayed":null,"text":"5     Kaw max chaj wal heb’ yab’i’, kaw yuj cha ix yaln Dios wal a win Noé; ochnhek a yol arca b’i’an. Xyal Dios a heb’, manh hex xiwok. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Kaw \ttzaljanhek, \tkaw b’itnanhek, halk wach’ paxti’, leswanhek. Kaw aynek’ wal he yet’ok."},{"id":7,"tag":null,"isDisplayed":null,"text":"6     Ay no nok’ ix och yet’ heb’. Chatk wanhil xaj yoch a yol arca jun. Kaw ix och no snun yet no smam, xoch no León, xoch no wakax."},{"id":8,"tag":null,"isDisplayed":null,"text":" Xoch pax no ch’ik, no calnelu, no k’ultkil chej, yet’ no chab’in, x’och he no yet’ win Noé."},{"id":8,"tag":null,"isDisplayed":null,"text":"7     Kaw wal jab’xoj skot yaxnhab’, ochnhek a yol te arca, xchi Dios a heb’. Kaw wal yiklum ix yutj sb’a heb’. Ix och Noé, yet’ yitb’eyum, yet’ heb’ yunnal, yet’ heb’ yalib’. "},{"id":9,"tag":null,"isDisplayed":null,"text":"Wajxkwanh sb’isl heb’, heb’ ix och jun, kaw wal tzaljk’ojlal xoch heb’."},{"id":9,"tag":null,"isDisplayed":null,"text":"8    Kaw ix makchj te arca jun, kaw ha ki Mam Dios ix makn te a heb’, yujto jab’xoj skot jun yaxnhab’. Kaw ix k’anh k’u, xek’ letz’lo’om."},{"id":10,"tag":null,"isDisplayed":null,"text":" Ix kot yaxnhab’, kaw ay yik’al, kaw chawink k’u, chawink ak’wal, ix yak’ jun niwkil yaxnhab’."},{"id":10,"tag":null,"isDisplayed":null,"text":"9     Xjaw kusk’ojlal a yib’nh heb’, kaw ix hok’ heb’ anma’, kaw ix el yaw heb’. Hax te arca maknhxo te’. Ix awj och heb’: mamin Noé,"},{"id":11,"tag":null,"isDisplayed":null,"text":" jaknh och het’ok, kaw o’ltak honh, ¿Tom tzonh cham jun? xchi heb’ anma’. Kaw wan scham heb’ a skal ha’"},{"id":11,"tag":null,"isDisplayed":null,"text":"10     Kaw manhx cheklok lum tzalktak, yujto xb’utj el sat lum lum tik yuj ha ha’. Kaw wal manhxa jak lum chekel. "},{"id":12,"tag":null,"isDisplayed":null,"text":"Xcham heb’ icham, xcham heb’ chichim, xcham heb’ kelem, xcham heb’ kob’es, xcham heb’ unin, xcham heb’ smasnil, yuj wal spitl heb’ ix cham heb’."},{"id":12,"tag":null,"isDisplayed":null,"text":"11     Kaw wal ma xcham win Noé, heb’ yunnal, heb’ yalib’, kaw ma ix cham heb’, kaw yiklum xyutj sb’a heb’ a Dios. Yel tzyal spaxti ki Mam Dios jun."},{"id":13,"tag":null,"isDisplayed":null,"text":" Kaw tzonh skol a, skal ki yail, yuj schamk’ojlal ki Mam Dios jun, yuj cha ix kolchj win Noé."}]},{"id":76,"title":"Yab'xil No Kalnelu Tzsati","guid":"ZlU1b+k/Fkq2BM7563p0Gg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"76   Yab'xil No Kalnelu Tzsati\n \nF. Y. A. # 217 Soy La Triste Oveja"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Is. 53:6; Jer. 50:6 \n \nHokxo wal junk anma’, yel xo wal niwn ye’lch a yib’nh junk kalnelu. Mt 12:12</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kaw ix yal kot Jesús, yab'xil no kalnelu; Ay howink kalnelu, kaw ix sat jun no'. Kaw wal tzkus win yuj no', yujto tzalj win yet'ok; yuj cha ix at win say yil no a najat. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Yik x'ilchj no yuj winak, kaw wal ix tzalj sk'ojol; kaw sme' kot win no', ix jaw no a skolal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"X'och jun k'inh yuj winak, yujto kaw ix jaw no'; tzaljk'ojlal yaj winak, yujto ayx ek' no'. Ixta pax kajk hanh tik yik honh xo Dios jun."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Icha jun kalnelu, ixta wal waj han tik; satnk hin a sb'e Dios, kusk'ojlal waji. Kaw yel may hin wach'il, kaw tzin b'o maysch'olnil; "},{"id":4,"tag":null,"isDisplayed":null,"text":"ha Dios tzin yawtej sek tzin kolchj kan eli. Kotnh ayin xchi Cristo, sek oj ha kolchj kani; kaw wal yel hojnhej hin cham a te kulus. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw wal xajn hach yuj Dios, yuj cha hin schek koti; ha wal aj ay ki Dios, kaw til wal swach'il. Kaw wal tznib'j ki Mam Dios tzach k'och wal yet'ok."}]},{"id":77,"title":"Yab’xil win Bartimeo","guid":"NpLi59jSAEaR/rz8lTu9mA","verses":[{"id":null,"tag":null,"isDisplayed":0,"text":"77     Yab’xil win Bartimeo "},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mr. 10:46-52 \n \nXlajw cha, ix k’och Jesús a chonhb’ Jericó yet’ heb’ skuywum, hax yik x’atx heb’…hax a sti b’e, hata ay jun wink wokn ejmi, Bartimeo sb’i…Matz huj yiln winak. Mr. 10:46</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Bartimeo kaw ix awj a Dios, Kaw wal niwkil hach yet’ hepalil"},{"id":3,"tag":null,"isDisplayed":null,"text":" --//Ak’ niwnk’ojlal yuj hin mul smasnil, oj hin cha Jesús hin Kolmalok.//"},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Bartimeo chotn ek’ a sti b’e, Kaw wal matz tak’ xon yil win jab’ok. "},{"id":4,"tag":null,"isDisplayed":null,"text":"--//Hach yunnal Dios o’ch ha k’ojl ayin, Xchi win a Jesús ki wach’ Kolmal,//"},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ha Jesus kaw x’o’ch sk’ojl a winak, Yuj cha ix el a skal heb’ anma’.  "},{"id":5,"tag":null,"isDisplayed":null,"text":"--//Ix yaln a win Bartimeo cha, b’ikl ha sat a jun ha Siloé.//"},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Bartimeo kaw xya’ch sk’ojl a Dios, Kaw yajnhej ix at a jun ha cha. "},{"id":6,"tag":null,"isDisplayed":null,"text":"--//Wal a smasnil sk’ojl win sb’ik sat, Kaw yajnhej ix jakw sat winak.//"},{"id":6,"tag":null,"isDisplayed":null,"text":"5     Heb’ Judío, sk’anb’j heb’ a winak, Bartimeo, mach ix jakn ha sat?"},{"id":7,"tag":null,"isDisplayed":null,"text":"  --//Ay jun wink hajun yet’ heb’ anma’, Ha Jesús, yel yunnal Dios b’ian.//"},{"id":7,"tag":null,"isDisplayed":null,"text":"6     Manh hak’ yuj diosal a jun wink cha, xchi e win a Bartimeo cha. "},{"id":8,"tag":null,"isDisplayed":null,"text":" --//Manh wojkok to may sch’olnil winak, kaw ix jakw wal hin sat yu’uj.//"},{"id":8,"tag":null,"isDisplayed":null,"text":"7     Til wal heb’ tzjaw a hin wach’ Kolmal, kaw yajnhej tzb’ox kan sk’ojl heb’ yu’uj."},{"id":9,"tag":null,"isDisplayed":null,"text":"  --//Kaw wal yel ay sjelnal hin Kolmal, Yuj cha kaw  ix wa’ch hin k’ojl ha a.//"}]},{"id":78,"title":"Toto Ix Och Wal Hin Mul","guid":"aGdAXgOIBky2VcfhSZXHOg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"78      Toto Ix Och Wal Hin Mul\n \nC. S. G. # 383 Si Fui Motivo De Dolor"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>1 Jn. 1; Heb. 9:13-22; Tit. 2:11-15 \n \nToto tzkalk k’et ki mul a Dios, ha tz’a’n lajw kan ki mulk cha, tzyi’n kan pax el jantknhej maysch’olnil aych aynhek.   1 Jn. 1:9</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Toto kaw ix och wal hin mul aych Mamin, k'inlok wujnhej ay heb' ix somchj eli."},{"id":3,"tag":null,"isDisplayed":null,"text":" Toto manhok wal tas tza nib'j tzin b'o'o, yuj cha, Mamin tzin hak' wal niwnk'ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Hach hin Diosal chaj hin wal yet' hin lesal, kaw tzin ha kol a yol sk'ab' tas ay smay. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw tzin ha tanhwj yet' wal smasnil heb' hek xo, yuj cha, tzin k’an wal niwnk’ojlal ayach."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Toto kaw may ye’lch jun tzo'nh tas tzlaj wala, toto ix waktj kan heb' ay skusk'ojlal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Toto hanhj wal wik tzlaj hin nib'k hin sayk'i, yuj cha, tzin k’an niwnk’ojlal aych Mamin."},{"id":0,"tag":1,"isDisplayed":null,"text":"Hach hin Diosal chaj hin wal yet' hin lesal, kaw tzin ha kol a yol sk'ab' tas ay smay. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw tzin ha tanhwj yet' wal smasnil heb' hek xo, yuj cha, tzin k’an wal niwnk’ojlal ayach."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ha yik tza nib’j wal tzin hel ha a munljel, hanxo Mamin tok wal nan hach wu’uj. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Toto yujnhej wal ma tzin nib’j tzwab’ syail, yuj cha, Mamin tzin hak’ wal niwnk’ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Hach hin Diosal chaj hin wal yet' hin lesal, kaw tzin ha kol a yol sk'ab' tas ay smay. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kaw tzin ha tanhwj yet' wal smasnil heb' hek xo, yuj cha, tzin k’an wal niwnk’ojlal ayach."}]},{"id":79,"title":"Aleluya A Hin Dios","guid":"EBcQu6v4z0GFzbXh5Iyv7g","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"79     Aleluya A Hin Dios \n \nB. B. D. # 143."},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mt. 27:32, 44; Ro. 5:1-11; Ap. 19:1-8 \n \n¡Kalk wach’ paxti a ki Diosalek! Yujto ha x’a’n ki kolnb’ilek. Ap. 19:1</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Aleluya a hin Dios, aleluya a Jesús, kaw wal yel, kolb'il hin. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw ix yak' wal hin kolnb'il yujto ix el wal schik'il, kaw wal yel, kolb'il hin."},{"id":0,"tag":1,"isDisplayed":null,"text":"Manb'il hin, ay hin k'inal; ha Jesús hin wach' Kolmal, ha ix a'n wal hin kolnb'il.  "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw tzin schamk'ojlej hin Kolmal; may junkxo icha Jesús."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Tzwa'ch hin k'ojl a hin Jesús, yuj cha kaw matz hin xiwi, kaw wal yel, kolb'il hin. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yuj Jesús sakx waj tiknek yiktax wal hin kolchj kani, kaw, wal yel, kolb'il hin."},{"id":0,"tag":1,"isDisplayed":null,"text":"Manb'il hin, ay hin k'inal; ha Jesús hin wach' Kolmal, ha ix a'n wal hin kolnb'il.  "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw tzin schamk'ojlej hin Kolmal; may junkxo icha Jesús."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Kaw kalk el wal spaxti Dios a smasnil heb' satnk to, sek wach' oj kolchjok heb'."},{"id":5,"tag":null,"isDisplayed":null,"text":" Yuj swach'k'ojlal tzin b'itni yujto xyak' wal hin k'inal, kaw wal yel, hin kolchji."},{"id":0,"tag":1,"isDisplayed":null,"text":"Manb'il hin, ay hin k'inal; ha Jesús hin wach' Kolmal, ha ix a'n wal hin kolnb'il. "},{"id":6,"tag":null,"isDisplayed":null,"text":" Kaw tzin schamk'ojlej hin Kolmal; may junkxo icha Jesús."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Oj hin b'itn a satcha'anh, yik oj hin k'och yet' hin Dios, kaw wal yel, kolb'il hin. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kojxnhej wach' paxti oj wal a Jesús a stziktznial. Kaw wal yel, hin kolchji."},{"id":0,"tag":1,"isDisplayed":null,"text":"Manb'il hin, ay hin k'inal; ha Jesús hin wach' Kolmal, ha ix a'n wal hin kolnb'il.  "},{"id":7,"tag":null,"isDisplayed":null,"text":"Kaw tzin schamk'ojlej hin Kolmal; may junkxo icha Jesús."}]},{"id":80,"title":"Manhx Tzak Nachj Tas Tzwal Ayach","guid":"ZW8LAVxeWki0vAJVkQWAew","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"80   Manhx Tzak Nachj Tas Tzwal Ayach\n \nC. S. G. # 388 Hay Momentos"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mat. 1:18-23; Is. 53; Jn. 20:19-29   \n \nTilto wal jun tzo’nh xo tas ix sb’o Jesús. K’inlok tz’ib’xkan jun jun, tzin na’a, matz yab’ ham yolyib’nhk’inl tik yuj ch’anh hunh aj tz’ib’xkan cha. (Ya kab’i.) Jn. 21:25</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Ay aj ti’il manhxtzak nachj hin paxti wach’ walni; yik tzwaln smasnil tas nab’il wu’uj. Ha aych hin wach' Kolmal"},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ay aj ti’il manhxtzak nachj hin paxti wach’ walni; yik tzwaln smasnil tas nab’il wu’uj.Ha aych hin wach' Kolmal"},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Kaw tzwal yuj diosal, yuj smasnil tas ha b'ojnak; yuj smasnil tas tza b'o'o. Yet' tas tot oj ha b'o'"},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Kaw tzwal yuj diosal, yuj smasnil tas ha b'ojnak; yuj smasnil tas tza b'o'o. Yet' tas tot oj ha b'o'"}]},{"id":81,"title":"Ay Jun Ak' B'it Aynhek Tiknek","guid":"+pT92TNSKU+plehfod8PYQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"81  Ay Jun Ak' B'it Aynhek Tiknek \n \nC. S. G. # 156  Hay Un Canto Nuevo En Mi Ser"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Is. 12; Ef. 5:20; Hch. 16:23-34 \n \nB’itn koyk yet’ b’it yik tz’ijx chanh sb’i, kalk wach’ paxti ha a, yujto satjub’tak yilx tastk b’ob’il yu’uj. 1 Cr. 16:9</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ay wal jun ak' b'it aynhek tiknek, ix yak' wal Jesús aynhek jun. Ix yal wal ki wach' Kolmal kotnhek, kaw oj ex wak' iljok, xchi."},{"id":0,"tag":1,"isDisplayed":null,"text":"Cristo, Cristo, Cristo, kaw wal may junk xo. Kaw wal tzalj ki pixnek, yuj schamk'ojlal ki Mam Dios."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ayx ek’ swach’k’ojlal haynhek tiknek, kaw wal tzonh tzalj yuj schamk’ojlal. Kaw ay yaxilal aynek tiknek, tzyak’ kot Kajlil wal ayonh."},{"id":0,"tag":1,"isDisplayed":null,"text":"Cristo, Cristo, Cristo, kaw wal may junk xo. Kaw wal tzalj ki pixnek, yuj schamk'ojlal ki Mam Dios."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Kaw aynhekx ek' a swach'k'ojlal Dios, yuj cha tzaljk'ojlal xo kajek. Ay jun spak kik molb'ilx yuj Jesús, yujto wach' tzkutj ki b'eyb'al."},{"id":0,"tag":1,"isDisplayed":null,"text":"Cristo, Cristo, Cristo, kaw wal may junk xo. Kaw wal tzalj ki pixnek, yuj schamk'ojlal ki Mam Dios."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Kaw oj jawk Jesús a skal asun, kaw oj kot wal a satcha’anh. Ha wal a stz’ey oj ki k’och kajan, oj ki kan yet’ a swach’il."},{"id":0,"tag":1,"isDisplayed":null,"text":"Cristo, Cristo, Cristo, kaw wal may junk xo. Kaw wal tzalj ki pixnek, yuj schamk'ojlal ki Mam Dios."}]},{"id":82,"title":"B’itnejek Kajlil A Tzaljk'ojlal","guid":"oVxdxjVUTUienop7huI6/Q","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"82  B’itnejek Kajlil A Tzaljk'ojlal \n \nC. S. G. # 5  Cantad Alegres Al Señor"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 100; 33:1-12; 9:1-11 \n \nKi masnil hanh kajnonhk a sat lum tik, b’itn koyk yet’ ki tzalk’ojlal a Dios. Sal. 100:1</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ki b'itnokek Kajlil a tzaljk'ojlal, ha tzyal aj til Kajn honhk ek’i;"},{"id":3,"tag":null,"isDisplayed":null,"text":" a smasnil k’inal kaw tzonh munljek a Kajlil, ki, yiklkek a tzaljk’ojlal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Yet’ wach’ paxti yet’ wal b’it, tzkijk cha’anh, sb’i wal jun mach ix honh b'onek; "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kojn a tzonh emk kuman, yujto niwkil ye’lchi, yet’ ki tzaljk’ojlalek tzki yiklni."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ojkej eli, to ha Dios ha Kajlil, ha honh b’oni yet’ wal sjenal;"},{"id":5,"tag":null,"isDisplayed":null,"text":" icha kalnelu ixta kaj wal a yolsk’ab’, kaw schonhb’ honh yuj wal schamk’ojlal."},{"id":5,"tag":null,"isDisplayed":null,"text":"4      Yet' wach' paxti yet' tzaljk'ojlal tzach k'och, a yojltak jun ki Yajlil. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Ijchanh sb'i yujto kaw niwkil ton wal ye'lchi, tzaln wach’ paxti yet’ tzaljk’ojlal. Amén."}]},{"id":83,"title":"B'itnejek Sb'i Kajlil","guid":"/Vu1VaSf8UW3Px6fPhZkYQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"83 B'itnejek Sb'i Kajlil \n \nC. S. G. # 20 Alabad Al Gran Rey"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 29; 1 Ti. 6:11-16; Sal. 69:30-34 \n \nB’itn koyk yet’ ki tzalk’ojlal a yojltak Kajlil. Sal. 98:6</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Tzaljk’ojlal tzonh b’itnek yet’ ki chamk’ojlal, yet' tzaljk'ojlal tzkalk wach' paxti ki masnil, "},{"id":3,"tag":null,"isDisplayed":null,"text":"ha ki Yajlilek ki wach’ kolmal paxi. Kaw smoj wal kalnek ki wach’ paxti ha a."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tzki b’itnej, tzki b’itnej, tzki b’itnej sb’i Kajlil. Kalk ki b'a, kalk ki b'a, hanhek to schonhb’ kaji. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yujto honh skolk eli, tzonh yi’nek cha’anh. Kaw wal tztak’ yuj a smasnil k’inal. Amén."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Kaw ay schamk'ojlal ki wach' kolmal Jesús, may junk mach tztak' yi'n ek' swach’k'ojlal aynhek. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha ki wach' Kolmal tz'o'chnhej wal sk'ojl aynhek, ki b'itnokek sb'i Dios a smasnil k'inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tzki b’itnej, tzki b’itnej, tzki b’itnej sb’i Kajlil. Kalk ki b'a, kalk ki b'a, hanhek to schonhb’ kaji. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yujto honh skolk eli, tzonh yi’nek cha’anh. Kaw wal tztak’ yuj a smasnil k’inal. Amén."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ha ki wach’ Kolmal ix cham a te kulus, Yuj wal ki maysch’olnilal ix cham Jesús. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yuj wal skolchj heb’ anma, yuj cha ix jawi; yuj smasnil ki mul ix cham ki wach' Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tzki b’itnej, tzki b’itnej, tzki b’itnej sb’i Kajlil. Kalk ki b'a, kalk ki b'a, hanhek to schonhb’ kaji."},{"id":6,"tag":null,"isDisplayed":null,"text":" Yujto honh skolk eli, tzonh yi’nek cha’anh. Kaw wal tztak’ yuj a smasnil k’inal. Amén."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Hanhek ayx och ki k’ojl a Kajlil tiknek, ki mak sjaw Jesús yujto kaw oj jawok. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Tzaljk'ojlal oj yak' Jesús Yajlil sjawi; oj ka'k pax yajlil yet' Jesús ki kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tzki b’itnej, tzki b’itnej, tzki b’itnej sb’i Kajlil. Kalk ki b'a, kalk ki b'a, hanhek to schonhb’ kaji. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Yujto honh skolk eli, tzonh yi’nek cha’anh. Kaw wal tztak’ yuj a smasnil k’inal. Amén."}]},{"id":84,"title":"Halx Kab' Wach’ Paxti’","guid":"kfaG2YXVGUm4KnXsQjyqvQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"84  Halx Kab' Wach’ Paxti’\n \nC.S.G 147 Gloria A Tu Nombre"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ef. 1:15-23; Ro. 5:1-11; 1 P. 1:13-23 \n \nMamin Jehová, may xon wal junk mach lajn het’ok, yujto hach tik, koxjn hach niwn he’lchi. Jer. 10:6</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ha Jesuscristo xkoln el hin pixan, wojkxo tiknek ha hin mann eli. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ix yak’ hin k’inal yet’ hin tzaljk’ojlal, manhx oj hin at a skal yailal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw smoj wal yalx wach’ paxti a Jesús. Smoj yalx wach’ paxti a hin Kolmal."},{"id":4,"tag":null,"isDisplayed":null,"text":" Kaw yuj hin mul ix kulsax hin Kolmal. Kaw yuj hin mul ix el wal schik’il."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ha yik oj hin k’och wal a satcha’anh, yet’ heb’ hek xo oj wal wach’ paxti’. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yujto ix hak’ wal skolnb’il hin pixan, a satcha’anh oj hach hin b’itnok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw smoj wal yalx wach’ paxti a Jesús. Smoj yalx wach’ paxti a hin Kolmal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw yuj hin mul ix kulsax hin Kolmal. Kaw yuj hin mul ix el wal schik’il."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Hach hin Kolmal hach ix hak’ hin k’inal, kaw ix hej el wal hin kusk’ojlal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw ix hak’ tzaljk’ojlal a hin pixan, yuj cha tiknek kaw tzach hin b’itnej."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw smoj wal yalx wach’ paxti a Jesús. Smoj yalx wach’ paxti a hin Kolmal. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kaw yuj hin mul ix kulsax hin Kolmal. Kaw yuj hin mul ix el wal schik’il."}]},{"id":85,"title":"Halx Kab' Wach' Paxti Aych Dios","guid":"PaqbqRIX9UqMRqUvz0TbcQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"85  Halx Kab' Wach' Paxti Aych Dios \n \nC. S. G. # 18 Gloria A Tu Nombre, Oh Dios"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 115:1-8, 17-18; 96; Dt. 32:1-4 \n \nMamin Jehová… Kaw smoj yalx wach’ paxti aych yuj ha chamk’ojlal yet’ yuj ha tojlal. Sal. 115:1</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Hach ki Dios Yajl hach satcha'anh, tzonh och wal emmkilal ayach. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw smasnilnhej tas tztak' ho'oj, hach tik ki wach' Kolmal wal hach."},{"id":0,"tag":1,"isDisplayed":null,"text":"//Halx kab' wach' paxti wal ha a b'i, halx kab' wach' paxti wal ha a b'i. Halx kab' wach' paxti aych Dios\\\\ Amén."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Kaw yajl haj wal a satcha'anh, palta hach wul a sat lum tik. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Xwul hak' cham ha b'a ki jelok, yik tzonh ha koln a skal ki mul."},{"id":0,"tag":1,"isDisplayed":null,"text":"//Halx kab' wach' paxti wal ha a b'i, halx kab' wach' paxti wal ha a b'i. Halx kab' wach' paxti aych Dios\\\\ Amén."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Kotnh hach Kajlil ki wach' Kolmal, tzach kot yet' wal ha tziktznial. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yik tzwul he'nok heb’ to hek xo, aj tzak' yajlil a satcha'anh."},{"id":0,"tag":1,"isDisplayed":null,"text":"//Halx kab' wach' paxti wal ha a b'i, halx kab' wach' paxti wal ha a b'i. Halx kab' wach' paxti aych Dios\\\\ Amén."}]},{"id":86,"title":"Ha Wal Yik Tzsakb’i","guid":"+n7q8KnMaEW8LIzrH/dZHA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"86 Ha Wal Yik Tzsakb’i\n \nB.  E. Y. D. # 197. Al Amanecer"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>1 Ts. 5:17; Sal. 88:13-18; Sal. 141:1-2 \n \nLeslwanhek, manh he yaktkan he leslwi. 1 Ts. 5:17</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ha wal yik tzsakb'i tzjaw stzaljk'ojlal hin pixan, ha yik tzsakb'i tzb'itn he no ch'ik a ki Mam Dios."},{"id":3,"tag":null,"isDisplayed":null,"text":" Xchi spaxti hin kolmal Jesucristo, leslwanh a junjn k'u."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kojn a hin Cristo ay swach'il, til wal swach'k'ojlal hin Dios. Kaw tzyij el wal hin kusk'ojlal, matz hin yaktj kan hin wach' Kolmal."},{"id":4,"tag":null,"isDisplayed":null,"text":" ¿Toto may aj tzab' spaxti Dios? Chaj spaxti Dios tiknek. Leslwanh a junjn k'u."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ha a yik aych ek' wal a skal ha kusk'ojlal, kotnh a Jesús, oj el ha kusk'ojlal yu'uj. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw wal yel may junk xo icha Cristo, leslwanh a junjn k'u."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kojn a hin Cristo ay swach'il, til wal swach'k'ojlal hin Dios. Kaw tzyij el wal hin kusk'ojlal, matz hin yaktj kan hin wach' Kolmal."},{"id":5,"tag":null,"isDisplayed":null,"text":" ¿Toto may aj tzab' spaxti Dios? Chaj spaxti Dios tiknek. Leslwanh a junjn k'u."}]},{"id":87,"title":"Kalk Wach’ Paxti A Kajlil","guid":"+Si9NueoSUylFf0u0avF+A","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"87      Kalk Wach’ Paxti A Kajlil \n \nV. C. # 67 \tPor Mil Arpas"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kalk wach' paxti wal a Kajlil, ki'k chanh wal yuj swach'ilal. Ha Kajlil kaw wal tzyak' yajlil, yuj cha til wal tzaljk'olal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ayk' ton wal a swach' k'ab' Dios jun, Yajl yaj a yib'nh heb' anma’."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kalk wach' paxti a ki Mam Dios, Yuj wal sniwkil chamk'ojlal."},{"id":2,"tag":null,"isDisplayed":null,"text":"2     Jesucristo kaw tzyak' yajlil, yujto kaw ay yipalil. Ha smasnil heb' ayk' a yol sk'ab', may ton tas oj i'nok heb'. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw wach' yik heb' ayk' a yol sk'ab', kaw oj yil heb’ swach’l yilxi."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kalk wach' paxti a ki Mam Dios, Yuj wal sniwkil chamk'ojlal."},{"id":3,"tag":null,"isDisplayed":null,"text":"3     Kaw tanhb'il sjaw kajlil Jesús, a skal jun asn oj jawok. Ak' satcha'anh, ak’ sat lu’um, oj yak’ aynh yuj schamk’ojlal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kalk wach' paxti a ki Mam Dios, yet' wal a smasnil ki k'ojlek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kalk wach' paxti a ki Mam Dios, Yuj wal sniwkil chamk'ojlal."}]},{"id":88,"title":"Kalk Wach' Paxti A Dios","guid":"WxuvKGBy5ESFYe7P/X4W2Q","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"88 Kalk Wach' Paxti A Dios\n \nC. S. G. # 535 Gloria, Gloria Aleluya"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ro. 8:28-39; 1 Cor. 15:51-58; Ap.12:10-12\n \n Wach’xam oj jawk jun tzo’nh tik a kib’nhek, palta kaw oj ka’k techjok yuj jun ay schamk’ojlal aynhek. Ro.8:37</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ha sDiosal smasnil tas a satcha'anh, tzwa'ch yipk hin k'ojol. Yuj cha tzin b'itnej sb'i ki Mam Dios wal a smasnil k'inal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Wach'xam ay tas kaw wal ay smay palta ma oj hin xiwi. Ki Mam Dios tzin kolni."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kalk wach' paxti aleluya, kalk wach' paxti aleluya.  Kalk wach' paxti aleluya, a Cristo ki Kolmal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Kaw manhok yet' sjelnal yolyib'nhk'inl tik oj stak’ wal ku’uj. Manh hok yet' yamk'ab' yik howal oj lajwok win ajk’ojol,"},{"id":4,"tag":null,"isDisplayed":null,"text":" palta yet’ skolwal Yespíritu Dios oj kan a yalanh. Yuj cha oj stak’ ku’uj."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kalk wach' paxti aleluya, kalk wach' paxti aleluya.  Kalk wach' paxti aleluya, a Cristo ki Kolmal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     A Belén yik Palestina ix alj ki Kolmal Jesús, hax, a yoxlajnhil schawink hab'il ix skulsej heb' anma'. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Palta hax a schab'jial ix pitzw pax aj ix mukxi. Yuj cha tzin b'itnej sb'i."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kalk wach' paxti aleluya, kalk wach' paxti aleluya.  Kalk wach' paxti aleluya, a Cristo ki Kolmal."}]},{"id":89,"title":"Kalk Wach' Paxti A Cristo","guid":"AYm5Mm0nXEm6MCDtK6vmfQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"89      Kalk Wach' Paxti A Cristo \n \nC. S. G. # 570 \tAlabanzas Dad A Cristo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 16: Ap. 5; Sal. 7:9-17 …\n \nKaw niwn tzalk’ojlal oj hak’ ayin, yik oj hin k’och a hojltak.  Ay tzaljk’ojlal ha a tz’ey a jun ejmnhej.  Sal 16:11</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kaw kalk wach' paxti a ki wach' Kolmal, kaw ki’k chanh wal sb’i ki wach’ kolmal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Tzaljkoyk hanhek kolb'ilnhek xo, tzkalnek wach' paxti a Dios."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha yik oj (ha yik oj ki k'ochk) ki k'ochk wal a yojltak jun ki wach' Kolmal Jesús. (yojltak jun ki wach' Kolmal Jesús.) "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kalk wal el (kalk wal el) jun wach' ab'x tik, yik jun ki wach' Kolmal Jesús. (Kolmal Jesús.)"},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Yuj wal sjelnal ki wach' Kolmal Jesús.Ix kan maysch’olnil a yalnh kujek, "},{"id":4,"tag":null,"isDisplayed":null,"text":"ka'k at ki nab'en wal a Dios, kaw ayk' wal a satcha'anh."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha yik oj (ha yik oj ki k'ochk) ki k'ochk wal a yojltak jun ki wach' Kolmal Jesús. (yojltak jun ki wach' Kolmal Jesús.) "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kalk wal el (kalk wal el) jun wach' ab'x tik, yik jun ki wach' Kolmal Jesús. (Kolmal Jesús.)"},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ka'k wal ip ki atk yet' ki wach' Kolmal, kaw wal schekb'onhk a smasnil k'inal."},{"id":5,"tag":null,"isDisplayed":null,"text":" Yuj swach’k’ojlal wal aynhek jun, yuj cha honh kolchjkan wali."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha yik oj (ha yik oj ki k'ochk) ki k'ochk wal a yojltak jun ki wach' Kolmal Jesús. (yojltak jun ki wach' Kolmal Jesús.) "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kalk wal el (kalk wal el) jun wach' ab'x tik, yik jun ki wach' Kolmal Jesús. (Kolmal Jesús.)"}]},{"id":90,"title":"Ha Moj Mamin","guid":"92UiGnS8FkCT3uvS4CBv2g","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"90  Ha Moj Mamin\n \nC. S. G. # 233 Digno Eres"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Heb. 3:1-6; Ap. 5; 1Ti. 6:11-16 \n \nHach Kajlil, hach ki Diosal honh, smoj tzalx ho’oj, to niwn ha wach’il, to kaw niwn he’lchi, niwn pax hepalil. Ap.4:11</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ha moj Mamin, ha moj Mamin, yujto kaw niwn he’lchi. Halx kab' wach' paxti wal ha aych Mamin, yujto kaw ay hepalil. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Yujto smasnil tas kaw wal hach ix ha b'o'o, ayk'nhej icha tas tza nib'ej. Ix ha b'o smasnil yik tzch'oxn ha wach'il, yujto kaw niwn he'lchi. "},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Ha moj Mamin, ha moj Mamin, yujto kaw niwn he'lchi. Hek wal smasnil tas, ay pax ha jelnal, halx kab' wach' paxti ayach. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yujto kaw wal ix hab' syal yuj wal ki mul honh, yujto hach cham wal ki jelok. Yet' wal ha chik'il ix honh ha mana, yujto kaw niwn he’lchi."}]},{"id":91,"title":"Kaw Wach' Ki B'itnan Ha B’i Mamin","guid":"E3FUW1WCZUu+gY6WKynW6g","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"91     Kaw Wach' Ki B'itnan Ha B’i Mamin \n \nC. S. G. # 17. Bueno Es Alabarte Oh Jehová"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 92:1-8; Sal. 147:1-11; Sal. 89:1-8 \n \nMamin Jehová, til wal sja’l kaln wach’ paxti aych honh; tzki b’itnan pax a b’i honh, tzki’n chanh ha b’i yujto kaw niwn e’lchi’. Sal. 92:1</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"--//Kaw wach' ki b'itnan wal ha b'i Mamin.// Tzki b'itnej Salmo wal ha a b'i, yujto niwn e'lchi. Tzki ch'oxli to tz'o'ch ha k'ojol, wal a smasnil anma'. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw wal tz'o'ch ha k'ojol, a smasnil anma'.  Kaw wal yel tojl hach."},{"id":3,"tag":null,"isDisplayed":null,"text":"--//Kaw wach' ki b'itnan wal ha b'i Mamin.// Tzki b'itnej salmo wal ha a b'i. Yujto niwn e'lchi."}]},{"id":92,"title":"Ki B'itkek Kajlil","guid":"dnCc0ZuvykWZWtBdizHtIA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"92 Ki B'itkek Kajlil\n \nC. S. G. # 75. Cantad Al Señor"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 30; Sal. 146; Sal. 98:1-6 \n \nKi masnil hanh kajn honh a sat lum lum tik, b’itn koyk a Jehová yet’ jun ak’ b’it. Sal.96:1</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     ///Ki b'itkek Kajlil yet' wal junk ak' b'it tik./// Ki b'itkek Kajlil, ki b'itkek Kajlil."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     ///Ha xb'on smasnil tas, ha pax ay yik smasnil./// Ki b'itkek Kajlil, ki b'itkek Kajlil."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      ///Ki b'itkek Kajlil, yujto smoj sb'itnaxi./// Ki b'itkek Kajlil, ki b'itkek Kajlil."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     ///Ix ya'ch kajn aynhek, Yespíritu Santo./// Ki b'itkek Kajlil, ki b'itkek Kajlil."},{"id":6,"tag":null,"isDisplayed":null,"text":"5     ///Ki b'itkek Kajlil, b'o kab' icha tznib'ej./// Ki b'itkek Kajlil, ki b'itkek Kajlil."}]},{"id":93,"title":"Oj Hin B'itnok Ha B’i Jesús","guid":"+O8OqC4RmEGNHz39NMHoZA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"93  Oj Hin B'itnok Ha B’i Jesús \n \nV. C. # 25 \tTu Santo Nombre Alabaré"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ef. 5:19; Sal. 33:1-4; Ap. 5:8-14\n \n Ha jun tzkuch Kalnelu milb’il chamok...Kaw smoj kalnek wach’ paxti ha a.    Ap. 5: 12</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Oj wal wach' paxti aych Jesús, yujto hin ha kolo. Manhx halchjb’enok yuj heb’ anma’, sniwkilal ha chamk’ojlal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Kaw wach' hach Dios Wajlil haji, oj wal yab’ heb’ anma’. To ay kolnb’il tzak’ a matnil, jun kolnb’il to may slajub’."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Kaw wach' ha b’inax hach Wajlil, tzej el hin xiwk'ojlal. Tzak' junk'ojlal a smasnil heb’, anma to tzna sb’a yuj smul."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Tzyak' Jesucristo ha te'nal, tzach skol a skal tu’al. Tzach sb'ik Jesús yet' wal schik'il, yuj wal dios sakx waj tiknek."}]},{"id":94,"title":"Oj Wal Wach' Paxti' A Jesús","guid":"eIGJjIVPeEWXS3V9ipXHxg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"94   Oj Wal Wach' Paxti' A Jesús\n \nV. C. # 61\tCorona A Nuestro Salvador"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mt. 27:1-66; Mt. 28:1-10; Hch. 1:6-11 \n \nHa Jesucristo, junhj xajmb’al ya’jnak yuj ki mulk a jun ejmnhej. Xlajw cha, x’at em wokn a swach’k’ab’ Dios. Heb. 10:12</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kaw tzwal wach’ paxti a Jesús, ayx ek' a swach' k'ab' Dios. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Manhx jantkok wal xchamk'ojlal jun; kaw wal wach' ton ki Mam Dios. Wach' ton wal ki Mam Dios."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ha wal a skal smasnil anma, may junkxo icha Dios. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yet’ a skal smasnil heb’ yajal, may junkxo kaw niwn ye’lchi. May junkxo niwn ye’lchi"},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Kaw ayn ek' a skal maysch'olnil, yik hin yawtn hin Diosal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ix cham Jesús a te kulus; yik ix yi’n kan el hin mul. Ix yijkan el hin mul."},{"id":5,"tag":null,"isDisplayed":null,"text":"4      Kaw tzyak' Dios swach'k'ojlal ayin, yujto tzin schamk'ojlej."},{"id":6,"tag":null,"isDisplayed":null,"text":" Yuj cha kaw tzwak' hin k'inl ha a; yuj wal schamk'ojlal ayin. Yuj schamk'ojlal ayin."}]},{"id":95,"title":"Oj Wal Wach' Paxti A Kajlil","guid":"GlghKW3+XE2hgDn4ovEddQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"95     Oj Wal Wach' Paxti A Kajlil \n \nC. S. G. # 22  Bendeciré Al Señor"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 16; 34:1-10; 66:1-8 \n \n…Kaw ix yal heb’ wach’ paxti a tzaljk’ojlal, ix em kumn heb’ yal sb’a.  2 Cr. 29:30</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"Oj wal wach' paxti a Dios a smasnil k'inal, oj hin b'itnok yet' wal smasnil hin k'ojol. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Tzaljk'ojlal waj a yol sk'ab' hin Kolmal Cristo, yet' smasnil heb' yik xo Cristo hin Kolmal."},{"id":3,"tag":null,"isDisplayed":null,"text":"Ki b'itnokek sb'i ki Kolmal Cristo, yujto may junk xo icha wal Jesús. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Oj wal hin b'a a hin kolmal Cristo; oj hin skol a skal smasnil hin xiwk'ojlal."}]},{"id":96,"title":"Smoj Yalx Wach' Paxti A Hin Kolmal","guid":"QJ1rM4Fq2kK3n+hP+LnPdA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"96       Smoj Yalx Wach' Paxti A Hin Kolmal\n \nC. S. G. # 234 Digno Es El Cordero"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ap. 5:1-5; Fil. 2:1-11; Ef. 3:14-21 \n \nHa jun tzkuch kalnelu milb’il chamok, kaw smoj tzkalek to ay yipalil. Ap. 5:12</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Smoj wal yalx wach' paxti a hin wach' Kolmal, yuj to ha xcham a te kuls yuj wal hin mul. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw may junkxo mach icha hin wach' Kolmal; kojxnhej Jesucristo smoj ki b’itnani."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wach' hin Jesús, kaw wach' hin Jesús, kaw wal smoj yalx wach' paxti a hin Kolmal."},{"id":4,"tag":null,"isDisplayed":null,"text":" Kaw wach' hin Jesús, kaw wach' hin Jesús, kaw smoj yalx wach' paxti a hin Kolmal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Smoj wal yalx wach' paxti a ki wach' Kolmal, yujto ix yak' cham sb'a yuj wal heb' anma'. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha ki wach' Kolmal ix i'n kot sakk'inal, wal a smasnil anma ayk’ a k’ik’k’inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wach' hin Jesús, kaw wach' hin Jesús, kaw wal smoj yalx wach' paxti a hin Kolmal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw wach' hin Jesús, kaw wach' hin Jesús, kaw smoj yalx wach' paxti a hin Kolmal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3       Smoj wal yalx wach' paxti a ki wach' Kolmal, yujto, ha honh mannek el wal yet' schik'il."},{"id":5,"tag":null,"isDisplayed":null,"text":" Smoj wal yalx wach' paxti a ki wach' Kolmal, kaw ayk' a satcha’anh a smasnil k'inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wach' hin Jesús, kaw wach' hin Jesús, kaw wal smoj yalx wach' paxti a hin Kolmal. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kaw wach' hin Jesús, kaw wach' hin Jesús, kaw smoj yalx wach' paxti a hin Kolmal."}]},{"id":97,"title":"Tzin B'itnej Jesucristo","guid":"BVg/DFDVI0OWUAiEJGMpjg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"97      Tzin B'itnej Jesucristo \n \nV. C. # 20 \tA Cristo Doy Mi Canto"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 30:1-4; 33:1-4; Ap. 5:8-14 \n \n…Ha yik tzex laj b’itni, tze yal wach’ paxti a Kajlil a smasnil he k’ojol.  Ef. 5:19</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Tzin b'itnej Jesús hin Kolmal, yujto kolb'iln xo yuj swach'il. Ix yab' syal hin Kolmal Jesús, kaw ilb'iln yuj hin Diosal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yuj cha tzach ki b'itnej Cristo, yujto kaw wal wach’ yalx jun hab’xil. Ki nib'b'en to oj hach kil jun, a skal ha tziktznil aj kajn hach."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      May hin somk'ojlal yet’ kuslal, yujto kaw ayk' Dios wet' tiknek. Kaw yet’ ton wal hin tzaljk’ojlal, tzwal wach' paxti a Cristo."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yuj cha tzach ki b'itnej Cristo, yujto kaw wal wach’ yalx jun hab’xil. Ki nib'b'en to oj hach kil jun, a skal ha tziktznil aj kajn hach."},{"id":4,"tag":null,"isDisplayed":null,"text":"3       Yet’ wal smasnil hin tzaljk’ojal, kaw tzwal wach’ paxti aych Wajlil. Kaw yel niwn wal hin tzaljk’ojlal, yik tzwab’n a b’inax Mamin."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yuj cha tzach ki b'itnej Cristo, yujto kaw wal wach’ yalx jun hab’xil. Ki nib'b'en to oj hach kil jun, a skal ha tziktznil aj kajn hach."},{"id":5,"tag":null,"isDisplayed":null,"text":"4        Kaw tzwal wach’ paxti aych Mamin, ya' sb'a pitzn hin hach hin Diosal. Kaw oj yil pax wal heb’ ángel, waln hin wach’ paxti aych ta’."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yuj cha tzach ki b'itnej Cristo, yujto kaw wal wach’ yalx jun hab’xil. Ki nib'b'en to oj hach kil jun, a skal ha tziktznil aj kajn hach."}]},{"id":98,"title":"Tzin B'itnej Hin Diosal","guid":"OLhInRhR6UuAHIqZyqW0WQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"98   Tzin B'itnej Hin Diosal\n \nC. S. G. # 25. De Jehová Cantaré"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 89:1-8; Lam. 3:19-26; Is. 63:7-9 \n \nMamin Jehová, oj wal a skal hin b’it chajtlto kaw wach’ ha nab’en. Sal. 89:1</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Tzin b'itnej hin Diosal, yuj wal swach'k'ojlal ayin; tzin b'itni, (tzin b'itni) jin b'itni. (jin b'itni.) Tzin b'itnej hin Diosal, yuj wal schamk'ojlal ayin; kaw yel niwkil wal jun schamk'ojlal tik.  Fin "},{"id":3,"tag":null,"isDisplayed":null,"text":"Yet' hin ti' jwal wach' ab'ix, jun to kaw yel, a smasnil k'inal. Tzin b'itnej wal hin Diosal, yuj wal swach'k'ojlal ayin; tzin b'itni. (Desde la cabeza)"},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Yet’ heb' ha chonhab' tzin nan kot sniwkilal he’lchi; tzin b'itni, (tzin b'itni) jin b'itni. (jin b'itni.) Yet' heb' ha chonhab' tzin nan kot sniwkilal he’lchi; oj hach hin b'itnok a smasnil k'inal.  Fin "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha tas yel oj wak' kuyxok, hin Diosal hach, Dios hach tztak' ho'oj; ha tas yel oj wak' kuyxok. Kaw hin Diosal hach, hin Kolmal haji. (Desde la cabeza)"}]},{"id":99,"title":"Tzin B'itn Aych Wajlil","guid":"AX6xad7PAEK7uXL0BCWE4Q","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"99    Tzin B'itn Aych Wajlil \n \nC. S. G. # 7 Con Canticos Señor"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 149:1-5; 34:1-10; 33:1-12    \n \n¡Halx kab’ wach’ paxti a Jehová! Ki b’itkek ak’ b’it a Jehová. Hanhek yik xo kaji. Sal. 149:1</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Tzach hin b’itnej Mamin, yet’ smasnil hin pixan. Yet’ tzalk’ojlal tzwij chanh ha b’i hach Dios Oxwanh."},{"id":3,"tag":null,"isDisplayed":null,"text":" A satcha'anh, kaw oj hin k'och kajn het' wal a smasnil k’inal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Hach ix ha ch’ox Mamin, wal aj til tzin b’eyi. Tanhb'iln hoj hach hin Dios wal a smasnil k'inal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"A satcha'anh, kaw oj hin k'och kajn het' wal a smasnil k'inal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Kaw wal manhx halchjb’enok ha yaxilal Mamin. Yuj cha kaw tzin tzalji tzwaln wach’ paxti ayach. "},{"id":5,"tag":null,"isDisplayed":null,"text":"A satcha'anh, kaw oj hin k'och kajn het' wal a smasnil k'inal."},{"id":5,"tag":null,"isDisplayed":null,"text":"4      Hin Diosal hach Mamin, kaw kojn hach ton wach’ hach. Smasnil heb' to heko' oj sb'itnok heb' ha b'i. "},{"id":6,"tag":null,"isDisplayed":null,"text":"A satcha'anh, kaw oj hin k'och kajn het' wal a smasnil k'inal."}]},{"id":100,"title":"Yik Wan Xo Yem K’u.","guid":"IcJWKFrwOki5tCVBmTnExA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"100      Yik Wan Xo Yem K’u.\n \nB.B. D.12- "},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>1:1-18; 2 P. 3:10-13 \n \nYujto smasnil tas, hanhj a Dios tzkoti. Smasnil tas b’obil yu’uj, sek tzcheklj el swa’ch’il. Ro. 11:36</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1 Ha yik wan xo wal yem k’u, smasnil siktak wal tz’aji. Kalk yuj diosal ya’sb’a tzk’ik’b’i yujto wach’ ix ek’ k’u ku’uj yuj ki Mam Dios."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal smasnil tas tztak’ yuj ki Mam Dios Sb’o lu’um yet’ satcha’anh Kaw sb’o pax k’u yet’ k’anal; Kaw jeln ki Dios."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ha k’anal kaw wal tziktzni, yujto kaw wal wach’ yilxi. Manh jantkok sjelnal ki Diosal, ay k’ual yet’ pax wal ak’wal yuj ki Mam Dios."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal smasnil tas tztak’ yuj ki Mam Dios Sb’o lu’um yet’ satcha’anh Kaw sb’o pax k’u yet’ k’anal; Kaw jeln ki Dios."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Hoj Mamin kaw tzonh ilji. Ha a b’i tzonh waykn ejmi, tzaljk’ojlal oj ki sakb’eli. K’ik’an tzach ki nan pax wali, yujto ki Dios hach."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal smasnil tas tztak’ yuj ki Mam Dios Sb’o lu’um yet’ satcha’anh Kaw sb’o pax k’u yet’ k’anal; Kaw jeln ki Dios."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Yik oj lajwok wal smasnil, k’u yet’ uj yet’ pax k’anal. Jchekljok jun aj sakk’inal, kaw oj sakb’ok el satcha’anh yuj ki Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal smasnil tas tztak’ yuj ki Mam Dios Sb’o lu’um yet’ satcha’anh Kaw sb’o pax k’u yet’ k’anal; Kaw jeln ki Dios."}]},{"id":101,"title":"Heb' Ix Yik Xo Dios","guid":"DsbqNK5vskekZS4Syne1ag","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"101  Heb' Ix Yik Xo Dios \n \nC. S. G. # 590. Las Mujeres Cristianas"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Pr. 31:10-31; 1 P. 3:1-6; Ef. 5:21-31 \n \nHa ix ix wach’ snab’en to k’asan, manh komnok tz’ilchj ix; yelxo wal niwn ye’lch ix a yib’n k’en k’en kaw chanh stojol.  Pr. 31:31</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ha wal heb’ ix tzmunlj a yik ki Mam Dios, yet’ chamk'ojlal yet' pax jichk’ojlal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw wal wach' tzyutj heb' sb'eyb'al a yatut, tzk'ann heb' sjelnal a ki wach' Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yet’ wal ki (yet’ wal ki) jichk’ojlal (jichk’ojlal) Tzonh munlj wal a yik ki wach' Kolmal."},{"id":4,"tag":null,"isDisplayed":null,"text":" Junxnhej yaj (junxnhej yaj) ki nab'en, (ki nab'en) Yuj ki chamk'ojlal a ki Kolmal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Yel ki ch'oxk chamk'ojlal a heb' anma', may kab’ b’a'nh tzkaktjek ki ch’oxn eli."},{"id":4,"tag":null,"isDisplayed":null,"text":" Kaw wal ix ilchj swach'k'ojlal ki Mam Dios, smanil nunb’il wach’ tzyutj sch’oxn eli."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yet’ wal ki (yet’ wal ki) jichk’ojlal (jichk’ojlal) Tzonh munlj wal a yik ki wach' Kolmal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Junxnhej yaj (junxnhej yaj) ki nab'en, (ki nab'en) Yuj ki chamk'ojlal a ki Kolmal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Junxnhej tzkutj munljok ki b’a a yik Dios, kaw te’n tzkutjek ki b’a a Kajlil. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Munlj koyk wal a smasnil ki k'ojol, a katut yet’ pax a ki chonhab’."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yet’ wal ki (yet’ wal ki) jichk’ojlal (jichk’ojlal) Tzonh munlj wal a yik ki wach' Kolmal. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Junxnhej yaj (junxnhej yaj) ki nab'en, (ki nab'en) Yuj ki chamk'ojlal a ki Kolmal."}]},{"id":102,"title":"Hex Kelem Halk El Jun Wach’ Ab’ix","guid":"7N9W6DxackONFfWEzxPNEA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"102 Hex Kelem Halk El Jun Wach’ Ab’ix\n \nC. S. G. # 582. Proclamad Juventud Redimida"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>2 Ti. 2:15-22; 1Ti. 4:1-9, 11-16 \n \nKaw manh ha b’o jun tzo’nh may sch’olnil, icha tznib’j och heb’ het kelmal.  2 Ti. 2:22</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Hex kelem kolb'ilx yuj ki wach' Kolmal. Kalk el jun wach' ab'x yik ki Kolmal. Ha Jesús tz'i'n el smasnil ki mul jun, tzyak’ wach’ b’eyb’al a heb’ tzjaw ha a. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kalk eli to kaw yel jun wach' ab'x tik, kalk wach' paxti a ki wach' Kolmal. // Tzaljk'ojlal tzkalk el yab'xil ki Kolmal, yujto kaw ix kot a Satcha'anh //"},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ka'k wal ip ki atk yet' ki wach' Kolmal, kaw manh honh xiwk ki atk wal yet'ok. Tzonh b'itnek tzonh tzaljek yik tzonh atek, tzkalnek el yab'xil a heb' anma'. "},{"id":4,"tag":null,"isDisplayed":null,"text":" Ijek chanh he bandera he masnil, he masnil hex kolb'ilx yuj Jesús. // Ki ch'oxk el wal a smasnil heb’ anma',  to ha Cristo Jesús tzonh kolni.//"},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Hex kelem kaw tzki chamkojlej Cristo,  oj ki b'ok icha tznib'j wal aynhek. Oj ki b'eyk a stojlal icha tznib'ej, sek oj yil wal heb' anma smasnil."},{"id":5,"tag":null,"isDisplayed":null,"text":" Ha Jesús ki Kolmal kaw sak k'inal, tzyak’ sakk’inl a masnil heb’ anma'. // Ha Jesús tzyak’ lajwok tas kaw ay smay,  yuj cha kaw ka’k ip ki atk yet’ok.//"}]},{"id":103,"title":"Kotnhek Hex Kelem","guid":"q2IS5Rb/f0eEJiIn7tOnLg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"103     Kotnhek Hex Kelem \n \nV. C. # 332. Oh Jóvenes Venid"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>I Ti. 4:12-16; 2 Ti. 2: 22-26 \n \nKaw wach’ tzotj ha b’a, sek may heb’ oj halnk ho’oj, to unnach to. Yel xo wach’ tza ch’ox jun wach’ b’eyb’al a heb’ creyente smasnil.  1 Ti. 4:12</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kotnhek wal hex kelem, kaw ch'oxk el jun wach' b'eyb'al, kaw wal te'n tze yutj he b’a yet’ ki Kolmal."},{"id":3,"tag":null,"isDisplayed":null,"text":" Kaw tznib'j wal Jesucristo tzex at wal he masnil, yuj Jesús hax skan win Satanás a yalnh wal jun."},{"id":0,"tag":1,"isDisplayed":null,"text":"Koyk wal yet' Jesús, ki'k wal kip a ki Kolmal, och koyk tza'n yuj Cristo, kaw te'n tzkutjek ki b'a. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw oj ka'k wal howl yet' smasnil maysch'olnil, Yujto ha Jesús tzonh jukb'tzan wali."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Kotnhek wal hex kelem, ijek chanh wal spaxti Dios, ya’sb’a pitzn hex, ochknhek tza'n wal yuj Jesús kajlil. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw tzex makwj wal b'i'an, kaw tzex leslwi a Dios, och koyk tza'n yuj Jesús, yik tzka'nek wal jun howal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Koyk wal yet' Jesús, ki'k wal kip a ki Kolmal, och koyk tza'n yuj Cristo, kaw te'n tzkutjek ki b'a."},{"id":5,"tag":null,"isDisplayed":null,"text":" Kaw oj ka'k wal howl yet' smasnil maysch'olnil, Yujto ha Jesús tzonh jukb'tzan wali."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Ha yamk’ab’ yik howal, hatn Spaxti ki Mam Dios, hatn yab’xil kolnb’il yet’ wal chamk’olal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ch'oxk el wal swach'l Dios wal a smasnil he k'ojol, kaw yiklum tze yutj he b'a wal a Kajlil Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"Koyk wal yet' Jesús, ki'k wal kip a ki Kolmal, och koyk tza'n yuj Cristo, kaw te'n tzkutjek ki b'a."},{"id":6,"tag":null,"isDisplayed":null,"text":" Kaw oj ka'k wal howl yet' smasnil maysch'olnil, Yujto ha Jesús tzonh jukb'tzan wali."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Ha heb' ajk'ojl aynhek schekb' win Satanás heb', ha heb' cha tanhb'il heb' yuj win syajlil cha. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Hex kelem kaw manh hex xiwk yuj tas maysch'olnilal, ijek wal he te'nal a ki wach' Kolmal tiknek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Koyk wal yet' Jesús, ki'k wal kip a ki Kolmal, och koyk tza'n yuj Cristo, kaw te'n tzkutjek ki b'a."},{"id":7,"tag":null,"isDisplayed":null,"text":" Kaw oj ka'k wal howl yet' smasnil maysch'olnil, Yujto ha Jesús tzonh jukb'tzan wali."},{"id":6,"tag":null,"isDisplayed":null,"text":"5     Ha spaxti ki Mam Dios, icha yamk'ab' yik howal, yuj cha kaw te'n kajek yik tzka'nek howal. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Och koyk tza'n yuj Kajlil hatn Cristo ki Kolmal. Yuj Jesús oj kan maysch’olnil wal a yalnh kujek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Koyk wal yet' Jesús, ki'k wal kip a ki Kolmal, och koyk tza'n yuj Cristo, kaw te'n tzkutjek ki b'a."},{"id":8,"tag":null,"isDisplayed":null,"text":" Kaw oj ka'k wal howl yet' smasnil maysch'olnil, Yujto ha Jesús tzonh jukb'tzan wali."}]},{"id":104,"title":"Tzki Chamk'ojlej Ki Nun","guid":"l7mdWqGtxEqTP4/1vlSy5w","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"104  Tzki Chamk'ojlej Ki Nun\n \nC. S. G. # 607. A Mi Madre"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>1 Ti. 5:1-4; 2 Ti. 4:1-5; Stg. 3:13-18  \n \nTil wal heb’ ix ix kaw wach’ sbe’yb’al, palta kojn hach tik, yel xo wal wach’ ha b’eyb’al a yib’nh heb’ ix ix smasnil, xchi heb’. Pr. 31:29</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Smoj tzki chamk'ojlej ki nunek, tzki na kot schamk'ojlal ayonh.  "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ya’sb’a to pitznonhk yet’ ki nun, oj ki chamk’ojlok nhej heb’."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzki chamk'ojlej ki nunek,  niwn kab' ye'lch heb’ a ki satek. Ka'k ki siylab' a ki nunek,  sek oj tzaljok wal ket'ek."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Kaw yuj wal dios a ki nunek, yujto honh skuyk a wach'ilal."},{"id":4,"tag":null,"isDisplayed":null,"text":" Ha honh ch’oxnek a sb’e Cristo, kaw wal yel xyab' syal kujek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzki chamk'ojlej ki nunek,  niwn kab' ye'lch heb’ a ki satek. Ka'k ki siylab' a ki nunek,  sek oj tzaljok wal ket'ek."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Kaw honh yil k’ib’ yet’ schamk’ojlal, jun chamk’ojlal to kaw wal yel. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw ki nak kot wal schamk'ojlal, yujto ha honh k'ib'tzanek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzki chamk'ojlej ki nunek,  niwn kab' ye'lch heb’ a ki satek. Ka'k ki siylab' a ki nunek,  sek oj tzaljok wal ket'ek."}]},{"id":105,"title":"Tzaljk'ojlal Yik Heb' Tznupni","guid":"cCeOgfecOE+AHRdOc4rUAQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"105     Tzaljk'ojlal Yik Heb' Tznupni\n \nB. B. D. # 200."},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 2:1-12; Mt. 19:1-12; I Cr. 7 \n \nHa yik tz’och yistzil win winak, tz’ilchj tzaljk’ojlal yu’uj; tzyal e’lchi to tzchaj swach’k’ojlal Dios.  Pr. 18:22</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Kaw wal yel tzaljk’ojlal yik heb’ wan snupni, yujto ha Dios tzyij chanh heb’."},{"id":3,"tag":null,"isDisplayed":null,"text":" Ha Jesús ayk’ yet’ heb’ a jun nupnel tik, yujto kaw yel junxnhej anmal x’aj heb’."},{"id":0,"tag":1,"isDisplayed":null,"text":"Hach hin Dios ak’ yaxilal a heb’, ak’ schamk’ojlal heb’ yet’ sjunk’ojlal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yet’ pax tzaljk’ojlilal, a yol yatut heb’ a junjn k’u."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ak’ ha wach’k’ojlal a yib’nh heb’ schawnhil,yet’ junk’ojlal a spixn heb’. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ay kab stzaljk’ojlal heb’ yi’n chanh ha b’i Mamin. Yujto tza ch’ox ha chamk’ojlal a heb’."},{"id":0,"tag":1,"isDisplayed":null,"text":"Hach hin Dios ak’ yaxilal a heb’, ak’ schamk’ojlal heb’ yet’ sjunk’ojlal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yet’ pax tzaljk’ojlilal, a yol yatut heb’ a junjn k’u."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Kaw manh najtlok tzonh ek’ a yolyib’nhk’inl tik, yujto yajnhej tzonh chami. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Icha snich te te’ ixta yek’ ki k’inal, oj ki pax yet’ Jesús a satcha’anh."},{"id":0,"tag":1,"isDisplayed":null,"text":"Hach hin Dios ak’ yaxilal a heb’, ak’ schamk’ojlal heb’ yet’ sjunk’ojlal. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Yet’ pax tzaljk’ojlilal, a yol yatut heb’ a junjn k’u."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Kaw tzach och yet’ heb’ hach Kajlil ki Diosal, sek may kusk’ojlal a heb’. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Snib’knhej kab’ sb’a heb’ a smasnil k’inal, yujto kaw ixta yaln wal ha paxti’."},{"id":0,"tag":1,"isDisplayed":null,"text":"Hach hin Dios ak’ yaxilal a heb’, ak’ schamk’ojlal heb’ yet’ sjunk’ojlal. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Yet’ pax tzaljk’ojlilal, a yol yatut heb’ a junjn k’u."}]},{"id":106,"title":"Tzyak' Dios Swach'k'ojlal  A Heb' Tznupni","guid":"K4s7ctetdkiw4o6Cylwi+g","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"106     Tzyak' Dios Swach'k'ojlal  A Heb' Tznupni\n \nC. S. G. # 593. Dios Bendiga Las Almas Unidas"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Gn. 2:18-24; Ef. 5:21-31; 1 Cor. 13\n \n Xyaln pax Jehová Dios ixtik: Manh wach’ok ayk’ win wink xch’okoj, to oj in b’o junk yitb’eym win to smoj tztak’ skolwj yet’ok, xchi. Gn. 2:18</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Yak’ kab’ Dios swach'k'ojlal ayx tzex nupni, junxnhej oj kan he nab'en he chawnhil.  ha ki Mam Dios oj och wal he yet'ok, junjn k'u oj hex yil ki Mam Dios. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw junxnhej niwnal tzex ajkn he chawnhil, ay kab’ wal chamk’ojlal a he kal jun. Tzaljk'ojlal tzex kan a smasnil k'inal,  oj he cha swach'k'ojlal ki Mam Dios."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Kaw wal tzalj ki Mam Dios yet' heb' tznupni,  yujto wan sch'oxn el heb' syiklumal jun.  Ha oj i’nok b’ey wal heb’ a stojlal, yujto xyak’ heb’ sti schamk’ojlan sb’a. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ixta yaln spaxti Dios tz'ib'b'il kani,  ha jun nupnel tik kaw wal niwn ye'lchi. Yuj wal cha xiw koyk a ki Diosal jun,  kaw oj yak' swach'k'ojlal wal aynhek."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Ha heb’ tznupni schamk’ojlok kab’ sb’a heb’.  Yujto xyak’ heb’ sti to junxnhej tz’ajkni. Say kab’ ek’ heb’ swachk’ojlal ki Mam Dios. yet’ jun chamk’ojlal to may slajub’. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Toto ay aj oj jawk skusk’ojlal heb’,  ha kab’ ki Mam Dios tzya’ch heb’ yipk sk’ojol, ki Mam Dios oj a'nok sniwnal sk'ojl heb', tiknek yet' wal a smasnil k'inal."}]},{"id":107,"title":"Ix Jaw Jesucristo","guid":"btICDxNC+U+Jo7YvxlKWhQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"107     Ix Jaw Jesucristo\n \nV. C. # 349. Jesucristo Ha Venido"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>1 S. 1:12-28; Sal. 8:1-2; Mr. 9:33-37 \n \nXlajw cha, ix yi’n och Jesús jun unn a skal heb’, ix sme’ni, xyaln ixtk a heb’: tzannhj mach tzchan junk unn icha jun tik yuj to wiko, han tzin scha’aj. Mr. 9:36,37</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Ix jaw wal ki Yajlilek  a yolyib'nhk'inl tik, yik xwul smannok heb' uninyet' schik'il yik ix chami."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wach' yilx heb' unin,  yujto kolb'ilx heb' yuj Jesús. Kaw tziktzni yilx oj aj heb',  yik jk'och heb' yet' Dios."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Kaw ix yab' syal hin wach' Kolmal, yik xcham a te kulus.Kaw ix sakb'tzej kan heb' yunnal, yik x'el wal schik'il."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wach' yilx heb' unin,  yujto kolb'ilx heb' yuj Jesús. Kaw tziktzni yilx oj aj heb',  yik jk'och heb' yet' Dios."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ha heb' unin kaw lajn heb' icha,junk k'en wach' yilxi.Kaw oj k'och heb' a stziktznil Dios, a smasnil k'inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wach' yilx heb' unin,  yujto kolb'ilx heb' yuj Jesús. Kaw tziktzni yilx oj aj heb',  yik jk'och heb' yet' Dios."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Heb' wink unin yet' heb' ix unin, tzchamk'ojlej Dios heb'. Toto tzya'ch heb' sk'ojl a Jesús, oj scha heb' skolnb'il."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wach' yilx heb' unin,  yujto kolb'ilx heb' yuj Jesús. Kaw tziktzni yilx oj aj heb',  yik jk'och heb' yet' Dios."},{"id":6,"tag":null,"isDisplayed":null,"text":"5     Yet' wal schamk’ojlal Jesús, tzonh yi'n och wal yunnalok. Smasnil heb' manb'ilx yuj schik'il, oj k'och heb' yet'ok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wach' yilx heb' unin,  yujto kolb'ilx heb' yuj Jesús. Kaw tziktzni yilx oj aj heb',  yik jk'och heb' yet' Dios."}]},{"id":108,"title":"Tze Ya' Kot Heb' Unin","guid":"EK3C4SJyH0+Qt99sNwuKZg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"108     Tze Ya' Kot Heb' Unin\n \nV. C. # 330. La Puerta Abrid A Los Niños"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mr. 10:13-16; Lc. 2:21-38; 18:15-17\n \n Yuj cha,  xyaln Jesús a heb’ skuywum chi ixtik: Chajek kot heb’ unn ayin.  Manh he tench wan heb’. Mt.19:14</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Tze yak' kot smasnil heb' unin, ki ch’oxk chamk’ojlal a heb’. Ki kolk heb’ a tas kaw ay smay. Ki’k at heb’ a ki Kolmal."},{"id":3,"tag":null,"isDisplayed":null,"text":" Ixta ix yutj Jesús yalni, yik ix yaln a heb' schekab'. Kaw tze chaj kot wal heb unn ayin, kaw manh he tench wan wal heb'."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tze ya' kot wal heb' unin, (tzeya' kot smasnil heb' unin, tzeya' kot smasnil heb' unin.) kaw manh he tench wan wal heb' unin,"},{"id":4,"tag":null,"isDisplayed":null,"text":" ixta xyutj Jesús yalni. Tze ya' kot smasnil heb’ unin, jaw kab’ wal heb’ smasnil jun."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ha wal a swach’ k’ab’ ki Kolmal oj yil wal heb’ swach’k’ojlal. Ki k’ank wal a ki Mam Dios jun, to tzyak’ syaxilal a heb’. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Tzchamk'ojlej Jesús wal heb' unin, oj k'och heb' a satcha'anh. Tze ya' kot smasnil heb' unin, sek ma oj sb'o heb' tu'al."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tze ya' kot wal heb' unin, (tzeya' kot smasnil heb' unin, tzeya' kot smasnil heb' unin.) kaw manh he tench wan wal heb' unin, "},{"id":5,"tag":null,"isDisplayed":null,"text":"ixta xyutj Jesús yalni. Tze ya' kot smasnil heb’ unin, jaw kab’ wal heb’ smasnil jun."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Kuyk heb' unn a spaxti Dios jun, kaw tze kuy heb' a swach'il. Kaw tze kuy wal heb' a lesal, sek oj och wal ste'nal heb'. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Toto matz kuyx heb' unn a swach'il, oj at heb' a skal tu'al. "},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tze ya' kot wal heb' unin, (tzeya' kot smasnil heb' unin, tzeya' kot smasnil heb' unin.) kaw manh he tench wan wal heb' unin,"},{"id":6,"tag":null,"isDisplayed":null,"text":" ixta xyutj Jesús yalni. Tze ya' kot smasnil heb’ unin, jaw kab’ wal heb’ smasnil jun."}]},{"id":109,"title":"Yik Honhk Cristo","guid":"RHnwsDeR7ESvX2TDeN7eeg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"109   Yik Honhk Cristo\n \nC. S. G. # 451 Iglesia De Cristo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ef. 5:24-27; Col. 1:15-23; 1 Tes. 5:1-11\n  \n Palta hanhek xo tik, junxnhej kinhtl ki masnil a sat Dios, si’kb’ilnhekxo el yu’uj. Hayx kalnek kik ka’nek och ki ti a Dios. 1 P. 2: 9</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Kaw ki mak sjaw Cristo hanh yiglesia honhk tik,yet' ki chamk'ojlal tzki mak sjaw wal Kajlilek."},{"id":3,"tag":null,"isDisplayed":null,"text":" Jesús oj emlok wal a skal stziktznial, kaw oj ab'xok wal yik oj jawk ki wach' Kolmal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Toto ay mach manhxtzak ya'ch Dios yipk sk'ojol, tiknek ki masnil kaw ka'k och ki k'ojl ha a. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ki mak sjaw ki Kolmal, kaw manh honh xiwok, kaw ayk' Yespíritu ki Mam Dios wal ket'ek."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ha mach tz'och tza'n yuj heb' anma ajmul,a yol sk'ab' yailal hata wan ya'n och sb'a heb’. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Hax wal heb' schekb' ki wach' Kolmal Jesús, ha tas tznib'j heb' to tzmak heb' sjaw ki wach' Kolmal."}]},{"id":110,"title":"Ha Win Anma Jelan","guid":"lZ5JrnZbNkaIOWDjJl6+/A","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"110     Ha Win Anma Jelan\n \nB. B. D. # 252."},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mt. 7:24-29; 1 Pe. 2:4-8; 1 Cor. 3:11-15 \n \nMay junkxo mach tztak’ ya’n ejm junk xo yipnub’al yich cha. Yujto ha jun yipnub’al yich emnk xo cha, hatn Jesucristo. 1 Co. 3:11</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Ha win jelan ix sb'o win jun yatut. //Ix sb'o yatut a yib'nh jun K'e'en, // xlajw cha ix kot yaxnhab'."},{"id":3,"tag":null,"isDisplayed":null,"text":"///Ix kot yaxnhab' ix jaw ha elmal ha', /// kaw may x'aj jun yatut cha."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    win may snab'en sb'o win jun yatut. //A yib'nh pok ix sb'o win jun yatut, // xlajw cha ix kot yaxnhab'."},{"id":4,"tag":null,"isDisplayed":null,"text":"///Ix kot yaxnhab' ix jaw ha elmal ha', /// ka ix juw jun yatut cha."}]},{"id":111,"title":"Ay Jun Katut A Satcha'anh","guid":"pV7Hw93+JEOX79u1/ZOXuQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"111 Ay Jun Katut A Satcha'anh\n \nV. C. # 208  Meditad En Que Hay Un Hogar"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 14:1-3; Fil. 3:20 \n \n Ix yaln Jesús a heb’ skuywum ixtik: Manh he yak’ somchjok el he nab’en. Ha’k och he k’ojl a Dios, tzeya’n pax och he k’ojl ayin.  Jn 14: 1, 2</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ay jun katut a satchanh tiknek, kaw wal manh jantkok stziktznil yilxi. (wach' yilxi.) "},{"id":3,"tag":null,"isDisplayed":null,"text":"Hanhek yik honhk xo Cristo Jesús jun, ha wal ta oj ki k’ochk ki masnil."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj ki k'ochk wal yet'ok, hatn a stz'ey Jesús a satcha'anh. Oj ki k'ochk yet' Jesús kaw wal yel, hatn a stz'ey Jesús a satcha'anh. "},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ha Jesús kaw wal ki wach’k’ojlek, yuj cha kaw wal tza’nonhk och yu’uj (yuj jichk’ojlal.) "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yuj cha ay jun k’ual kaw oj kilek, aj ayk’ ya’n Yajlil a stacha’an."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj ki k'ochk wal yet'ok, hatn a stz'ey Jesús a satcha'anh. Oj ki k'ochk yet' Jesús kaw wal yel, hatn a stz'ey Jesús a satcha'anh. "},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ha Jesús kaw ki wach' Kolmalek, yuj cha, kaw smoj tzki chamk'ojlejek. (wal Jesús.) "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw oj ki k’ochk wal yet’ a satcha’anh, manhxa xiwk’ojlal yet’ yailal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj ki k'ochk wal yet'ok, hatn a stz'ey Jesús a satcha'anh. Oj ki k'ochk yet' Jesús kaw wal yel, hatn a stz'ey Jesús a satcha'anh. "},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Junxnhej oj kajk yet’ ki wach’ Kolmal, yik oj lajwok kan k’och ki k’inlek (oj lajwok.) "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kaw wal oj ki k’ochk yet’ a satcha’anh, aj oj kiljek a smasnil k’inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj ki k'ochk wal yet'ok, hatn a stz'ey Jesús a satcha'anh. Oj ki k'ochk yet' Jesús kaw wal yel, hatn a stz'ey Jesús a satcha'anh. "}]},{"id":112,"title":"Ayx Yab’lil Ayn Ek’ A Skal Mul","guid":"qOskGAiKK0Ce9oZkI3tKRA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"112      Ayx Yab’lil Ayn Ek’ A Skal Mul\n \nC. S. G. #322  Años Mi Alma En Vanidad Vivió"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 8:31-36; Ro.  6:1-11; 7:15-8:2 \n \nHa yik pekti’, yaktjnak kan Dios heb’ anma’, sek mun tzb’o heb’ icha tznib’ej.  Hch. 14:16</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Niwn yab’lil hin satk’ a skal stu’al,tok wal wojtak mach xyab’ syal wu’uj. Tikni kaw o’ltak x’aj yuj hin mul, Cristo hin Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Dios ix yak' wal niwnk'ojlal ayin, ix chax junk'ojlal yuj hin pixan. Ha a te kulus, ix stoj hin mul,  Cristo hin Kolmal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Tzyal ch'anh Biblia to kaw ajmul hin,Max hin yiklj scheknb'il hin Dios. Palta yuj hin jichk'ojlal xin chaj, Cristo hin Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Dios ix yak' wal niwnk'ojlal ayin, ix chax junk'ojlal yuj hin pixan. Ha a te kulus, ix stoj hin mul,  Cristo hin Kolmal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Xwak’ hin pixn smasnil a Jesús,tiknek tzwa'ch hin b'a schekb'ok hin Dios. Tzin b’itnej sb’i a smasnil k'inal, Cristo hin Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Dios ix yak' wal niwnk'ojlal ayin, ix chax junk'ojlal yuj hin pixan. Ha a te kulus, ix stoj hin mul,  Cristo hin Kolmal."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     A te kuls ix sch'ox wal Dios swach'il, ix yak' niwnk'ojlal aynh a matnil. Kaw ix cham ki jelk a te kulus, Cristo ki Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Dios ix yak' wal niwnk'ojlal ayin, ix chax junk'ojlal yuj hin pixan. Ha a te kulus, ix stoj hin mul,  Cristo hin Kolmal."}]},{"id":113,"title":"E'nk Hin A Skal Maysch'olnil","guid":"oupkD0EXWES2tkkXWg68OQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"113     E'nk Hin A Skal Maysch'olnil\n \nV. C. # 274 \tVagaba Yo En La Obscuridad"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ef. 2:1-10; 1 Jn. 1:5-10; Is. 9:1-2 \n \nToto tzkalek, to junxnhej kajk yet’ok, palta hanhja k’ik’k’inl yaj ki pixnek, toto ixta’,  tonhj tzka’k es. 1 Jn. 1:6</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Kaw e'nk hin a k'ik'k'inal, hin b'ojnak maysch'olnil. Yuj schamk'ojlal hin wach' Kolmal, ayn ek' a sakk'inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzaljk'ojlal xo yaj hin pixan, (tzaljk'ojlal) tzaljk'ojlal waj yuj swach'k'ojlal Dios. (tzaljk'ojlal) "},{"id":3,"tag":null,"isDisplayed":null,"text":"Yiktax hin chan Jesús hin wach’ Kolmalok, (ha Jesús) kaw wal ix jaw tzaljk'ojlal a hin pixan."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Kaw wach'xam tzannhj aj tzin ek'i, ilb'iln yuj hin Kolmal. Tzaljk'ojlal waj yuj sakk'inlal, hin wach' Kolmal Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzaljk'ojlal xo yaj hin pixan, (tzaljk'ojlal) tzaljk'ojlal waj yuj swach'k'ojlal Dios. (tzaljk'ojlal) "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yiktax hin chan Jesús hin wach’ Kolmalok, (ha Jesús) kaw wal ix jaw tzaljk'ojlal a hin pixan."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Tzin b'eyk' wal a sakk'inlal Dios, junk'ojlal xo waji. Oj woch tza'n yuj hin wach' Kolmal, oj wakkan maysch’olnil."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzaljk'ojlal xo yaj hin pixan, (tzaljk'ojlal) tzaljk'ojlal waj yuj swach'k'ojlal Dios. (tzaljk'ojlal) "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yiktax hin chan Jesús hin wach’ Kolmalok, (ha Jesús) kaw wal ix jaw tzaljk'ojlal a hin pixan."},{"id":5,"tag":null,"isDisplayed":null,"text":"4      Kaw oj wil sat hin wach' Kolmal, yik oj hin k'och yet'ok. Tzaljk'ojlal oj hin k'och yet'ok, yujto ix cham wu’uj."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzaljk'ojlal xo yaj hin pixan, (tzaljk'ojlal) tzaljk'ojlal waj yuj swach'k'ojlal Dios. (tzaljk'ojlal) Yiktax hin chan Jesús hin wach’ Kolmalok, (ha Jesús) kaw wal ix jaw tzaljk'ojlal a hin pixan."}]},{"id":114,"title":"Hach Hin Kolmal","guid":"arDZJ5YYXUaBR4U2FRt7gg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"14  Hach Hin Kolmal\n \nV.C. 138 Salvador mío"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>1 Jn. 3:1-3; Ro. 6:8-10; 1 Ts. 2: 7; 2 Ts. 2:3 \n \n…Yujto kaw ha Dios tz’a’n nachjk el he yu’uj, tas tze yutj he chamk’ojlan he ba’. 1 Ts. 4:9</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Hach hin wach’ kolmal, icha wal helxi, may ha palta’il, tzin kan het’ok."},{"id":3,"tag":null,"isDisplayed":null,"text":" Kaw tzwakkan smasnil wal maysch’olnilal, ha aj tzach ati, tzin at het’ok."},{"id":0,"tag":1,"isDisplayed":null,"text":"B’on hach hin Cristo, icha hach wali, kaw ak’ wal wip yet’ wal hepalil. Kotnh a satcha’anh hach hin wach’ Kolmal, icha helxi ixta oj waji"},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Tzak’ wal hin te’nal yet’ pax hin jelnal, sek wach’ kaw ay wal hin niwnk’ojlal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Tzin nib’j to kaw, emmkilal tzwutj hin b’a, tzwaln pax el ton wal tas tza nib’ej."},{"id":0,"tag":1,"isDisplayed":null,"text":"B’on hach hin Cristo, icha hach wali, kaw ak’ wal wip yet’ wal hepalil. Kotnh a satcha’anh hach hin wach’ Kolmal, icha helxi ixta oj waji"},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Kaw emmkilal tzin nib’j tzwutj wal hin b’a, tzin nib’j to kaw yel tas tzin b’o’o. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Tzwal wach’ paxti aych’ yet wal hin pixan, kaw yuj wal smasnil ha wach’ilal."},{"id":0,"tag":1,"isDisplayed":null,"text":"B’on hach hin Cristo, icha hach wali, kaw ak’ wal wip yet’ wal hepalil. Kotnh a satcha’anh hach hin wach’ Kolmal, icha helxi ixta oj waji"},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Kaw sakb’tzej hin pixn hach hin Jesús, yet’ wal ha wach’ilal hach Mamin."},{"id":6,"tag":null,"isDisplayed":null,"text":" Kaw ij el wal smasnil maysch’olnilal, sek wach’ hachnhej tzin ha k’anlb’ej."},{"id":0,"tag":1,"isDisplayed":null,"text":"B’on hach hin Cristo, icha hach wali, kaw ak’ wal wip yet’ wal hepalil. Kotnh a satcha’anh hach hin wach’ Kolmal, icha helxi ixta oj waji"}]},{"id":115,"title":"Ha Yik X'ilchj Wal Hin Jesús","guid":"5n9oc2F5d0uJBlAI1EzYkg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"115    Ha Yik X'ilchj Wal Hin Jesús\n \nEl Encuentro Con Jesús"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 1:40-50; Lc. 24:14-32; Jn. 9:18-25\n \n …Yik wan sb’eyi, ix chan sb’a yet’ Felipe ix yal Jesús ha a ixtik: ochnh hin kuywumok, xchi ha a. Jn. 1:43</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Ha yik x'ilchj wal Jesús wu'uj, kaw mayskh'olnil yilx hin b'eyb'al. Kaw wal tu wilx yet' wal hin mul, Jesucristo hin yak' niwnk'ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha yik x'ilchj wal hin Jesús, kaw wal matz sat hin k'ojol. Yujto ay hin tzaljk'ojlal, yuj cha may wal b'a'nh oj wakkani."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Kaw ix ilchj junk'ojlal wu'uj, ha wal tz'a'n sniwnal hin k'ojol. May aj tzchax junk'ojlal wu'uj, haxnhej kusk'ojlal ix ilchj wu'uj."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha yik x'ilchj wal hin Jesús, kaw wal matz sat hin k'ojol. Yujto ay hin tzaljk'ojlal, yuj cha may wal b'a'nh oj wakkani."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Kaw wal tzin b'itnej hin Kolmal, yujto hin skol a skal hin mul. Ha wal schik'il hin mann eli, tzin b'itnej Dios yuj wal schamk'ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha yik x'ilchj wal hin Jesús, kaw wal matz sat hin k'ojol. Yujto ay hin tzaljk'ojlal, yuj cha may wal b'a'nh oj wakkani."}]},{"id":116,"title":"Icha Sakk'inl Yaj Cristo","guid":"rBv2Kj6nEUOWdimmOb8R/w","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"116      Icha Sakk'inl Yaj Cristo\n \nH. D. G. # 200. Nítido Rayo Por Cristo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 19:1-14; Jos. 1:5-9; Sal. 1:1-6; Ecl. 12:1\n \n Ix yaln pax Jesús ixtk a skal heb’ anma cha: Han tik, icha sakk’inl waj a heb’ anma ay a yol yib’nhk’inl tik.   Jn. 8:12</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Ha Cristo icha sakk’inal,ixta wal tzin aji. Yiklum tzin nib’j tzwutj hin b’a jun, yet’ wal hin tzaljk’ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal wach' snab'en Dios, tzonh schamk'ojlej wal ki Cristo. Yuj cha kaw tzonh b'itnek, yujto ix o'ch sk'ojl aynhek."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Tznib'j Dios to wach' ki b'eyb'alek, yik unn anmanhek to. Smasnil k’inal tzki chamk’ojlej, tzki b’on icha tznib’ej."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal wach' snab'en Dios, tzonh schamk'ojlej wal ki Cristo. Yuj cha kaw tzonh b'itnek, yujto ix o'ch sk'ojl aynhek."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Icha sakk’inal kajk yuj Dios, wal a skal k’ik’k’inal. Kaw tzki ch’oxk el sakk’inlal Dios, a skal heb’ satnkto."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal wach' snab'en Dios, tzonh schamk'ojlej wal ki Cristo. Yuj cha kaw tzonh b'itnek, yujto ix o'ch sk'ojl aynhek."},{"id":5,"tag":null,"isDisplayed":null,"text":"4      Ix sb’o Jesús jun b’e aynhek,sek wach’ tzonh k’ochk yet’ok. Heb’ chab’il xo Cristo yu’uj, kaw wal oj k’och heb’ ta'."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal wach' snab'en Dios, tzonh schamk'ojlej wal ki Cristo. Yuj cha kaw tzonh b'itnek, yujto ix o'ch sk'ojl aynhek."}]},{"id":117,"title":"Ix Jaw Cristo A Hin Pixan","guid":"9jbeEEy4FUKX4kZxpybzcA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"117  Ix Jaw Cristo A Hin Pixan \n \nC. S. G. # 337  El Vino A Mi Corazón"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>2 Cor. 5:11-21; Gá. 1:11-24; Ro. 8:11-23\n \n …Hatn jun tik x’ajx kojkokek eli, to ha Cristo kajn och a he pixn junjn  hex ket’ honh.   Col.1:27</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kaw yel til wal swach'il yik ix jelmj hinnab'en, yuj x'och Jesús a hin pixan."},{"id":3,"tag":null,"isDisplayed":null,"text":" Smasnil kusk'ojlal tzwab' a pekti' ix lajwi, a yik ix jaw a hin pixan."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ix jaw Cristo a hin pixan, ix jaw Cristo a hin pixan. Til wal tzaljk'ojlal yujto kaw ay hin k'inal, yik xjaw Cristo a hin pixan."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Manhx tzak yal hin k'ojol tzin at a skal tu'al,ix wixtj hin b'a yuj a yalanh. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Hax hin Cristo ix suksatk hin mul a wib'anh, a yik ix jaw a hin pixan."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ix jaw Cristo a hin pixan, ix jaw Cristo a hin pixan. Til wal tzaljk'ojlal yujto kaw ay hin k'inal, yik xjaw Cristo a hin pixan."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Manhxanhej chab'k'ojlal a hin Kolmal Jesús,kaw manhxa yowl Dios a wib'anh. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Junk'ojlal tzin ilji yuj skuynb'il hin Jesús, a yik ix jaw a hin pixan."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ix jaw Cristo a hin pixan, ix jaw Cristo a hin pixan. Til wal tzaljk'ojlal yujto kaw ay hin k'inal, yik xjaw Cristo a hin pixan."}]},{"id":118,"title":"¡Kaw Wach' Hin B'eyk' Yet' Cristo!","guid":"tejWR/IjKUuiR81sxwcwbw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"118  ¡Kaw Wach' Hin B'eyk' Yet' Cristo!\n \nV. C. # 178 ¡Cuán Dulce Es Andar Con Cristo!"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 91: 1-7; Heb. 12:1-4; Is. 42:16 \n \nKaw kannheknhej wet’ok.  Hanxo tik, oj hin kannhj pax he yet’ok. Jn. 15:4</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    ¡Kaw wach' ton yik tzin b'eyk' yet' Cristo! Kaw tzin b'eyk' yet' jichk'ojlal."},{"id":3,"tag":null,"isDisplayed":null,"text":" Ha wal yet' Jesús kaw tzin b'eyk'i, jun waj yet' a junjn k'u."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tza'n hin nhej yuj Jesús, yuj wal hin jichk'ojlal. Kaw yel jun tza'n hinnhej, junxnhej waj yet' Cristo."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Wach' junxnhej waj yet' Jesucristo, ayk' yipalil ton wet’ok. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Tiknek kaw may tas wach' tzin xib'tni, yalnhej aj wal ayn ek’i."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tza'n hin nhej yuj Jesús, yuj wal hin jichk'ojlal. Kaw yel jun tza'n hinnhej, junxnhej waj yet' Cristo."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Kaw tzin b'eyk' wal het' Jesucristo, tza'n hinnhej wal hoj Mamin."},{"id":5,"tag":null,"isDisplayed":null,"text":" kaw may wal junk tas tztak' hin xib’tni, yik tza'n hinnhej wal ho’oj."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tza'n hin nhej yuj Jesús, yuj wal hin jichk'ojlal. Kaw yel jun tza'n hinnhej, junxnhej waj yet' Cristo."},{"id":5,"tag":null,"isDisplayed":null,"text":"4      Tza'n hin ton wal yuj Jesucristo, wach'xam oj jawk hin chamel."},{"id":6,"tag":null,"isDisplayed":null,"text":" Ix sch'ox Jesús aj tzin b'ey wal jun, yuj ix cham a spenk kulus."},{"id":0,"tag":1,"
