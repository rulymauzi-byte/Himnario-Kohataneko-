null,"isDisplayed":null,"text":"Ha tzch'oxni tas wal kilxek yet’ ajtil oj ki k’ochek."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Ha tz’i’n el ki chab’k’ojlal, junjn k’u tzonh stench wa’an. Ha tzch’oxn ajtil tzonh b’eyi, tzya’n pax yip ki jichk’ojlal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Tzya’n kojkok el schamk’ojlal, wal ki wach’ Kolmal Jesús."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Ha smasnil tas tzyal aynhek, ha a snab'en Dios kotnak. Tzyak’ ste’nal ki nab’enek, yik ay ki kusk’ojlalek. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Tzonh skuyk ki te’wtzan ki b’a, sek manhxtzak ochki mulek."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Yuj tas tz'ib'b'il kan a ch'anh, ix kojkank el ki Kolmal. Kaw wal may ki wach’lek jun, palta honh ya’k niwnk'ojlal. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Ha wal spaxti ki Mam Dios kaw wal yel xo niwn ye’lchi."}]},{"id":248,"title":"Ha Spaxti Dios Tzalx Eli","guid":"vMQR+L1A/kyHXp9XuhszBA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"248  Ha Spaxti Dios Tzalx Eli\n \nV.C. A. # 185 La Palabra Hoy Sembrada"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mt. 13:1-9, 18-23 \n \nTzin mol ha paxti a hin nab’en, sek matz och hin mul ayach. Sal. 119: 11</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Ha wal ha paxti hach Mamin, kan kab'nhej a hin pixan."},{"id":3,"tag":null,"isDisplayed":null,"text":" K’ib’ kab’ wal hin nab’en yu’uj, sek kaw wal ma tz’och hin mul."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tzaljk’ojlal tzin satni yuj wal ha paxti', tzaljk’ojlal tzin satni yuj wal ha paxti'."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ha a paxti icha inhat, kan kab’ wal a hin pixan."},{"id":4,"tag":null,"isDisplayed":null,"text":" Manh ha cha jawk win ajk’ojol, yik tzyi’n el a hin nab’en."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tzaljk’ojlal tzin satni yuj wal ha paxti', tzaljk’ojlal tzin satni yuj wal ha paxti'."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ak’ k’ib' ha wach’k’ojlal ayin, sek tzin ch’ox ha chamk’ojlal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ma'oj satkn el yuj te k’i'ix, tzk’ib' a skal hatn ilk'ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tzaljk’ojlal tzin satni yuj wal ha paxti', tzaljk’ojlal tzin satni yuj wal ha paxti'."},{"id":5,"tag":null,"isDisplayed":null,"text":"4    K’ib' tzej wal ki jelnal yuj ha paxti tzki jolmej tiknek. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Yik wach' oj kal wal jun kolnb'il, a smasnil anma satnak."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tzaljk’ojlal tzin satni yuj wal ha paxti', tzaljk’ojlal tzin satni yuj wal ha paxti'."},{"id":6,"tag":null,"isDisplayed":null,"text":"5      Kawkek spaxti ki Mam Dios a chamk'ojlal yet’ emmkilal. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Sek kaw oj ki chak wal spak jun, yik oj ki k’ochk yet’ Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tzaljk’ojlal tzin satni yuj wal ha paxti', tzaljk’ojlal tzin satni yuj wal ha paxti'."}]},{"id":249,"title":"Ix Wab' Spaxti Wajlil","guid":"D2nS12G2fkmdhDMkc29UwA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"249 Ix Wab' Spaxti Wajlil \n \nC. S. G. # 281. La Palabra Del Señor"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>2 Ti. 4:1-5; 1 Ti. 4:11-16; 1 Co. 2:1-7 \n \nKaw tzall spaxti Dios a skal heb’ anma’. Toxnhej tznib’j heb’ yab’i’, toxnhej ma’ay, palta kaw tzallnhej, kaw tza montj heb’...   2 Ti. 4:2</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Ha wal spaxti ki Mam Dios, kalk eli, kalk eli. Ka’k wal ip ki leslwi, tzkalnek el spaxti Dios. "},{"id":3,"tag":null,"isDisplayed":null,"text":"A smasnil heb’ satnhk to, kalk el wal xchamk’ojlal Dios, ha wal yipal ki komal, kalk eli, kalk eli."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Ch’oxnb’il wal yaj Kajlil, b’eylb’ej wal sb’eylb’al, emmkilal, yet chamk’ojlal, b’eylb'ej, b’eylb’ej.  "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha wal ste’nal a lesal, yet’ sniwnk’ojlal wal Kajlil. Swach’k’ojlal yet' schamk’ojlal, b’eylb’ej, b’eylb’ej."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ha wal sjawmb’il wal Kajlil, kaw tanhwej, kaw tanhwej. Kaw yajnhej wal oj jawok, kaw tanhwej, kaw tanhwej. "},{"id":5,"tag":null,"isDisplayed":null,"text":"yujto schekb’ hach wal kajlil, munljanh yet’ jichk’ojlal Toto tzawej ja cha spak, kaw tanhwej, kaw tanhwej."}]},{"id":250,"title":"Kaw Wal Yel Tzyal Spaxti'","guid":"nQk8x9sJAEqZM32xOK7hDQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"250   Kaw Wal Yel Tzyal Spaxti'\n \nLluvias # 221 Su Palabra Es Tan Fiel"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>1 P. 1:24-25; Mt. 24:35; Sal. 19:7-10 \n \nPalta hax spaxti Kajlilek, ayk’nhej a jun ejmnhej. 1 P. 1: 25</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Kaw wal yel tzyal spaxti ki Mam Dios aykni, a yol Biblia aj tzkilk elt wal b'i'an. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Tz'ichmax smasnil tas ay a yolyib'nhk'inl tik, hal spaxti Dios may wal b'a'nh tz'ichmaxi’."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha jun paxti tik chi icha yalchab', satchanhil paxti wal yik Dios aykn ayonh. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Wach'xam ay yailal, wach'xam ay ajk'ojol, ayk' spaxti ki Mam Dios wal ki te’nalok."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Ha mach ha jun paxti tik aj tzya'ch schikin, tzlajw cha tzy’an och wal a sk'ojol. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yelk'ojlal wal tztojlb'i sb'eyb'al yu'uj, kaw oj te’nb’ok pax wal heb’ yet’ sjichk'ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha jun paxti tik chi icha yalchab', satchanhil paxti wal yik Dios aykn ayonh. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Wach'xam ay yailal, wach'xam ay ajk'ojol, ayk' spaxti ki Mam Dios wal ki te’nalok."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Kojxnhej spaxti Dios tzka'k och yipk ki k'ojol, yik tzjaw yailal wal a kib’anh. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ha spaxti ki Mam Dios tz’a’n ki jichk'ojlal, yujto yel tas tz’ib’ilkan wal a spaxti’."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha jun paxti tik chi icha yalchab', satchanhil paxti wal yik Dios aykn ayonh. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Wach'xam ay yailal, wach'xam ay ajk'ojol, ayk' spaxti ki Mam Dios wal ki te’nalok."}]},{"id":251,"title":"Kuyn Wal Mamin","guid":"f8YGMXyb/067hlRZ4srP+Q","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"251 Kuyn Wal Mamin  \n \nB. B. D. # 87."},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 16:13; Sal. 19. \n \nHat a yik oj jawk Yespíritu Dios kaw yel, hat oj a’nk nachjk el samasnil tas yel he yu’uj. Jn. 16:13</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Tzin ha kuy wal hach Mamin, a jun b'e kaw yel tojol. Sek wach' kaw matz hin xiwi, tzin b’on icha tza nib’ej."},{"id":0,"tag":1,"isDisplayed":null,"text":"Mamin, Mamin, tzin ha kuy ha a paxti’. Tzin ha ch'ox wal a swach'il, tzin nib'j to kaw yiklum hin."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Tzin ha kuy hach hin Diosal, ya' sb'a mantzak hin chami. Sek oj hin b’o tza nib’ej, a yol yib'nhk'inl tik."},{"id":0,"tag":1,"isDisplayed":null,"text":"Mamin, Mamin, tzin ha kuy ha a paxti’. Tzin ha ch'ox wal a swach'il, tzin nib'j to kaw yiklum hin."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Yik hach hin chan Wajlilok, ix hin chaj wal hin k’inal. Yik oj jawk hin yailal, kaw tzach wa’ch yipk hin k’ojol."},{"id":0,"tag":1,"isDisplayed":null,"text":"Mamin, Mamin, tzin ha kuy ha a paxti’. Tzin ha ch'ox wal a swach'il, tzin nib'j to kaw yiklum hin."}]},{"id":252,"title":"Sakk’inl Yaj Ha Paxti Ayin","guid":"NxJfu3Ac+EyUlnFgpkLVeA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"252 Sakk’inl Yaj Ha Paxti Ayin\n \nC. S. G. # 268. Lámpara Es A Mis PiesTu Palabra"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 119: 97-105; Pr. 6:16-23; Sal. 19 \n \nHa a paxti’, ha sakk’inl yaj a wojltak icha yok junk kantil, a tz’a’n sakk’inl a yol hin b’e aj tzin b’eyi. Sal. 119:105</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ha a paxti sakk’inl yaj aj tzin b'eyi, ha a paxti sakk’inl yaj aj tzin b'eyi."},{"id":3,"tag":null,"isDisplayed":null,"text":" Ha a paxti sakk'inl yaj aj tzin b'eyi, kaw ha tz'a'n sakk’inl wal a yol hin b'e."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Ha yik tzki kuyn ha paxti tzyak' sakk’inal,ha yik tzki kuyn ha paxti tzyak' sakk’inal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha yik tzki kuyn ha paxti tzyak' sakk’inal, tzyak' jawk snab'en heb' anma may snab'en."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ayk'nhej ha paxti Mamin may tz'aj sjelmji, ayk'nhej ha paxti Mamin may tz'aj sjelmji."},{"id":5,"tag":null,"isDisplayed":null,"text":" Ayk'nhej ha paxti Mamin may tz'aj sjelmji, kaw may tz'aj sjelmj wal a smasnil k’inal."}]},{"id":253,"title":"Tzaljk'ojlal Yik Win Tzb'ey A Stojlal","guid":"V/6HoZbPiES57Wwf0nzg1g","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"253  Tzaljk'ojlal Yik Win Tzb'ey A Stojlal\n \nC. S. G. # 589 Dicha Grande Es La Del Hombre"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal.1; 17:1-8;  119:43-56 \n \nKaw wach’ yik heb’ matz tzyiklni tas tzyal heb’  tu snab’en. Ha yik heb’, to tzchamk’ojlej heb’ sley Jehová. Sal. 1:1-2.</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Kaw wal wach’ yik jun anma’, to tzb’ey wal a stojlal yet’ a swach’il. Tzyij el sb'a wal a skal heb' ajmul, matz b’o win wal maysch'olnilal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Matz chaj yab' yik heb' a'm k'ojol, yik maysch'olnil tzyal eb' ha a. Yajnhej tzyakkan heb' b'uchwjum, yet' heb' may tz'och jab'ok Dios a sat."},{"id":3,"tag":null,"isDisplayed":null,"text":" 2      Til wal tzaljk'ojlal ay a spixan, yuj wal spaxti ki Mam Dios jun. A smasnil k'u, a smasnil ak'wal, aych snab'en a scheknb'il Dios. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Icha junk te te’ tzk'ib' a sti ha', smasnil k’inal kaw yax xi'il. Til wal sat tzyak' a smasnil k'inal, jun te tik may aj oj takjok."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ha smasnil tas oj sb'o jun wink tik, wach' oj aj yuj swach'k'ojlal Dios. Hax heb’ anma mayscholnli sb’eyb’al, kaw oj yab’ ton wal heb’ sya’il. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ha Dios tz’iln smasnil wal heb’ yiko, ayk’nhej yet’ wal ha aj tz’ek’ heb.’ Smasnil heb’ maysch’olnil sb’eyb’al tik, oj k’ochkn heb’ smasnil a skal k’ak’."}]},{"id":254,"title":"Tzalj Hin K'ojol  Yik Tzwiln Spaxti Dios","guid":"dhbshdIREESi7WrnV6iUMA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"254   Tzalj Hin K'ojol  Yik Tzwiln Spaxti Dios\n \nC. S G. #575. Gozo Me Da La Palabra Leer"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 10:11-18; Sal. 119:97-105; 2 Ti. 3:14-4:8  \n \nHa yik tzaln ha paxti ayin, kaw xin chajnhej wab’i, hanhj aych hin tzalk’ojlalok, yujto hek hin. Jer. 15:16</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kaw tzin tzalji yik tzwiln wal spaxti Dios. Spaxti Dios tz’ibb’il kan ha ch’anh hu’unh,"},{"id":3,"tag":null,"isDisplayed":null,"text":" kaw wach' jun paxti tik yik hin Kolmal, niwn schamk'ojlal a smasnil heb' unin."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yet' tzaljk'ojlal kaw wal tzin b'itni, A hin Kolmal hin wach' Ilmal. A spenk kulus ix cham wal wu'uj. Kaw yel ix cham wu'uj."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Yuj schamk'ojlal Jesús ix cham wu'uj. Kaw ay schamk'ojlal wal a heb' unin. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Chajek kot wal smasnil heb' unn ayin, sek oj kolchjok kan el heb', xchi Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yet' tzaljk'ojlal kaw wal tzin b'itni, A hin Kolmal hin wach' Ilmal. A spenk kulus ix cham wal wu'uj. Kaw yel ix cham wu'uj."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Toto ay mach oj k'anb'nok tas wojtak,chaj Jesús ha Kolmalok hach ajmul. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yuj spaxti ki Mam Dios ayk' wal het'ok, Tzojkej el schamk'ojlal Jesús ayach."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yet' tzaljk'ojlal kaw wal tzin b'itni, A hin Kolmal hin wach' Ilmal. A spenk kulus ix cham wal wu'uj. Kaw yel ix cham wu'uj."}]},{"id":255,"title":"Wach’ Paxti Yik K’inal","guid":"MUWCcfipAEahjX0UMSmnNw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"255  Wach’ Paxti Yik K’inal\n \nC. S. G. # 280 Bellas Palabras De Vida"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 6:63-69; Sal. 119:161-168; Sal. 119:129-135\n \n Ha jun tzo’nh paxti xwal ayx tik, kaw yel yik Yespíritu Dios. Jn 6: 63</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      B'itnejk jun ejm xo wab’i, jun kaw wach' Paxti yik k'inal. Tzaljk’ojlal to tzchax kuj ha a, jun kaw wach' Paxti yik k'inal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ha tzonh ch'oxn a sb'e Cristo, yik tzonh k'och a satcha'anh."},{"id":0,"tag":1,"isDisplayed":null,"text":"Til wal swach'il, til wal swach'il, kaw yel xo wach' Paxti yik k’inal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Til wal swach'il, til wal swach'il; jun kaw wach’ Paxti yik k'inal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      To tzyak' Cristo aynhek smasnil,jun kaw wach' Paxti yik k'inal. Hach anma, ab’ wal si’mb’il, jun kaw wach’ Paxti yikk’inal, "},{"id":4,"tag":null,"isDisplayed":null,"text":"oj ha kolchj kan el yu’uj, tzach yi’n at a satcha’anh."},{"id":0,"tag":1,"isDisplayed":null,"text":"Til wal swach'il, til wal swach'il, kaw yel xo wach' Paxti yik k’inal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Til wal swach'il, til wal swach'il; jun kaw wach’ Paxti yik k'inal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Kaw tzaljk’olal yik oj och b’it, jun kaw wach' Paxti yik k'inal. Oj ajxok niwnk'ojlal ha mul, jun kaw wach' Paxti yik k'inal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Cristo tztak’ wal hach skolni, tzyak’ wal jun ak’ k’inl ayach."},{"id":0,"tag":1,"isDisplayed":null,"text":"Til wal swach'il, til wal swach'il, kaw yel xo wach' Paxti yik k’inal. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Til wal swach'il, til wal swach'il; jun kaw wach’ Paxti yik k'inal."}]},{"id":256,"title":"Yel Tzyal Spaxti Dios","guid":"89LuxWvit0iZ/nNkgeD6nQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"256 Yel Tzyal Spaxti Dios\n \nV. C. # 226. Lámpara Fiel"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 119:105-112; 2 Ti. 3:15-17 \n \nHa a paxti’, ha sakk’iln yaj a wojltak icha yok junk kantil, ha tz’a’n sakk’inl a yol hin b’e aj tzin b’eyi. Sal 119:105</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1       Kaw yel ton tzyal ha paxti jun, hach ki Kolmal Jesús. Kaw tzonh sch'ox wal a swach'ilal, yet' pax a junk’ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw (ha a paxti') wal yel tzyal (sak k'inl yaji) ha paxti', (kaw yel tzyala,) hach ki Dios. (tzjak hin nab'en.) "},{"id":3,"tag":null,"isDisplayed":null,"text":"A satcha’anh, (ha a paxti',) tzonh yij at ha paxti'. (kaw tzin sch'ox wal ha jun b'e yik satchanh, ha aj ay ki Mam Dios.) "},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Ha spaxti Dios ki k’inl yaji, yel satchanhil paxti’. Ha ch’anh tzpaxtin wal aynhek jun, icha tzib’j wal ki Dios."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw (ha a paxti') wal yel tzyal (sak k'inl yaji) ha paxti', (kaw yel tzyala,) hach ki Dios. (tzjak hin nab'en.) "},{"id":4,"tag":null,"isDisplayed":null,"text":"A satcha’anh, (ha a paxti',) tzonh yij at ha paxti'. (kaw tzin sch'ox wal ha jun b'e yik satchanh, ha aj ay ki Mam Dios.) "},{"id":4,"tag":null,"isDisplayed":null,"text":"3       Ha spaxti Dios tzyak' ki nab'en, icha snib’b’en Kajlil. Ha tztak' sb'on wal ki b'eyb'alek, a skal maysch’olnilal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw (ha a paxti') wal yel tzyal (sak k'inl yaji) ha paxti', (kaw yel tzyala,) hach ki Dios. (tzjak hin nab'en.) "},{"id":5,"tag":null,"isDisplayed":null,"text":"A satcha’anh, (ha a paxti',) tzonh yij at ha paxti'. (kaw tzin sch'ox wal ha jun b'e yik satchanh, ha aj ay ki Mam Dios.) "},{"id":5,"tag":null,"isDisplayed":null,"text":"4       Ha spaxti Dios tz’a’n ki jelnal, yujto ha tzonh kuynek. Sek manhxtzak och ki mulk a Dios, a yolyib’nhk’inl tik."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw (ha a paxti') wal yel tzyal (sak k'inl yaji) ha paxti', (kaw yel tzyala,) hach ki Dios. (tzjak hin nab'en.) "},{"id":6,"tag":null,"isDisplayed":null,"text":"A satcha’anh, (ha a paxti',) tzonh yij at ha paxti'. (kaw tzin sch'ox wal ha jun b'e yik satchanh, ha aj ay ki Mam Dios.) "}]},{"id":257,"title":"Ha Dios Tzyak’ Yajlil","guid":"JewLETwPgE+LDOQ7ipgGmw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"257   Ha Dios Tzyak’ Yajlil\n \nC. S. G. # 42 Reina Dios"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal.93; 96; Ap. 11:15-17 \n \nTil wal sja’l  yilxi yik tzajw junk win halm ab’x a heb’ lum tzalktak…hatn yab’xil junk’ojlal tzyaln el yab’xil kolnb’il. Is. 52:7</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Kaw tzaljk'ojlal yik heb' tzaln el yab'xil tiknek, yab'xil kolnb’il tzyak’ Dios. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Tzyall heb' yab'xil tzaljk’ojlal yet’ wal kolnb'il. ¡Tzyak' Yajlil! ¡Ki Mam Dios!"},{"id":0,"tag":1,"isDisplayed":null,"text":"¡Tzyak’ Yajlil! ¡Ki Mam Dios! ¡Tzyak' Yajlil! ¡Ki Diosal, ki Mam Dios!"},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Yuj wal ki mul kaw k’ixweltak ix aj yilxi,kaw o’ltak x'aj schami. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ix yab' syail, palta may xon tas ix yala. ¡Yuj smann kan, ki kolnb’il!"},{"id":0,"tag":1,"isDisplayed":null,"text":"¡Tzyak’ Yajlil! ¡Ki Mam Dios! ¡Tzyak' Yajlil! ¡Ki Diosal, ki Mam Dios!"},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Ha Jesucristo ix kan chaml a yalnh yu’uj, ix pitzw pax Kajlil. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw ayk’ yet’ ki Mam Dios tiknek a satcha’anh. ¡Tzonh tzalji, kaw pitzan!"},{"id":0,"tag":1,"isDisplayed":null,"text":"¡Tzyak’ Yajlil! ¡Ki Mam Dios! ¡Tzyak' Yajlil! ¡Ki Diosal, ki Mam Dios!"}]},{"id":258,"title":"Ha Jesús Kajlilek","guid":"ONtM1+4RfUyMUtMF+iCLtQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"258  Ha Jesús Kajlilek\n \nC. S. G. # 542 Cristo Nuestro Jefe"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ef. 3:14-21; Ro. 8:28-39; I Cor. 15:51-58\n \n …Ha Kajlilek, hatn ki Diosalek, kaw kojxni, smasnil tas tzta’nhj yu’uj. Ap. 4:8 </f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Ha ki wach' Kolmalek kajlilek toni, kaw wal manh hex xiwok xchi Jesús aynek. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Wach'xam kaw oj kab'k syal yuj ki wach' Kolmal, ka'k wal ip ki atk yet'ok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw och koyk tza'n yuj ki wach' Kolmal, och koyk tzak'an, kaw ma tzonh xiwek. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Och koyk tzak'an tzki b'itnejek sb'i, kaw oj ki k'ochk yet' a satcha'anh."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Kaw tzki ch’oxk el ki b’eyb’al aj tzonh b'eyk'i,ki ch’oxk el yipal a smasnil heb’ anma'. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Smasnil maysch’olnil kaw kannk a yalnh yu’uj, ka'k wal ip ki atk yet'ok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw och koyk tza'n yuj ki wach' Kolmal, och koyk tzak'an, kaw ma tzonh xiwek. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Och koyk tzak'an tzki b'itnejek sb'i, kaw oj ki k'ochk yet' a satcha'anh."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Ka'k wal ip ki atk yet' ki kolmal Jesús,sek wach' oj ki k'ochk wal yet' a satcha'anh. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Tzaljk'ojlal oj ki b'itnek a ki Kolmal, ka'k wal ip ki atk yet'ok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw och koyk tza'n yuj ki wach' Kolmal, och koyk tzak'an, kaw ma tzonh xiwek. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Och koyk tzak'an tzki b'itnejek sb'i, kaw oj ki k'ochk yet' a satcha'anh."}]},{"id":259,"title":"Hek Hin Xo Jesús","guid":"y0PQw7wvTkmOyBo5Z/VICg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"259  Hek Hin Xo Jesús\n \nB. B. D. # 54 Himnos De Gloria # 75"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>2 Cor. 6:18; Jn. 17:1-26; 2 Cor. 5:14 \n \nOj woch he Mamok.  Hax he yo ch wunnalok, wislok… xchi Kajlilek. 2 Cor. 6:18</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1       Hek hin xo Jesús, ix wab' ton hab'xil, yuj ha chamk'ojlal wal ayin. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Yuj wal cha kaw tzin nib'j tzwab' ha paxti', sek tzin k’och kajn ha a tz’ey."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj hin at wal het’ hach hin Kolmal, toxnhej oj wab’ syal ho’oj. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Oj hin b’o icha wal tas tza nib’j ayin, hach hin Diosal wilmal hach."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Tzin och tza'n het’ok tzin b’on hin nab’en,yuj ha chamk’ojlal wal ayin."},{"id":4,"tag":null,"isDisplayed":null,"text":" Yuj wal cha Mamin tzwak’ hin pixn ayach, yik tzin och wal ha chekb’ok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj hin at wal het’ hach hin Kolmal, toxnhej oj wab’ syal ho’oj. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Oj hin b’o icha wal tas tza nib’j ayin, hach hin Diosal wilmal hach."},{"id":4,"tag":null,"isDisplayed":null,"text":"3        Kaw wal manhxa yalnb'il ha wach'k'ojlal,yujto junxnhej wal waj het’ok. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yik tzin leslwi, tzab’ wal hin lesal, junjn k’u tzab’ tas tzwala."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj hin at wal het’ hach hin Kolmal, toxnhej oj wab’ syal ho’oj. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Oj hin b’o icha wal tas tza nib’j ayin, hach hin Diosal wilmal hach."},{"id":5,"tag":null,"isDisplayed":null,"text":"4       Ha a chamk’ojlal matz nachj e’lch wu’uj, yujto kaw wal manhx halchjb’enok."},{"id":6,"tag":null,"isDisplayed":null,"text":" Masnto yik oj hin k’och het’ Jesús, hax hin wach’ ojtkan eli."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj hin at wal het’ hach hin Kolmal, toxnhej oj wab’ syal ho’oj."},{"id":7,"tag":null,"isDisplayed":null,"text":" Oj hin b’o icha wal tas tza nib’j ayin, hach hin Diosal wilmal hach."}]},{"id":260,"title":"Iltek Cristo Yajl Yaji","guid":"C3y2oJzzO0iiVonkf16pOA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"260  Iltek Cristo Yajl Yaji \n \nC. S G. # 240 Coronadle"},{"id":2,"tag":null,"isDisplayed":null,"text":"<fMicrosoft Himalaya>Hch. 2:29-36; Ap. 5; Heb. 2:1-9 \n \n...Yuj wal swach’k’ojlal Dios, x’el a sk’ojol, scham Jesús kujek ki masnil. Heb. 2:9</f>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1   Iltek Cristo Yajl yaji, ix yak' lajwok maysch’olnil. Yuj ix cham a te kulus ix, xyak' lajwok maysch'olnilal."},{"id":0,"tag":1,"isDisplayed":null,"text":"B'itjek Cristo hex kolb'il xo, hatn Syajlil yaj a heb' yajal. B'itjek Cristo hex kolb'il xo, b'itjek Cristo ki Kolmal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Ki’k wal chanh sb'i ki wach’ Kolmal,yuj to kaw wal wach' aynhek. Jesucristo ya'jnak techjok, yuj cha Yajl yaj tiknek"},{"id":0,"tag":1,"isDisplayed":null,"text":"B'itjek Cristo hex kolb'il xo, hatn Syajlil yaj a heb' yajal. B'itjek Cristo hex kolb'il xo, b'itjek Cristo ki Kolmal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Heb' aj mul kaw sb'uch heb' Cristo,yik ix cham a te kulus. Hax heb' ángel yet' heb' kolnb'il, ay schamk'ojlal heb' ha a."},{"id":0,"tag":1,"isDisplayed":null,"text":"B'itjek Cristo hex kolb'il xo, hatn Syajlil yaj a heb' yajal. B'itjek Cristo hex kolb'il xo, b'itjek Cristo ki Kolmal."},{"id":5,"tag":null,"isDisplayed":null,"text":"4      Makljek he yab' wal sb'itn heb',smasnil heb' kolb'ilx yu'uj. Cristo x'och Yajlok heb' yajal, kaw kojn a tzonh emk kuman."},{"id":0,"tag":1,"isDisplayed":null,"text":"B'itjek Cristo hex kolb'il xo, hatn Syajlil yaj a heb' yajal. B'itjek Cristo hex kolb'il xo, b'itjek Cristo ki Kolmal."}]},{"id":261,"title":"Ay Jun Mach Ayk' A Hin Tz'ey","guid":"m5unk16GUkCvmY7OOZdGFg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"261  Ay Jun Mach Ayk' A Hin Tz'ey\n \nA Ti Cantamos # 1   Alguien Cerca Está De Mi"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 139:7-12; Mt. 28:20; Jer. 23:23 \n \nHa a wach’ k’ab’ ha tzin ketzn cha’anh,  tzin he’n b’eyok.  Sal. 139: 10</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Ay wal jun ayk' a hin tz'ey, hatn hin wach’ kolmal Jesús. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ay wal jun ayk'i, ay wal jun ayk'i, hatn hin wach’ Kolmal Jesús."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Kajn och wal a hin pixan,kajn och wal a hin pixan. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ayk' a hin pixan, ayk’ a hin pixan; hatn hin wach’ Kolmal Jesús."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Ha Jesús hin wach’ Kolmal, xyak’ hin kolnb’il a matnil."},{"id":5,"tag":null,"isDisplayed":null,"text":" Kaw xyak’ hin kolnb’il xyak’ wal a matnil, Ha Jesús x’a’n hin kolnb’il."}]},{"id":262,"title":"Cristo Icha Nha K’e'en","guid":"5CtBdLVp7EeYeO1FEFLq2g","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"262 Cristo Icha Nha K’e'en\n \nC. S. G. # 153 Oh Cristo, Nuestra Roca Aquí"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>2 S. 22:1-7; Sal. 61; Is. 32:1-4 \n \nHach hin Diosal  ab’ wal tas tzwala, yujto tz’el waw yuj hin yailal; patzej hin lesal.  Sal. 61:1.</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Hach Cristo icha nha k’e’en, wal jun aj wach' tzki kol ki b'a."},{"id":3,"tag":null,"isDisplayed":null,"text":" Kaw wach' yik heb' tzkol sb’a ayach, wal jun aj wach’ tzki kol ki b’a."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha yik kaw k’unb’nakonh yuj maysch’olnilal. //Jesús nha k’e’en.// "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha yik kaw k’unb’nakonh yuj maysch’olnilal, wal jun aj wach’ tzki kol ki b’a."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Kaw wenhl haji, tzin ha kolni, wal jun aj wach’ ki koln ki b’a."},{"id":4,"tag":null,"isDisplayed":null,"text":" ¿Tas yuj tzonh xiw yuj tas ay smay? Cristo aj wach’ tzki kol ki b’a."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha yik kaw k’unb’nakonh yuj maysch’olnilal. //Jesús nha k’e’en."},{"id":5,"tag":null,"isDisplayed":null,"text":"// Ha yik kaw k’unb’nakonh yuj maysch’olnilal, wal jun aj wach’ tzki kol ki b’a."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Hach tzonh ha mol hach ki Kolmal, wal jun aj wach’ tzki kol ki b’a."},{"id":5,"tag":null,"isDisplayed":null,"text":" Kaw yel aych ek’ ton wal ket’ok, ha aych aj wach’ tzki kol ki b’a."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha yik kaw k’unb’nakonh yuj maysch’olnilal. //Jesús nha k’e’en."},{"id":6,"tag":null,"isDisplayed":null,"text":"// Ha yik kaw k’unb’nakonh yuj maysch’olnilal, wal jun aj wach’ tzki kol ki b’a."}]},{"id":263,"title":"Dios Oj Ha Tanhwni","guid":"aqNAntLyzkKQXOA68abP2Q","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"263  Dios Oj Ha Tanhwni\n \nC.S.G. #427 Dios Cuidará de Ti."},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>I P. 5:6-11; Sal. 37:1-11; Sal. 62:1-8 \n \nJantnhej kilk’ojlalek ka’k och a yol sk’ab’ Dios, yujto ha aych il honh yilnek.  1 P. 5:7</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Ha wal yik kaw ay ha yailal, kaw yel tzach yil ki Diosal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Manh jantkok schamk'ojlal ki Mam Dios, kaw yel tzach yil ki Dios."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw yel tzach yil ki Dios, ayk’nhej wal het' aj tzach b'eyk'i. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw yel tzach yil ki Mam Dios, may junk k'u ma tzach yila."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Toto ay aj tzjaw ha chab'k’ojlal, kaw yel tzach yil ki Diosal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Toto ay smay ajtil aych ek’i, kaw yel tzach yil ki Dios."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw yel tzach yil ki Dios, ayk’nhej wal het' aj tzach b'eyk'i. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw yel tzach yil ki Mam Dios, may junk k'u ma tzach yila."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Wach'xam tzjaw niwk yailal ayach,kaw yel tzach yil ki Diosal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Aych ek’ wal a yol sk’ab ki Mam Dios, kaw yel tanhb’ilch yu’uj"},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw yel tzach yil ki Dios, ayk’nhej wal het' aj tzach b'eyk'i. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kaw yel tzach yil ki Mam Dios, may junk k'u ma tzach yila."}]},{"id":264,"title":"Ha Jesús Hin Wach' Ilmal","guid":"rSrUlP2wyEWv60Tk3UrYsA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"264  Ha Jesús Hin Wach' Ilmal\n \nF. Y. A. # 93 Mi Pastor Es Jesús"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 23;  Jn. 10:7-21; 1 P. 2:25 \n \n Ha a yik yalanh, lajnonhk icha jun tzo’nh kalnelu puknk kan ati. Palta Hax tiknek, honh meltzjek kot a Kilmalek, hatn jun tzonh tanhwniek. 1 P. 2:25</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Hach hin Jesús kaw yel hin wach' ilmal hach, Kaw tanhb’iln ho’oj yuj cha kaw tzin tzalji. "},{"id":3,"tag":null,"isDisplayed":null,"text":"kaw yuj ix wab' ha paxti hach hin wach' Kolmal, yuj ha chamk'ojlal tzaljk'ojlal xo waji."},{"id":0,"tag":1,"isDisplayed":null,"text":"Jun hin wach' ilmal a smasnil k'inal, ha Jesús. Jun hin wach' ilmal a smasnil k'inal, ha Jesús."},{"id":4,"tag":null,"isDisplayed":null,"text":" Kaw ay schamk'ojlal ayin wach'xam to kaw may hin wach’il. Ha Jesús kaw tzin yil a junjn k'u."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Kaw tzaljk'ojlal waj a yol sk'ab' hin Diosal, kaw wal b'utn hin yuj spaxti hin wach' Kolmal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw ma'oj wi'l hin nab'en a hin wach' Kolmal, kaw tzin ha kuy wal het' a smasnil k'inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Jun hin wach' ilmal a smasnil k'inal, ha Jesús. Jun hin wach' ilmal a smasnil k'inal, ha Jesús. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw ay schamk'ojlal ayin wach'xam to kaw may hin wach’il. Ha Jesús kaw tzin yil a junjn k'u."}]},{"id":265,"title":"Ha Jesús Kaw Yel Kolwjum","guid":"+oM72p4V8ke3l9zEffB90A","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"265 Ha Jesús Kaw Yel Kolwjum\n \nC. S. G. # 342 Un Gran Salvador Es Jesús"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Is. 32:1-4; 1 P. 2:21-25; Col. 1:15-23 \n \nHa a Dios tzkot hin Kolnb’il, yuj cha ay we’lchi.  Sal. 62: 7</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Kaw wal wach’ hin Kolmal Jesús Wajlil jun. Kaw wach’ kolwjum wal ayin. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Tzin skol a skal smasnil tas kaw wal ay smay, tanhb'iln yuj a smasnil k’inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzkol hin pixn a smasnil tas kaw ay smay. Tzyij el smasnil hin b’ilk’ojlal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Xyij el hin chab’k’ojlal yuj cha kaw wojtak.\n//Kaw tzaljk’ojlal wal tzin smolo.//"},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Ha Jesús hin wach’ Kolmal ha tzin kolni,kaw niwkil hin mul xyij eli.  "},{"id":4,"tag":null,"isDisplayed":null,"text":"Tanhb'iln yuj wal schamk'ojlal hin wach’ Kolmal, kaw hin skol elt a maysch'olnil."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzkol hin pixn a smasnil tas kaw ay smay. Tzyij el smasnil hin b’ilk’ojlal."},{"id":5,"tag":null,"isDisplayed":null,"text":" Xyij el hin chab’k’ojlal yuj cha kaw wojtak.\n//Kaw tzaljk’ojlal wal tzin smolo.//"},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Kaw niwn schamk'ojlal wal Jesús tzyak' ayin,kaw niwn sjunk’ojlal yet’ swach’il. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ha wal Yespíritu Dios tzb'on hin nab'en, tzyak' hin tzaljk'ojlal may slajub'."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzkol hin pixn a smasnil tas kaw ay smay. Tzyij el smasnil hin b’ilk’ojlal. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Xyij el hin chab’k’ojlal yuj cha kaw wojtak.\n//Kaw tzaljk’ojlal wal tzin smolo.//"},{"id":5,"tag":null,"isDisplayed":null,"text":"4      Ha yik oj hin at yet’ Jesús hin Kolmal,oj hin k’och a stziktznil hin Dios. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Schamk’ojlal, swach’k’ojlal to may wal slajub’, smasnil k’inal oj hin b'itnok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzkol hin pixn a smasnil tas kaw ay smay. Tzyij el smasnil hin b’ilk’ojlal. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Xyij el hin chab’k’ojlal yuj cha kaw wojtak.\n//Kaw tzaljk’ojlal wal tzin smolo.//"}]},{"id":266,"title":"Icha Nha K’en Haj Mamin","guid":"WjUebk94W0SgVIACf5urrw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"266   Icha Nha K’en Haj Mamin\n \nC.S.G. 560 Roca De La Eternidad."},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ex. 33:11-22; Sal. 31:1-5; 1 P. 2:4-10 \n \nChaj hab’ tas tzwala, kaw koln muk’uk, wojtak icha hin nhak’en haji. Sal. 31:2</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Icha nhak’en haj Mamin, kaw hach cham wal yuj hin mul. Kojn aych tztak’ hin koln hin b’a, tz’ilchj junk’ojlal wuj ayach. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ha wal ha chik’il Jesús, ix b’ikn el smasnil hin mul."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      May junk tas wach’ tzin b’o'o, wach’xam kaw wal tzin ok’i. Kaw kojn hach tzin ha’ch wach’il, may junk mach tztak’ hin skolni. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yuj nhej wal hin jichk’ojlal, yuj wal cha hin kolchj kani."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Ya’s b’a pitzn hin to Mamin, wach’ xam to oj hin chami. Oj hin k’och a hojltak, kaw oj hin ta’wk wal hin b’i."},{"id":5,"tag":null,"isDisplayed":null,"text":" Kojn hach tztak’ hin ha kolni, icha nha k’en haj Mamin."}]},{"id":267,"title":"Kaw Hin Si’kn El Hin Diosal","guid":"RR4APzlZOkKEeTaLVkDhBA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"267  Kaw Hin Si’kn El Hin Diosal\n \nC. S. G. # 340 Escogido Fui De Dios"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ef. 1:3-14;  3:14-21; 4:17-30 \n \nYiktax mantzak b’o yolyib’nhk’inl tik, ha Dios si’jnaknhek xon yuj Cristo, sek hanhj aynhek  yiko. Ef.1:4</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Kaw hin si'kn el hin Diosal yuj wal schamk'ojlal, ha jun watut kaw wal wach' yilxi, oj hin cha swach'k'ojlal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ha yik pekti' kaw ixta yaj yaln kani, yujto ixta wal tznib’ej."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw molb'iln ton yuj hin Cristo, yuj cha tzin tzalji; hax tas ay wal a sat lum tik, may tas tztak' hin yixtni. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw pitzn hin, ay hin k'inal, yuj Cristo hin Kolmal; yujto hin si'kn el hin Dios."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Ha Yespíritu ki Mam Dios aych wal ayin,yujto kojn Jesucristo kaw tzwa'ch yipk hin k'ojol. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yuj cha wojtak to ha Cristo tz'a'n hin k'inal, sik'b'iln el yuj hin Diosal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw molb'iln ton yuj hin Cristo, yuj cha tzin tzalji; hax tas ay wal a sat lum tik, may tas tztak' hin yixtni."},{"id":5,"tag":null,"isDisplayed":null,"text":" Kaw pitzn hin, ay hin k'inal, yuj Cristo hin Kolmal; yujto hin si'kn el hin Dios."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Sik'b'iln el yuj hin Diosal yuj hin b'itnan sb'i,oj wem wokn yet' hin Kolmal, wal aj ay stziktznial. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw wal niwn tas ix yak' ayn yuj swach'k'ojlal, yujto sik'b'iln el yuj Dios."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw molb'iln ton yuj hin Cristo, yuj cha tzin tzalji; hax tas ay wal a sat lum tik, may tas tztak' hin yixtni. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kaw pitzn hin, ay hin k'inal, yuj Cristo hin Kolmal; yujto hin si'kn el hin Dios."}]},{"id":268,"title":"Kaw Wilmal Yaj Jesús","guid":"zxT14Les0E+H0wQma2tUzw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"268  Kaw Wilmal Yaj Jesús\n \nC. S. G. # 143 Jesús El Buen Pastor"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 23; Ez. 34:11-16; Heb. 13:20-25\n \n …Ha junk ilm kalnelu wach’, ay snib’b’en tzyak’ cham sb’a yuj no kalnelu cha. Jn. 10:11.</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Kaw wilmal yaj Jesús, kaw ay schamk'ojlal ayin, hin sik' elt a skal maysch'olnil. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Yet' wal sjelnal hin Dios, hin yij el a skal hin mul, kaw tzaljk'ojlal xo waj tiknek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzin tzalj yuj hin wach' Kolmal, tzin b'itnej wal schamk'ojlal jun. Kaw niwn tzaljk'ojlilal yik tzin b'itni, ochnh wet' hach hin wach' Kolmal, "},{"id":4,"tag":null,"isDisplayed":null,"text":"kaw tzin nib'j to tzak' hin jelnal, ay jun k'ual oj hin at yet' Jesús a satcha'anh."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Kaw tzin b'eyk' yet' Jesús, a jun b'e yik sakk’inal. Kaw oj lajwok jun yolyib’nhk’inl tik, kaw yik hin xo Jesús. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Oj hin b’o icha tznib’ej, manhx oj hin b’o maysch’olnil."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzin tzalj yuj hin wach' Kolmal, tzin b'itnej wal schamk'ojlal jun. Kaw niwn tzaljk'ojlilal yik tzin b'itni, ochnh wet' hach hin wach' Kolmal,"},{"id":5,"tag":null,"isDisplayed":null,"text":" kaw tzin nib'j to tzak' hin jelnal, ay jun k'ual oj hin at yet' Jesús a satcha'anh."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Ha wal a satcha'anh oj hin k'och yet' hin Jesús, smasnil k’inal oj hin b’itnok."},{"id":5,"tag":null,"isDisplayed":null,"text":" Kaw Yajl yaj tiknek, kaw kojxnhej wal ay sjelnal, kaw yel ayk' a smasnilk’inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzin tzalj yuj hin wach' Kolmal, tzin b'itnej wal schamk'ojlal jun. Kaw niwn tzaljk'ojlilal yik tzin b'itni, ochnh wet' hach hin wach' Kolmal, "},{"id":6,"tag":null,"isDisplayed":null,"text":"kaw tzin nib'j to tzak' hin jelnal, ay jun k'ual oj hin at yet' Jesús a satcha'anh."}]},{"id":269,"title":"Kojxnhej Jesús","guid":"ry/9/1rG20yCkz19ldpnCw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"269  Kojxnhej Jesús\n \nB. B. D. # 147  Solo Jesús"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Hch. 4:1-22; Sal. 118:21-29; Mt. 1:18-25\n \n May junk xo mach aj wach’ tzonh kolchjek... kojxn Jesús. Hch. 4:12</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Kojn wal a Jesucristo, yelk'ojlal oj ha nichni’. Ha wal a yolyib'nhk'inl tik, may junk xo tztak' hach skolni."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kojn Jesús, (kojn Jesús)kojn wali.(kojn wali) Kojn tztak’ hach skoln el a skal ha mul.(chaj wal Jesús)"},{"id":3,"tag":null,"isDisplayed":null,"text":" Kojn Jesús, (kojn Jesús)kojn wali.(kojn wali) Kojn oj stak’ hach skoln el a skal ha mul."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Ha mach to tzchan Jesucristo,kaw tzaljk'ojlal oj b'itnok. Yuj cha oj jawk wal snab'en b'i'an, oj kan wal a tzaljk'ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kojn Jesús, (kojn Jesús)kojn wali.(kojn wali) Kojn tztak’ hach skoln el a skal ha mul.(chaj wal Jesús)"},{"id":4,"tag":null,"isDisplayed":null,"text":" Kojn Jesús, (kojn Jesús)kojn wali.(kojn wali) Kojn oj stak’ hach skoln el a skal ha mul."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     ¿Tzam ha nib'j tzach skolkn el Cristo?¿Tzam ha nib’j sniwnk’ojlal jun? Kotanh tzach yawtj Jesucristo, yuj wal schamk'ojlal ayach."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kojn Jesús, (kojn Jesús)kojn wali.(kojn wali) Kojn tztak’ hach skoln el a skal ha mul.(chaj wal Jesús)"},{"id":5,"tag":null,"isDisplayed":null,"text":" Kojn Jesús, (kojn Jesús)kojn wali.(kojn wali) Kojn oj stak’ hach skoln el a skal ha mul."},{"id":5,"tag":null,"isDisplayed":null,"text":"4       Ak’ ha pixn a Jesucristo,sek oj ha kolchj kan wali. Toto matz ha chaj wal Cristo, ma'oj ha k'och wal yet'ok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kojn Jesús, (kojn Jesús)kojn wali.(kojn wali) Kojn tztak’ hach skoln el a skal ha mul.(chaj wal Jesús)"},{"id":6,"tag":null,"isDisplayed":null,"text":" Kojn Jesús, (kojn Jesús)kojn wali.(kojn wali) Kojn oj stak’ hach skoln el a skal ha mul."}]},{"id":270,"title":"¿Mach Junk Tztak’ Honh Yi'n Ek’ A Jesús?","guid":"K4SH2MtJE0WcrrI0NHD06Q","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"270 ¿Mach Junk Tztak’ Honh Yi'n Ek’ A Jesús?\n \nC. S. G. # 346 Del Amor Divino"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ro. 8:28-39; Ro. 5: 1-11; Sal. 91.\n \n May junk tas ch’oxni, to tzyij el Cristo schamk’ojlal aynhek.  Ro. 8:35</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1       ¿Mach wal junk oj stak' honh yi'n ek' a Jesús? May junk mach oj i'nk ek’ schamk'ojlal ayonh."},{"id":3,"tag":null,"isDisplayed":null,"text":" Kolb'ilnhek xo yuj Dios ¿tom ayt ki yail? Ha tiknek kaw yel tztew och Jesús kujek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha smasnil mach ay schamk’ojlal wal a Dios, smasnil tas tzjaw a yib’anh yuj yoch swach’lok."},{"id":3,"tag":null,"isDisplayed":null,"text":" \n2      Smasnil wal tas tz’ek’ aynhek a sat lum tik,ha Dios tz’a’n kot aynhek yuj yoch ki wach’lok."},{"id":4,"tag":null,"isDisplayed":null,"text":" Ha Dios matz honh yakkan a skal ki yail.¿Tas yuj kaw tzonh xiwk jun? Ilb'ilnhek yuj Dios."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha smasnil mach ay schamk’ojlal wal a Dios, smasnil tas tzjaw a yib’anh yuj yoch swach’lok."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Tzjaw ki yailalek, tzjaw pax ki chamlil;may ki xiwk'ojlal yujto yik honhk xo Dios."},{"id":5,"tag":null,"isDisplayed":null,"text":" May tas tzonh i'nek toto manh hok tzalni, yujto kajn och aynhek ha wal tzonh ilni."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha smasnil mach ay schamk’ojlal wal a Dios, smasnil tas tzjaw a yib’anh yuj yoch swach’lok."}]},{"id":271,"title":"Wilmal Yaj Hin Diosal","guid":"6z51tvH8+EClkK432x+TgA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"271  Wilmal Yaj Hin Diosal\n \nC. S. G. # 364 Jehová Es Mi Pastor"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 23; Jn. 10:1-15; Ez. 34:11-16 \n \nMamin Jehová wilmal haji…  Yuj cha may tas tzyak’ palta ayin. Sal. 23:1</f></i>"},{"id":3,"tag":null,"isDisplayed":null,"text":"1       Wilmal yaj wal hin Diosal, kaw tzin yil yet' schamk’ojlal, ha wal aj ay swach’ilal tzin yij b’eyok."},{"id":4,"tag":null,"isDisplayed":null,"text":" Tzaljk’ojlal wal tzin ilji, yujto kaw molb’iln yu’uj, ha jun ha yik k’inal tzyak’ ton wal ayin."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw ilb'iln yuj wal hin Kolmal, kaw may aj tzin yak kani. Oj hin b'eyk' yet' hin Kolmal, kaw aychnhej yipk hin k'ojol. "},{"id":5,"tag":null,"isDisplayed":null,"text":"May junk mach oj stak' hin yi'n ek' a hin Dios."},{"id":2,"tag":null,"isDisplayed":null,"text":"2       Ha Jesús hin wach' ilmal, kaw wal ha tz’a’n hin te’nal, kaw tzin sketz b'ey wal a jun b’e yik tojlal."},{"id":3,"tag":null,"isDisplayed":null,"text":" Ha yik ay hin yailal ha tz’a’n sniwnal hin k'ojol, ha Jesús tz’a’n junk’ojlal a hin pixan."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw ilb'iln yuj wal hin Kolmal, kaw may aj tzin yak kani. Oj hin b'eyk' yet' hin Kolmal, kaw aychnhej yipk hin k'ojol. "},{"id":4,"tag":null,"isDisplayed":null,"text":"May junk mach oj stak' hin yi'n ek' a hin Dios."},{"id":3,"tag":null,"isDisplayed":null,"text":"3       Kaw wach' snab'en hin Kolmal,kaw ay schamk'ojlal ayin. Yuj wal cha kaw ay hin tzaljk'ojlal tiknek. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Toxnhej tzin ek’ aj ay smay, kaw wal manhx tzak hin xiwi, yujto a yatut hin Mam oj hin k’ochi."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw ilb'iln yuj wal hin Kolmal, kaw may aj tzin yak kani. Oj hin b'eyk' yet' hin Kolmal, kaw aychnhej yipk hin k'ojol."},{"id":5,"tag":null,"isDisplayed":null,"text":" May junk mach oj stak' hin yi'n ek' a hin Dios."}]},{"id":272,"title":"Wilmal Yaj Jesucristo","guid":"VGedSQUhGE+xgNVkve8BQA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"272 Wilmal Yaj Jesucristo\n \nC. S. G. # 154 Cristo Cual Pastor"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 10:1-15; Sal. 23; Ez. 34:23-31\n \n Hax no kalnelu cha, k’aynk no yet’ win yilmal cha. Jn. 10:3</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Yel kilmal aj hach Jesucristo, hach tzonh hel yuj ha chamk’ojlal. Yuj cha matz honh och il yuj ki k'inal, yujto hach tzonh ha molo’. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw wal wach’ hach, Jesucristo; honh ha man yet' ha chik'il. Kaw wal wach’ hach, Jesucristo; kaw wal hek honhxo Mamin."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Hek honh xo tiknek hach Jesucristo, yuj cha kolwjanh wal ket’ok. Kaw tzel smasnil heb' honnal hach Mamin, a yolyib'nhk'inl tik."},{"id":4,"tag":null,"isDisplayed":null,"text":" Kaw wal wach’ hach, Jesucristo; ab’ wal tas tzkal hach Mamin. Kaw wal wach’ hach, Jesucristo; ab’ wal tas tzkal hach Mamin."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ix hak’ wal ha ti yik tzonh ha chani, wach’xam kaw manh ki mojok. Ha tiknek tzak' ha wach'k'ojlal ayonh, hach ton ix ha toj ki mul."},{"id":5,"tag":null,"isDisplayed":null,"text":" Kaw wal wach’ hach, Jesucristo; tzach ki sayk’ wal hach Mamin. Kaw wal wach’ hach, Jesucristo; tzach ki sayk’ wal hach Mamin."},{"id":5,"tag":null,"isDisplayed":null,"text":"4      Hach Kilmal kaw wal tzach ki sayk'i, yik tzki k'ann wal ha kolwal. A’nh k’ib’ yet’ wal ha chamk'ojlal Mamin, yik tzonh leslwi ayach."},{"id":6,"tag":null,"isDisplayed":null,"text":" Kaw wal wach’ hach, Jesucristo; may b’anh tzlajw ha chamk’ojlal. Kaw wal wach’ hach, Jesucristo; may b’a’nh tzlajw ha chamk’ojlal."}]},{"id":273,"title":"Kaw Tzaljk'ojlal Xo Waji","guid":"a8WejXzQ4EKjur5XOeW/EA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"273  Kaw Tzaljk'ojlal Xo Waji\n \nC. S. G. # 361 Grande Gozo Hay En Mi Alma"},{"id":3,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>2 Cor. 4:5-16; Gá. 5:16-25; Ro. 5:1-11 \n</f></i> \n<i><fMicrosoft Himalaya>Ha a jun ak’wl cha, ix sb’ikn el win schik’l spatkil heb’ aj xlajwi. Xlajw cha xya’n win ajxk bautizar sb’a yet’ heb’ jun  yaj yet’ a yol yatut cha. Hch. 16:33</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ha tiknek tzaljk'ojlal xo waji,  yujto ayk' Jesús wet’ok. Ha sjunk'ojlal tz’a’n hin tzaljk’ojlal, wal a smasnil k'inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzaljk'ojlal xo waj yuj Jesús, (tzaljk'ojlal xo waj tiknek, yuj hin wach' Kolmal Jesús,) smasnil k'inal ay hin tzaljk'ojlal. (kaw wal 'ay hin tzaljc'ojlal.) "},{"id":3,"tag":null,"isDisplayed":null,"text":"Yujto xwa'ch hin k'ojl a hin Kolmal Jesús, yuj cha tzaljk'ojlal waji."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ha tiknek tzaljk'ojlal tzin b'itni,  wal a sb'i hin wach' kolmal. Kaw kolb'iln xo yuj wal schamk'ojlal, yuj xwa'ch hin k'ojl ha a."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzaljk'ojlal xo waj yuj Jesús, (tzaljk'ojlal xo waj tiknek, yuj hin wach' Kolmal Jesús,) smasnil k'inal ay hin tzaljk'ojlal. (kaw wal 'ay hin tzaljc'ojlal.)"},{"id":4,"tag":null,"isDisplayed":null,"text":" Yujto xwa'ch hin k'ojl a hin Kolmal Jesús, yuj cha tzaljk'ojlal waji."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      kaw junk'ojlal xo yaj hin pixan,  yujto Cristo hin kolni. Ha pekti kaw aych hin mul ayin, kolb’iln xo yuj tiknek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzaljk'ojlal xo waj yuj Jesús, (tzaljk'ojlal xo waj tiknek, yuj hin wach' Kolmal Jesús,) smasnil k'inal ay hin tzaljk'ojlal. (kaw wal 'ay hin tzaljc'ojlal.)"},{"id":5,"tag":null,"isDisplayed":null,"text":" Yujto xwa'ch hin k'ojl a hin Kolmal Jesús, yuj cha tzaljk'ojlal waji."},{"id":5,"tag":null,"isDisplayed":null,"text":"4      Tzwal yuj diosal wal yet hin pixan,  tzin b’itnej sb’i hin Jesús. Yuj swach’k’ojlal oj hin at yet’ok, wal a smasnil k’inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzaljk'ojlal xo waj yuj Jesús, (tzaljk'ojlal xo waj tiknek, yuj hin wach' Kolmal Jesús,) smasnil k'inal ay hin tzaljk'ojlal. (kaw wal 'ay hin tzaljc'ojlal.) "},{"id":6,"tag":null,"isDisplayed":null,"text":"Yujto xwa'ch hin k'ojl a hin Kolmal Jesús, yuj cha tzaljk'ojlal waji."}]},{"id":274,"title":"Tzaljk'ojlal Yaj Heb' Yik Xo Dios","guid":"5emtQREH80WLFasbXMZHXw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"274  Tzaljk'ojlal Yaj Heb' Yik Xo Dios\n \n Coros Insp. # 92. Que Alegre Los Creyentes"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Fil. 4:4-7; Pr. 15:13-15; Sal. 100:1-5\n \n Tzaljkoyk a Kajlil a smasnil k’inal. Tzwaln pax jun ejmxo, kaw tzaljkoyek. Fil. 4:4</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      ///Kaw wal tzalj heb' yik xo Dios./// Yik tzb'itnan wal heb’ sb’i."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw manhxa  kusk'ojlal, manhxa pax chab'k'ojlal. Smasnil heb' yik xo Dios ay sjichk'ojlal ha a."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     //Kaw wal tzalj heb' yik xo Dios.///Yik tzmunlj heb’ ha a."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw manhxa  kusk'ojlal, manhxa pax chab'k'ojlal. Smasnil heb' yik xo Dios ay sjichk'ojlal ha a."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     ///Kaw wal tzalj heb’ yik xo Dios.///Yik tzya'n heb' sdiezmo jun."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw manhxa  kusk'ojlal, manhxa pax chab'k'ojlal. Smasnil heb' yik xo Dios ay sjichk'ojlal ha a."}]},{"id":275,"title":"Tzin Tzalj Tiknek","guid":"wGOfDARMy0CaTI6wbMsvfg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"275 Tzin Tzalj Tiknek\n \n V. C. # 237   Dia Feliz"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ro.12:12; 1 Ts. 5:16\n \n zalj koyk a Kajlil a smasnil tiempo. Fil. 4:4</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kaw ay hin tzaljk'ojlal tiknek,   yuj cha kaw tzwil wal ha munljel. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Yel xo kaw wach’ hin tzaljk’ojlal, ha tzch’oxn el tas tza b’o ayin."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw ay hin tzaljk'ojlal, yuj swach’k’ojlal kaw tzin tzalji. Yik hin kolchji, xwil sak k’inal, yujto ix wa’ch hin k’ojl ayach. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yuj wal cha manhxa tas tzin na tiknek, ayk' Dios wet'ok."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Kaw xin b’o wal icha tznib’ej, yuj cha yik hin Cristo tiknek. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw hin och tza’n ton wal yu’uj, kaw yojk smasnil wal heb’ yiko’. "},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw ay hin tzaljk'ojlal, yuj swach’k’ojlal kaw tzin tzalji. Yik hin kolchji, xwil sak k’inal, yujto ix wa’ch hin k’ojl ayach. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yuj wal cha manhxa tas tzin na tiknek, ayk' Dios wet'ok."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ha hin pixan kaw tzalj tiknek, xyaktj kan smasnil wal tu b'eyb'al.  "},{"id":5,"tag":null,"isDisplayed":null,"text":"A satcha’anh oj ton k’ochok, yuj ton wal cha kaw tzin tzalji."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw ay hin tzaljk'ojlal, yuj swach’k’ojlal kaw tzin tzalji. Yik hin kolchji, xwil sak k’inal, yujto ix wa’ch hin k’ojl ayach. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Yuj wal cha manhxa tas tzin na tiknek, ayk' Dios wet'ok."}]},{"id":276,"title":"Tzaljk'ojlal Tzach Jawi","guid":"pHhXGcCft0S+jr2wrAPriQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"276 Tzaljk'ojlal Tzach Jawi\n \nC. S. G. # 635. ¡Bienvenido!"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Fil. 2:28-30; I Co. 16:17-21; Mt. 11:25-30\n \n Matz tak’ kaktnek kan ki yamn ki b’a, icha sb’eyb’al jun tzo’nh  xo heb’.  Heb 10:25</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kaw wal yel tzonh tzalj tiknek, yujto tzkilk pax e’lch ki b’a. Tzka'nek stzatzl ki k'ojol, yel tzonh tzaljek. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ay ki tzaljk'ojlal tiknek, yet’ pax wal ki chamk’ojlal, Junnhj tzkutj kalnek ki b'a, a ki Mam Dios."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yel tzonh tzaljek, yel tzonh tzaljek; hex ayx ek’  wal ket' atik, wal tiknek yel tzonh tzaljek. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yel tzonh tzaljek, yel tzonh tzaljek. yujto tzkilk pax e’lch ki b’a, yel tzonh tzaljek."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Ki Mam Dios xkolwj he yet’ok, may wal aj hex yakkan jun. Yujto tzex jaw ket’ tiknek, yel tzonh tzaljek."},{"id":4,"tag":null,"isDisplayed":null,"text":" Ki Mam Dios x’och he yet'ok, ha ex iln yet swach’k’ojlal, hex smol a skal tas ay smay, yel tzonh tzaljek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yel tzonh tzaljek, yel tzonh tzaljek; hex ayx ek’  wal ket' atik, wal tiknek yel tzonh tzaljek. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yel tzonh tzaljek, yel tzonh tzaljek. yujto tzkilk pax e’lch ki b’a, yel tzonh tzaljek."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Dios tzonh moln yet' schamk’ojlal,yujto kaw ay yipalil. Kalk wach’ paxti a Kajlil yik tzonh b’itnek. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Oj ki k'ochk a satcha'anh, junxnhej oj kaj ki masnil, kaw manhx oj ki kusk wal ta', yel tzonh tzaljek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yel tzonh tzaljek, yel tzonh tzaljek; hex ayx ek’  wal ket' atik, wal tiknek yel tzonh tzaljek. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Yel tzonh tzaljek, yel tzonh tzaljek. yujto tzkilk pax e’lch ki b’a, yel tzonh tzaljek."}]},{"id":277,"title":"Tzach Kal Wach'l Dios","guid":"dLYm8vwlAEui8Ar4fCPdLQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"277  Tzach Kal Wach'l Dios\n \nC. S. G. # 73 \nTe Loamos Oh Dios"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ap. 19:1-10; 1 Cr. 16:23-36; Jud. 20-25\n \n Han tik, kaw ay hin tzaljk’ojlal hoj Jehová hach hin Kolmal. Hab. 3: 18</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Tzach kal wach’l Dios, a junxnhej nab’enal. Yujto niwnk'ojlal xak' aynh yuj honnal Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"Aleluya tzach ki b’itnej, yuj ha chamk’ojlal, Aleluya tzkij chanh ha b’i, kaw wach' hach Mamin."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Kaw tzach ki b’itnej, hach Jesús ki Kolmal. Yujto xakkan ha tziktznil yik tza'n ki k'inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Aleluya tzach ki b’itnej, yuj ha chamk’ojlal, Aleluya tzkij chanh ha b’i, kaw wach' hach Mamin."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Tzkij chanh pax ha b’i, hach ton A’m niwnk'ojlal. Yujto tzak’ ki tzaljk’ojlal yet’ pax ki te’nal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Aleluya tzach ki b’itnej, yuj ha chamk’ojlal, Aleluya tzkij chanh ha b’i, kaw wach' hach Mamin."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Junnhj tzkutjek ki b’a, yik tzki b’itnank sb’i Dios. Yuj to ha a tzkot smasnil wach’il yet tas yel."},{"id":0,"tag":1,"isDisplayed":null,"text":"Aleluya tzach ki b’itnej, yuj ha chamk’ojlal, Aleluya tzkij chanh ha b’i, kaw wach' hach Mamin."}]},{"id":278,"title":"B'oxnk Sk'ojl Heb' Ya'ay Yuj Jesús","guid":"TQbmwgIkd0K1R6iZ8HrFcw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"278   B'oxnk Sk'ojl Heb' Ya'ay Yuj Jesús\n \nB. B. D. # 142"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mr. 5:1-20; 10:46-52;  Jn. 11:1-44\n \n Hantik, hin eml a yolyib’nhk’inl tik wul wak’ sakk’inl a spixn heb’ anma’.  Jn. 3:19</f></i>"},{"id":3,"tag":null,"isDisplayed":null,"text":"1      Ay jun meb'a kaw chotn ek' wal a sti b'e, kaw tzk'an wa sb'a yujto matz huj yilni. "},{"id":4,"tag":null,"isDisplayed":null,"text":"O'ch kab' ha k'ojl ayin xchi win a Jesús, yik xjaw Jesús ix jakw sat yu’uj."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yik xjaw Jesús ix b'ox kan sk'ojl yu'uj, Manhxa tas tzna’ yet mannhxa syailal.  "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yik xjaw Jesús kaw ix ya'ch win sk'ojl a Dios, yik xjaw Jesús xjaw sak k’inl a winak."},{"id":2,"tag":null,"isDisplayed":null,"text":"2     Ay jun winak ayk' wal aj mukn heb' chamnak, aych heb' demonio a sniwnal winak. Kaw o’ltak tz’aj win yuj heb’ demonio cha,  yik xjaw Jesús yajnhej xb’ox kan winak."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yik xjaw Jesús ix b'ox kan sk'ojl yu'uj, Manhxa tas tzna’ yet mannhxa syailal. "},{"id":3,"tag":null,"isDisplayed":null,"text":" Yik xjaw Jesús kaw ix ya'ch win sk'ojl a Dios, yik xjaw Jesús xjaw sak k’inl a winak."},{"id":3,"tag":null,"isDisplayed":null,"text":"3     Ha a Betania kaw wal ay kusk'ojlal,yujto ha Lázaro tox ix chami. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yoxjil xo smukxi til wal yok' heb' yu'uj, yik xjaw Jesús ix pitzw pax winak."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yik xjaw Jesús ix b'ox kan sk'ojl yu'uj, Manhxa tas tzna’ yet mannhxa syailal.  "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yik xjaw Jesús kaw ix ya'ch win sk'ojl a Dios, yik xjaw Jesús xjaw sak k’inl a winak."},{"id":4,"tag":null,"isDisplayed":null,"text":"4    Ha wal a jun yolyibnhk'inl tik jun, kaw til wal anma tzb'on maysch'olnilal."},{"id":5,"tag":null,"isDisplayed":null,"text":" Toto ay mach tzya'ch sk'ojl a Jesucristo, tzjaw a Jesús, kaw oj scha wal sk'inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yik xjaw Jesús ix b'ox kan sk'ojl yu'uj, Manhxa tas tzna’ yet mannhxa syailal.  "},{"id":6,"tag":null,"isDisplayed":null,"text":"Yik xjaw Jesús kaw ix ya'ch win sk'ojl a Dios, yik xjaw Jesús xjaw sak k’inl a winak."}]},{"id":279,"title":"Tzaljk’ojlal Yik Mach Tz'akw Yab'lil","guid":"4DMHiwU1zUeUGIWLDkiR4w","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"279  Tzaljk’ojlal Yik Mach Tz'akw Yab'lil\n \nC. S. G. # 612. Feliz, Feliz Cumpleaños"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 90:1-6, 12-17; 1 Ti. 4:11-16; 2 Ti. 1:3-10 \n \n Yuj cha, kaw tze tanhwj he b’a yuj he b’eyb’al, manh icha hok heb’ may snab’en a sat Dios. Ay kab’ he nab’en a sat. Efesio 5:15</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Kaw ay ki tzaljk'ojlal yuj, junx hab’il ha k’inal. Tzonh tzalji yujto ha Dios, ix a'n wal ha k’inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw ay ki tzaljk'ojlal yuj, junx hab’il ha k’inal. Tzaljk'ojlal nhej kab' haji, wal a smasnil k’inal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Yuj wal dios a ki Mam Dios, yuj swach'k'ojlal ayach. Yuj cha kaw tzaljk'ojlal yik, tza chan junx hab’il tik."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw ay ki tzaljk'ojlal yuj, junx hab’il ha k’inal. Tzaljk'ojlal nhej kab' haji, wal a smasnil k’inal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Tiknek jun och kab' lesal, ya' sb'a yamnonhk a tik. Sek wach' oj yak' ki Mam Dios, swach'k'ojlal a heb'anh."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw ay ki tzaljk'ojlal yuj, junx hab’il ha k’inal. Tzaljk'ojlal nhej kab' haji, wal a smasnil k’inal."}]},{"id":280,"title":"Yet' Tzaljk'ojlal Tzonh B'itnek","guid":"/00yqE23cUyDcm1zzy0JuQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"280  Yet' Tzaljk'ojlal Tzonh B'itnek\n \nC. S. G. # 611. Con Alegres Corazones"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 32; Sal. 90:1-6,12-17; Pr.17:19-24\n \n Ha tzaljk’ojlal, lajn wal icha junk yanhl yab’il, hax pax kusk’ojlal, tonhj tzyij el kipek. Pr. 17:22</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Yet' wal smasnil ki tzaljk'ojlal, tzki b'itnej sb'i ki Mam Dios. Tznax kot junx hab'il ha k’inal, tzki b'itnej yet' smasnil kip. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Tzki nib'j tz'ajx nanhlokx ha k'inal, to tzaljk'ojlal nhej haji. Kaw ha Cristo aj k'inl ayach, yet' smasnil tas tzyak' ayach."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzonh b'itni, (tzonh b'itni) yel tzonh tzalji. (Tzonh tzalji) Tzki nib'j yet' smasnil ki pixan,  smoj tzki b'itnejek sb'i. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yujto kaw niwn ye'lchi, ha ki Mam Dios tzach tanhwni. Ha wal Kilmal, (wal kilmal) ha tzonh ilni, (tzonh ilni) kaw tzonh yijb'ey a junk’ojlal. Yujto ha Cristo ayk'nhej wal ket'ok, yuj cha kaw tzonh b'itni."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ha ki Mam Dios x'a'n ha k'inal, hach sb'o wal icha yilxi, yuj wal yijx chanh sb'i ki Diosal, til wal tas ix yak' ayach. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ki Mam Dios tzyil aj tzach b'eyi, yujto ayk'nhej wal het'ok. Yuj swach'k'ojlal tzyak' ha k'inal, yet' smasnil tas tzyak' ayach."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzonh b'itni, (tzonh b'itni) yel tzonh tzalji. (Tzonh tzalji) Tzki nib'j yet' smasnil ki pixan,  smoj tzki b'itnejek sb'i. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yujto kaw niwn ye'lchi, ha ki Mam Dios tzach tanhwni. Ha wal Kilmal, (wal kilmal) ha tzonh ilni, (tzonh ilni) kaw tzonh yijb'ey a junk’ojlal. Yujto ha Cristo ayk'nhej wal ket'ok, yuj cha kaw tzonh b'itni."}]},{"id":281,"title":"Icha Soldado Waj Yuj Jesús","guid":"Gv6ae7LzJUiIrBfQJOB7aA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"281  Icha Soldado Waj Yuj Jesús\n \nC. S. G. # 538. ¿Soy Yo Soldado De Jesús"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>2 Ti. 2:1-9; Ef. 6:10-18; Jos. 1:1-9\n \n Makwjanhek, kaw te’n tze yutj he b’a he ya’n och he k’ojl a Kajlilek. Manh hex xiwok. Kaw tze te’w tzej he b’a junjn hex. 1 Co.16:13</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Yel icha ton soldado kaj yuj ki Kolmal Jesús. Kaw matz honh xiw koch tza'n yu'uj, wach'xam oj kab' syail."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yik tzka' techjok jun howl cha, oj ki cha swach'il, kaw oj ki cha swach'il, kaw oj ki cha swach'il. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Yik tzka' techjok jun howl cha, oj ki cha swach'il; yik tzonh k'och a satcha'anh."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Icha heb’ yab'jnak syal yu’uj, ixta tzkutjek ki b’a. Yuj ki Kolmal oj ka’k howal, yet’ wal win aj k’ojol."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yik tzka' techjok jun howl cha, oj ki cha swach'il, kaw oj ki cha swach'il, kaw oj ki cha swach'il."},{"id":4,"tag":null,"isDisplayed":null,"text":" Yik tzka' techjok jun howl cha, oj ki cha swach'il; yik tzonh k'och a satcha'anh."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Kaw yowlal tzka'k och ki nab'en, a ki Kolmal Jesús. Kaw och koyk wal tza'n yuj Jesús, oj yak' ki junk'ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yik tzka' techjok jun howl cha, oj ki cha swach'il, kaw oj ki cha swach'il, kaw oj ki cha swach'il."},{"id":5,"tag":null,"isDisplayed":null,"text":" Yik tzka' techjok jun howl cha, oj ki cha swach'il; yik tzonh k'och a satcha'anh."}]},{"id":282,"title":"Hek Stziktznial","guid":"cd1PAsmeAkODbx5P3Q+Keg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"282  Hek Stziktznial\n \nC. S. G. # 27. Tuya Es La Gloria"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ap. 7:9-17; Col. 1:15-19; Ap. 4\n \n Xyaln heb’ ixtik, b’o kab’ ixta.  Halx kab’ wach’ paxti a Dios a smasnil k’inal.  Ap. 7:12</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Kaw hek wal stziktznial, kaw niwn pax  he'lchi Hek a smasnil k'inal, b'o kab' ixta'."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Kaw wal Yajl hach Mamin, a yib'nh heb' yajal. Wal a smasnil k'inal, b'o kab' ixta'."}]},{"id":283,"title":"Yowlal Tzach Alj A Scha'ejmal","guid":"5ClPKBlusUaaop2EyoiaAg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"283  Yowlal Tzach Alj A Scha'ejmal\n \nV. C. # 288 Tendras Que Renacer"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ix yaln Jesús a win ixtik: Wal yel tzwal ayach, ha mach matz alj pax a scha’ejmal, ma’oj stak’ yoch a yol sk’ab Dios.   Jn.3:3</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ay jun win ix jaw a Jesús ha ak'wal,  wan sayn ek' sk'inal yik wal tzkolchj el spixan. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Xyal Cristo ha a, toto tza nib'j tzel Dios, yowlal tzach alj a scha'ejmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yowlal tzach alj a scha'ejmal,  yowlal tzach alj a scha'ejmal."},{"id":4,"tag":null,"isDisplayed":null,"text":" Kaw yel totn yel tzwal ayach xchi Jesús; yowlal tzach alj a scha'ejmal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Toto tza nib'j tzach k'och wal a satcha'anh,  yik tzach k’och iljok yet’ heb’ yikxo Dios. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Toto tza nib’j ha k’inl a jun ejmnhej, yowlal tzach alj a scha'ejmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yowlal tzach alj a scha'ejmal,  yowlal tzach alj a scha'ejmal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw yel totn yel tzwal ayach xchi Jesús; yowlal tzach alj a scha'ejmal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Hach anma’ manh wal hak' pitb'ok ha nab'en,  chaj spaxti Cristo ix yal a heb' ajmul. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Toto ma tza nib’j tzach k'och a skal yail, yowlal tzach alj a scha'ejmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yowlal tzach alj a scha'ejmal,  yowlal tzach alj a scha'ejmal. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kaw yel totn yel tzwal ayach xchi Jesús; yowlal tzach alj a scha'ejmal."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Ay heb’ yik xo Dios ayx ek' a satcha'anh, toto tza nib'j tzach k’och yet’ heb’ hach tik."},{"id":6,"tag":null,"isDisplayed":null,"text":" Chaj hab' spaxti Cristo Jesús wal tiknek,yowlal tzach alj a scha'ejmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yowlal tzach alj a scha'ejmal,  yowlal tzach alj a scha'ejmal. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Kaw yel totn yel tzwal ayach xchi Jesús; yowlal tzach alj a scha'ejmal."}]},{"id":284,"title":"Lum América Oj Och Yiko'ok Cristo","guid":"7ZvrQLx/R0CwQaa+sG2fmQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"284  Lum América Oj Och Yiko'ok Cristo\n \nC. S. G. # 614. América Será Para Cristo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 150; Gn. 12:1-4 \n \nXlajw cha, xwilni. Kaw niwn anma ayk’ a yojltak jun despacho cha, yet’ a yojltak jun tzkuch Kalnelu. Ha heb’ cha, ay heb’ a junjn chonhab’,  a junjn hinhtal, yet’ a junjn ti’al.  Ap. 7:9</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     América oj och yiko'ok Cristo, toto tzya'ch wal snab'en a ki Dios. Oj yil wal stziktznil Dios a jun k'u cha, toto yiklum wal heb' a spaxti'. "},{"id":3,"tag":null,"isDisplayed":null,"text":"América oj k'och a satcha'anh, ay wal jun skajnub' heb' sb'o Jesús. Jun mutz'satil oj jawk Jesucristo, hax yem wokn heb' yet' wal a swach' k'ab'."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Kaw ay schamk'ojlal Dios a heb' chonhb' tik, tanhb'il wal heb' yuj a junjn k'u. Oj scha heb' swakh’k'ojlal ki Kolmalek, toto oj scha heb' yab' spaxti Dios. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha Jesucristo kaw ix el schik’il, yik ix och wal a spenk te kulus. Ha heb' oj ya'ch sk'ojl a yunnal Dios jun, oj scha wal heb' sk'inl a ki Kolmal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Colombia, Panamá, Venezuela; Bolivia, Paraguay yet' Brasil; oj scha heb' sjunk'ojlal a ki Mam Dios, toto tzya'ch heb' Jesús a sk'ojol. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Perú, yet' Chile, yet' Argentina; yet' Cuba, Uruguay, Ecuador; toto tzya'ch heb' sk'ojl a Jesucristo, kaw oj kolchjok heb' a skal yail."},{"id":5,"tag":null,"isDisplayed":null,"text":"4      Ay wal heb' anma manh yojkok Dios jun, hax tiknek Dios tzchamk'ojlan wal heb'. Alaska yet' Estados Unidos; yet' México yet' pax Canadá."},{"id":6,"tag":null,"isDisplayed":null,"text":" Kojxnhej ton wal Jesús tztak' skoln el heb', smasnil heb' ay a Sur oj yab' heb'. Toto ma'oj scha heb' Jesucristo, kaw oj at heb' a skal k'ak' b'i'an."},{"id":6,"tag":null,"isDisplayed":null,"text":"5     Ha Guatemala yet' pax Honduras; kaw wach' yilx Nicaragua yet' heb'. Toto tzya'ch heb' snab'en a ki Mam Dios, oj scha heb' skolnb'il a Jesús. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Oj yak' Dios syaxil a Costa Rica; oj yak' Dios a heb' aj Salvador. Tznib'j Dios to oj kolchjok el heb' smasnil, sek kaw ma oj at heb' a skal k'ak'."},{"id":7,"tag":null,"isDisplayed":null,"text":""}]},{"id":285,"title":"Hach Hin Diosal Waji","guid":"NzlIEYoPmU+AYSsHji/iew","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"285     Hach Hin Diosal Waji\n \nV.C. 137  Todo Rendido"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Is. 55:1-2; 1 co. 6:18- 20; 1 co. 7: 17-24 \n \nHanhek tik, manb’ilnhek xo yuj Dios. 1 Co. 7:23</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Hanhj wal ha aych Mamin, tzin nib’j tzwak’ hin b’a. Tzwak’ hin b’a aych tiknek, yujto Wajlil hach. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ha wal ton a hojltak, ayn xo ek’ wal tiknek jun. Yujto tox hin ha mana, tzwak’ hin b’a ayach."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Hanhj wal ha aych Mamin, tzwak’ hin b’a tiknek, yujto hach xak’ ton wal hin kolnb’il jun. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Tzwak’ hin k’inl a yol ha k’ab’, yet’ wal hin tzaljk’ojlilal. Kaw heknhej tzin aj tiknek, tzwak’ hin b’a ayach."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Hanhj wal ha aych Mamin, tzwak’ smasnil tiknek, yaxilal xak’ ayin, yet’ pax niwnk’ojlal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Smasnil tas ay wal ayin, tzin nib’j tzwak’ smasnil ayach. Yujto tox hin ha man yet’ wal ha chamk’ojlal.\n "},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Kaw tzwak’ emmkilal ayach, yujto kaw hek hin. Tzwak’ hin b’a wal ayach, heknhej tzin aji,"},{"id":6,"tag":null,"isDisplayed":null,"text":" Kaw manhxtok wik wal hin b’a, ha Cristo kajn och ayin. B’o wal tas tza nib’j ayin, Cristo Jesús."}]},{"id":286,"title":"Tzam Hach Xiw Ha’n Howl Yet’ Maysch’olnil","guid":"TEErfxY2z0yvOZ9hYNMTWg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"286 Tzam Hach Xiw Ha’n Howl Yet’ Maysch’olnil\n \nV. C. # 298 ¿Temes Que En La Lucha?"},{"id":2,"tag":null,"isDisplayed":null,"text":"<fMicrosoft Himalaya>Is. 1:16-20; Ef. 6:10-19; Ap. 3:20-22\n \n Yujcha. icha junk soldado tzk’anlb’ej syamk’ab’il yik howal, ixta tze yutj he k’anlb’an jun tzonh tas tzyak’ Dios aynhek. Ef. 6:13</f>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     ¿Tzam hach xiw yuj wal smasnil maysch’olnilal? ¿Tzam ha na to oj techjok ha yailal? "},{"id":3,"tag":null,"isDisplayed":null,"text":"Jak wal ha pixn a ki wach’ Kolmal Jesús, sek oj och kajn aych b’i’an."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ak’ ha pixn a ki Kolmal, (a ki wach’ Kolmal) ak’ ha pixn a ki Kolmal. (a ki wach’ Kolmal) "},{"id":4,"tag":null,"isDisplayed":null,"text":"Jak wal ha pixn a ki wach’ Kolmal Jesús, sek oj och kajn aych b’i’an."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ha tiknek kaw aych ek’ a skal k’ik’k’inal, kaw aych kan a yalnh smasnil tas maysch’olnil."},{"id":4,"tag":null,"isDisplayed":null,"text":" Jak wal ha pixn a ki wach’ Kolmal Jesús, sek oj och kajn aych b’i’an."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ak’ ha pixn a ki Kolmal, (a ki wach’ Kolmal) ak’ ha pixn a ki Kolmal. (a ki wach’ Kolmal) "},{"id":5,"tag":null,"isDisplayed":null,"text":"Jak wal ha pixn a ki wach’ Kolmal Jesús, sek oj och kajn aych b’i’an."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      ¿Tzam ha nib’j tzaljk’ojlal tzach kan yet’ Jesús? ¿Tzam ha nib’j kaw tzach och wal yunnalk tiknek?"},{"id":5,"tag":null,"isDisplayed":null,"text":" Jak wal ha pixn a ki wach’ Kolmal Jesús, sek oj och kajn aych b’i’an. "},{"id":0,"tag":1,"isDisplayed":null,"text":"Ak’ ha pixn a ki Kolmal, (a ki wach’ Kolmal) ak’ ha pixn a ki Kolmal. (a ki wach’ Kolmal) "},{"id":6,"tag":null,"isDisplayed":null,"text":"Jak wal ha pixn a ki wach’ Kolmal Jesús, sek oj och kajn aych b’i’an."}]},{"id":287,"title":"Matz Honh Xiwk Ki Atk A Kojltak","guid":"yAPinOotM064V1KwoqLqBQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"287   Matz Honh Xiwk Ki Atk A Kojltak\n \nC. S. G. # 534  Adelante Con Valor"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>2 Cor. 4:5-16; Is. 59:19-21; 1 Cor. 1:17-24 \n \nIx hak’ jun ch’oxnb’il a heb’ to ay he’lch a sat, sek matz yamchj heb’ yuj jun tzo’nh sjul’lab’ heb’ ajk’ojol.  Sal. 60:4</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kalk el jun wach’ ab’x tik yab’xil ki Kolmal, yujto xcham a te kulus."},{"id":3,"tag":null,"isDisplayed":null,"text":" Ha wal jun wach' ab'x tik kaw wal yel tzyala, yik Jesús ki wach' Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ka'k wal ip jun, ka'k wal ip jun; och koyk tza'n yuj ki wach’ Kolmal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Tzyak' ki tzaljk'ojlal, junk’ojlal, ka'k wal ip ki atk yet'ok."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Kalk el yab’xil Jesús, yet’ wal tzaljk’ojlal, yujto xcham a te kulus. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kalk wach’ paxti a ki wach’ kolmal Jesús, yujto xyak’ ki junk’ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ka'k wal ip jun, ka'k wal ip jun; och koyk tza'n yuj ki wach’ Kolmal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Tzyak' ki tzaljk'ojlal, junk’ojlal, ka'k wal ip ki atk yet'ok."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Ha wal a satcha’anh oj ki b’itnokek, sb’i ki wach’ kolmal Jesús. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw oj kilk tzaljk’ojlal yet’ pax junk’ojlal, yik oj ki k’ochk yet’ Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ka'k wal ip jun, ka'k wal ip jun; och koyk tza'n yuj ki wach’ Kolmal. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Tzyak' ki tzaljk'ojlal, junk’ojlal, ka'k wal ip ki atk yet'ok."}]},{"id":288,"title":"Jesucristo Sak K'inl Yaj Aynhek","guid":"4AEX60CMf06LhF7nq65MzQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"288   Jesucristo Sak K'inl Yaj Aynhek\n \nV. C. # 247. Una Voz Resuena De Ansia"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 8:12; 1 Jn. 2:7-17; Jn. 12:44-46\n \n Hantik, icha sakk’inl waj a heb’ anma ay a yolyib’nhk’inl tik.  Jn. 8:12</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Ay heb’ anma tz’el yaw a skal skusk’ojlal, tznib’j heb’ tzniwnk’ojlaxi. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Til wal mach ayt ek’ a skal maysch’olnilal, kaw tznib’j heb’ skolnb’il."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kotnhek a Jesús ki wach' kolmal, kaw oj yak' he kolnb’il. Kotnhek a Jesús ki wach' kolmal, kaw oj yak' sakk'inl ayex."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Toto tzki b'o tas tzyal Jesús ki kolmal,ayx ek’ sak k’inl aynek’. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yuj cha ch’oxk el wal jun sakk’inal, yik Dios. Wal a smasnil anma’."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kotnhek a Jesús ki wach' kolmal, kaw oj yak' he kolnb’il. Kotnhek a Jesús ki wach' kolmal, kaw oj yak' sakk'inl ayex."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Toto yel tzki chaj Jesús ki kolmalok, sakk'inal yaj aynhek. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ha swach’k’ojlal yet’ schamk’ojlal tzyak’ aynhek, sakk'inal, yaj aynhek’."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kotnhek a Jesús ki wach' kolmal, kaw oj yak' he kolnb’il. Kotnhek a Jesús ki wach' kolmal, kaw oj yak' sakk'inl ayex."},{"id":5,"tag":null,"isDisplayed":null,"text":"4    Hanhek yunnalnhek xo ki Mam Dios tiknek, kalk el yab’xil Jesús. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Sek oj kolchjok heb’ anma wal a skal smul, yuj sak k’inlal Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kotnhek a Jesús ki wach' kolmal, kaw oj yak' he kolnb’il. Kotnhek a Jesús ki wach' kolmal, kaw oj yak' sakk'inl ayex."}]},{"id":289,"title":"Tzki Yamk Ki B'a A Wa’el Yic Kajlil","guid":"ou1QAfyX60K5wpyfQIkmlA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"289  Tzki Yamk Ki B'a A Wa’el Yic Kajlil\n \n<i><fMicrosoft PhagsPa>V. C. # 239. En Tu Cena Nos Juntamos</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mt. 26:26-29; Mr. 14:22-25; Lc. 22:14-20\n \n Wal yel tzwal ayex, manhxa junk yal uva oj wuk’, masnto a jun k’u oj wuk’ junyal uva a’t a yik oj och Dios Yajlil, xchi Jesús a heb’.  Mr.14: 25</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ha jun k'u tik tzki yam ki b'a, yik tzki nan kot ha chamlil. Hach ajx och a yol sk'ab' chamel, tzki na kot ha chamk'ojlal."},{"id":3,"tag":null,"isDisplayed":null,"text":" Kaw niwn ha chamk'ojlal, yuj ha chamlil a kulus."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Manb'ilnhek xo el wal tiknek, yujto xya’ cham sb’a kujek. Yuj wal jun pan tzki chajek tik, tzki nank kot mach hohn kolnek. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kolb'ilnhek, kolb'ilnhek, ix yak' Dios ki kolnb’ilek."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ha jun yet’l schik’l Kajlil, kaw tzyak’ ki na kot schamlil. Yuj jun kolnb’il tik xyak’ aynhek, yujcha oj ki k’och yet’ok. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Tzki nib'j wal tzkilk Jesús, ay jun k’u oj kilk Jesús."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Junxnhej kajk yuj schamk'ojlal Dios, yet’ sjunk’ojlal tzyak’ aynek. Yuj Yespíritu tzonh b'itnek, wal a ki wach’ Kolmalek. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kalk wach’ paxti ha a, yujto yel ki Kolmalek."}]},{"id":290,"title":"Tzonh Jawk A Wa’el Yik Kajlil","guid":"9MhkhjiK0EOebskJK5sktg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"290 Tzonh Jawk A Wa’el Yik Kajlil\n \nC. S. G. # 520  Hoy Venimos, Cual Hermanos"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>1 Cor. 11:23-28; Mt. 26:26-29\n \n Ix yaln a heb’ ixtik: Ha jun tik, hatn hin niwnal tik, oj ajxok he yu’uj. Wajek.  Tze b’o jun tik, yik tzin he nan koti, xchi. Lc. 22:19</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ha tiknek tzonh jawk ki masnil, a jun wa’el, yik Kajlil.Emmkilal tzonh ajk ki jawi, smoj tzonh xiwk a ki Mam Dios."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Tzki na kot wal schamlil Jesús, yik ix cham a te kulus.Ha jun pan tik oj ki waknhej, icha wal yaj yalnkani."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Tzki nakot yik ix yab’ syail jun ki wach’ kolmal Jesús. Yuj wal schamlil a te kulus, yuj cha ay ki tzaljk’ojlal."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Tzyak’ ki k’inal yuj wal xchamlil, yet’ pax wal ki tzaljk’ojlal. Ki b’itnokek sb’i ki Kolmal, yujto xyak’ wal ki k’inal."}]},{"id":291,"title":"Yik Kajlil Jun Wa’el","guid":"xvqg9/dt70+H38LqQzCKmw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"291 Yik Kajlil Jun Wa’el\n \nC. S. G. # 522 Es La Cena Del Señor \n \nLajn sjal jun himno tik yet’ himno #184."},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Luc. 24:14-32; Luc. 22:14-29; Mat. 26:26-29\n \n Hax yik xk’och hora, ix k’och Jesuús yet’ heb’ skuywum, ix och hoyn heb’ a te mexa wa’ok. Lc.22:14</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ha wal Wa’el yik Kajlil, tzyak' ki na kot schamk'ojlal. Tzch'ox kot jun tas to kaw yel, hatn stojlal yet' swach'il. "},{"i
