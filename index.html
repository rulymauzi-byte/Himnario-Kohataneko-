<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0d0f">
<meta name="description" content="Himnario BIT YIK KI MAM DIOS, disponible sin internet.">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Himnario">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#0c0d0f; --panel:#15171b; --panel2:#1d2025; --text:#f7f2e7;
  --muted:#b8b1a4; --gold:#c99a2e; --gold2:#e5bc57; --red:#7f1018;
  --border:#34373d; --shadow:0 14px 38px rgba(0,0,0,.28); --reader-size:24px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer}
.app-shell{min-height:100vh;background:radial-gradient(circle at top,#231d12 0,#111216 34%,#0c0d0f 68%)}
.topbar{position:sticky;top:0;z-index:30;background:rgba(12,13,15,.94);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.topbar-inner{max-width:900px;margin:auto;padding:12px 14px;display:flex;align-items:center;gap:10px}
.brand{min-width:0;flex:1}
.brand h1{font-size:clamp(18px,4vw,26px);margin:0;color:var(--gold2);letter-spacing:.02em}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}
.icon-btn,.btn{border:1px solid var(--border);background:var(--panel2);color:var(--text);border-radius:12px;min-height:44px;padding:9px 13px;font-weight:700;box-shadow:none}
.icon-btn:hover,.btn:hover{border-color:#6a5a32;background:#26282e}
.icon-btn.primary,.btn.primary{background:linear-gradient(180deg,#8e161f,#6f0d14);border-color:#a12d35;color:#fff}
.icon-btn.gold,.btn.gold{background:linear-gradient(180deg,#c79a36,#9b721d);border-color:#d8ac4e;color:#14110b}
main{max-width:900px;margin:auto;padding:18px 14px 90px}
.search-card{background:linear-gradient(180deg,rgba(31,33,38,.98),rgba(20,22,26,.98));border:1px solid var(--border);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.search-title{font-size:19px;font-weight:850;color:var(--gold2);margin:0 0 12px}
.search-options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.search-option{background:#101216;border:1px solid #373b42;border-radius:16px;padding:12px}
.search-label{display:block;font-weight:800;margin:0 0 8px;color:#f5e5b2;font-size:15px}
.search-label-button{width:100%;border:0;background:transparent;padding:3px 0 7px;text-align:left;cursor:pointer;font:inherit;color:#f5e5b2;display:flex;align-items:center;justify-content:space-between;gap:10px}
.search-label-button:hover{color:var(--gold2)}
.search-label-button:focus-visible{outline:2px solid var(--gold);outline-offset:4px;border-radius:6px}
.browse-arrow{font-size:18px;transition:transform .16s ease}
.search-label-button[aria-expanded="true"] .browse-arrow{transform:rotate(180deg)}
.search-row{display:flex;gap:8px}
.search-box{flex:1;position:relative;min-width:0}
.search-box input{width:100%;min-height:50px;border-radius:14px;border:1px solid #444850;background:#0b0d10;color:var(--text);padding:0 46px 0 15px;outline:none;font-size:17px}
.search-box input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,154,46,.16)}
.clear-btn{position:absolute;right:7px;top:6px;width:38px;height:38px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:22px}
.help{display:flex;justify-content:space-between;gap:10px;margin-top:11px;color:var(--muted);font-size:13px}
.list{display:grid;grid-template-columns:1fr;gap:9px;margin-top:14px}
.hymn-card{width:100%;border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:15px;padding:13px 14px;display:flex;gap:13px;align-items:center;text-align:left;transition:.12s transform,.12s border-color,.12s background}
.hymn-card:hover{transform:translateY(-1px);border-color:#665b43;background:#1a1d22}
.num{width:52px;height:52px;border-radius:14px;background:#261014;border:1px solid #6f2228;display:grid;place-items:center;color:#ffdcdf;font-weight:850;font-size:18px;flex:0 0 auto}
.card-title{font-size:16px;font-weight:760;line-height:1.25}
.card-sub{font-size:12px;color:var(--muted);margin-top:4px}
.empty{padding:34px 18px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:16px;margin-top:14px}
.reader-toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.reader-toolbar .spacer{flex:1}
.size-label{min-width:58px;text-align:center;color:var(--gold2);font-weight:800;font-size:13px}
.reader{background:linear-gradient(180deg,#181a1f,#121418);border:1px solid var(--border);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
.reader-head{padding:18px 18px 14px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,#261014,#17191d 60%);text-align:center}
.reader-number{display:inline-flex;align-items:center;justify-content:center;border-radius:999px;background:#78141b;color:#fff;padding:6px 12px;font-weight:800;font-size:13px}
.reader-title{font-size:clamp(24px,6vw,38px);line-height:1.12;margin:10px 0 0;color:#f4d67f;word-break:break-word}
.reader-body{padding:20px 18px 26px;text-align:center}
.verse-block{font-family:Georgia,"Times New Roman",serif;font-size:var(--reader-size);line-height:1.62;letter-spacing:.005em;margin:0;white-space:normal;color:#fffdf8;text-align:center}
.verse-block em{color:#e6decf}
.verse-block.meta{color:#ddd2bd;font-size:calc(var(--reader-size) * .83);border-left:0;padding-left:0;text-align:center;margin-bottom:.8em}
.verse-block.stanza-start{margin-top:.8em}
.verse-block.chorus{font-weight:800;text-align:center;margin:.8em 0}
.verse-block.chorus + .verse-block.stanza-start{margin-top:0}
.chorus-label{display:block;color:var(--gold2);font-weight:900;letter-spacing:.08em;margin-bottom:.35em;text-align:center}
.verse-block.chorus em{font-weight:800}

.reader-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.reader-nav .btn{min-height:50px}
.reader-nav .btn:disabled{opacity:.38;cursor:not-allowed}
.footer-note{margin:18px 0 0;text-align:center;color:#777f89;font-size:12px}
.hidden{display:none!important}
.install-tip{margin-top:12px;padding:11px 13px;border-radius:14px;background:#121923;border:1px solid #293748;color:#bac8d7;font-size:12px;display:none}
.install-tip.show{display:block}
@media(min-width:680px){.list{grid-template-columns:1fr 1fr}.reader-body{padding:26px 30px 32px}.reader-head{padding:22px 30px 18px}}
@media(max-width:620px){.search-options{grid-template-columns:1fr}}
@media(max-width:520px){main{padding-left:10px;padding-right:10px}.topbar-inner{padding-left:10px;padding-right:10px}.brand p{display:none}.search-row{gap:7px}.search-row .btn{padding-left:11px;padding-right:11px}.reader-toolbar .icon-btn{min-width:48px;padding:8px 10px}.reader-body{padding-left:15px;padding-right:15px}.verse-block{line-height:1.55}}

/* --- Mejoras visuales de la pantalla principal --- */
.home-hero{position:relative;overflow:hidden;margin-bottom:16px;padding:24px 20px;border:1px solid rgba(213,168,70,.22);border-radius:24px;background:
  radial-gradient(circle at top right, rgba(201,154,46,.30), transparent 34%),
  radial-gradient(circle at left bottom, rgba(127,16,24,.33), transparent 38%),
  linear-gradient(135deg, rgba(32,18,21,.98), rgba(18,20,25,.98) 58%, rgba(15,17,21,.98));
  box-shadow:0 18px 42px rgba(0,0,0,.34)}
.home-hero::after{content:'';position:absolute;inset:auto -80px -80px auto;width:210px;height:210px;border-radius:50%;background:radial-gradient(circle, rgba(229,188,87,.20), transparent 68%);pointer-events:none}
.hero-kicker{display:inline-flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;background:rgba(247,228,176,.10);border:1px solid rgba(229,188,87,.25);color:#f3d990;font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.hero-title{margin:12px 0 8px;font-size:clamp(28px,6vw,42px);line-height:1.05;color:#fff4cf;text-shadow:0 2px 18px rgba(0,0,0,.26)}
.hero-subtitle{margin:0;max-width:760px;color:#ddd4c4;font-size:15px;line-height:1.6}
.hero-badges{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.hero-badge{display:inline-flex;align-items:center;min-height:36px;padding:0 13px;border-radius:999px;background:rgba(12,13,15,.45);border:1px solid rgba(255,255,255,.08);color:#f4ead7;font-weight:700;font-size:13px}
.main-card{padding:18px;border-radius:24px;border-color:rgba(120,124,133,.34);background:
  linear-gradient(180deg, rgba(29,32,37,.98), rgba(16,18,23,.98));
}
.search-card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:14px}
.search-kicker{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#d7b15e;margin-bottom:4px}
.search-title{font-size:26px;margin:0;color:#fff1c5}
.search-glow{width:64px;height:64px;border-radius:18px;background:radial-gradient(circle at 35% 35%, rgba(241,206,114,.95), rgba(201,154,46,.25) 45%, rgba(201,154,46,0) 72%);filter:blur(1px);opacity:.85;flex:0 0 auto}
.search-options{gap:14px}
.search-option{position:relative;border-radius:20px;padding:16px;background:
  linear-gradient(180deg, rgba(17,19,24,.92), rgba(11,13,16,.94));border:1px solid rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.03)}
.number-option::before,.name-option::before{content:'';position:absolute;inset:0 auto 0 0;width:4px;border-radius:20px 0 0 20px;background:linear-gradient(180deg, #d9af4f, #8b141c)}
.option-topline{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#c7a96e;margin-bottom:5px}
.search-label{font-size:18px;color:#fff1c5;margin-bottom:6px}
.option-note{color:#bdb5a8;font-size:13px;line-height:1.45;margin-bottom:12px}
.search-box input{background:linear-gradient(180deg,#0b0d10,#11141a);border-color:#444a54}
.search-box input::placeholder{color:#8d9199}
.search-row .btn.gold{min-width:108px;font-weight:800;box-shadow:0 8px 18px rgba(201,154,46,.15)}
.feature-strip{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.feature-chip{display:inline-flex;align-items:center;min-height:36px;padding:0 12px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);color:#eee4d1;font-size:13px;font-weight:700}
.help{margin-top:14px;padding-top:14px;border-top:1px solid rgba(255,255,255,.06)}
#results.list{margin-top:18px}
.footer-note{margin-top:20px;color:#8a919b}
@media(max-width:620px){
  .home-hero{padding:20px 16px;border-radius:22px}
  .hero-title{font-size:clamp(24px,8vw,34px)}
  .search-card-head{align-items:center}
  .search-glow{width:52px;height:52px}
  .search-title{font-size:22px}
  .main-card{padding:15px}
}


/* Pantalla principal limpia + color de visualización */
.home-hero,.hero-kicker,.hero-title,.hero-subtitle,.hero-badges,.hero-badge,.search-card-head,.search-kicker,.search-glow,.option-topline,.option-note,.feature-strip,.feature-chip{display:none!important}
.clean-home{max-width:760px;margin:18px auto 0;padding:18px;border-radius:20px;background:linear-gradient(180deg,#1b1e23,#121418);border:1px solid #34373d;box-shadow:0 14px 36px rgba(0,0,0,.24)}
.clean-home .search-title{font-size:22px;text-align:center;margin:0 0 16px;color:var(--gold2)}
.clean-home .search-options{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.clean-home .search-option{padding:14px;border-radius:16px;background:#0f1115;border:1px solid #32363d}
.display-color-box{margin-top:14px;padding:14px;border-radius:16px;background:#0f1115;border:1px solid #32363d}
.display-color-title{font-weight:800;color:#f5e5b2;margin-bottom:10px;text-align:center}
.display-colors{display:grid;grid-template-columns:1fr 1fr;gap:8px;max-width:420px;margin:0 auto}
.display-color-btn{min-height:46px;border:1px solid #3b4048;background:#181b20;color:#f5f0e7;border-radius:12px;padding:8px 12px;font-weight:750;display:flex;align-items:center;justify-content:center;gap:8px}
.display-color-btn:hover{border-color:#7b6a3d;background:#20242a}
.display-color-btn.active{border-color:var(--gold2);box-shadow:0 0 0 2px rgba(229,188,87,.14)}
.color-dot{width:16px;height:16px;border-radius:50%;display:inline-block;border:1px solid rgba(255,255,255,.30);box-shadow:0 0 0 1px rgba(0,0,0,.25) inset}
.color-dot.light{background:#f7f4ed;border-color:#bfc1c5}
.color-dot.dark{background:#0c0d0f}

body[data-view-theme="dark"] .reader{background:linear-gradient(180deg,#181a1f,#101216)}
body[data-view-theme="dark"] .reader-head{background:linear-gradient(135deg,#261014,#17191d 60%)}
body[data-view-theme="dark"] .reader-body{background:#121418}
body[data-view-theme="dark"] .verse-block{color:#fffdf8}
body[data-view-theme="dark"] .verse-block.meta{color:#ddd2bd}

body[data-view-theme="light"] .reader{background:#ffffff;border-color:#d8d3c9}
body[data-view-theme="light"] .reader-head{background:linear-gradient(135deg,#f1e3c1,#f8f5ed 70%);border-bottom-color:#d8d3c9}
body[data-view-theme="light"] .reader-body{background:#ffffff}
body[data-view-theme="light"] .reader-number{background:#7f1018;color:#fff}
body[data-view-theme="light"] .reader-title{color:#5d4514;text-shadow:none}
body[data-view-theme="light"] .verse-block{color:#171717}
body[data-view-theme="light"] .verse-block.meta{color:#5e5a52}
body[data-view-theme="light"] .verse-block em{color:#5e5a52}
body[data-view-theme="light"] .chorus-label{color:#7a5711}
@media(max-width:620px){.clean-home .search-options{grid-template-columns:1fr}.display-colors{grid-template-columns:1fr 1fr}}


/* --- Pantalla principal tipo app móvil --- */
.app-shell{background:#efefef}
.topbar{background:#a97816;border-bottom:none;backdrop-filter:none}
.topbar-inner{max-width:640px;min-height:52px;position:relative;justify-content:center}
.app-like-topbar .icon-btn{position:absolute;left:10px;top:8px;min-height:36px;min-width:36px;padding:6px 10px;border:none;background:transparent;color:#fff;border-radius:8px;font-size:22px}
.app-like-topbar .icon-btn:hover{background:rgba(255,255,255,.12);border:none}
.app-like-topbar #homeBtn{left:auto;right:10px}
.centered-brand{flex:0 1 auto;text-align:center}
.centered-brand h1{color:#fff;margin:0;font-size:clamp(20px,4.8vw,32px);font-weight:800;letter-spacing:0}
.centered-brand p{display:none}
main{max-width:640px;padding:30px 16px 70px}
.home-screen{display:flex;flex-direction:column;align-items:center}
.home-app-card{width:min(100%, 340px);margin:0 auto;background:transparent;border:none;box-shadow:none;padding:0;text-align:center}
.home-label{font-size:17px;font-weight:800;color:#1f1f1f;margin:18px 0 12px}
.home-main-buttons{width:100%;max-width:140px;margin:0 auto;display:flex;flex-direction:column;gap:0;border-radius:4px;overflow:hidden;box-shadow:0 2px 7px rgba(0,0,0,.25)}
.home-main-btn{width:100%;min-height:41px;border:1px solid rgba(255,255,255,.24);background:linear-gradient(180deg,#d9aa42,#b78319);color:#fff;font-weight:800;font-size:18px;text-shadow:0 1px 2px rgba(90,55,0,.45);padding:8px 14px}
.home-main-btn + .home-main-btn{border-top:1px solid rgba(255,255,255,.35)}
.home-main-btn.active{background:linear-gradient(180deg,#c8962f,#9f7112)}

.mobile-search-row{flex-direction:column;align-items:stretch}
.mobile-search-row .btn.gold{min-height:44px;width:100%;background:#b78319;border-color:#b78319;color:#fff}
.search-box input{background:#fff;border:1px solid #ccc;color:#222;border-radius:10px}
.search-box input:focus{border-color:#b78319;box-shadow:0 0 0 3px rgba(183,131,25,.16)}
.clear-btn{color:#666}

.display-color-btn:hover{border-color:#b78319;background:#fff}
.display-color-btn.active{border-color:#b78319;box-shadow:0 0 0 2px rgba(183,131,25,.16)}

.color-dot.light{background:#f7f7f7}

.centered-help{display:block;margin-top:14px;text-align:center;color:#666;font-size:12px}

.reader-toolbar .icon-btn,.btn{background:#ffffff;color:#222;border:1px solid #d2d2d2}
.reader-toolbar .icon-btn:hover,.btn:hover{background:#f5f5f5;border-color:#c5c5c5}
.reader-toolbar .icon-btn.gold,.btn.gold{background:#b78319;border-color:#b78319;color:#fff}
@media(min-width:680px){.list{grid-template-columns:1fr 1fr}}

.home-main-btn{display:flex;align-items:center;justify-content:center;gap:8px}
.home-main-btn .browse-arrow{font-size:15px;transition:transform .16s ease}
.home-main-btn[aria-expanded="true"] .browse-arrow{transform:rotate(180deg)}


/* --- Teclado numérico para búsqueda por número --- */
.number-mode-panel{padding:14px 12px 12px;background:#fdfdfd}
.number-panel-title{font-size:18px;font-weight:900;color:#b2871f;letter-spacing:.03em;text-align:center;margin:2px 0 8px}
.hidden-number-input{position:absolute!important;left:-9999px!important;opacity:0!important;width:1px!important;height:1px!important;pointer-events:none!important}
.sr-only-btn{position:absolute!important;left:-9999px!important;opacity:0!important;width:1px!important;height:1px!important;pointer-events:none!important}
.number-display{min-height:58px;display:flex;align-items:center;justify-content:center;font-size:52px;line-height:1;font-weight:900;color:#8c1d1d;background:#ffffff;border:1px solid #e2e2e2;border-radius:16px;margin:8px auto 14px;max-width:210px;padding:6px 12px;letter-spacing:.04em}
.number-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:280px;margin:0 auto}
.number-key{min-height:56px;border-radius:14px;border:1px solid #d4d4d4;background:linear-gradient(180deg,#ffffff,#f1f1f1);color:#6e6e6e;font-size:28px;font-weight:900;box-shadow:0 2px 5px rgba(0,0,0,.08)}
.number-key:hover{border-color:#c1a24d;background:linear-gradient(180deg,#fffdf7,#f3ebd4)}
.number-key:active{transform:translateY(1px)}
.number-key.action-key{font-size:18px;letter-spacing:.02em;color:#ffffff;background:linear-gradient(180deg,#d3a53a,#b4861b);border-color:#b4861b}
.number-key.action-key:hover{background:linear-gradient(180deg,#dcb14b,#b8891d)}
.number-key.search-key{font-size:17px}
@media(max-width:520px){
  .number-display{font-size:48px;max-width:190px;min-height:52px}
  .number-pad{max-width:100%}
  .number-key{min-height:52px;font-size:26px}
  .number-key.action-key{font-size:16px}
}


/* --- Menú de tres barras para tema --- */
.home-app-card{position:relative}
.theme-menu-wrap{z-index:40}

<script>window.HYMNS=[{"id":1,"title":"JAB'XOJ YOCH AK' HAB'IL","guid":"u8ur3Cx2TEult+Xt+mz5aQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"1 JAB'XOJ YOCH AK' HAB'IL\n \nAutor Chepe Diego"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 90:1-17; Mt. 16:1-4; Sal. 102:23-28 \n \nHa jun mil ab’il, icha nhej yek’ jun k’u a yik ewi, ixta a yol ha sat. Sal. 90:4</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Wan xo wal slajw kan jun ichm hab'il, tik kaw jab'xoj wal yek'i. Kaw jab'xoj wal yoch pax jun ak' hab'il, yuj cha tzonh tzaljek. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ochnh ket' hach Jesucristo, kolwjanh ket' hach Mamin. Kaw wal yel may jak ki jelnal, ak’ ki jelnal het' Mamin."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Toto ixta tz'el wal a sk'ojl Dios,  pitzn honhk to a junx hab'il. Kojxnhej a ki Mam Dios oj kem kuman,  a junx hab'il cha. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Pitzn honhk wal yuj Jesucristo, kaw wal ha aj k'inl aynhek. Ay jun k'ul oj ki k'ochk yet'ok, a stziktznil a jun ejmnhej."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Ha jun ichm hab'il jab'xoj slajw ek' tik, yuj swakh'k'ojlal Dios tz'ek'i.  Tzki nib'j skolwal Dios a junx hab'il cha, a smasnil k'inal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kalk wach' paxti a ki Kolmal, yujto kolb'il nhek yu'uj. Oj ki atk yet' a satkcha'anh, yet' ki wach' Kolmal Jesús."}]},{"id":2,"title":"JUNX HAB'IL","guid":"3UqwJFDzyU21tqoKOcCkbw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"2 JUNX HAB'IL   \n \n C. S. G. # 608. Un Año Más"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 90:1-6, 12-17; Lc. 10:25-37; Heb. 13:13-16 \n \nTil wal sat awb’en tzyak’ a junjn habil ho’oj, hax asun tz’och nhab’il. Sal 65:11</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1   Kaw tzonh tzaljek yuj junx hab'il tik, yujto tzyak' Dios aynhek a matnil.Tzki chamk'ojlejek wal ki Diosal, yik tzki b’onek yik Cristo."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tzin nib’j tzin mulnj a yik Jesús.Tzwaln el spaxti aj tzin ek’i.Tzwaln el schamk’ojlal yik ix chami. Tzin nib’j tzin munlj a Cristo."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Junx hab’il tik wach’ oj wutk hin b’a, hax wa’n hin k’inl yuj hin wach’ kolmal.Manhx jantkok swach’il yik tzwiln yik Dios. Tzin chamk’ojlej yik Cristo."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tzin nib’j tzin mulnj a yik Jesús.Tzwaln el spaxti aj tzin ek’i.Tzwaln el schamk’ojlal yik ix chami. Tzin nib’j tzin munlj a Cristo."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Kaw tzonh tzaljek yuj junx hab'il tik. Kaw manh kojkok b’a’nh oj jawk Jesús. Kaw manh kojkok jantkto ki k’inal. Yuj cha kaw kilk yik Cristo."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tzin nib’j tzin mulnj a yik Jesús.Tzwaln el spaxti aj tzin ek’i.Tzwaln el schamk’ojlal yik ix chami. Tzin nib’j tzin munlj a Cristo."}]},{"id":3,"title":"TZ'EL YICH JUNX AK' HAB'IL","guid":"wKBdOhqczEuIzsqNK70eoA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"3  TZ'EL YICH JUNX AK' HAB'IL\n \nC. S. G. # 610. Principia Un Año Nuevo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 90:1-6, 12-17; 39; Heb.13:13-16, 20-21  \n \nA’ kojkok el honh, to jab’ wal ki k’inl tik honh, sek tzki b’eylb’ej jelnal honh. Salmo 90:12</f></i>"},{"id":3,"tag":null,"isDisplayed":null,"text":"1     A jun ak' hab'il tik, tzki nib'j ha kolwal Mamin, a yol junx hab'il tik, kaw tzki nib'j ha chamk'ojlal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"A jun ak' hab'il tik, oj hach ki’chanh hach Mamin, jun hab'il to kaw oj ki cha smasnil a wach'il."},{"id":4,"tag":null,"isDisplayed":null,"text":"2    A jun ak' hab'il tik, jka'ch wal ki k'ojl aych Mamin,kaw yet' wal ton hep jun, tzonh ha kol a tas ay smay. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ha a niwn chamk'ojlal yet' wal ha wach'k'ojlal jun, kaw tzki nib'j tzki chaj a jun ak' hab'il tik Mamin."},{"id":5,"tag":null,"isDisplayed":null,"text":"3    A jun ak' hab'il tik, tzki nib'j ha kolwal Mamin, sek oj ki b'o tas wach', icha wal tza nib'j Mamin. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Toxnhej a satcha'anh toxnhej a sat lum lum tik, smasnil tas tzki b'o’o, yuj yalx wach' paxti ayach. Amén.\n "}]},{"id":4,"title":"TZONH OCH A JUNX HAB'IL","guid":"ukOGbXaLBkGKlUt0HL936w","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"4  TZONH OCH A JUNX HAB'IL\n \nLajn sjajl yet’ 635 CSG \nF. Y. A. # 371. Ya Llego Un Año Más"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Rom. 13:11-14; Ef. 5:6-20; Col. 3:5-17 \n \n Tzki nib’j honh to niwn kab’ yab’lilal tzak’ kil jak tzaljk’ojlal, icha yab’lil yailal xek’ a kib’nh  honh. Sal. 90:15</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Tzonh k'och a junx hab'il tik, yet' wal skolwal ki Mam Dios. X’e'x kan el jun ichm hab'il a tzaljk'ojlal, "},{"id":3,"tag":null,"isDisplayed":null,"text":"junk'ojlal tzkutjek ki b'a, yuj skhamk'ojlal ki Mam Dios. Smasnil tas tznib'j ki Mam Dios, oj ki b'ok jun."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzki chajek junx hab’il tik, kaw wal yel tzonh tzalj yet’ok tzki chaj wal a tzaljk’ojlal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw tzki chajek junx hab’il tik, yuj tzaljk'ojlal wal aynhek, kaw tzonh tzaljek."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Kaw tzki k'an wal aych Mamin, to kaw tzak' yip ki pixan. A smasnil tas kaw ay smay tzak' ki te'nal, "},{"id":4,"tag":null,"isDisplayed":null,"text":"ha smasnil ha yaxilal, junjn k'u tzak' wal ayonh. Toxnhej wal oj kab’ syail, oj ki munljnhej."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzki chajek junx hab’il tik, kaw wal yel tzonh tzalj yet’ok tzki chaj wal a tzaljk’ojlal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw tzki chajek junx hab’il tik, yuj tzaljk'ojlal wal aynhek, kaw tzonh tzaljek."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Ha smasnil tas kaw ay smay, oj ki cha ki b’a yet'ok. Oj yak’ Jesús ki te’nal ki masnil hek. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Toto tzonh b’eyk yet’ Jesús, aynhek’ a skal sakk’inal, wach'xam ay tas kaw ay smay matz honh xiwek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzki chajek junx hab’il tik, kaw wal yel tzonh tzalj yet’ok tzki chaj wal a tzaljk’ojlal. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kaw tzki chajek junx hab’il tik, yuj tzaljk'ojlal wal aynhek, kaw tzonh tzaljek."}]},{"id":5,"title":"¿AJ HA B'E AJ TZACH ATI?","guid":"JlSwSWE4pUe8J5Mt0FVyDg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"5  ¿AJ HA B'E AJ TZACH ATI? \n \n F. Y. A. # 332.  ¿Rumbo A Donde?"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 14:1-14; Mt. 7:13-14; Col. 1:15-23\n \n  Ha jun b’e tzwal tik, hanton tik. Kojn hin tztak’ hex wi’n at ha aj ay ki Mam Dios. Han tik yel hin, aj kínl hin. Jn.14:6</f></i>"},{"id":3,"tag":null,"isDisplayed":null,"text":"1    ¿Aj ha wal b'e aj tza nib'j tzach ati? Ha Jesucristo b'e yik satcha'anh. "},{"id":4,"tag":null,"isDisplayed":null,"text":"ha hin wach' Kolmal tznib'j tz'och kajn ayach, sek wach' oj ha kan a tzaljk'ojlal jun."},{"id":0,"tag":1,"isDisplayed":null,"text":"Chaj Jesucristo, oj hach yi’ b’eyok;  kaw oj yi’kn el wal ha xiwk’ojlal jun. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw manhxa kusk'ojlal a satcha'anh, oj ha k'och wal a stziktznil ki Diosal."},{"id":2,"tag":null,"isDisplayed":null,"text":"2    ¿Aj ha wal b'e aj tza nib'j tzach ati?Kaw al haj yuj wal ha maysch'olnilal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kotnh a Jesús kaw oj hach yak' iljok, oj kan ha pixn a junk'ojlal yu'uj."},{"id":0,"tag":1,"isDisplayed":null,"text":"Chaj Jesucristo, oj hach yi’ b’eyok;  kaw oj yi’kn el wal ha xiwk’ojlal jun. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw manhxa kusk'ojlal a satcha'anh, oj ha k'och wal a stziktznil ki Diosal."},{"id":3,"tag":null,"isDisplayed":null,"text":"3    ¿Aj ha wal b'e aj tza nib'j tzach ati? ¿Tas yuj tzach at a jun b'e yik chamel? "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw a'ch wal ha k'ojl a ki wach' Kolmal,  yuj wal ki mul ix cham a te kulus. "},{"id":0,"tag":1,"isDisplayed":null,"text":"Chaj Jesucristo, oj hach yi’ b’eyok;  kaw oj yi’kn el wal ha xiwk’ojlal jun. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw manhxa kusk'ojlal a satcha'anh, oj ha k'och wal a stziktznil ki Diosal."}]},{"id":6,"title":"A STI SMAK HATUT AYK' CRISTO","guid":"5d1gCNB+7UqdNiIDDjyBuQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"6  A STI SMAK HATUT AYK' CRISTO\n \nV. C. A. # 70. A Tu Puerta Esta Cristo\n "},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ro. 10:8-10; Heb. 3:7-19 \n \n Ab’ek, icha to wan wawj och a yol smak nha. Ap. 3:20</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     A smak hatut ayk' Jesús, jak ha a; (// jak wal ha pixan //) kaw wal pektix tzach stanhwej, jak wal ha a. (// jak wal ha pixan //)   "},{"id":3,"tag":null,"isDisplayed":null,"text":"Wal tiknek jak a Jesús, yunnal Dios aj satcha'anh, ha oj och kajn aych b'i'an, jak wal ha a. (// jak wal ha pixan //) "},{"id":4,"tag":null,"isDisplayed":null,"text":"  Jak ha pixn a ki Kolmal, jak ha a; (// jak wal ha pixan //) sek oj yak' wal ha kolnb'il, jak wal ha a. (// jak wal ha pixan //)"},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Kaw wal tzach schamk'ojlej jun, oj hach skol a tas ay smay, masnto wal a slajub’ jak wal ha a. (// jak wal ha pixan //)   "},{"id":4,"tag":null,"isDisplayed":null,"text":"¿Tom matz ha chaj wal hab'i? jak ha a; (// jak wal ha pixan //) chaj Jesús ha Kolmalok, jak wal ha a. (// jak wal ha pixan //) "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ayk’ a sti hatut tiknek, kaw oj yak’ ha tzaljk’ojlal.   Sek jal wach’ paxti ha a, jak wal ha a. (// jak wal ha pixan //)"},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Jak wal ha pixn a Jesús, jak ha a; (// jak wal ha pixan //) sek wach' tz'och wak wal het'ok, jak wal ha a. // jak wal ha pixan //   "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yel oj yak' ha niwnk'ojlal, kaw oj hach yi't wal yet'ok; sek tzach k'och a tzaljk'ojlal, jak wal ha a. (// jak wal ha pixan //)   "}]},{"id":7,"title":"Awtb'il Hach","guid":"ZfrdOapK+0i88/+xL3MylQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"7   Awtb'il Hach\n \nC. S. G. # 316. Con Voz Benigna"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 95:1-7;  Jn. 11:17-29; Sal. 100\n \n  Xlajw yaln ix Marta juntik,  ix paxi. Ix at yawtnok kot ix ix snul’ej. K’ultak xyal a ix ixtik: Ix jaw ki Kuymal, to tzach yawtj ati, chi ix. Jn. 11:28</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Awtb'ilch yuj wal ki wach' Kolmal tiknek, Kaw awtb'il hach, yuj schamk’ojlal."},{"id":3,"tag":null,"isDisplayed":null,"text":" Tas yuj ma tza chaj wal hab’ tas tzyala, oj hab’ syal wal hach ajmul."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw awtb'il hach, kaw awtb'il hach; kaw manhx jantkok tznib'j ki Mam Dios tzach yawtj kot tiknek."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Heb’ anma k’unb'nak yuj smul tzyawtj Jesús,yet' schamk'ojlal tz’o'ch sk’ojl a heb’."},{"id":4,"tag":null,"isDisplayed":null,"text":" Ij ejm ha b'a a Jesús ki Kolmal, ha oj kolwjok wal het’ok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw awtb'il hach, kaw awtb'il hach; kaw manhx jantkok tznib'j ki Mam Dios tzach yawtj kot tiknek."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Oj jawk Jesús yuj cha makwjanh an, kaw tza tanhwej yet’ chamk’ojlal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Hach ajmul kaw kotnh a Cristo Jesús, yet’ smasnil ha b’ilk’ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw awtb'il hach, kaw awtb'il hach; kaw manhx jantkok tznib'j ki Mam Dios tzach yawtj kot tiknek."}]},{"id":8,"title":"Chaj Sniwn K'ojlal Jesús","guid":"e/eo0xs6RkC81DEb7+E6sA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"8     Chaj Sniwn K'ojlal Jesús\n \nV. C. # 324. Acepta El Perdón De Jesús"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mt. 11:25-30; Is. 55:1-13 \n \nPalta hach tik, ki Diosal hach honh, kaw tz’o’ch ha k’ojol, ay pax ha niwk’ojlal, wach’xam hanh tik honh, kojn tenmtakl tzki b’o a hojltak honh.  Dn. 9:9</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Kaw yel k'unb'nakch yuj ha maysch'olnilal, Kaw chaj sniwnk'ojlal Jesús tiknek. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Toto tza nib'j tza chaj jun ak' k'inal, chaj sniwnk'ojlal Jesús tiknek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Manhx ha b'o maysch'olnilal, kotnh a Jesús wal tiknek. Kaw ay schamk'ojlal ayach,chaj sniwnk'ojlal Jesús tiknek."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Toto tza nib'j jun ha k'inal kaw wach', chaj wal sniwnk'ojlal Jesús tiknek. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha wal tztak' sb'ikn el ha maysch'olnilal, chaj sniwnk'ojlal Jesús tiknek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Manhx ha b'o maysch'olnilal, kotnh a Jesús wal tiknek. Kaw ay schamk'ojlal ayach,chaj sniwnk'ojlal Jesús tiknek."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Yujto kaw matz tak' wal hoj ha ch'okoj, chaj wal sniwnk'ojlal Jesús tiknek. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Manh hojkok Dios yuj wal tas tza b'o'o, chaj sniwnk'ojlal Jesús tiknek.\n \nCoro\nManhx ha b'o maysch'olnilal, kotnh a Jesús wal tiknek. Kaw ay schamk'ojlal ayach,chaj sniwnk'ojlal Jesús tiknek."},{"id":5,"tag":null,"isDisplayed":null,"text":"4    Toto tza nib'j tzach kan yet' heb' yik Dios, chaj wal sniwnk'ojlal Jesús tiknek. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Toto tza nib'j tzach k'och a satcha'anh, chaj sniwnk'ojlal Jesús tiknek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Manhx ha b'o maysch'olnilal, kotnh a Jesús wal tiknek. Kaw ay schamk'ojlal ayach,chaj sniwnk'ojlal Jesús tiknek."}]},{"id":9,"title":"E'lb'a Wek' A Tik","guid":"bzjSvNDad0aV9mXZQ0VQbA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"9     E'lb'a Wek' A Tik\n \nV.C. # 334. Soy Peregrino Aquí"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Fil. 1:12-30; Fil. 3:20-21; Ap. 21:9-27 \n \nYujto han tik, ya’sb’a pitzn hinto, kojxnhej Cristo nan wu’uj. Hax yik oj hin chami, yel xo wal wach’ wiko’. Fil. 1:21</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Kaw e'lb'a wek' a tik, kaw najt ay jun watut. Ha wal a satcha'anh, hata ay sakk'inal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Schekb' wal Dios waji, yuj jun hin wach' Kolmal, kaw oj wil yik Wajlil Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ab'tek wal yoch jun he kuynb'il, xchi Jesús ki Kolmal ixtik:"},{"id":4,"tag":null,"isDisplayed":null,"text":" Ochnhek a junk'ojlal, xchi Jesús kajlilek, ochnhek a junk'ojlal yet' Dios."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Nak wal he b'a tiknek, aktjek kan maysch'olnil,ochnhek a stojlal Dios; "},{"id":4,"tag":null,"isDisplayed":null,"text":"yiklum tze yutj he b’a. Ha yab’xil kolnb’il kaw yowlal tzwalkn eli, ha tz'a'n ki k’inl a jun ejmnhej."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ab'tek wal yoch jun he kuynb'il, xchi Jesús ki Kolmal ixtik: "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ochnhek a junk'ojlal, xchi Jesús kajlilek, ochnhek a junk'ojlal yet' Dios."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Yel xo wal wach' yilxi, jun katut oj yak' Dios,kaw til wal tzaljk'ojlal; wal a smasnil k’inal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Hanhek yik honhk xo Dios, kaw oj ki k'ochk yet'ok, Ixta yaj yaln kan a Spaxti’."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ab'tek wal yoch jun he kuynb'il, xchi Jesús ki Kolmal ixtik: "},{"id":6,"tag":null,"isDisplayed":null,"text":"Ochnhek a junk'ojlal, xchi Jesús kajlilek, ochnhek a junk'ojlal yet' Dios."}]},{"id":10,"title":"Hach Anma Ab'xnanh A Dios","guid":"4Id8t8MHAU6eM4JJFEayBQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"10   Hach Anma Ab'xnanh A Dios\n \nV.C. # 320. Escucha Pobre Pecador   \n               "},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 6:25-59; 3:1-36\n \n Ha jun tznib’j Dios tze b’o tik. Tznibe’j to tze ya’ch he k’ojl ayin, yujto ha chekjnakn koti, xchi Jesús a heb’. Jn. 6:29.</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Hach anma ab'xnanh wal a Dios, tas oj aj yel ha mul. Kaw kotnh a Jesús tiknek jun, oj hach yak' niwnk'ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Chaj wal Cristo, chaj wal Cristo; yiklum tzotj ha b'a. Oj ha cha wal ha k’inal, a ki Wach’ Kolmal jun."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Yuj wal ki kolchjek kan eli, yuj cha ix el schik'il. Ix cham a te kuls wal ku'uj, yuj wal ki kolchj kani. "},{"id":0,"tag":1,"isDisplayed":null,"text":"Chaj wal Cristo, chaj wal Cristo; yiklum tzotj ha b'a. Oj ha cha wal ha k’inal, a ki Wach’ Kolmal jun."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Kojxnhej Jesús b'e yik k'inal, a'ch wal ha k'ojl ha a, oj hach yik’ b’ey a sakk’inal. Kaw oj hach yak’ iljok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Chaj wal Cristo, chaj wal Cristo; yiklum tzotj ha b'a. Oj ha cha wal ha k’inal, a ki Wach’ Kolmal jun."},{"id":5,"tag":null,"isDisplayed":null,"text":"4    Kotnh a skal heb’ yik xo yaji, aktj kan ha tu b'eyb'al. Oj ha cha junk'ojlal a Dios, yet' pax wal tzaljk'ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Chaj wal Cristo, chaj wal Cristo; yiklum tzotj ha b'a. Oj ha cha wal ha k’inal, a ki Wach’ Kolmal jun."}]},{"id":11,"title":"Ha Jesucristo Wan Hach Yawtni","guid":"8SNZVh1HdUCAzD9G8QhJYQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"11  Ha Jesucristo Wan Hach Yawtni\n \nC. S. G # 312  A Jesucristo Ven Sin Tardar"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Is. 55; Jn. 14:1-10; Mt. 11:25-30 \n \nTzannj hex icha to tz’el he yip he munlji, yet’ hex icha to kaw al he yaj yuj he yikatz, kotnhek ayin, oj hex wak’ iljok. Mt. 11:28</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Ha Jesucristo wan hach yawtni, yujto tznib’j tzach kolchj kan wal eli."},{"id":3,"tag":null,"isDisplayed":null,"text":" Kaw tzach yawtj kot wal a tzaljk’ojlal, lem xchi Jesús ayach."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzaljk'ojlal wal jun ki yamnil, yet’ Jesús wal a smasnil k’inal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha wal ta junxnhej oj kaj yet’ok, wal a smasnil k’inal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Haxnhej Jesús aj ay junk’ojlal,may junk xo mach aj ay tzaljk’ojlal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yujto tznib’j junk’ojlal tzach aji, Kotn a Jesús tiknek"},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzaljk'ojlal wal jun ki yamnil, yet’ Jesús wal a smasnil k’inal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ha wal ta junxnhej oj kaj yet’ok, wal a smasnil k’inal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    ¿Tas yuj ma tza chaj wal hab’ tiknek? Yujto k’ik’an manhxtok aych ek’i, "},{"id":5,"tag":null,"isDisplayed":null,"text":"ay smay toto ma tza chaj hab’i, lem xchi Jesús ayach"},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzaljk'ojlal wal jun ki yamnil, yet’ Jesús wal a smasnil k’inal."},{"id":6,"tag":null,"isDisplayed":null,"text":" Ha wal ta junxnhej oj kaj yet’ok, wal a smasnil k’inal."}]},{"id":12,"title":"Ha Smasnil Mach Tz'ab'ni","guid":"1UJCRHmsukekV42/Z5/sYw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"12    Ha Smasnil Mach Tz'ab'ni    \n  \nV. C. # 296 Todo Aquel Que Oye"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ro. 10:9-17; Ap. 3:20-22; Mt. 11:25-30 \n \nJantnhej heb’ tzab’ni, ya’ kab’ och heb’ xchikn a tas tzyal Espíritu a junjn iglesia. Ap. 2:11</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Ha heb’ tzab’n jun wach’ ab’x tik, yallkab heb’, to ay kolnb'il tzsiyxi yuj swachk'ojlal Dios. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Yal kab’ heb' yab’ smasnil anma to satnak, to wach’ tzjaw heb’ a Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"Smasnil mach tz'ab’ni yowlal j'at yala', ha ki Kolmal Cristo tznib'j tzyak' kolnb'il. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Toto ay mach tznib'j tzchaj niwnk'ojlal yuj smul, kot kab’ a Kajlil Jesús."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Smasnil mach tznib'ni kot kab’ wal heb’ tiknek, jaknto wal sb’el satchanh a heb’ smasnil. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha ki Kolmal Cristo b'e yik satcha'anh, kotnh a ki Kolmal Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"Smasnil mach tz'ab’ni yowlal j'at yala', ha ki Kolmal Cristo tznib'j tzyak' kolnb'il. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Toto ay mach tznib'j tzchaj niwnk'ojlal yuj smul, kot kab’ a Kajlil Jesús."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Kaw yel spaxti Cristo ab' wal hach ajmul, tzach yawtj Jesucristo yuj wal schamk'ojlal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"¿Tzam ha nib'j tzach k'och kajn aj ay ki Mam Dios? Kotnh a ki Kolmal Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"Smasnil mach tz'ab’ni yowlal j'at yala', ha ki Kolmal Cristo tznib'j tzyak' kolnb'il. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Toto ay mach tznib'j tzchaj niwnk'ojlal yuj smul, kot kab’ a Kajlil Jesús."}]},{"id":13,"title":"Icha Smak Nha Yaj Cristo","guid":"/CSFcu3UD0CefQ9Ii53ZxA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"13  Icha Smak Nha Yaj Cristo\n \n             La Puerta Es Cristo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 10:7-21; Mt. 7:13-14; Lc. 13:22 \n \n …A’k he yip he yoch a jun icha smaknha lot’an.  Lc.13:24 </f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Icha smaknha yaj Cristo aj tzonh k'och a satcha'anh. Toto tza nib'j tzach k'och a satcha'anh, chaj hab' spaxti'."},{"id":0,"tag":1,"isDisplayed":null,"text":"¿Aj ha b'e tzach ati? Yujto chab' b'e tz'ati. Kojxnhej Jesús tzkolwji, manhx wal aj ay kolnb'il, ajtil wal tzach ati."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Ay chab' b'e tz'at a jun ejmnhej, ajtil oj ha k'ochi. Jun utzn b'e yik ki Mam Dios, jun niwn b'e yik chamel. "},{"id":0,"tag":1,"isDisplayed":null,"text":"¿Aj ha b'e tzach ati? Yujto chab' b'e tz'ati. Kojxnhej Jesús tzkolwji, manhx wal aj ay kolnb'il, ajtil wal tzach ati."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Kotnh a Jesús aktj kan ha b'eyb'al, chaj wal ha kolnb'il. Sek oj ha cha ha k'inl a jun ejmnhej a satcha'anh."},{"id":0,"tag":1,"isDisplayed":null,"text":"¿Aj ha b'e tzach ati? Yujto chab' b'e tz'ati. Kojxnhej Jesús tzkolwji, manhx wal aj ay kolnb'il, ajtil wal tzach ati."}]},{"id":14,"title":"Jesús Sakk'inlal Yolyib'nhk'inal","guid":"u9XRx0o3GkmCCqTzxyIXmw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"14   Jesús Sakk'inlal Yolyib'nhk'inal\n \nC. S. G. # 157  Jesús Es La Luz Del Mundo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 1:1-14; 9:1-7; Is. 60:1-3, 18-22\n \n …Hach icha to waynak, ij el ha wayanh. K’en wan a skal heb’ icha to chamnkto. Hax Cristo oj a’nk sakk’inl ayach.  Ef. 5:14</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    To satnk heb’ anma, a skal maysch’olnil. Ha Jesús kaw wal sakk'inal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"A skal k'ik’k'inal ix jaw sakk’inlal Dios. Ha Jesús kaw wal sakk'inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Hex ajmul ochnhek a sakk'inal, ixta b'i'an oj jakwok he sat. Pekti matz huj wiln jab'ok hantik, "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha Jesús kaw wal sakk'inal. Toto aychto ek’ wal a skal k'ik'k'inal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Ha Jesús kaw wal sakk'inal. Tzyal Jesús ayach to tza b’o ha b’eyb’al, ha Jesús kaw wal sakk'inal."},{"id":4,"tag":null,"isDisplayed":null,"text":" Ha wal k’ik'k’inal tz’och sakk’inlal yu’uj."},{"id":0,"tag":1,"isDisplayed":null,"text":"Hex ajmul ochnhek a sakk'inal, ixta b'i'an oj jakwok he sat. Pekti matz huj wiln jab'ok hantik, "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ha Jesús kaw wal sakk'inal. Toto aychto ek’ wal a skal k'ik'k'inal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Ha Jesús kaw wal sakk'inal. Oj hel sakk’inal toto wach’ tzotj ha b’a. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ha Jesús kaw wal sakk'inal. Ma oj k'anxok k'u yet' uj a satcha'anh."},{"id":0,"tag":1,"isDisplayed":null,"text":"Hex ajmul ochnhek a sakk'inal, ixta b'i'an oj jakwok he sat. Pekti matz huj wiln jab'ok hantik, "},{"id":6,"tag":null,"isDisplayed":null,"text":"Ha Jesús kaw wal sakk'inal. Toto aychto ek’ wal a skal k'ik'k'inal."},{"id":5,"tag":null,"isDisplayed":null,"text":"4    Ha Jesús kaw wal sakk'inal. Yuj stziktznil ki Dios oj sakb'ok satcha'anh. Ha Jesús kaw wal sakk'inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Hex ajmul ochnhek a sakk'inal, ixta b'i'an oj jakwok he sat. Pekti matz huj wiln jab'ok hantik,"},{"id":6,"tag":null,"isDisplayed":null,"text":" Ha Jesús kaw wal sakk'inal. Toto aychto ek’ wal a skal k'ik'k'inal."}]},{"id":15,"title":"Kaw Wal Sk’ul Ha Jawi","guid":"kzQlp2NnIkSbB4mWs2aLFg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"15   Kaw Wal Sk’ul Ha Jawi\n \nHoy Es Tiempo De Venir."},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 8:31-38; Ap. 20:11-15; Heb. 3:1-19 \n \n…Kotnhek,  b’ok yaj he b’a. Wach’xam ha he mul kaw wal tu’ he yilx yu’uj, palta oj hex hin b’ikli, hax he sakb’ kan icha yilx k’en sakb’akum. Is.1:18</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Kaw wal sk’ulxo ha jawi, yik wal tzab'n spaxti Dios---//Awtb'il hach yuj Kajlil, awtb'il hach yuj Kajlil, kotnh wal hach ajmul//"},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Kaw oj kil wal stziktznial,yik oj jawk wal Kajlilal---//Yik oj kochk a jun smak nha a skal stziktznial, jun b'ob'ilx wal yu'uj.//"},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Manh ha pitb'ok wal ha b'a, oj hach yak' niwnk'ojlal Dios---//A te kuls ix lajwi, wach'xam kaw niwn ha mul, Oj hach yak' niwnk'ojlal.//"},{"id":5,"tag":null,"isDisplayed":null,"text":"4    Kaw kusk'ojlal wal yik heb',heb' maysch'olnil wal sb'eyb'al--- //Yik oj jawk jun k'u cha, oj at heb' a skal k'ak', jun ejmnhej a skal k'ak'.//"}]},{"id":16,"title":"Kotnh A Cristo Jesús","guid":"+y8xQrpFFECOz7o1QB8CLw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"16   Kotnh A Cristo Jesús  \n \n C. S. G. # 310. Pecador Ven a Cristo Jesús"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Stg. 4:7-10;  Jn. 7:37-46;\n \n …Toto ayx tze nib’j tze chaj he k’inl a jun ejmnhej, kotnhek ayin.  Jn. 7:37 1 </f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Kotnh a Cristo Jesús hach ajmul, hax ha kan ton wal a tzaljk'ojlal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Toto yelk'ojlal tza chaj Jesús, oj hach skol wal a jun ejmnhej."},{"id":0,"tag":1,"isDisplayed":null,"text":"// Kotnh ha a, (kotnh ha a) kotnh ha a. (kotnh ha a) Kaw tanhb’ilch yuj wal jun ha Kolmal//"},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Wach'xam tox hach pitb' el yuj ha mul, toto tza chaj wal hab' spaxti Dios. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Oj ilchjok junk’ojlal hoj ha a, oj yak' pax niwnk'ojlal wal ayach."},{"id":0,"tag":1,"isDisplayed":null,"text":"// Kotnh ha a, (kotnh ha a) kotnh ha a. (kotnh ha a) Kaw tanhb’ilch yuj wal jun ha Kolmal//"},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Toto wan ha cham a skal ha mul,ha Jesús tztak’ ya’n b’oxk ha k’ojol. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yujto elnk xchik’l a spenk te kulus, Yuj cha xlajw kan smasnil ha mul."},{"id":0,"tag":1,"isDisplayed":null,"text":"// Kotnh ha a, (kotnh ha a) kotnh ha a. (kotnh ha a) Kaw tanhb’ilch yuj wal jun ha Kolmal//"},{"id":5,"tag":null,"isDisplayed":null,"text":"4    Icha junk kalnelu to satnak, wan sayx ek’ yuj mach to ay yiko. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Ixta tzyutj Cristo hach sayn ek’i, sek wach’ tzach kan yet’ a jun ejmnhej."},{"id":0,"tag":1,"isDisplayed":null,"text":"// Kotnh ha a, (kotnh ha a) kotnh ha a. (kotnh ha a) Kaw tanhb’ilch yuj wal jun ha Kolmal//"}]},{"id":17,"title":"Kotnhek Wal A Jesucristo","guid":"6UHtON8Tz0mHFhHXZ//cUw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"17   Kotnhek Wal A Jesucristo\n \nV. C. # 147   Ved La Fuente Sanadora"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 4:14; Jn. 7:37-39; Ap. 21:6\n \n Palta hax heb’ tz’u’n jun ha tzwak’a, manhx b’a’nh oj kot stakntil heb’ jun ejmxo. Jn. 4:14</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Ha jun ha spak’b’a kaw wal wach', ix yak’ wal ki wach’ Kolmal."},{"id":3,"tag":null,"isDisplayed":null,"text":" Kaw tzyak’ sikb’ok wal ki pixan, kaw wal yel niwn ton ye’lchi."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wach’ jun spak’b’a tik xyak’ ki Kolmal, kaw tz’ajx a smasnil heb’ anma'. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw wach’ jun spak’b’a tik xyak’ ki Kolmal, yujto kaw ha hin kolni."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Ha wal jun ha spak’b’a tik jun, ix ilchj niwnk’ojlal wu’uj. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ix yij el smasnil maysch’olnil, to aych wal a hin pixan."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wach’ jun spak’b’a tik xyak’ ki Kolmal, kaw tz’ajx a smasnil heb’ anma'. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw wach’ jun spak’b’a tik xyak’ ki Kolmal, yujto kaw ha hin kolni."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Kaw yet' wal jun ha spak’b’a tik, Kaw tzyak’ Jesús ki k’inal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kotnhek he masnil hex ya’ay, Kaw iltek wal swach’k’ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wach’ jun spak’b’a tik xyak’ ki Kolmal, kaw tz’ajx a smasnil heb’ anma'. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kaw wach’ jun spak’b’a tik xyak’ ki Kolmal, yujto kaw ha hin kolni."},{"id":5,"tag":null,"isDisplayed":null,"text":"4    Ha wal jun ha spak’b’a tik jun, kaw tzyak’ b’oxk wal ki k’ojol. Kotnek wal a Jesucristo, oj he b’ox kan wal yu’uj."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wach’ jun spak’b’a tik xyak’ ki Kolmal, kaw tz’ajx a smasnil heb’ anma'. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kaw wach’ jun spak’b’a tik xyak’ ki Kolmal, yujto kaw ha hin kolni."}]},{"id":18,"title":"¿Mach Tznib’j Tz'och Tza’n Yu’uj?","guid":"YO45lPYeLUemZDmIO4i1vw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"18     ¿Mach Tznib’j Tz'och Tza’n Yu’uj?\n \nV. C. # 253 ¿Quién Seguirle Quiere?"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Heb. 10:23; 2 Cor. 7:1-2; Is. 6:8-9\n \n Kaw te’n tzkutjek ka’n och yipk ki k’ojol jun aj tzkal ki b’a. Manh chab’kojlalk tzkutjek ki b’a. Heb. 10: 23</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ha mach yel tz’och tza’n yuj ki kolmal Jesús, Sch’ox kab’ el ste’nal yik tzyaln el spaxti Dios."},{"id":3,"tag":null,"isDisplayed":null,"text":" Yet’ wal emmkilal tzmunlj a yik ki Mam Dios, kaw yiklumnhej tzyutj sb'a wal a spaxti Dios."},{"id":0,"tag":1,"isDisplayed":null,"text":"¿Mach junk oj halnok yet' sti a ki Kolmal, hach hin wach' Kolmal jun, waj Mamin chek hin? "},{"id":4,"tag":null,"isDisplayed":null,"text":"¿Mach junk oj halnok yet' sti a ki Kolmal, hach hin wach' Kolmal jun, yiklum hin ayach?"},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ha mach aych sk'ojl a ki wach' Kolmal Jesús,Yalkab’ wach’ paxti a sb’i ki wach’ kolmal "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha Jesús ki kolmal ha honh kolnek jun ki b'ok icha tznib'ej tzkalnek el yab'xil."},{"id":0,"tag":1,"isDisplayed":null,"text":"¿Mach junk oj halnok yet' sti a ki Kolmal, hach hin wach' Kolmal jun, waj Mamin chek hin?"},{"id":5,"tag":null,"isDisplayed":null,"text":" ¿Mach junk oj halnok yet' sti a ki Kolmal, hach hin wach' Kolmal jun, yiklum hin ayach?"},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ha heb' yel tzya'ch sk'ojl a ki Kolmal Jesús, ha wal a ki kolmal hata tzkol sb’a heb’."},{"id":5,"tag":null,"isDisplayed":null,"text":" Kaw may schab’k’ojlal heb’ a ki wach’ kolmal, kaw tzaljkoyk ki smasnil yuj wal swach’kojlal "},{"id":0,"tag":1,"isDisplayed":null,"text":"¿Mach junk oj halnok yet' sti a ki Kolmal, hach hin wach' Kolmal jun, waj Mamin chek hin?"},{"id":6,"tag":null,"isDisplayed":null,"text":" ¿Mach junk oj halnok yet' sti a ki Kolmal, hach hin wach' Kolmal jun, yiklum hin ayach?"}]},{"id":19,"title":"May Hin Wach’il","guid":"v/TvnOqUVUux+dSx2QA4mA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"19   May Hin Wach’il\n \nC. S. G. # 308. Tal Como Soy"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 6:38-40; 10:1-15;  5:36-40 \n \nXyaln win unnab’il chi ix tik: Mamin,   kaw x’och hin mul a Dios. X’och pax hin mul ayach. Hax tiknek,  manhx smojk tzin hal honnalok, xchi win a smam cha.  Lc. 15:21</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kaw may hin wach’il hach hin Kolmal Jesús,kaw wal manh hin mojk tzin jaw ayach. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Yuj ha wach'k'ojlal tzin hawtej, hach Cristo yuj cha tzin jaw aych tiknek Mamin. "},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Kaw wal may hin wach’il hach hin wach' Kolmal,kaw tzin sayk' hin junk'ojlal tiknek."},{"id":4,"tag":null,"isDisplayed":null,"text":" Kaw wal al yaj hin pixn yuj hin mul jun. Hach hin Diosal waj tiknek Mamin."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Kaw wal may hin wach’il kaw tu hin nab'en, kaw hin hanhtej yik hin jaw ayach. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yujto xwa’ch yipk hin k’ojl halb’en. Cristo hin Kolmal, kaw waj tiknek hach Mamin."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Kaw may hin wach’il hach hin Kolmal Jesús, ayn ek’ a skal mul, hin ha kolni."},{"id":6,"tag":null,"isDisplayed":null,"text":" Hek xo waj tiknek hach hin Dios, Mamin may junk xo mach icha hach hin Kolmal"}]},{"id":20,"title":"Na Wali","guid":"TsSzZ/JlD0qT3pmU3xa7Zw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"20   Na Wali\n<fWide Latin> \n</f>Decídate."},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mt. 11:25-30; Lc.19:1-10; Mt. 24:29-44 \n \nTzannhj hex icha  to tz’el he yip he munlji, yet’ hex icha  to kaw al he yaj yuj he yikatz, kotnhek ayin, oj hex wak’ iljok. Mt.11:28</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Hach anma awtb'ilch yuj Cristo, yik tza chan wal jun ha k’inal. Toto matz ha chaj hab' tiknek, oj ha at a skal yail."},{"id":0,"tag":1,"isDisplayed":null,"text":"Chaj wal Jesús ha kolmalok, ya'sb'a mantzak hach chami. Chaj wal Jesús ha Kolmalok, sek oj ha kolchj kan eli."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     A'ch ha k'ojl a Jesucristo,sek oj ha cha wal ha k’inal. Tzaljk'ojlal oj kan ha pixan, toto tza chaj wal tiknek. "},{"id":0,"tag":1,"isDisplayed":null,"text":"Chaj wal Jesús ha kolmalok, ya'sb'a mantzak hach chami. Chaj wal Jesús ha Kolmalok, sek oj ha kolchj kan eli."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Jab'xoj wal sjaw Jesucristo. ¿Tas yuj matz ha chaj tiknek jun? Ay skusk'ojlal wal ha pixan, yujto matz ha chaj Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"Chaj wal Jesús ha kolmalok, ya'sb'a mantzak hach chami. Chaj wal Jesús ha Kolmalok, sek oj ha kolchj kan eli."}]},{"id":21,"title":"Tik Tzin Jaw Aych Mamin","guid":"0OUqAiewFke/xiNr1OlIew","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"21     Tik Tzin Jaw Aych Mamin"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ef. 2:1-10; Ro. 12:1-8; Ap. 5:9-10\n \n Kotnhek, em koyk kuman yik tzonh ochk emmkilal a Jehová, em koyk kumn ha a, yujto ha b’ojnaknhek.  Sal. 95:6</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Tik tzin jaw wal aych Mamin, a sb'i Jesús hin wach' Kolmal. Kaw sik'b'ilnxo och honnalok, yuj Jesús hin wach' Kolmal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw sakx waj yuj schik'l hin Kolmal Jesús, tzin k'och a hojltak Mamin. Ha Espíritu tzin kuyn yik, tzin och emmkilal ayach."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ha pekti kaw satnk hin jun, ayn at a skal maysch'olnil. Kaw yuj wal ha chamk'ojlal jun, tzin hej at a satcha'anh. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Hach ix ha suk sat smasnil wal hin mul, kaw ix hak' niwnk'ojlal ayin. Kaw wach'xo wilx yuj ha chik'il, hek hin a smasnil k'inal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Emmkilal tzin jaw aych Mamin, yujto kaw Dios ton wal hach. Kolb'iln xo yuj hin wach' Kolmal, yuj ha wach'k’ojlal ayin. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw oj hin k'och wal het' hach hin Diosal, yujto manb'ilnxo wal ho'oj. kaw oj hin b'itnok jun ak' b'it, yik oj hin k'och het' Mamin."}]},{"id":22,"title":"¿Tox Ham Xa Chaj Cristo?","guid":"t2m6rWqPJ0q3TWt7GNTskw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"22    ¿Tox Ham Xa Chaj Cristo?\n \nC. S. G. # 304 ¿Has Hallado En Cristo?"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>1 Jn. 1; Ro. 5:1-11;  3:21-28\n \n …Hax xchik’l Jesucristo Yunnnal, ha tz’i’n el samasnil ki mul aych aynhek.  1 Jn 1:7</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     ¿Tox ham xa chaj Cristo ha wach' Kolmalok? ¿Sakx ham wal ha pixn yuj schik'l Jesús? "},{"id":3,"tag":null,"isDisplayed":null,"text":"¿Aym ha junk'ojlal yuj ix yij el ha mul? ¿Sakx ham wal ha pixn yuj schik'l Jesús?"},{"id":0,"tag":1,"isDisplayed":null,"text":"¿Sakx ham wal (sakxam wal)ha pixan,(ha pixan) yuj Jesús yuj ix elkn schik'il?(schik’il) "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kojn heb’ sakx yaj spixn oj k’och yet’ ki Mam Dios. ¿Sakx ham wal ha pixn yuj schik'l Jesús?"},{"id":3,"tag":null,"isDisplayed":null,"text":"2     ¿Kajn hach ham a stz'ey Jesús a jun jun k'u? ¿Sakxam wal ha pixn yuj schik'l Jesús? "},{"id":4,"tag":null,"isDisplayed":null,"text":"¿Hojkam yipal Cristo a yib'nh smasnil mul? ¿Sakxam wal ha pixn yuj schik'l Jesús? "},{"id":0,"tag":1,"isDisplayed":null,"text":"¿Sakx ham wal (sakxam wal)ha pixan,(ha pixan) yuj Jesús yuj ix elkn schik'il?(schik’il) "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kojn heb’ sakx yaj spixn oj k’och yet’ ki Mam Dios. ¿Sakx ham wal ha pixn yuj schik'l Jesús?"},{"id":4,"tag":null,"isDisplayed":null,"text":"3     ¿Yik oj jawk Jesús sakxam yaj ha pixan, yuj wal xchik’l Jesucristo ki Kolmal? "},{"id":5,"tag":null,"isDisplayed":null,"text":"¿Toto tzjaw Jesús ki wach' Kolmal tiknek? ¿Sakx ham yaj ha pixn yuj schik'l Jesús?"},{"id":0,"tag":1,"isDisplayed":null,"text":"¿Sakx ham wal (sakxam wal)ha pixan,(ha pixan) yuj Jesús yuj ix elkn schik'il?(schik’il) "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kojn heb’ sakx yaj spixn oj k’och yet’ ki Mam Dios. ¿Sakx ham wal ha pixn yuj schik'l Jesús?"},{"id":5,"tag":null,"isDisplayed":null,"text":"4     ¿Tzam ha nib'j niwnk'ojlal yet’ pax junk’ojlal? Kojn ay niwnk'ojlal yuj wal schik'l Jesús."},{"id":6,"tag":null,"isDisplayed":null,"text":" ¿Tzam ha nib'j tzach kolchj kan el a skal yail? Chaj wal niwn'kojlal ay yuj schik'l Jesús. "},{"id":0,"tag":1,"isDisplayed":null,"text":"¿Sakx ham wal (sakxam wal)ha pixan,(ha pixan) yuj Jesús yuj ix elkn schik'il?(schik’il) "},{"id":7,"tag":null,"isDisplayed":null,"text":"Kojn heb’ sakx yaj spixn oj k’och yet’ ki Mam Dios. ¿Sakx ham wal ha pixn yuj schik'l Jesús?"}]},{"id":23,"title":"¿Tzam Ha Nib'j Tza Chaj Ha Kolnb'il?","guid":"86xchZ+ubUCG0A06V39ALQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"23     ¿Tzam Ha Nib'j Tza Chaj Ha Kolnb'il?\n \nC. S. G. # 311 ¿Quieres Ser Salvo?"},{"id":2,"tag":null,"isDisplayed":null,"text":"<fMicrosoft Himalaya>Ap. 12:10-12; Col. 1:9-14; Ap. 5\n \n Hatn Yunnal chi honh kolnek eli, ( yujto xcham kujek). Col. 1:14</f>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    ¿Tzam ha nib'j tzach kolchj a skal maysch'olnil? Kaw tztak' yuj Jesús, kojxnhej Jesús."},{"id":3,"tag":null,"isDisplayed":null,"text":" ¿Tzam ha nib'j tzach b’ey a swach'ilal Dios? Kaw smasnil tztak' wal yuj Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal tztak' yuj ki Kolmal Jesús, ix cham a te kulus. Kaw wal tztak' yuj ki Kolmal Jesús, ix cham a te kuls ku'uj."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    ¿Tzam ha nib'j tzakkan smasnil tu b’eyb’al? Kaw tztak' yuj Jesús, kojxnhej Jesús. "},{"id":4,"tag":null,"isDisplayed":null,"text":"¿Tzam ha nib’j tzkan mayxcholnilal ho’oj? Kaw smasnil tztak' wal yuj Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal tztak' yuj ki Kolmal Jesús, ix cham a te kulus. Kaw wal tztak' yuj ki Kolmal Jesús, ix cham a te kuls ku'uj."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     ¿Tzam ha nib'j tza b’o wal yik ki Mam Dios? Kaw tztak' yuj Jesús, kojxnhej Jesús. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Oj ha kolchj kan wal el yuj xchamk’ojlal, kaw smasnil tztak' wal yuj Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal tztak' yuj ki Kolmal Jesús, ix cham a te kulus. Kaw wal tztak' yuj ki Kolmal Jesús, ix cham a te kuls ku'uj."}]},{"id":24,"title":"¿Tzam Ha Nib'j Tzach Kan Yet’ Jesús?","guid":"fUGBn0GR30CDy0hsbFXnDQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"24     ¿Tzam Ha Nib'j Tzach Kan Yet’ Jesús? \n  \nV. C. # 293 ¿Quieres Siempre Por Jesús Vivir?"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mt. 7:13-14; 2 Cor. 6:1 …\n \nYujto ha tzaln ixk a Ch’anh U’unh:…Xk’och sk’ul wa’n ha kolnb’il, xchi Dios. …2 Cor. 6:2</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     ¿Tzam ha nib'j tzach kolchj kan yuj Jesús ki wach' Kolmal? ¿Tzam ha nib'j tzach b'eyk' wal yet' Jesús tiknek? "},{"id":3,"tag":null,"isDisplayed":null,"text":"¿Tzam ha nib'j tzach skol Jesús yik ay ha kusk'ojlal? Sb'o kab' icha tznib'j ayach."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw oj och Jesús het' a junjn k'u, kaw hach kolchj kan el wal a skal ha mul. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Tzach schamk'ojlej Dios a smasnil k’inal, yuj cha kaw ay ha tzaljk'ojlal tiknek."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     ¿Tzam ha nib'j tzach kolchj kan el a skal maysch'onililal? ¿Tzam ha nib'j tza chaj junk'ojlal tzyak' Jesús? "},{"id":4,"tag":null,"isDisplayed":null,"text":"¿Tzam ha nib'j skolwal Jesús yik matz och wal ha mul? Sb'o kab' icha tznib'j ayach."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw oj och Jesús het' a junjn k'u, kaw hach kolchj kan el wal a skal ha mul. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Tzach schamk'ojlej Dios a smasnil k’inal, yuj cha kaw ay ha tzaljk'ojlal tiknek."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     ¿Tzam ha nib'j tzaljk'ojlal tzach kan a yol sk'ab' Jesús? Sek wach' oj och het' wal a smasnil k'inal."},{"id":5,"tag":null,"isDisplayed":null,"text":" ¿Tzam ha nib'j kaw yiklum tzotj ha b'a a ki Mam Dios? Sb'o kab' icha tznib'j ayach."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw oj och Jesús het' a junjn k'u, kaw hach kolchj kan el wal a skal ha mul. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Tzach schamk'ojlej Dios a smasnil k’inal, yuj cha kaw ay ha tzaljk'ojlal tiknek."}]},{"id":25,"title":"Tzin B'itnej Hin Kolmal","guid":"43rE7pLmfEqs6hA/NDPTyA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"25     Tzin B'itnej Hin Kolmal\n \n V. C. # 119 Le Canto A Mi Señor  "},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 29:10-11; Sal. 108:1-6; Hch. 16:23-34 \n \nHach hin Diosal, kaw yipk’ojll haj wu’uj. Kaw tzin nib’j tzach hin b’itnej, tzwaln hin wach’ paxti ayach. Sal. 108:1</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Tzin b'itnej wal Wajlil, aych wal hin k'ojl ha a; tzin b'itnej hin Kolmal yujto Wilmal yaji."},{"id":3,"tag":null,"isDisplayed":null,"text":" Kaw wal tzin chamk'ojlej, yet’ pax wal swach'k'ojlilal jun. Tzin yak' wal niwnk'ojlal, yujto manb'iln yu'uj."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     zaljk'ojlal xo waji, ha Jesús tzin kolni; kaw ayk'nhej wal wet'ok, tzyak' pax yipal ayin. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Oj hin k'och yet' hin Dios, wal aj kajn ek' a satcha'anh. Kaw wal oj hin b'itnok, yet' smasnil wal wipal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Kaw tzaljk'ojlal yik mach, tzya'ch sk'ojl a hin Kolmal; kaw ay yipal hin Dios, kaw ay pax schamk'ojlal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Wach'xam oj yab' syail, kaw oj yak' sjunk'ojlal ha a. May b’anh oj yak’ kus heb’, smasnil heb’ to yikxo,"}]},{"id":26,"title":"Tzwab’ Hin Yawtn Hin Kolmal","guid":"HiszTIQ+vkqGdt4JfMYcfg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"26   Tzwab’ Hin Yawtn Hin Kolmal \n \nV.C.A. 169 Puedo Oir Tu Voz Llamando"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 10:27; Mt. 16: 24, 1 P. 1:15-19\n \n Ha heb’ wiko’, tzya’ch heb schikn ayin. Hanxo tik, wojk heb’. Jn.10:27</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     ///Tzwab’ hin yawtn hin kolmal Cristo/// Tza’n hin och yuj wal hin wach’ Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"///Oj hin at het aj tzach at jun./// Kaw oj woch tza’nhej ton wal het’ok."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    ///Han tik oj wab’ syal yet’ Cristo/// Junjn k’u oj yak’ yip hin pixan."},{"id":0,"tag":1,"isDisplayed":null,"text":"///Oj hin at het aj tzach at jun./// Kaw oj woch tza’nhej ton wal het’ok."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     ///Oj wab’ syal het’ hach hin kuymal./// Oj hin cham het’ hach Cristo Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"///Oj hin at het aj tzach at jun./// Kaw oj woch tza’nhej ton wal het’ok."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     ///Kaw oj hak’ ha tziktznil ayin/// Tzwak’ hin b’a aych a smasnil k’inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"///Oj hin at het aj tzach at jun./// Kaw oj woch tza’nhej ton wal het’ok."}]},{"id":27,"title":"E’nhk Hin A Skal Mul","guid":"/bCD/UBYkkiIvuExRtulMA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"27 E’nhk Hin A Skal Mul\n \nV. C. # 235  Yo Vivia En El Pecado"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Hch. 8:26-39; Ro. 6:1-11; Gá. 3:23-28\n \n … Ha a yik yalanh, chammk honk a sat yuj ki mulek, yuj pax ki maysch’olnilal. Ef. 2:1</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ha pekti ayn at a skal mul, chuk kuynb’ilal wal tzin yiklej.    Kaw wal yel satnk hin ton jun, wan hin at a skal yail."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tiknek kolb'iln xo a syail, yet' hin Cristo tzin ati. Ha yik tzin ejm a yol ha', ch'ox to manhx wajlok maysch’olnil."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Kaw kusk'ojlal yaj hin pixan, yujto may hin junk'ojlal. Jesucristo ix yal ayin, to kaw wal tzin yak' iljok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tiknek kolb'iln xo a syail, yet' hin Cristo tzin ati. Ha yik tzin ejm a yol ha', ch'ox to manhx wajlok maysch’olnil."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Hin sman Cristo yet’ wal schik’il, kaw tzin smol wal a junk’ojlal."},{"id":5,"tag":null,"isDisplayed":null,"text":" Ha Espíritu tzin smolo, ha tzin tojlb'tzan paxi."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tiknek kolb'iln xo a syail, yet' hin Cristo tzin ati. Ha yik tzin ejm a yol ha', ch'ox to manhx wajlok maysch’olnil."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Ha pekti' chamnk hin yuj mul jun, hal tiknek pitzn hin yet' Cristo. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Manhx jstak' woch yiko’ok stu’al, yujto kaw yik hin xo Dios."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tiknek kolb'iln xo a syail, yet' hin Cristo tzin ati. Ha yik tzin ejm a yol ha', ch'ox to manhx wajlok maysch’olnil."},{"id":6,"tag":null,"isDisplayed":null,"text":"5      Ha wal yik tzin ejm a yola’, tzin ch'oxli to yik hin Cristo.     "},{"id":7,"tag":null,"isDisplayed":null,"text":"Yik xin chaj wal Jesucristo, ix hin chaj wal hin kolnb'il."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tiknek kolb'iln xo a syail, yet' hin Cristo tzin ati. Ha yik tzin ejm a yol ha', ch'ox to manhx wajlok maysch’olnil."}]},{"id":28,"title":"Hanhek Tzonh Ejmek A Yola’","guid":"g8lZJUiiyUCAiDq77MJUtA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"28  Hanhek Tzonh Ejmek A Yola’ \n \nC. S. G. # 513. Los Que Somos Bautizados"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Hch. 8:26-38; Ro.  6:3-14; Mt. 28:16-20 \n \n¿Mamtzak stak’ tzin hak’ bautizar tiknek? xchi winak. Tztak’a, toto smansnil ha k’ ojol, tza’ch ha k’ojl a Cristo xchi a winak. Tzwa’ch a hin k’ojol, chajtlto ha Jesucristo, yunnal Dios, xchi winak. Hch. 8:36-37</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1       Hanhek tzonh ejmek a yola’, icha ki Kolmal Jesús yik tzki ch’oxnek el wal ki b’a yet’ jun ki wach’ Kolmalek. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw wal junxnhej honh aj ki mukxek jun, yet' wal ki wach' Kolmal Jesús. Yik tzki ch’oxnek el ki Kolmal, yik ix cham a te kulus."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Yujto xka'k och a ki k'ojol, yuj cha tzon ejm a yola’, tox honh pitzwek pax yet' Cristo, yuj wal swach'k'ojlal aynhek."},{"id":4,"tag":null,"isDisplayed":null,"text":" Ha tiknek manhxtok tzki b’ok maysch’olnil, tox ix b'o wal ki nab'enek. Tza'n honhk och yuj Jesucristo, yujto ha x'a'n ki k'inlek."},{"id":4,"tag":null,"isDisplayed":null,"text":"3         Tzonh tzaljek yuj Jesucristo, yujto xyij el ki mulek, tiknek kolchjnaknhek yuj Cristo, yujto xyak' cham sb'a kujek. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw yel niwn schamk'ojlal ki wach' Kolmal, yujto ix yak' cham sb'a kujek. Yuj cha manhxtok kikek ki b'a, haxnhej Dios aynhek yiko."}]},{"id":29,"title":"Ha Jesús Hin Wach' Kolmal","guid":"I0JVTCoa+EywRJOqZysw5Q","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"29       Ha Jesús Hin Wach' Kolmal "},{"id":2,"tag":null,"isDisplayed":null,"text":"<i>Jn. 3:1-21; Ro.  6:1-2; \n \n</i><i><fMicrosoft Uighur>Palta ha heb’ tzyiklni icha tzyal jun kuynb’il kaw yel, tzchaj heb’ jun sakk’inl tik, sek wach’ tzcheklj eli to aych Dios yet’ heb’ yuj tas tz’o’o.   Jn. 3:21</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     ///Ha Jesús hin Wach' Kolmal/// hin kolchj kan wal el yu'uj."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      ///Ha Jesús x'a'n hin k'inal/// xyak' hin k'inl yet' hin kolnb'il."},{"id":4,"tag":null,"isDisplayed":null,"text":"3       ///Manhxtzak hin nib'j tz'och hin mul/// sek matz och hin mul a Dios."},{"id":5,"tag":null,"isDisplayed":null,"text":"4       ///Chaj Jesús ha Kolmalok/// sek oj ha kolchj kan wali."},{"id":6,"tag":null,"isDisplayed":null,"text":"5     ///Oj yak' Dios sjelnal ayach/// yik jnachjok wal el ho’oj."},{"id":7,"tag":null,"isDisplayed":null,"text":"6        ///Ha Dios tzyab' wal ki lesal/// oj yak' wal syaxil ayonh."}]},{"id":30,"title":"Ix Yij Kan EL Hin Mul","guid":"boGvLSBMO0atzfk8msIClA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"30     Ix Yij Kan EL Hin Mul \n \nC. S. G. # 336   Mi Culpa El Llevo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Is. 53; 1 P. 2:21-25; Ro. 6:8-15\n \n Hanhjtona Cristo, jun ejm wal milxnak xamb’ alil, sek wach’ kaw niwnhonhek tz’el ki mul yu’uj. He. 9:28</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Kaw k'unb'nak hin, hin jaw a hin Kolmal, ix yij kan el hin mul, ix yij kan el hin mul. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Hin k’inl ix chax yuj swach'k'ojlal Jesús, ix yij kan el hin mul."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ix yij kan el hin mul, ix yij kan el hin mul; kaw tzaljk'ojlal oj hin b'itnok. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Tzaljk’ojlal tzin b’itnej sb’i Wajlil. Yujto ha hin kolni."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Sukb'il xo el smasnil hin maysch'olnil, ix yij kan el hin mul, ix yij kan el hin mul. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Oj hin b'itnok wach' paxti a Jesús, ix yij kan el hin mul."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ix yij kan el hin mul, ix yij kan el hin mul; kaw tzaljk'ojlal oj hin b'itnok. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Tzaljk’ojlal tzin b’itnej sb’i Wajlil. Yujto ha hin kolni."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Manhxa yowl sk'ojl wal ki Mam Dios ayin, ix yij kan el hin mul, ix yij kan el hin mul. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Tiknek ay junk'ojlal a hin pixan, ix yij kan el hin mul."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ix yij kan el hin mul, ix yij kan el hin mul; kaw tzaljk'ojlal oj hin b'itnok."},{"id":6,"tag":null,"isDisplayed":null,"text":" Tzaljk’ojlal tzin b’itnej sb’i Wajlil. Yujto ha hin kolni."},{"id":5,"tag":null,"isDisplayed":null,"text":"4        Toto tza chaj Jesús ha wach' Kolmal, ha oj i'nk el ha mul, ha oj i'nk el ha mul. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Oj hach yak' niwnk'ojlal yuj smasnil mul, ha oj i'nk el ha mul."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj yi’kn el wal ha mul, oj yi'nk el wal ha mul, ha oj b’iknk el ha pixan.  Kaw tzaljk’ojlal ja b’itn ha a Kolmal, yujto xyij el ha mul."}]},{"id":31,"title":"Tzin Ejm A Yola Icha Tznib’j Ki Kolmal","guid":"0/owz//16U6smuP8hRX9ig","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"31 Tzin Ejm A Yola Icha Tznib’j Ki Kolmal\n \nSoy bautizado como manda el Salvador"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ro. 6:1-14; Mt. 28 19; Gá. 3:27 \n \nYik wan s’at heb’ ha yol b’e, ix k’och heb’ aj ay jun ha a’. ix yaln win aj Etiopía chi a Felipe ixtik: Yaj jun ha a tik. ¿Mamtzak stak’ tzin ak’ bautizar tiknek? Xchi winak. Hch. 8:36</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1       Kaw ix wak' bautizar hin b'a a yol jun ha', kaw oj hin b'o icha tznib'j hin wach' Kolmal jun. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Hin wach' Kolmal ix suksat hin maysch'olnilal, sek wach' yilx hin pixan yik oj hin k'och yet'ok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj hin at yet' hin Jesús, kaw tox ix wakkan smasnil maysch'olnilal jun. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ochnh wet' hach hin Kolmal, kaw wal tzin nib'j tzin b'eyk' yet’ wal a swach'ilal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Ha wal a pekti', kaw yel tu yilx hin b’eyb’al. Hal tiknek yik hin xo hin wach' Kolmal Jesús. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Tzaljk'ojlal yaj hin pixn yuj hin wach' Kolmal. Kaw wal manhx oj hin b'eyk' a skal maysch'olnilal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj hin at yet' hin Jesús, kaw tox ix wakkan smasnil maysch'olnilal jun. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ochnh wet' hach hin Kolmal, kaw wal tzin nib'j tzin b'eyk' yet’ wal a swach'ilal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Yuj wal ix wa'ch hin k'ojl a Jesús hin Kolmal, yuj wal cha kaw ayx hin kolnb'il a jun ejmnhej. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Tzin k'an a Dios to tzin smol yet' schamk'ojlal jun, sek wach' yilx hin pixan, yik 'oj hin k'och yet'ok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj hin at yet' hin Jesús, kaw tox ix wakkan smasnil maysch'olnilal jun. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Ochnh wet' hach hin Kolmal, kaw wal tzin nib'j tzin b'eyk' yet’ wal a swach'ilal."}]},{"id":32,"title":"Tzwab' Sjaj Jun Wach’ Ilm Kalnelu","guid":"ZSTgO+mYrEmOUobLAiZrdA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"32  Tzwab' Sjaj Jun Wach’ Ilm Kalnelu \n \nV. C. # 254 Oigo La Voz del Buen Pastor"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ez. 34:11-16; Jn. 10:11-13 \n \nHan tik, laj hin yet’ jun ilm kalnelu kaw wach’. Jn.10:11</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Tzwab’ sjaj jun wach’ ilm kalnelu, a kusltak aj k'ik'k'inal. Tzyawtj win no skalnelu satnak, no satnk a skal k'ik'k'inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tzyawtj kot heb', yet’ swach’il, kaw tznib’j tzkolkn el heb’, a skal smul jun, kotnh ayin, xchi Jesús, hatn Cristo ki Kolmal jun."},{"id":3,"tag":null,"isDisplayed":null,"text":"2         ¿Mach heb' oj kolwjok yet' Jesús, yik tzsayn ek' wal heb' satnkto. ¿Mach oj i'nok b’ey wach’ ab’ ix, yabxil kolnb’il a heb’ ajmul."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tzyawtj kot heb', yet’ swach’il, kaw tznib’j tzkolkn el heb’, a skal smul jun, kotnh ayin, xchi Jesús, hatn Cristo ki Kolmal jun."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Kusltak yaj yolyib’nhk’inal, kaw b’utjnak wal yet’ tas ay smay. Yuj cha kotnh ayin xchi Jesús, at ijkot heb’ to satnhkto."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tzyawtj kot heb', yet’ swach’il, kaw tznib’j tzkolkn el heb’, a skal smul jun, kotnh ayin, xchi Jesús, hatn Cristo ki Kolmal jun."}]},{"id":33,"title":"Ayx Ki Chonhb'ek A Satcha'anh","guid":"hCRggGEO7Eq7Nsw2QkVlJA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"33   Ayx Ki Chonhb'ek A Satcha'anh\n \nE. D. W. # 20.  Hay Mansiones En El Cielo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ap. 22:1-5; Zac. 14:11; Jn. 14:1 …\n \nHa a jun chonhb cha, hata ayk’ Dios aj tzyak’ yajlil yet’ jun tzkuch Kalnelu.  Ap.22:3</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Ayx ki chonhb'ek a satcha'anh, wach' yaj yuj ki wach' Kolmal."},{"id":3,"tag":null,"isDisplayed":null,"text":"Yowlal oj at kilk jun chonhb' cha, wal aj ayk' ki kolmal Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ayx jun ki chonhb' a satcha'anh, ayx jun ki ch'onhb' a satcha'anh (aleluya.) "},{"id":4,"tag":null,"isDisplayed":null,"text":"Tzaljk'ojlal oj ki k'och ta jun (ay jun katut.) a jun ki chonhb' a satcha'anh."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Ha jun ki chonhb' a satcha'anh, manhx a chamel yet' ok'el. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Manhxa kusk'ojlal yet' yail, tzaljk'ojlal a smasnil k'inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ayx jun ki chonhb' a satcha'anh, ayx jun ki ch'onhb' a satcha'anh (aleluya.) "},{"id":5,"tag":null,"isDisplayed":null,"text":"Tzaljk'ojlal oj ki k'och ta jun (ay jun katut.) a jun ki chonhb' a satcha'anh."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Ha jun ki chonhb' a satcha'anh, ay jun ha kaw sak yilxi."},{"id":5,"tag":null,"isDisplayed":null,"text":" Ha heb' oj k'och a jun chonhb' cha, kaw oj yuk' heb' jun spak'b'a cha."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ayx jun ki chonhb' a satcha'anh, ayx jun ki ch'onhb' a satcha'anh (aleluya.) "},{"id":6,"tag":null,"isDisplayed":null,"text":"Tzaljk'ojlal oj ki k'och ta jun (ay jun katut.) a jun ki chonhb' a satcha'anh."}]},{"id":34,"title":"Ak’ Jerusalén","guid":"dgmWrZVz4UyDtDkznmulKQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"34      Ak’ Jerusalén \n \nC S G   # 563 La nueva Jerusalén"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 14:1-10; Ap. 21: 1-5, 22-26; Ap. 22:1-7\n \n … Ha ta xch’ox wil jun niwkil chonhb’ Jerusalén, hatn jun yik Dios.  Ap. 21:10</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ay jun b’eymal ha kaw wal wach’ yilxi, wal a jun ak’ Jerusalén. Tzch’oxkot ayonh to kaw wal wach’ yilx ta’, wal a jun ak’ Jerusalén. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw yax t’ujnak wal yilxi, kaw wal tziktzni pax yilxi. Wal a jun chonhb’ to yik Dios."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Ay pax wal jun te te’ to yik k’inal, wal a jun ak’ Jerusalén. Lajchw ejm tzsatn te’ a yol hab’il, wal a jun ak’ Jerusalén. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Hax xil te’ kaw wach’ yanhtwi, sch’oxnb’il swach’ k’ojlal Dios. Wal a jun chonhb’ to yik Dios."},{"id":4,"tag":n
