ull,"isDisplayed":null,"text":"3     Manhxa ye’lch k’u yet’ pax yok uj ta’, wal a jun ak’ Jerusalén. Kojxn wal stziktznil ki Mam Dios ay ta’, wal a jun ak’ Jerusalén."},{"id":5,"tag":null,"isDisplayed":null,"text":" Manhxa tas oj kab’ syal ta’, yujto manhxa ya’ilal. Wal a jun chonhb’ to yik Dios."},{"id":5,"tag":null,"isDisplayed":null,"text":"4       Kaw wal ha ta ayk’ ch’anh hunh yik k’inal, wal a jun ak’ Jerusalén. Hata oj ki k’och kajn yet’ Jesús, wal a jun ak’ Jerusalén. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Tz’ib’ilxo ki b’i yuj Dios, kaw manhx oj stak’ sukx satok. Wal a jun chonhb’ to yik Dios."}]},{"id":35,"title":"E'lb'a Wek' A Sat Lum Tik","guid":"I3RlgPulmUyyhLizSsXpVA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"<fOpen Sans Semibold>35  E'lb'a Wek' A Sat Lum Tik\n</f> \nV. C. A. # 288 Soy Peregrino En La Tierra"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ap. 21:1-8; 1 Ts. 4:13-18\n \n Ha yik tzonh hek’ a yolyib’nhk’inl tik, kojxn Dios tzka’k och a ki k’ojol. 2 Cor. 5:7</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1   Kaw e'lb'a wek' a sat lum tik, oj hin at a satcha'anh. Kaw tanhb'il sjaw hin wach' Kolmal, yik tzwul hin yik' wal yet'ok. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ay mayok wal hin ati, tzin k'och yet' hin Diosal. Kaw oj wil sat hin wach' Kolmal, yik oj hin k'och wal yet'ok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ay junk’ojlal a satcha’anh, yet’ hin Jesús hata oj hin k’ochi."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Ya sb’a ayn ek’ a sat lum tik, kaw oj wa’ch hin k’ojl a Dios. Yujto yaljnak kan a spaxti’, to kaw oj hin k’och yet’ok. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha jun a’m niwnk’ojlal, Kaw kajn och wal ayin, tzin sch’ox a smasnil tas kaw wach’, tas to yiknhej Dios yaji."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ay junk’ojlal a satcha’anh, yet’ hin Jesús hata oj hin k’ochi."},{"id":4,"tag":null,"isDisplayed":null,"text":"3       Toto kaw tzalj mach tz’och tzak’an, yuj hin wach’ Kolmal Jesús. Hokxom wal yik oj k’och sk’ual, yik oj k’och yet’ hin Jesús. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yajnhej oj jawk hin Kolmal, oj jawk a skal asun, oj k'ewan heb' aych sk'ojl a Dios, heb' chamnak yet' heb' pitzan."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ay junk’ojlal a satcha’anh, yet’ hin Jesús hata oj hin k’ochi."}]},{"id":36,"title":"Ha Satlum Tik Kaw Wal Manh Watutok","guid":"L2Gr/lyKsEmgDXEq06SE/g","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"36  Ha Satlum Tik Kaw Wal Manh Watutok \n \nV. C. # 174 El Mundo No Es Mi Hogar"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Fil. 3:20-21; Stg. 4:13-17 \n \n Palta hanhek xo tik, ha a satcha’anh, hata ayb’t ki nab’enek, yujto ha jun cha, hatn ki chonhb’ek. Fil. 3:20</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Ha wal jun satlum tik ma oj och watutok, ha wal a satcha’anh, ha ta ay jun watut. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Wal a smasnil k’inal, kaw oj hin tzalj wal ta’, hax wal tas maysch’olnil kaw manhx oj wil wal ta’."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wach’ hach Cristo, yel wal tas tzala. Ha tas haljnak kani, kaw chi icha yalchab’."},{"id":4,"tag":null,"isDisplayed":null,"text":" Ha wal a watut cha kaw wal oj hin tzalji, hax wal tas maysch’olnil kaw manhxa yaln yik ta’."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Kaw wal oj hin b'itnok sb'i hin kolmal Jesús, smoj wal hin b'itnan sb'i yujto Wajlil yaji. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha wal a satcha'anh, kaw oj hin k'och kajan, hax wal tas maysch’olnil kaw manhxa yaln yik ta’."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wach’ hach Cristo, yel wal tas tzala. Ha tas haljnak kani, kaw chi icha yalchab’."},{"id":5,"tag":null,"isDisplayed":null,"text":" Ha wal a watut cha kaw wal oj hin tzalji, hax wal tas maysch’olnil kaw manhxa yaln yik ta’."},{"id":4,"tag":null,"isDisplayed":null,"text":"3       Manhxa hin kusk'ojlal yuj hin kolmal Jesús, yujto ha wal ix el schik’l a spatk te kulus. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Haxnhej wal junk’ojlal, oj wil a satcha’anh, hax wal tas maysch’olnil kaw manhxa yaln yik ta’."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wach’ hach Cristo, yel wal tas tzala. Ha tas haljnak kani, kaw chi icha yalchab’. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Ha wal a watut cha kaw wal oj hin tzalji, hax wal tas maysch’olnil kaw manhxa yaln yik ta’."}]},{"id":37,"title":"Ha Satcha'anh Jaknnhej","guid":"Pj/hN+kza0ai7oI5CtdTsg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"<fSegoe UI Symbol>37  Ha Satcha'anh Jaknnhej\n</f> \nV. C. A. # 205 Francas Las Puertas"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ap. 21:9-22:5; Mt. 24:30-31\n \n Ha heb’ tzya’ch sk’ojl a Yunnal Dios, ay sk’inl heb’ a jun ejmnhej. Jn. 3:36</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Ha satcha'anh jaknhej yuj Dios, ay mach tz'ochi, ay mach ma'ay.  Ay mach oj och wal a stziktznial. ¿Halach, halin, halach halin?  "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw tziktzninhej ton wal yilx sb’eal, ay pax ha ha kaw tziktzni yilxi. Yel ay mach oj och a tzaljk'ojlal. ¿Halach, halin, halach halin?"},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Awtb'il heb' smasnil yuj ki Mam Dios, ay mach tz'ab'ni, ay mach ma'ay. Oj ki cha spak yik tzkiln smunljel Dios. ¿Halach, halin, halach, halin?"},{"id":4,"tag":null,"isDisplayed":null,"text":" Kaw ayk’ kajlil a skal stziktznial, aj manhxa kusk’ojlal yet’ yail. Ha heb' tzchani yel oj kolchjok heb'. ¿Halach halin, halach halin?"},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Smasnil mach tzchani kaw wach’ yiko, ay mach tzchani ay mach ma’ay. Heb’ matz chani matz nachj el yuj heb’. ¿Halach halin, halach halin? "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ay heb’ kaw matz chaj wal ton yab’i, kaw oj kus heb’ schan spak spitalil. Ha wal Jesús oj b’eyk’ojlank heb’. ¿Halach halin, halach halin?"},{"id":5,"tag":null,"isDisplayed":null,"text":"4       Tzyaltj Jesús jun kolnb’il a matnil, ay mach tzchani ay mach ma’ay. Ay heb’ wach’ sb’eyb’al icha tznib’j Dios. ¿Halach halin, halach halin? "},{"id":6,"tag":null,"isDisplayed":null,"text":"Ha mach jtechjok kusk’ojlal yu’uj, heb’ tzb’on icha wal tznib’j ki Mam Dios, kaw wach’ yik heb’ a smasnil k’inal. ¿Halach halin, halach halin?"}]},{"id":38,"title":"Ha Wal Aj Ayk' Dios","guid":"3B18GOdhsku0Qozd7gqvRQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"38    Ha Wal Aj Ayk' Dios \n \nC. S. G. # 564 Más Allá Del Sol"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 14:1-10; 2 Cor. 5:1-9; Ap. 21:1-5; 22-26 \n \nHa a jun chonhb’ cha, may tz’och yok k’u, may pax tz’och yok uj. Ap. 21:23</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Kaw wal meb'a hin jun, kaw wal may hin tumin; ha wal a satcha'anh, hata ay watut. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ha wal a yik pekti', satnk hin wal ek’i, palta Jesucristo kaw xo’ch sk’ojl ayin."},{"id":0,"tag":1,"isDisplayed":null,"text":"//Ha wal aj ayk' Dios, ha wal aj ayk' Dios; ha wal ta ay jun watut wach' yilxi, wal aj ayk' hin Dios.//"},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ha wal aj ayn ek’ tik, kaw wal ay maysch’ olnil; tzjaw wal hin yailal, yujto yik hin Dios. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw ay jun aych wet'ok, wal a smasnil k'inal, ha wal Jesucristo yunnal hin Diosal."},{"id":0,"tag":1,"isDisplayed":null,"text":"//Ha wal aj ayk' Dios, ha wal aj ayk' Dios; ha wal ta ay jun watut wach' yilxi, wal aj ayk' hin Dios.//"},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ha smasnil heb’ anma, heb’ to ayk’ a skal smul, ha wal Jesucristo tztak’ wal skoln el heb’. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ha mach tzya'ch a sk'ojol, hin wach' Kolmal Jesús, kaw oj kolchjok el heb' a skal yailal."},{"id":0,"tag":1,"isDisplayed":null,"text":"//Ha wal aj ayk' Dios, ha wal aj ayk' Dios; ha wal ta ay jun watut wach' yilxi, wal aj ayk' hin Dios.//"}]},{"id":39,"title":"Jun Katutek Wach’ Yilxi","guid":"GLxPJbSG0EGN/+DuKBWOGg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"39  Jun Katutek Wach’ Yilxi\n \nC. S. G. # 565  Bellas Mansiones"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 14:1-10; 2 P. 3:8-14; Ap. 21:1-5\n \n Palta hanhek xo tik, ha a satcha’anh, hata ayb’t ki nab’enek. Fil. 3:20</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Ha a satcha'anh, ha wal ta ay jun watut, may junk maysch'olnil, oj och wal ta jun. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Smasnil kusk’ojlal oj kan a sat lum lum tik, kaw kojxnhej wach’ paxti oj halxok ta."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal wach' yilx jun watut ay a satcha'anh, kaw tzalk’ojlal yik oj hin k'och wal ta’. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw oj och b’it yik oj hin k’och a satcha’anh. Tzaljk'ojlal oj hin k'och a watut cha."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ha wal a tik jun, aynh ek' a skal kusk’ojlal, kaw wal aynhek ek’ a skal yailal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Hax a satcha'anh kojxnhej tzaljk'ojlal ay ta', yujto ma oj och maysch’olnilal ta’."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal wach' yilx jun watut ay a satcha'anh, kaw tzalk’ojlal yik oj hin k'och wal ta’. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw oj och b’it yik oj hin k’och a satcha’anh. Tzaljk'ojlal oj hin k'och a watut cha."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Hach hin wach’ k’ojol kaw tzin nib’j wal tzach kolchji, a skal kusk’ojlal yet’ wal somk’ojlal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Chaj Jesucristo, kaw yel oj ha kolchj kani, sek wach' oj ha k'och wal a satcha'anh."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal wach' yilx jun watut ay a satcha'anh, kaw tzalk’ojlal yik oj hin k'och wal ta’. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kaw oj och b’it yik oj hin k’och a satcha’anh. Tzaljk'ojlal oj hin k'och a watut cha."}]},{"id":40,"title":"Jun Yolyib'nhk'inl Tik","guid":"kNtLY+ucE0C80b2phylLwQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"40  Jun Yolyib'nhk'inl Tik  \n \nC. S. G. # 473. El Mundo Hoy"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jd. 3-4,16-25; 2 Ti. 3:1-5, 14-17; Ro. 1:24-32\n \n …Icha jun tzo’nh k’anal, kaw tziktzni yilx a k’ikk’inal, ixta hex a skal heb’. Fil. 2:15</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Ay wal heb’ anma a yolyinb’nk’inl tik, Wan skusk’ heb’ a skal mul. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Haxnhej howal yet' chichnk'ojlal tzb'o heb’, may schamk'ojlal a Dios, may xon wal schamk'ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw ay wal jun wach' ab'x tik tzkal he yab'i', yik Jesús ki wach' Kolmal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yet’ wach’ b’eyb’al, yet’ wal ki paxti tzkala, ki ch’oxk el wal schamk’ojlal ki Kolmal, kaw yel, kaw yel."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Kalk el jun wach’ ab'ix wal a heb’ anma’, to kaw wal tzyab’ syail. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ki ch'oxk el ki wach' b'eyb'al a sat anma', ha Cristo ki Komal, ki Kolmal, ki Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw ay wal jun wach' ab'x tik tzkal he yab'i', yik Jesús ki wach' Kolmal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yet’ wach’ b’eyb’al, yet’ wal ki paxti tzkala, ki ch’oxk el wal schamk’ojlal ki Kolmal, kaw yel, kaw yel."}]},{"id":41,"title":"Kaw Ayk' Jesús A Stziktznial","guid":"hlWcRtLX3Eqh5mQqELrGCQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"41     Kaw Ayk' Jesús A Stziktznial\n \nC. S. G. # 567  En La Mansión Do Cristo Está"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 14:1-10; Ap 21:1-5, 22-26; Sal.  42 \n \nHa a jun chonhb cha, may tz’och yok k’u, may pax tz’och yok uj.  yujto ha sakk’inlal Dios yet’ pax sakk’inlal jun tzkuch Kalnelu, ha tzyak’ sakk’inlal ha a.  Ap. 21:23</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Kaw ayk' Jesús a stziktznial, ha wal ta manhxa somk'ojlal. Kaw manhxa kusk'ojlal wal ta', kaw manhx oj wil kusk’ojlal ta’."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha wal ta kaw may kusk'ojlal, may xiwk'ojlal, may yailal. Tzaljk’ojlal oj aj hin pixan, yik oj hin k’och yet’ hin Kolmal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2       Kaw tzin tzalji, a junjn k’u, kaw tzin stanhwej yet’ xchamk’ojlal, kaw yel xo wach’, yik oj hin k’och a yojltak hin wach’ Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha wal ta kaw may kusk'ojlal, may xiwk'ojlal, may yailal. Tzaljk’ojlal oj aj hin pixan, yik oj hin k’och yet’ hin Kolmal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Tzaljk’ojlal oj hin kan yet’ok, yik oj hin k'och yet' hin Kolmal. Kaw junk'ojlal oj waj yet’ ta', yik oj hin k’och yet’ hin Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha wal ta kaw may kusk'ojlal, may xiwk'ojlal, may yailal. Tzaljk’ojlal oj aj hin pixan, yik oj hin k’och yet’ hin Kolmal."},{"id":5,"tag":null,"isDisplayed":null,"text":"4      Kaw oj wak’ tzaljb’ok hin k’ojol, yet’ wal smasnil tzaljk’olilal. Ha wal yet’ Cristo jin kani, oj waj yet’ a smasnil k’inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha wal ta kaw may kusk'ojlal, may xiwk'ojlal, may yailal. Tzaljk’ojlal oj aj hin pixan, yik oj hin k’och yet’ hin Kolmal."}]},{"id":42,"title":"Oj Hin At Wal A Satcha'anh","guid":"oUqy9S3hHEmAq6gPOl4q5A","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"42     Oj Hin At Wal A Satcha'anh \n \nV. C. # 210 Voy Al Cielo, Soy Peregrino"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ap. 21: 2; 2 Cor. 5:1-10; Jn. 14:1-3 \n \nXlajw cha, xwiln jun ak’ satcha’anh, yet’ jun ak’ yolyib’nhk’inal.  Ap. 21:1</f></i>"},{"id":3,"tag":null,"isDisplayed":null,"text":"1    Oj hin at wal a satchanh aj ayk’ Jesús, yuj to manh najtlok ayn ek’ a sat lum tik. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Oj hin k’och kajan yet’ a smasnil k’inal, kaw ix sjak jun b’e yik xcham a te kulus."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj hin at wal a satchanh aj ayk’ Jesús, a smasnil k'inal oj hin kan yet' a cha."},{"id":2,"tag":null,"isDisplayed":null,"text":"2     Kusltak chamel, somk'ojlal b'ilk'ojlal, hal a satchanh manhxa tas oj wab' syail. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Tzaljk'ojlal yet' Dios, wal a smasnil k'inal. Manhxa somk'ojlal, manhxa pax kusk'ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj hin at wal a satchanh aj ayk’ Jesús, a smasnil k'inal oj hin kan yet' a cha."},{"id":3,"tag":null,"isDisplayed":null,"text":"3    Ha chonhb' satcha'anh, kaw wach' ton wal yilxi, ha wal ta oj hin k’och kajn yet’ Jesús. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw oj at wila', ha aj ayk’ ki Mam Dios, jun niwkil chonhab’ to kaw tziktzni yilxi."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj hin at wal a satchanh aj ayk’ Jesús, a smasnil k'inal oj hin kan yet' a cha."}]},{"id":43,"title":"Oj Jawk Sk'ul Ki Chami","guid":"zvaPRd4nMkKU+yUL5ftj3Q","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"43      Oj Jawk Sk'ul Ki Chami\n \nC. S. G. # 307. Nuestra Vida Acabará"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Hch. 26:15-29; Is. 40:1-8; Mt. 11:25-30\n \n A’k och Jehová yipk he k’ojol, ya’sb’a chab’ilx to yu’uj, awjanhk ha a,  ya’sb’a to la’nto yaj a he tz’ey.  Is. 55. 6.</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    To oj jawk sk'ul ki chami, yuj tzonh cham ki masnil jun; icha yel xilte' a sk'ab', say ha Dios."},{"id":3,"tag":null,"isDisplayed":null,"text":" Aymaynhej tz'ek' ki k'inal, yujto seb' k'inl honh ajkni; kotanh hal ha b'a a Dios, say ha Dios."},{"id":0,"tag":1,"isDisplayed":null,"text":"Say ha Dios, (say ha Dios) say wal ha Dios;(say ha Dios) ya' sb'a mantzak jaw ha chamel say ha Dios.(say ha Dios) "},{"id":4,"tag":null,"isDisplayed":null,"text":" To ma oj ha say ha Dios, skal ha mul oj ha chami; yel wal manhx aj tzach kolchji, say ha Dios. "},{"id":3,"tag":null,"isDisplayed":null,"text":"2.      Tz'el yip smasnil heb anma', icha snichte tz'aj wal heb'; tz'u'lx heb' icha wal sakb'at, say ha Dios."},{"id":4,"tag":null,"isDisplayed":null,"text":" Icha yel wal ha niwn ha’, tzk'och ha aj ay sniwnal jun; ixta yek' wal ki k'inal, say ha Dios."},{"id":0,"tag":1,"isDisplayed":null,"text":"Say ha Dios, (say ha Dios) say wal ha Dios;(say ha Dios) ya' sb'a mantzak jaw ha chamel say ha Dios.(say ha Dios)  "},{"id":5,"tag":null,"isDisplayed":null,"text":"To ma oj ha say ha Dios, skal ha mul oj ha chami; yel wal manhx aj tzach kolchji, say ha Dios. "},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Hal ha b'a a Dios a yel, ak' ha b'a a ki Kolmal; kaw wal yel oj yi'l ha mul, say ha Dios. T"},{"id":5,"tag":null,"isDisplayed":null,"text":"o matz ha chaj tas tzyal Dios, toto tzak' ha b'a pital; oj ha k'och aj ay syail, say ha Dios."},{"id":0,"tag":1,"isDisplayed":null,"text":"Say ha Dios, (say ha Dios) say wal ha Dios;(say ha Dios) ya' sb'a mantzak jaw ha chamel say ha Dios.(say ha Dios)  "},{"id":6,"tag":null,"isDisplayed":null,"text":"To ma oj ha say ha Dios, skal ha mul oj ha chami; yel wal manhx aj tzach kolchji, say ha Dios. "}]},{"id":44,"title":"Oj Ki K’och A Satcha’anh","guid":"TM7SFpuK/kyhHDZ89bymlQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"44     Oj Ki K’och A Satcha’anh \n \nC.S.G 430 Entenderemos"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Stg. 1:2-12; 1 P. 1:3-9; Ap. 2:8-11\n \n Manh e ya’ch he b’a man nab’enal, kuyk he b’a sek tznachj el eyu’uj, tas wal tznib’j Dios tzki b’o’ek. Ef. 5:17</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Ha yik tzin kusi kaw tzin nib’j tzwojkej, tas yuj ay mach matz jaw syailal, "},{"id":3,"tag":null,"isDisplayed":null,"text":"toxnhej maysch’olnil tas wan wal sb’on heb’, hanxo tik kaw ay hin yailal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha a satcha’anh oj kojkok eli, smasnil kusk’ojlal tz’ek’ aynh a tik. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw ki te’wtzok ki b’a ki masnil jun, a satcha’anh oj ki kan yet’ok."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    A smasnil k’inal xchi Jesucristo, may kab' aj tzjaw wal ki chab’k’ojlal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yik oj ki k’ochk yet’ Dios a satcha’anh, junjn mach oj scha wal spak yiko'."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha a satcha’anh oj kojkok eli, smasnil kusk’ojlal tz’ek’ aynh a tik. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw ki te’wtzok ki b’a ki masnil jun, a satcha’anh oj ki kan yet’ok."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Ha yik oj jawk pax wal Jesucristo, kaw oj ki atk yet’ a satcha’anh. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ha yik jun k’ul cha oj kil wal yilxi, smasnil k’inal oj ki kank yet’ok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha a satcha’anh oj kojkok eli, smasnil kusk’ojlal tz’ek’ aynh a tik. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kaw ki te’wtzok ki b’a ki masnil jun, a satcha’anh oj ki kan yet’ok."}]},{"id":45,"title":"Oj Ki K’ochk A Yojltak Cristo","guid":"goa04Im9skKLbCZbJXCLHg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"45      Oj Ki K’ochk A Yojltak Cristo\n \nC. S. G. # 556. En Presencia Estar De Cristo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ap. 1:1-8; 5; Jn. 14:1-10 \n \nMatz nachj el wu’uj, aja wal junk wach’. Tzin nib’j tzin chami, sek tztak’ tzin k’och mu’k ha aj ayk’ Cristo.  Fil. 1:23</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1   Oj ki k'ochk wal aj ay Cristo, oj kil sat a tzaljk'ojlal. Manhx jantkok wal tzaljk'ojlal ta’, a yik oj ki k'ochk yet'ok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yowlal oj wil sat hin Kolmal, ha aj ayk' a satcha'anh. Kaw oj wil wal yilx hin Jesús, yik oj hin k’och wal yet’ok."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Yuj hin jichk'ojlal a Cristo, kaw tznachj el yik Dios wu’uj. Jab’xoj wal sjaw jun k’ual, yik oj jawk a skal stziktznial."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yowlal oj wil sat hin Kolmal, ha aj ayk' a satcha'anh. Kaw oj wil wal yilx hin Jesús, yik oj hin k’och wal yet’ok."},{"id":4,"tag":null,"isDisplayed":null,"text":"3   Til wal tzaljk'ojlal yet’ Cristo, hata’, manhxa kusk’ojlal. Oj kan smasnil tas kaw ay smay, yik tzk’och sk’ul ki pax yet’ok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yowlal oj wil sat hin Kolmal, ha aj ayk' a satcha'anh. Kaw oj wil wal yilx hin Jesús, yik oj hin k’och wal yet’ok."},{"id":5,"tag":null,"isDisplayed":null,"text":"4    Kaw oj kilk wal och yilx Cristo, yik oj jawk wal jun k’ul cha. Kaw oj kilk yilx ki wach’ Kolmal, to ix yak’ cham sb’a kujek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yowlal oj wil sat hin Kolmal, ha aj ayk' a satcha'anh. Kaw oj wil wal yilx hin Jesús, yik oj hin k’och wal yet’ok."}]},{"id":46,"title":"Heb' Anma Tzalni To May Dios","guid":"eReO48r9IUynADVtbq4WEw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"46    Heb' Anma Tzalni To May Dios "},{"id":2,"tag":null,"isDisplayed":null,"text":"<fMicrosoft Himalaya>Sal. 14:1-7; 53; Ro. 1:22 \n \nHa heb’ tu sb’eyb’al, may Dios snan heb’.  Sal. 14:1</f>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Ay heb' anma tzalni to kaw may Dios, kaw tzyal jelnal sb'a heb' yet’ wal snab’en. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kojxnhej wal maysch'olnilal tznib'j och heb', yujto kaw may Dios snan heb'."},{"id":0,"tag":1,"isDisplayed":null,"text":"//Wojtak to ay Dios, wojtak to ay Dios; kaw til wal tas tzch'oxn el a sat lum lum tik, to kaw yel ay hin Diosal.//"},{"id":3,"tag":null,"isDisplayed":null,"text":" 2    Ha wal heb' anma' tzkob' yal heb' ix tik, smasnil tas ay wal a sat lum lum tik. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Tzyal heb' to may junk mach b'ojnak kani, yujto kaw may Dios yaln heb'."},{"id":0,"tag":1,"isDisplayed":null,"text":"//Wojtak to ay Dios, wojtak to ay Dios; kaw til wal tas tzch'oxn el a sat lum lum tik, to kaw yel ay hin Diosal.//"},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ha ki Mam Dios yel ix sb'o satcha'anh, yet’ smasnil tas ay a sat lum lum tik. "},{"id":5,"tag":null,"isDisplayed":null,"text":"May junk tas to manhok wal Dios xb'oni, kaw yel a Dios xb'on smasnil."},{"id":0,"tag":1,"isDisplayed":null,"text":"//Wojtak to ay Dios, wojtak to ay Dios; kaw til wal tas tzch'oxn el a sat lum lum tik, to kaw yel ay hin Diosal.//"},{"id":5,"tag":null,"isDisplayed":null,"text":"4    Kaw oj hin k'och yet' Dios a satcha'anh, ha jun tik kaw ayx och yipk hin k'ojol. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kaw wal tzaljk'ojlal xo yaj hin pixan, yujto oj hin k'och yet' Dios."},{"id":0,"tag":1,"isDisplayed":null,"text":"//Wojtak to ay Dios, wojtak to ay Dios; kaw til wal tas tzch'oxn el a sat lum lum tik, to kaw yel ay hin Diosal.//"}]},{"id":47,"title":"May Junk Xo Mach Icha Cristo","guid":"p0VYbuC3Mkq/so/TZWnTNA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"47       May Junk Xo Mach Icha Cristo\n \nYajtz’ib’al: Xuxp Yakin."},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 139:1-12; Ro. 11: 33-36; Isa. 44:1-8 \n \n Kaw wal satjub’tak yilx ha jelnal tik,  matz nachj el xon wu’uj.  Sal.139: 6</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1       Wal yel may junkxo icha hin wach’ Kolmal, yet’ wal yipalil ix sb’o wal smasnil tas. Kaw may junkxo mach icha wal ki Mam Dios."},{"id":3,"tag":null,"isDisplayed":null,"text":"   --//Kaw wal jeln hin Diosal, kaw wal jeln hin Diosal, kaw tztak’ yuj smasnil. //"},{"id":3,"tag":null,"isDisplayed":null,"text":"2       Wal yel may junkxo icha hin wach’ kolmal, yojknhej ton smasnil tas ay a hin pixan. Wal yel chekl smasnil a sat hin Diosal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"--//Kaw tzyil wal ha nab’en, kaw tzyil wal hin nab’en, kaw yel tzyil smasnil.//"},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Ayk’ Dios a smasnil yolyib’nhk’inl tik, Tanhb’iln yuj hin Dios wal a smasnil k’inal. Tzyak’ wal hin jelnal yet’ smasnil swach’ilal,"},{"id":5,"tag":null,"isDisplayed":null,"text":" --//Kaw ayk’ a satcha’anh, kaw ayk’ a sat lum tik, ayk’ a hin pixan.//"},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Yuj sjelnal hin Diosal kaw wal pitznonhek. Yujto ayk’ ki k’inl a yolsk’ab’ ki Diosal, kojxnhej a ki Kolmal aj wal tzkal ki b’a. --"},{"id":6,"tag":null,"isDisplayed":null,"text":" //Kaw wal tzonh leslwi, kaw wal tzonh leslwi, a sb’i ki Kolmal.//"}]},{"id":48,"title":"Diezmo Yet' Ofrenda","guid":"PpdSqaFdk0icNhaE1pdm5w","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"48     Diezmo Yet' Ofrenda \n \n # 344. V.C. El Diezmo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Gn. 14:17-24; 2 Cor. 8:1, 9:15\n \n …Ha smasnil tas oj yak’ ayin, oj wi’l jun a junjn lajnhe’, hax wa’n ha a xchi.  Gn. 28:22</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kaw ha spaxti Dios tzalni to tzkak’ yik a junjn lajnhe, yujto ixta tznib’j wal ki Mam Dios. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Hax ki Mam Dios kaw tzalj yet’ wal jun ki yiklumalek tik, hax oj a’nok wal spak aynhek jun."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzaljk'ojlal yik heb' yikxo Dios, (yikxo Dios,) yujto tzyiklj wal heb’ Spaxti Dios. (spaxti Dios)"},{"id":4,"tag":null,"isDisplayed":null,"text":" Ay junk’ojlal a spixn heb’, tzyak' Dios syaxilal heb', niwn tzaljk'ojlal ay a spixn heb’. (a spixn heb’)"},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ha ki Mam Dios kaw tzk’an sdiezmoal smasnil tastk ay ayonh, jun yik Dios wal a junjn lajnhe'."},{"id":4,"tag":null,"isDisplayed":null,"text":" Ha tzalni to yowlal tzkijek at wal aj ay sk’unhail, ha tzyal tas to tzyak’ wal Dios aynhek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzaljk'ojlal yik heb' yikxo Dios, (yikxo Dios,) yujto tzyiklj wal heb’ Spaxti Dios. (spaxti Dios)"},{"id":5,"tag":null,"isDisplayed":null,"text":" Ay junk’ojlal a spixn heb’, tzyak' Dios syaxilal heb', niwn tzaljk'ojlal ay a spixn heb’. (a spixn heb’)"},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ki tumin, ki chamk’ojlal yet’ wal smasnil tastk ay ayonh, yelk’ojlal kab’ tzkak’ a ki Mam Dios."},{"id":5,"tag":null,"isDisplayed":null,"text":" Tzchamk'ojlej Dios mach to tzyak' wal junk tas a smasnil sk'ojol, manh tok yet' wal jab'ok schab'k'ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzaljk'ojlal yik heb' yikxo Dios, (yikxo Dios,) yujto tzyiklj wal heb’ Spaxti Dios. (spaxti Dios) "},{"id":6,"tag":null,"isDisplayed":null,"text":"Ay junk’ojlal a spixn heb’, tzyak' Dios syaxilal heb', niwn tzaljk'ojlal ay a spixn heb’. (a spixn heb’)"},{"id":5,"tag":null,"isDisplayed":null,"text":"4      Toto ma tzki chaj kab’ tas tzyal ki Mam Dios wal a spaxti’, kaw wal oj kot yowl sk’ojl a kib'nhek. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Toto tzka’ ki ti ka’nek ki siylab a yik ki Mam Dios, oj yak' Dios syaxilal a kib'nhek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzaljk'ojlal yik heb' yikxo Dios, (yikxo Dios,) yujto tzyiklj wal heb’ Spaxti Dios. (spaxti Dios) "},{"id":7,"tag":null,"isDisplayed":null,"text":"Ay junk’ojlal a spixn heb’, tzyak' Dios syaxilal heb', niwn tzaljk'ojlal ay a spixn heb’. (a spixn heb’)"}]},{"id":49,"title":"A Yojltak Jesucristo","guid":"5vWogZS7X0uGNu/2SdqaBg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"49  A Yojltak Jesucristo\n \nC.S.G. 393  A Los Pies De Jesucristo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Lc. 10: 38-42; Heb. 4:11-16; Heb. 10: 11-25 \n \nAy jun ix snu’lj Marta cha, María sb’i. Ix em wokn ix a stz’ey yok Jesús, yik tz’ab’xni ix a tas tzyala. Lc.10:39</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     A yojltak Jesucristo, kaw wal manh jantkok swach’il. Ki chak kab’ icha heb’ schekab’, jun paxti yik chamk’ojlal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"A yojltak Jesucristo kaw wal ay tzaljk’ojlilal, yujto kaw wal tanhb’ilnh yu’uj, yet’ wal smasnil swach’k’ojlal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     A yojltak Jesucristo tz’ilchj wal chamk’ojlal wu’uj. Ix yij el wal hin ilk’ojlal, ix yak’ syaxilal ayin."},{"id":4,"tag":null,"isDisplayed":null,"text":" Oj wal a hin kolmal Cristo, smasnil wal hin xiwk’ojlal. Oj yak’ wal tzaljk’ojlal ayin, junk’ojlal yet’ chamk’ojlal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"3     A yojltak Jesucristo, oj hin cha wal yaxilal. Yujto ha ta tz’ilchj tzaljk’ojlal, ki tanhmal pax wal yaji. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw wal ay hin tzaljk’ojlal jun, yujto ayk'nhej wal wet’ok. Yuj cha kaw tanhb’il sjaw wu’uj, a yik oj wul hin yi’nok."}]},{"id":50,"title":"Ha Jesús Ha Tzaln Ayin","guid":"n9UV/IGA4kCy1npXjz21uA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"50      Ha Jesús Ha Tzaln Ayin \n \nJoyas Favoritas # 2. Habla Jesús Amante"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Is.  43:1-3; Sal. 91:1-8. \n \nManh hach xiwok, may kab’ a chabk’ojlal, yujto Jehová hin, ha Diosal hin, aynnhej och het’ok. Jos. 1:9</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ha Jesús hin wach' Kolmal, ha tzaln a hin pixan; manh hach xiw a tas ay smay, ayn ek' ton wal het'ok. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ayk' Jesús wal a hin tz'ey, ay schamk'ojlal ayin, yuj cha, kaw tzach hin b'itnej yet' wal hin tzaljk'ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzin nib'j tzwab' ha paxti', yujto kaw wach' yalni. Ha wal ha paxti tzalni, to ayx hin kolnb'il. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yet' wal hin tzaljk'ojlal jun, tzwaln el ha wach' paxti'. Ak' wal hin nab'en Mamin, manh he'l ha sat ayin."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Tzwak' hin niwnal aych Mamin, tzin och wal ha chekb'ok. Kaw tzak' wal hin tzaljk'ojlal, yet' hin chamk'ojlilal."},{"id":4,"tag":null,"isDisplayed":null,"text":" Kaw tzin nib'j wach' hin b'eyb'al, wal a smasnil k'inal. wojtak to jab'xoj ha jaw hach hin Kolmal Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzin nib'j tzwab' ha paxti', yujto kaw wach' yalni. Ha wal ha paxti tzalni, to ayx hin kolnb'il. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yet' wal hin tzaljk'ojlal jun, tzwaln el ha wach' paxti'. Ak' wal hin nab'en Mamin, manh he'l ha sat ayin."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Oj hin cha wab' ha paxti', hach hin Kolmal Jesús, ha yik xjaw hin tzaljk'ojlal, kaw ix tzalj hin pixan."},{"id":5,"tag":null,"isDisplayed":null,"text":" A yik b'ilk'ojlal waji, kaw ix wab' ha paxti', yuj cha, tiknek hach Mamin, kaw tzin b'itnej ha b'i. "},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzin nib'j tzwab' ha paxti', yujto kaw wach' yalni. Ha wal ha paxti tzalni, to ayx hin kolnb'il. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Yet' wal hin tzaljk'ojlal jun, tzwaln el ha wach' paxti'. Ak' wal hin nab'en Mamin, manh he'l ha sat ayin."}]},{"id":51,"title":"Ha Yik Tzsakb'i","guid":"3vvVS6rz30mENbWe0+lThQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"51   Ha Yik Tzsakb'i\n \nC. S. G. # 94  Por La Mañana"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 63:1-8; 42; Zac. 12:10\n \n Hach hin Diosal, tzin nib’j tzwal hin b’a aych a kaw sk’inhb’ilto. Sal. 63:1</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Ha yik tzsakb'i kaw tzwal wach’ paxti a ki Mam Dios. Kaw ix yak' jun niwkil tzaljk'ojlal a hin pixan."},{"id":3,"tag":null,"isDisplayed":null,"text":" Ha wal a yik tzsakb'i kaw yel tzin leslwi jun, tzin k'an a Dios to tzyak' junk'ojlal a hin pixan. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Tzonh schamk’ojlej ki Mam Dios tzyab' ki lesal, tzyak' ki te'nal a yik tzjaw ki somk’ojlal."},{"id":5,"tag":null,"isDisplayed":null,"text":" Tzyak' ki Mam Dios ki jelnal yuj swach’k’ojlal, ha wal tzin koln el a yol sk’ab jun chamel."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Ha yik tzk'ik’b'i tzin leslwi kan a ki Mam Dios, ha yik tzin leslwi tzaljk'ojlal tz'aj hin pixan. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha wal Jesús hin wach' kolmal xyak' hin junk'ojlal, ha Jesucristo ix yij el wal hin xiwk'ojlal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yuj cha tzin b'itnej hin wach' Kolmal Jesús, yujto kaw ix sch'ox wal swach'k'ojlal ayin. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Ha yik tzk’ik’b’i kaw ayk’nhej Cristo wet'ok, ha tzin koln el a smasnil tas kaw ay smay."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Tanhb’iln yu’uj yik tzin waykn ejm a junjn ak’wal, may aj tzin yak kani yik tzjaw wal hin yailal."},{"id":5,"tag":null,"isDisplayed":null,"text":" Yik tzin waykn ejmi ha tz’a'n iljok wal hin niwnal, yujto manb’iln xo yu’uj, yuj cha, yik xo waji. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Ha yik tzsakb’i tz’el hin waynh a tzaljk’ojlal, yujto ha ki Mam Dios kaw tanhb’iln yu’uj. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Ha Jesucristo kaw wal tzin schamk'ojlej, yuj hin mul ix yak’ cham sb’a a te kulus."},{"id":5,"tag":null,"isDisplayed":null,"text":"4      Kaw ix el chik' a yol sk'ab' aj ix och k'en lawux, kaw ix el chik' a smo'och aj ix och k'en lanza. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kaw xel chik’ yuj jun k'ix corona xk’e a sjolom, kaw ix sb’uch heb’ anma x’a’n och a spenk te kulus."},{"id":7,"tag":null,"isDisplayed":null,"text":" Palta tzaljk’ojlal yik xpax a satcha’anh, kaw wal tziktzni yilxi yik ix paxk’e ta’. "},{"id":8,"tag":null,"isDisplayed":null,"text":"Kaw tzaljk'ojlal ix paxk'e a satcha'anh, a skal asun ix paxk’e a tzaljk’ojlal."}]},{"id":52,"title":"Kalk Wach' Paxti’","guid":"SfxRTiyO1UqmVWaSULOexw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"52   Kalk Wach' Paxti’\n \nC. S. G. # 80  Adoradle"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 95:1-7; 66:1-8; Lc. 1:68-75 \n \nOj wem kumn a yol hatut yik oj walnk wach’ paxti aych yuj ha chamk’ojlal yet’ ha wach’il. Sal. 138:2</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kalk wach' paxti a ki Mam Dios, kalk wach' paxti a Jesús. A Yespíritu ki Mam Dios, oj kalk wach' paxti ha a."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kalk wach' paxti', kalk wach' paxti', a Jesús ki wach' Kolmal. (ki wach' kolmal) "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kalk wach' paxti a ki Kolmal, kaw yik honkh xo yuj wal schamk’ojlal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ki b’itkek sb’i Dios yet’ ak’ b’it, hex kolb'ilx yuj swach'k'ojlal. Uj yet' mar yet' pax lum lum tik, to tzb’itnej heb’ sb’i Kajlil."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kalk wach' paxti', kalk wach' paxti', a Jesús ki wach' Kolmal. (ki wach' kolmal) "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kalk wach' paxti a ki Kolmal, kaw yik honkh xo yuj wal schamk’ojlal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ka’k emmkilal a ki Diosal, hex to ayx he kolnb’il. Kolb’ilnhek xo yuj swach’k’ojlal, kolchjnaknhek yuj schamk'ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kalk wach' paxti', kalk wach' paxti', a Jesús ki wach' Kolmal. (ki wach' kolmal) "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kalk wach' paxti a ki Kolmal, kaw yik honkh xo yuj wal schamk’ojlal."}]},{"id":53,"title":"Tzwab' Tas Tzal Hach Hin Kolmal","guid":"Pe3x5fpWeE6J6wQ54uPExg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"53      Tzwab' Tas Tzal Hach Hin Kolmal\n \nV. C. # 94  Yo Escucho Buen Jesús"},{"id":3,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Lc. 10:38-42; Lc. 6:47-48; Mt. 15:21-28\n \n Yuj cha, xyaln pax ha ix ix tik: Hach ix, tzwila kaw yelk’ojlal tza’ch ha k’ojl a Dios.  Yuj cha, b’o kab’ icha tza nib’ej, xchi ha ix.   Mt. 15:28</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Tzwab' tas tzal hach hin Jesús, kaw wach' yaln ha paxti'. Yujto hach cham a te kulus, jkolchjok heb' tzach chani. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw yel ajmul hin, may jak hin wach'il, ch'ox ha chamk'ojlal ayin, yuj cha tzin jaw ayach."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Kaw ay wal ha niwnk’ojlal, a yib’nh hin mul smasnil. Yik kusk'ojlal yaj hin pixan, ha aych tz'ilchj tzalk'ojlal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw wal ajmul hin x'o'ch ha k'ojl ayin, a'n wal niwnk'ojlal Mamin, suk sat hin maysch'olnil."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Hach tzak' wal k'ib' sjichk'ojlal, heb' to tzya'ch sk'ojl ayach. Smasnil heb' tzach ya'ch yipk sk'ojol, oj scha heb' ha yaxil. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Tzwa'ch hin k'ojl ayach, hin Kolmal haji, ak' ha chamk'ojlal ayin, yipk'ojlal haj wu'uj."}]},{"id":54,"title":"Tzwak' Hin B'a Ayach","guid":"zqP8lnjnPkOvSKUHXgWwXw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"54          Tzwak' Hin B'a Ayach\n \nV. C. # 236 \tSalvador A Ti Me Rindo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Hch. 9:1-19; Ro. 12:1-2; Sal. 34:1-8 \n \nTo tze ya’ch he ba’ a yol sk’ab’.  Icha junk xajmb’al pitzan, tz’ajx yiko’ok, ixta tzkutjek ka’n ki b’a ha a. Ro. 12:1</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Tzwak' hin b'a wal aych hin Kolmal, hach Jesús tzach och wajlok. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Smasnil wach' aj tzin ha ch'oxo, yujto tzin ha chamk'ojlej."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tzwak' hin b'a ayach, (tzwak’ hin b’a ayach) tzwak' hin b'a ayach; (tzwak' hin b'a ayach) hin kuslal yet' smasnil yail, oj wal aych Mamin."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Ha yik tzin kus yuj wal hin mul, kaw tzwal hin b’a ha ayach. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ab’ tas tzwal aych hach hin Cristo, kaw tzin hak’ wal niwnk’ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tzwak' hin b'a ayach, (tzwak’ hin b’a ayach) tzwak' hin b'a ayach; (tzwak' hin b'a ayach) hin kuslal yet' smasnil yail, oj wal aych Mamin."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Tzwak’ hin b’a wal aych hin Kolmal, yet’ wal smasnil tas ayin, "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ha Espíritu kaw tzyak’ wip, kaw tzyak’ pax wal hin jelnal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tzwak' hin b'a ayach, (tzwak’ hin b’a ayach) tzwak' hin b'a ayach; (tzwak' hin b'a ayach) hin kuslal yet' smasnil yail, oj wal aych Mamin."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Ha wal smasnil ha wach’ilal, halx kab’ a smasnil k’inal. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Ha wal ha chamk’ojlal Mamin, ayk’ wet’ a smasnil k’inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tzwak' hin b'a ayach, (tzwak’ hin b’a ayach) tzwak' hin b'a ayach; (tzwak' hin b'a ayach) hin kuslal yet' smasnil yail, oj wal aych Mamin."},{"id":6,"tag":null,"isDisplayed":null,"text":"5     Tz’ilchj tzaljk’ojlal wuj a Cristo, tzyak’ pax wal hin junk’ojlal. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Yuj cha tzwak’ hin b’a a Cristo, yuj schamk’ojlal wal ayin."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tzwak' hin b'a ayach, (tzwak’ hin b’a ayach) tzwak' hin b'a ayach; (tzwak' hin b'a ayach) hin kuslal yet' smasnil yail, oj wal aych Mamin."}]},{"id":55,"title":"Yuj Wal Ha Cheknb'il Jesús","guid":"BPhJzfNjeEm87TNSLM+rQQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"<fYu Gothic UI Semibold>55  Yuj Wal Ha Cheknb'il Jesús \n \n</f>V. C. A.# 215. A Tu Palabra, Mi Señor"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mt. 26:36-46; 27:32-56; Sal. 22:1-2\n \n Kotnhek, emkoyk kuman yik tzonh ochk emmkilal a Jehová. Sal. 95:6</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Yuj ha paxti hach hin Jesús, emmkilal tzin jawi. Yuj yamnil yik tzaljk’ojlal tik, matz sat hin k’ojl ayach."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Manh hin mojk wal tzin jaw a tik, yujto may hin wach'il. Ix hak’ cham ha b’a hin jelok, yuj wal ha chamk’ojlal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Yik tax pekti kaw aj mul hin, hal tiknek kolb'il hin. Kaw tzin nakot ha chamk’ojlal, yuj cha tzach hin b’itnej."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Getsemaní aj x'el halil, hata x'el ha chik'il. Kaw ix hab' syal a te kulus, kaw hach yixtj heb' anma'."},{"id":6,"tag":null,"isDisplayed":null,"text":"5     Ha yik hach cham a te kulus, sk’ub’j el Dios sat ayach. Yuj ha chamlil a te kulus, ay junk’ojlal yet’ Dios."},{"id":7,"tag":null,"isDisplayed":null,"text":"6     Ha tiknek hach Wajlil Jesús, yuj wal ha wach'k'ojlal. Tzach hin b'itnej yet’ heb’ honnal, yuj wal ha chamk'ojlal."}]},{"id":56,"title":"Hach Hin Dios Tzwak' Hin B'a Ayach","guid":"tItIC6VxC0aTm2tsNNBSIQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"56   Hach Hin Dios Tzwak' Hin B'a Ayach\n \nC. S. G. #317 Oh Señor, Recíbeme Cual Soy"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 143; 25:1-10; Mt. 11:25-30 \n \nHach hin Diosal komnok tz’o’ch wal ha k’ojl ayin, to kaw yel ajmul hin si’mb’il, xchi win a Dios.   Lc. 18:13</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Hach hin Dios, kaw tzwak' hin b'a ayach; kaw oj wi'l hin b'a a maysch'olnil. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw wal manhx oj och hin mul ayach; tojlb'tzej hin nab'en, ak' wal hin junk'ojlal yet' wal hin tzaljk'ojlal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Hach hin Dios, kaw tzin ha chaj tiknek; oj hin b'o smasnil tza nib'j ayin. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yuj wal dios yuj ha wach'k'ojlal jun; a'ch wal a hin pixan, b'it yik tzaljk'ojlilal, yet' wal ha wach'k'ojlal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Hach ajmul, aych at a skal stu’al, kaw kotanh chaj Cristo wal tiknek. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ha wal Dios tzyak’ niwnk’ojlal ayach. Tznib’j wal tzyak’ ha kolnb’il, tznib’j wal kaw tzkolwj het’ok, chaj sniwnk’ojlal tiknek."}]},{"id":57,"title":"Hach Hin Diosal Chaj Hin B'it","guid":"/f9RScHYHU+bcDtJ0U8BwQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"57      Hach Hin Diosal Chaj Hin B'it \n \nV. C. A. # 98. Escucha Mi Doliente VOZ"},{"id":3,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 7:17; Sal. 92:1-4; Is. 6:1-13 \n \nOj wal wach paxti a Jehová, yuj to kaw tojl snab’en. Sal. 7:17</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Hach hin Diosal ab' hin b'itni, wach'xam to kaw may hin ch'olnil. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ch'ox wal ha kolwal ayn tiknek, hach Jesús hin wach' Kolmal hach. "},{"id":0,"tag":1,"isDisplayed":null,"text":"Tzin at het'ok, waj an Mamin; hach Cristo kaw hin ha kolo. Chaj hin Jesús, tzin jaw ayach; yujto kaw ix hej el hin mul."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Ayn ek' a skal hin yailal, kaw kusk'ojlal waj yuj hin mul."},{"id":4,"tag":null,"isDisplayed":null,"text":" Hach Jesús hach hin ha kolo, ak' wal niwnk'ojlal ayn tiknek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tzin at het'ok, waj an Mamin; hach Cristo kaw hin ha kolo. Chaj hin Jesús, tzin jaw ayach; yujto kaw ix hej el hin mul."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Wach'xam to kaw may hin ch'olnil, hach ix hak' wal hin kolnb'il. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yipk'ojlal wal haj wuj Mamin, manb'iln el yuj wal ha chik'il."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tzin at het'ok, waj an Mamin; hach Cristo kaw hin ha kolo. Chaj hin Jesús, tzin jaw ayach; yujto kaw ix hej el hin mul."},{"id":5,"tag":null,"isDisplayed":null,"text":"4      Manh hin mojk tzin jaw ha a tz'ey, kolb'iln ho'oj, kaw tzin tzalji. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Ilt wal wilxi may hin ch'olnil, hach Jesús kaw wach' ha nab'en."},{"id":0,"tag":1,"isDisplayed":null,"text":"Tzin at het'ok, waj an Mamin; hach Cristo kaw hin ha kolo. Chaj hin Jesús, tzin jaw ayach; yujto kaw ix hej el hin mul."}]},{"id":58,"title":"Hach Santo Espíritu","guid":"hi6iC1U6jkaSbplrc91DkA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"58      V. C. A. # 55  Deciende Espíritu De Amor"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 16:5-15; Hch. 2:1-13; Ef. 1:13-14 \n \nYuj Yespiritu aych aynhek, yuj cha, kojtak to oj ki chak jun kik oj yak’ Dios aynhek. Ef. 1:14</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Hach Santo Espíritu Dios, kojtak to junxnhej hach, yet’ Jesucristo ki Kolmal; Junxnhej yet’ ki Mam Dios."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Kaw ak’ yip ki jichk’ojlal honh, yet’ pax ki te’nal honh, yik tzonh ha kuy a yik Jesús; a jun b’eyb’al kaw wach’."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Hach jaw yik tzach och kajn ayonh, kajn hach a ki pixn honh. Kaw tzki k’an ki jelnal aych honh; sek yiklum honh ayach."},{"id":5,"tag":null,"isDisplayed":null,"text":"4      Kaw yuj wal dios yuj ki k’inl honh, sak k’inl yaj ki pixn honh. Ayx ki kolnb’il honh yuj Jesús; yik xcham a te kulus."},{"id":6,"tag":null,"isDisplayed":null,"text":"5    ¡Tzkal wach’ paxti a ki Mam Dios! ¡Yet’ a Dios Unnab’il! Yet’ wal a jun a’m Niwnk’ojlal; smasnil k'inal. Amén"}]},{"id":59,"title":"Ha Wal A Yol Jun Te Nha","guid":"py7jC0Ot2kaaXSCKKFmoRg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"59      Ha Wal A Yol Jun Te Nha\n \nC. S. G. #255  En Un Aposento Alto"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Hch. 2:1-6, 41-47; Hch. 10:34-48; Ef. 5:8-20\n \n Kaw x’ochkn Yespiritu Dios a junjn heb’. Hch.2:4</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ha wal a yol jun te nha jun, junxnhej yaj snab'en heb' ta'. Wak wiknk wal sb'isl heb' tanhwjnak, yuj tas yaljnak kan Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"A'kot hepalil Mamin; a'kot hepalil Mamin. A'kot hepalil Mamin; wal a heb' hek xo jun."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Kaw ix jommi wal satcha'anh, ixta wal ix aj yemli. Kaw wal ix ajx bautizar heb', yuj Espíritu Santo."},{"id":0,"tag":1,"isDisplayed":null,"text":"A'kot hepalil Mamin; a'kot hepalil Mamin. A'kot hepalil Mamin; wal a heb' hek xo jun."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Hat xo wal a yik jun k'u cha, sjaw kan jun a'm Niwnk'ojlal. Kajn och wal a spixn heb' yikxo, tzya'n jelnal yet' junk'ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"A'kot hepalil Mamin; a'kot hepalil Mamin. A'kot hepalil Mamin; wal a heb' hek xo jun."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Ha wal Yespíritu ki Mam Dios, kaw tz’och ki te'nal yu'uj, Yik tzka’nek och ki b’a, kalnek el wach’ ab’x yik Kolnb’il."},{"id":0,"tag":1,"isDisplayed":null,"text":"A'kot hepalil Mamin; a'kot hepalil Mamin. A'kot hepalil Mamin; wal a heb' hek xo jun."}]},{"id":60,"title":"Ha Wal Espíritu Mamin","guid":"LIH+vGOHEEa50yTk+FhGjg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"60    Ha Wal Espíritu Mamin\n \nV. C. # 91 \tTu Santo Espíritu, Señor"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ef. 5:18-20; Ro.8:14; Gl. 5:22-23, \n \nYelxo wach’ ha Yespiritu aych yaljlil aynhek. Ef. 5:18</f></i>"},{"id":3,"tag":null,"isDisplayed":null,"text":"1     Ha wal Espíritu Mamin, ha tzin koln a stu'al. Yuj ton wal hepalil Mamin, yuj cha sakx waj tiknek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha Espíritu hach Mamin, ha tzin moln a swach'il. Ha tz’i'n el tu a hin pixan, Tzya’n pax syaxilal ayin."},{"id":4,"tag":null,"isDisplayed":null,"text":"2     Ha wal Espíritu Mamin ha tzch’oxn ha chamk’ojlal. Yik tzya'n wal tzaljk'ojlal ayin, yuj tzin ha chamk'ojlej."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha Espíritu hach Mamin, ha tzin moln a swach'il. Ha tz’i'n el tu a hin pixan, Tzya’n pax syaxilal ayin."},{"id":5,"tag":null,"isDisplayed":null,"text":"3     Ha wal Espíritu Mamin, ix ak' ton wal ayin. Kaw tzyak’ wal sniwnal hin k’ojol, yujto kajn och ayin."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha Espíritu hach Mamin, ha tzin moln a swach'il. Ha tz’i'n el tu a hin pixan, Tzya’n pax syaxilal ayin."},{"id":6,"tag":null,"isDisplayed":null,"text":"4      Ha wal Espíritu Mamin, ix hak' a hin pixan, Kaw ha aychnhej ton wal wet’ok, tzin yi’n b’ey a swach’il."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha Espíritu hach Mamin, ha tzin moln a swach'il. Ha tz’i'n el tu a hin pixan, Tzya’n pax syaxilal ayin."}]},{"id":61,"title":"Ix Aj Samaria","guid":"+N15PpVRd0W/W8Z7Og7jug","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"61     Ix Aj Samaria \n \nC. S. G. # 180. La Samaritana"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 4:4-15; 7:37-46; Is. 12\n \n Xlajw cha, xyaln pax Jesús ixtk a ix: Tzin k’an wuk’ jak ha ayach, palta manh hojkok mach hin. Manh hojkok pax tas tznib’j Dios tzyak’a. Komnok hojtak. Toto ixta, hachxo tik, xa k’an ayin, hanxo xwak’ jun ha tz’a’n ha k’inal, xchi Jesús a ix. Jn.4:10</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Lech k'et' wuk' jak ha ha tik, xchi Jesús ix yalni, a jun ix aj Samaria, hata ix sk'an Jesús. Manh kit chonhb'ok wal ki b'a, yuj cha kaw matz tak'a. "},{"id":3,"tag":null,"isDisplayed":null,"text":"//Xchi ix a ki wach’ Kolmal yujto matz nachj el yuj ix; schamk'ojlal ki Mam Dios. //"},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Tzin k'an wuk' jak ha ayach, kaw manh hojkok mach hin; manh pax hojkok tas tznib'j Dios, komnok tznachj el ho'oj. Hach xo tik xa k'an ayin, jun ha tz'a'n ha k'inal."},{"id":4,"tag":null,"isDisplayed":null,"text":" //Ha jun ha tik may slajub', may aj oj ilchjok ho'oj; wal a sat lum lum tik. //"},{"id":4,"tag":null,"isDisplayed":null,"text":"3       Ha mach tz'u'n jun ha ha tik, kaw oj takjok sti heb'; hax heb' tz'u'n jun ha tzwak'a, manhx oj takjok sti heb'. Yujto ha jun ha tzwak' tik, kaw oj pak' sjaj a heb'."},{"id":5,"tag":null,"isDisplayed":null,"text":" //Kaw oj pak' wal a spixn heb', kaw oj scha wal heb' sk'inal, kaw tzaljk'ojlal yik heb'. //"}]},{"id":62,"title":"Jun A'm Niwnk'ojlal","guid":"w+NfCFcw2E+5oyGi2s0kSA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"62   Jun A'm Niwnk'ojlal\n \nC. S. G. # 253  El Fiel Consolador"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 14:12-24; Ef. 5:8-20; Jn. 15:26, 16:14 \n \nHantik oj hin k’an a ki Mam Dios hax oj chekn kot junx oj kolwjok he yet’ok. Jn. 14:16.</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Hanh yunnalnhek xo Dios, kalk el jun wach' ab'ix, toxnhej ay yailal, toxnhej ay kusk’ojlal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kalk yab’ smasnil anma', to chekb’il kot aynhek, wal jun a'm Niwnk'ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Halb’il kan yuj Jesús yuj Yespíritu Dios. To xya’ kot wal aynhek, ayx ek’ a kin pixan, "},{"id":4,"tag":null,"isDisplayed":null,"text":"oj yal heb’ yikxo Dios yab’xil to ix jawi, wal jun a’m Niwnk’ojlal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Ix ek’ wal k’ik’k’inal, ix jaw jun sak k’inal. Ha wal ix a’n lajwok smasnil tas to ay smay. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha wal jun sakk’inal ix jaw a hin pixan. Yuj jun a’m Niwnk’ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Halb’il kan yuj Jesús yuj Yespíritu Dios. To xya’ kot wal aynhek, ayx ek’ a kin pixan, "},{"id":5,"tag":null,"isDisplayed":null,"text":"oj yal heb’ yikxo Dios yab’xil to ix jawi, wal jun a’m Niwnk’ojlal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Ha Yespíritu Dios x’a’n b’oxk sk’ojl heb’ anma’, heb’ ayk’ a k’ik’k'inal yet’ a skal kusk’ojlal, "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yuj cha kaw oj yal heb’ to ay sjunk’ojlal heb’, yuj jun a’m Niwnk’ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Halb’il kan yuj Jesús yuj Yespíritu Dios. To xya’ kot wal aynhek, ayx ek’ a kin pixan, "},{"id":6,"tag":null,"isDisplayed":null,"text":"oj yal heb’ yikxo Dios yab’xil to ix jawi, wal jun a’m Niwnk’ojlal."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Jun niwkil chamk’ojlal, matz hin k’ech waln eli. Jun niwkil siylab’ tik ix ajxkan wal ayin, "},{"id":6,"tag":null,"isDisplayed":null,"text":"ha tzjeln el hin nab’en, yuj cha yik Dios xaji, yuj jun a’m Niwnk’ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Halb’il kan yuj Jesús yuj Yespíritu Dios. To xya’ kot wal aynhek, ayx ek’ a kin pixan, "},{"id":7,"tag":null,"isDisplayed":null,"text":"oj yal heb’ yikxo Dios yab’xil to ix jawi, wal jun a’m Niwnk’ojlal."}]},{"id":63,"title":"U’j Jun Ha Yik K’inal","guid":"CeaK6xKlhUSr8t0TF1at8A","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"63  U’j Jun Ha Yik K’inal \n \nC. S. G. # 309 Toma De La Fuente De Agua Viva"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 4:4-15; Is. 55; Jn. 7:37-46\n \n Palta hax heb’ tz’u’n jun ha tzwak’a, manhx b’a’nh oj kot staknhtil heb’ jun ejmxo.  Jn. 4:14</f></i>"},{"id":3,"tag":null,"isDisplayed":null,"text":"1      Ha yik pekti’ kaw takjnak hin ti yuj hin mul, may aj ay tzaljk’ojlal a hin pixan. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Hat a yik xin chaj Jesús hin wach’ Kolmalok, ix ilchj wal jun ha ix b’on hin pixan."},{"id":0,"tag":1,"isDisplayed":null,"text":"Manhx oj takjok sti heb’ tzjaw a Cristo, tzyak’ wal ki k’inal; tzyak’ ki tzaljk’ojlal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Manhx oj takjok sti heb’ tzjaw a Cristo, yujto tzyak’ ki k’inl a jun ejmnhej."},{"id":2,"tag":null,"isDisplayed":null,"text":"2      Kaw wach’ jun ha yik k’inl tzyak’ Dios wal aynhek, wach’k’ojlal yet’ tzaljk’ojlal xyak’ aynhek."},{"id":3,"tag":null,"isDisplayed":null,"text":" Yuj schamlil Jesús junk’ojlal xo kajk yet’ Dios, yuj cha kaw tzaljk’ojlal tzonh b’itnek jun."},{"id":0,"tag":1,"isDisplayed":null,"text":"Manhx oj takjok sti heb’ tzjaw a Cristo, tzyak’ wal ki k’inal; tzyak’ ki tzaljk’ojlal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Manhx oj takjok sti heb’ tzjaw a Cristo, yujto tzyak’ ki k’inl a jun ejmnhej."},{"id":3,"tag":null,"isDisplayed":null,"text":"3      Hach anma’, ¿tas yuj matz ha chaj Jesús tiknek? To ixta’, tza chaj jun ha yik k’inal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Xchi Jesús to kaw ha tz’a’n jun ha yik k’inal, to ixta’ manx b’a’nh oj takjok ha ti’."},{"id":0,"tag":1,"isDisplayed":null,"text":"Manhx oj takjok sti heb’ tzjaw a Cristo, tzyak’ wal ki k’inal; tzyak’ ki tzaljk’ojlal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Manhx oj takjok sti heb’ tzjaw a Cristo, yujto tzyak’ ki k’inl a jun ejmnhej."}]},{"id":64,"title":"Yowlal Tzach Och Wu’uj","guid":"O4A3sXSx00O33wfZmR5vnQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"64  Yowlal Tzach Och Wu’uj\n \nV. C. #100. Te Necesito Ya"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Pr. 3:5-8; 1 Cr. 28:9-10; Sal. 17:8-12\n \n Mamin Jehová, yiktax hin kotch kelmal, toxn yipk’ojlal haj wu’uj. Sal 71:5</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1       Yowlal tzach och wu’uj, Jesús hin wach’ Kolmal, kaw yuj ha chamk’ojlal, tz’och junk’ojlal ayin."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yowlal tzach och wet’ Cristo, yelk’ojlal tzin k’an hep. A emmkilal tzin jaw aych Jesús hin Kolmal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Yowlal tzach och wu’uj, may aj tzin hak kani. Ho’oj matz hin telwi, yujto aych ek’ wet’ok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yowlal tzach och wet’ Cristo, yelk’ojlal tzin k’an hep. A emmkilal tzin jaw aych Jesús hin Kolmal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Yowlal tzach och wu’uj, ak’ wach’k’ojlal ayin. Kaw b’o tas tza nib’ej, a smasnil hin pixan."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yowlal tzach och wet’ Cristo, yelk’ojlal tzin k’an hep. A emmkilal tzin jaw aych Jesús hin Kolmal."},{"id":5,"tag":null,"isDisplayed":null,"text":"4    Yowlal tzach och wu’uj, hach hin Jesús Wajlil. Kaw hek hin xo wal jun, hach Jesús hin Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yowlal tzach och wet’ Cristo, yelk’ojlal tzin k’an hep. A emmkilal tzin jaw aych Jesús hin Kolmal."}]},{"id":65,"title":"Ay Jun B'e","guid":"k1xnfXF/606wCbeFY4FEFg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"65   Ay Jun B'e \n<fWide Latin> \n</f>C. S. G. # 330 Hay Una Senda"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 14:1-10; Sal. 16; Pr. 3:5-6, 13-18\n \n Ha jun b’e tzwal tik, han, ton tik. Kojn hin tztak hex wi’n at aj ayk’ ki Mam Dios. Hantik, yel hin, aj k’inl hin. Jn .14:6</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ay wal jun b'e kaw wal manh yojkok heb' anma', Ha wal jun b’e tik kaw wal yel x’ilchj wuj hantik. Ha wal hin Cristo yel hin Kolmal xo yaji. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ha Jesucristo b’e yik satcha’anh. Ha wal hin Cristo yel hin Kolmal xo yaji. Ha Jesucristo b’e yik wal Kolnb’il."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ha yik pekti' kaw tzin schamk'ojlej heb' anma', Kaw hin b'ojnak smasnil maysch'olnilal yet' heb'. Ha yik ix wa'n och hin k'ojl a Jesucristo, "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw tzin schab'k'ojlej wal heb' anma tiknek jun. Ha yik ix wa'n och hin k'ojl a Jesucristo, kaw tzin schab'k'ojlej wal heb' anma tiknek. "},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ha yik pekti' ayn wal och a b'e yik kuslal, tiknek ayn xo och a jun b'e yik satcha'anh Yik ix hin chaj hin wach' Kolmal Jesucristo, "},{"id":5,"tag":null,"isDisplayed":null,"text":"kaw yel hin och yunnalk Dios a smasnil k'inal. Yik ix hin chaj hin wach' Kolmal Jesucristo, kaw yel hin och yunnalk a smasnil k'inal"}]},{"id":66,"title":"Chaj Hab' Spaxti Dios","guid":"DaMA6Gmj202HEVemfHHaQw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"66      Chaj Hab' Spaxti Dios\n \nH. D. G. # 83 Oh, Ven Sin Tardar"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mt. 11:28-30; Is. 55:1-3\n \n Tzannhj hex icha to tz’el he yip he munlji, yet’ hex icha to kaw al heyaj yuj heyikatz, kotnhek hayin, oj hex wak’ iljok. Mt. 11:28</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Chaj hab' spaxti ki Mam Dios tiknek, oj ha cha swach'k'ojlal Jesús. Aktj kan smasnil maysch'olnilal, chaj Cristo tiknek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kotnh wal (kaw kotn a Jesús) a Jesús, (Kotnh a Jesús,) Kaw chaj (kotnh a Jesús) ha k’inal, (kotnh a Jesús,) "},{"id":3,"tag":null,"isDisplayed":null,"text":"kaw chaj (chaj wal Jesús) wal Jesús, (chaj wal Jesús,) sek oj (yuj wal Jesús) ha kolchji. (Oj ha kolchji’)."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Kaw awtb'ilch yuj wal ki wach' Kolmal, manh hojkok tas wal haj k’ik’an, A'ch ha k'ojl a ki wach' Kolmal, sek oj ha kolchji. "},{"id":0,"tag":1,"isDisplayed":null,"text":"Kotnh wal (kaw kotn a Jesús) a Jesús, (Kotnh a Jesús,) Kaw chaj (kotnh a Jesús) ha k’inal, (kotnh a Jesús,) "},{"id":4,"tag":null,"isDisplayed":null,"text":"kaw chaj (chaj wal Jesús) wal Jesús, (chaj wal Jesús,) sek oj (yuj wal Jesús) ha kolchji. (Oj ha kolchji’)."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Kaw ay sniwnk’ojlal Jesús ayach, tas wal spak schamk’ojlal tzak’a. Ak’ ha pixn a ki wach’ Kolmal, sek oj ha kolchji."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kotnh wal (kaw kotn a Jesús) a Jesús, (Kotnh a Jesús,) Kaw chaj (kotnh a Jesús) ha k’inal, (kotnh a Jesús,) "},{"id":5,"tag":null,"isDisplayed":null,"text":"kaw chaj (chaj wal Jesús) wal Jesús, (chaj wal Jesús,) sek oj (yuj wal Jesús) ha kolchji. (Oj ha kolchji’)."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Chab’il sjaw heb’ ajmul yuj Jesús, yujto tznib’j tzkolchjkan el spixn heb’. Manh ha chab'k'ojlok spaxti Dios, chaj Jesús tiknek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kotnh wal (kaw kotn a Jesús) a Jesús, (Kotnh a Jesús,) Kaw chaj (kotnh a Jesús) ha k’inal, (kotnh a Jesús,) "},{"id":6,"tag":null,"isDisplayed":null,"text":"kaw chaj (chaj wal Jesús) wal Jesús, (chaj wal Jesús,) sek oj (yuj wal Jesús) ha kolchji. (Oj ha kolchji’)."}]},{"id":67,"title":"Ha Kajlil Jesús Wan Hach Yawtni","guid":"GlDdzhE4M06hlE+LtmuTSQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"67  Ha Kajlil Jesús Wan Hach Yawtni \n \nV. C. # 252 El Señor Jesús Está Llamando"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mr. 3:18; Lc. 6:15-18 \n \nHax Jesús, ix atxi. Yik wan sb’eyi, ix yiln jun Mateo sb’i…Ochnh hin kuywumok, xchi Jesús ha a. Yajnh cha, xk’ewa’an, ix och skuywumok.  Mt. 9:9</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Awtb'il hach yuj ki wach' Kolmal Jesús, wan sayn ek' Jesús heb' oj munljok. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Yujto tilto wal heb' mantzak chani, ¿mach oj halnok spaxti Dios a heb'?"},{"id":0,"tag":1,"isDisplayed":null,"text":"Hach hin Dios, (hach hin Dios) waj Mamin, (waj Mamin) oj hin at a smasnil hin k'ojol. (waj hach Mamin)"},{"id":4,"tag":null,"isDisplayed":null,"text":" Kaw oj wall (waj Mamin) ha paxti', oj hin b'o wal tas tza nib'j ayin. (oj hin b’o’) "},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Hach ton wal tzach b'inax ha a paxti', yel hach ton xa sik' heb' ha chekab'. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha a yik ix och wal heb' ha chekb'ok, ixtk ix yutj heb' yaln wal aych Mamin. "},{"id":0,"tag":1,"isDisplayed":null,"text":"Hach hin Dios, (hach hin Dios) waj Mamin, (waj Mamin) oj hin at a smasnil hin k'ojol. (waj hach Mamin) "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw oj wall (waj Mamin) ha paxti', oj hin b'o wal tas tza nib'j ayin. (oj hin b’o’) "},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Til wal heb' anma tzcham a skal smul jun, oj at heb' a skal jun yailal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yuj cha kalk el yabxil Jesucristo ¿Mach junk 'oj halnok, chekn at Mamin?"},{"id":0,"tag":1,"isDisplayed":null,"text":"Hach hin Dios, (hach hin Dios) waj Mamin, (waj Mamin) oj hin at a smasnil hin k'ojol. (waj hach Mamin) "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kaw oj wall (waj Mamin) ha paxti', oj hin b'o wal tas tza nib'j ayin. (oj hin b’o’) "},{"id":5,"tag":null,"isDisplayed":null,"text":"4    Jab'xoj wal oj jawk pax Jesucristo, jab'xoj wal oj ki k'ochk a stz'ey Dios."},{"id":6,"tag":null,"isDisplayed":null,"text":" Hoktom wal wach' oj aj yalx aynhek ta', kaw wal wach' smasnil tas xa b'o'o."},{"id":0,"tag":1,"isDisplayed":null,"text":"Hach hin Dios, (hach hin Dios) waj Mamin, (waj Mamin) oj hin at a smasnil hin k'ojol. (waj hach Mamin) "},{"id":7,"tag":null,"isDisplayed":null,"text":"Kaw oj wall (waj Mamin) ha paxti', oj hin b'o wal tas tza nib'j ayin. (oj hin b’o’) "}]},{"id":68,"title":"Ixkek Halk El Wach' Ab'ix","guid":"pcTZDDDcYk2GsIiraqSPEg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"68    Ixkek Halk El Wach' Ab'ix\n \nV. D. J. # 59 Id A Buscar Al Alma Perdida"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Hch. 1:8; Mt. 10:5-15 \n \nTz’at heyalli, to jab’xoj wal oj wach’ och jun aj satchan Yajlil.  Mt. 10:7</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Ixkek at halk el wal jun wach' ab'x tik, wal a heb' anma manh yojkok Dios. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kot kab' smasnil heb' anma kaw k'unb'nak, Yuj maysch'olnilal xchi ki Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal 'ixkek, halk el jun wach' ab'x tik; (kaw wal 'ixkek) (halk el jun wach' ab'x tik,) a heb' anma', ijk kot heb’ a Jesús. (a heb' anma') (ijk kot heb' a Jesús.) "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw oj kolchjok heb', toto tzin schaj heb', (kaw oj kolchjok heb',) xchi ki Kolmal a smasnil heb’ schekab'. (toto tzin schaj eb'.)"},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Ixkek at halk el wal jun wach' ab'x tik, a heb' 'anmaayk’ a skal maysch'olnil. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw chek kot heb' a jun ki wach' Kolmal, kaw yel oj kan heb' a tzaljk'ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal 'ixkek, halk el jun wach' ab'x tik; (kaw wal 'ixkek) (halk el jun wach' ab'x tik,) a heb' anma', ijk kot heb’ a Jesús. (a heb' anma') (ijk kot heb' a Jesús.) "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw oj kolchjok heb', toto tzin schaj heb', (kaw oj kolchjok heb',) xchi ki Kolmal a smasnil heb’ schekab'. (toto tzin schaj eb'.)"},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Tzin nib’j tzin och tza’n yuj Jesucristo, sek yiklum hin nhej wal a spaxti’. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Tzwiptzan heb’ anma to telwnak yuj mul, tzin jukb’tzan heb’ wal a stojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal 'ixkek, halk el jun wach' ab'x tik; (kaw wal 'ixkek) (halk el jun wach' ab'x tik,) a heb' anma', ijk kot heb’ a Jesús. (a heb' anma') (ijk kot heb' a Jesús.)"},{"id":6,"tag":null,"isDisplayed":null,"text":" Kaw oj kolchjok heb', toto tzin schaj heb', (kaw oj kolchjok heb',) xchi ki Kolmal a smasnil heb’ schekab'. (toto tzin schaj eb'.)"}]},{"id":69,"title":"Kab'ek Tas Tzyal Ki Kolmal","guid":"7K3NEA81V0i+CkQqEp3MUQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"69      Kab'ek Tas Tzyal Ki Kolmal\n \nV. C. # 244. Oid, Oid Lo Que Nos Manda El Salvador"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mt. 28:19-20; Mr. 1:16-20 \n \nYuj cha, ixkek kuywjok a junjn chonhab’, sek oj laj och heb’ hin kuywumok. Mt. 28:19</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Kab’ek tas tzyal spaxti ki wach’ Kolmal tiknek, koyek kalk el schamk’ojlal ki Mam Dios. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ayn ek' he yet' a junjn k'u aj tzex ek'i, Xchi wal ki wach’ Kolmal Jesucristo aynhek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kalk el yab'xil Jesús, kaw kalk el yab'xil ki wach' Kolmal Jesús, kalk el yab'xil Jesús. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ki wach' Kolmal kaw tztak' wal yuj smasnil, kaw kalk wach' paxti a ki Kolmal Jesús, kaw kalk wach' paxti a ki Kolmal Jesús."},{"id":5,"tag":null,"isDisplayed":null,"text":" Ha tzonh kolnek wal eli, ha x’i’n el smasnil ki mul; kalk el smasnil schamk'ojlal ki Dios a heb'."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Wal yel o’ltak wal smasnil heb' tzb'on maysch'olnil, manh yojkok heb' jun ki wach' Kolmal Jesús. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw kusk'ojlal wal yaj heb' tzb'on maysch'olnilal, yujto kaw yel manh yojkok heb' aj oj k'ochok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kalk el yab'xil Jesús, kaw kalk el yab'xil ki wach' Kolmal Jesús, kalk el yab'xil Jesús."},{"id":5,"tag":null,"isDisplayed":null,"text":" Ki wach' Kolmal kaw tztak' wal yuj smasnil, kaw kalk wach' paxti a ki Kolmal Jesús, kaw kalk wach' paxti a ki Kolmal Jesús. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Ha tzonh kolnek wal eli, ha x’i’n el smasnil ki mul; kalk el smasnil schamk'ojlal ki Dios a heb'."},{"id":4,"tag":null,"isDisplayed":null,"text":"3       Kalk el yab'xil ki wach' Kolmal a smasnil heb' anma', kalk el a smasnil heb' satnak."},{"id":5,"tag":null,"isDisplayed":null,"text":" Kaw yel yowlal oj kalk el yab'xil jun kolnb'il, sek wach' oj scha heb' skolnb'il a ki wach' Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kalk el yab'xil Jesús, kaw kalk el yab'xil ki wach' Kolmal Jesús, kalk el yab'xil Jesús."},{"id":6,"tag":null,"isDisplayed":null,"text":" Ki wach' Kolmal kaw tztak' wal yuj smasnil, kaw kalk wach' paxti a ki Kolmal Jesús, kaw kalk wach' paxti a ki Kolmal Jesús. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Ha tzonh kolnek wal eli, ha x’i’n el smasnil ki mul; kalk el smasnil schamk'ojlal ki Dios a heb'."},{"id":5,"tag":null,"isDisplayed":null,"text":"4        Kaw yel, kaw yel, oj lajwok ek' wal smasnil tas, hax jun ki wach' Kolmal oj och Yajlil. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Oj yak' wal ki nab'en yet' pax ki junk'ojlal, yel oj ki b'itnok sb'i Jesús ki wach' Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kalk el yab'xil Jesús, kaw kalk el yab'xil ki wach' Kolmal Jesús, kalk el yab'xil Jesús. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Ki wach' Kolmal kaw tztak' wal yuj smasnil, kaw kalk wach' paxti a ki Kolmal Jesús, kaw kalk wach' paxti a ki Kolmal Jesús. "},{"id":8,"tag":null,"isDisplayed":null,"text":"Ha tzonh kolnek wal eli, ha x’i’n el smasnil ki mul; kalk el smasnil schamk'ojlal ki Dios a heb'."}]},{"id":70,"title":"Ki Ch'oxk El Yik Cristo","guid":"u6qllLMaIkCTIXOrlDcGxg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"70  Ki Ch'oxk El Yik Cristo\n \nV. C. # 194  Despliegue El Cristiano"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ef. 6:10-20; Ro. 13:12-14; Ro. 1:16-17 \n \n   Icha heb’ wach’ tzyutj sb’a a k’ual, ixta tzkutjek ki b’a.    Ro. 13:13</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ki masnilek kaw ki ch’oxk el spaxti ki Mam Dios, yik tzki ch’oxnek sniwn chamk’ojlal Dios a heb’ anma’. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw ka’k wal ip icha heb’ a’m howl yet’ syamk’ab’, tzki ch'oxn el sjelnal Dios a smasnil k'inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kajlilk yaj Jesús, tzyak’ ki te'nalek, ayk' a ki tz'eyk a smasnil k'inal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw matz honh xiwek, tzya’n ki jelnalek, kaw oj kan win ajk’ojl a yalnh kujek."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Ki masnilek jun, ki ch’oxk el spaxti ki Mam Dios, kaw manh honh xiwk a smasnil tas kaw ay smay."},{"id":4,"tag":null,"isDisplayed":null,"text":" Kaw ha spaxti Dios aych ket'ek a smasnil k'inal, ha ch'anh tzonh kuynek wal a smasnil stojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kajlilk yaj Jesús, tzyak’ ki te'nalek, ayk' a ki tz'eyk a smasnil k'inal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw matz honh xiwek, tzya’n ki jelnalek, kaw oj kan win ajk’ojl a yalnh kujek."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ki masnilek jun, ki ch’oxk el spaxti ki Mam Dios, kalk el spaxti Dios wal a smasnil anma'.  "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ha wal ki wach' Kolmal Jesús sakk'inl yaji, sakk'inl xo yaj ki pixnek yuj ki Mam Dios."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kajlilk yaj Jesús, tzyak’ ki te'nalek, ayk' a ki tz'eyk a smasnil k'inal. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kaw matz honh xiwek, tzya’n ki jelnalek, kaw oj kan win ajk’ojl a yalnh kujek."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Ki masnilek jun, ki ch’oxk el spaxti ki Mam Dios, kalk yab' heb' anma spaxti Dios may slajub'. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Ki ch'oxk el a heb' anma jun sakk'inl to kaw yel, sek tztak' yojkan el heb' spaxti ki Mam Dios."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kajlilk yaj Jesús, tzyak’ ki te'nalek, ayk' a ki tz'eyk a smasnil k'inal. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Kaw matz honh xiwek, tzya’n ki jelnalek, kaw oj kan win ajk’ojl a yalnh kujek."},{"id":6,"tag":null,"isDisplayed":null,"text":"5     Ki masnil hek jun, ki ch’oxk el spaxti’ ki Mam Dios, tzki ch'oxnek el sjelnal Dios yet' wal swach'ilal."},{"id":7,"tag":null,"isDisplayed":null,"text":" Ha wal a ki Mam Dios kaw yel may tas ajltak, yuj wal cha kaw ayk' ki wach' Kolmal ket'ek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kajlilk yaj Jesús, tzyak’ ki te'nalek, ayk' a ki tz'eyk a smasnil k'inal. "},{"id":8,"tag":null,"isDisplayed":null,"text":"Kaw matz honh xiwek, tzya’n ki jelnalek, kaw oj kan win ajk’ojl a yalnh kujek."}]},{"id":71,"title":"¿Mach Aj Wach’ Woch Tzak’an?","guid":"4zDYTJgKuEe87sLCWru29A","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"71     ¿Mach Aj Wach’ Woch Tzak’an? \n \n8# E.D.V."},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Juan 14;6. \n \nHax Simón Pedro ix ta’w ixk ha a: Mamin, ¿tom ay junk mach aj oj stak’ ki at yet’ honh? Yujto a jun tzo’nh paxti tzal aynh tik honh, hata oj ki cha ki k’inl a jun ejmnhej honh. Juan 6:68</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      A sat lum tik kaw wal ay kusk’ojlal, a junjn k’u tzwab’ syal yu’uj. "},{"id":3,"tag":null,"isDisplayed":null,"text":"A hin ch’okoj kaw wal matz tak’ wu’uj yik tzwa’n howl yet’ win aj k’ojol."},{"id":0,"tag":1,"isDisplayed":null,"text":"¿Ha a Jesùs hata tzin och tzak’an?, ¿Ha Jesùs tzwa’ch yipk hi k’ojol? "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha hin kolni, xb’o hin b’eyb’al yu’uj ¿Ha Jesùs tzwa’ch yipk hin k’ojol?"},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Cristo tzyak’ k’inal, kaw yel pax tzyala; kaw wal tzin tzalj woch tza’n yu’uj. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yuj Cristo tztak’ ki k’och yet’ ki Mam Dios, kaw wal chi icha no yal chab’."},{"id":0,"tag":1,"isDisplayed":null,"text":"¿Ha a Jesùs hata tzin och tzak’an?, ¿Ha Jesùs tzwa’ch yipk hi k’ojol? "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ha hin kolni, xb’o hin b’eyb’al yu’uj ¿Ha Jesùs tzwa’ch yipk hin k’ojol?"},{"id":4,"tag":null,"isDisplayed":null,"text":"3     A smasnil tas kaw wal ay tz’och wu’uj, a Jesús ix ilchj wuj smasnil. "},{"id":5,"tag":null,"isDisplayed":null,"text":"May junkxo mach aj tztak’ skot wach’ilal, ha Cristo icha sak k’inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"¿Ha a Jesùs hata tzin och tzak’an?, ¿Ha Jesùs tzwa’ch yipk hi k’ojol? "},{"id":6,"tag":null,"isDisplayed":null,"text":"Ha hin kolni, xb’o hin b’eyb’al yu’uj ¿Ha Jesùs tzwa’ch yipk hin k’ojol?"}]},{"id":72,"title":"Oj Wawk Jun Inhat Hatn Spaxti Dios","guid":"fidSX3tSXUCTOIzMQcGiXQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"72       Oj Wawk Jun Inhat Hatn Spaxti Dios\n \nC. S. G. # 282. Sembraré La Simiente Preciosa"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Lc. 8:4-15; Mr. 4:1-9; Jn. 4:31-38 \n \nOj wal ayex, tas tzyal e’lch’ jun ab’x xwal tik. Ha jun tzo’nh inhkt cha, tzyal e’lchi, hatn spaxti Dios.  Lc. 8:11</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kaw oj wawk jun inhat yik ki Mam Dios, hatn jun wach’ ab'x yik kolnb’il. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Oj wawok, oj wawok, ya' sb'a pitzn hin, oj kan wuj a yol sk'ab' hin Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj wawok, (oj wawok) oj wawok, (oj wawok,) jun inhat hatn spaxti ki Dios. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Oj yak’ Dios, (oj yak’ Dios) spak ayin, (spak ayin,) Sat wawb'en yik oj hin k'och yet' Dios."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Oj wawk a spixn heb' anma to satnak, scheknb'il, Dios yik jun niwnk'ojlal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Oj wawok, oj wawok, ya'sb'a pitzn hin, oj kan wuj a yol sk'ab' hin Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj wawok, (oj wawok) oj wawok, (oj wawok,) jun inhat hatn spaxti ki Dios."},{"id":5,"tag":null,"isDisplayed":null,"text":" Oj yak’ Dios, (oj yak’ Dios) spak ayin, (spak ayin,) Sat wawb'en yik oj hin k'och yet' Dios."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Wach'xam tzatz spixn heb' anma oj wawok, Spaxti Dios aykn a yol ch'anh hu'unh. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Oj wawok, oj wawok, ya' sb'a pitzn hin, oj kan wuj a yol sk'ab' hin Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj wawok, (oj wawok) oj wawok, (oj wawok,) jun inhat hatn spaxti ki Dios. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Oj yak’ Dios, (oj yak’ Dios) spak ayin, (spak ayin,) Sat wawb'en yik oj hin k'och yet' Dios."}]},{"id":73,"title":"Wach'xam Kaw Ay Smay","guid":"s9Cf6sf8C0SEeObyFivnPg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"73  Wach'xam Kaw Ay Smay \n \nV. C. # 248  A Lugares Obscuro"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Is. 6:8-10; Ro. 10:14-17; 2 Cor. 5:18-21 \n \n...Waj Mamin, tztak’ hin ha chekni.   Is. 6:8</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Oj hin at wal aj tznib'j hin Kolmal tzin scheka, wach'xam kaw oj wab’ syal wal yu'uj."},{"id":3,"tag":null,"isDisplayed":null,"text":" Yuj wal smasnil heb’ anma, may Dios a spixan. Yik tzwa’n yojkok wal heb’ jun kolnb’il."},{"id":0,"tag":1,"isDisplayed":null,"text":"Waj Mamin, oj hin at, (waj Mamin,) (oj hin at,) Wall hab'xil, a smasnil, heb' anma'; (wall ab'xil,) (a smasnil,) (heb' anma';) maysch'olnil, "},{"id":4,"tag":null,"isDisplayed":null,"text":"sek 'oj scha heb' sk'inal. (kaw ajmul,) (sek oj scha,) (heb’ sk'inal.)"},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Wach'xam kaw wal ay smay kaw ma oj hin, xiwi, kaw, oj wak' hin b'a schekb'ok Jesús. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Wach'xam kaw manhxtzak hin schamk'ojlej heb' anma', palta tzin schamk’ojlej hin kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Waj Mamin, oj hin at, (waj Mamin,) (oj hin at,) Wall hab'xil, a smasnil, heb' anma'; (wall ab'xil,) (a smasnil,) (heb' anma';) maysch'olnil, "},{"id":5,"tag":null,"isDisplayed":null,"text":"sek 'oj scha heb' sk'inal. (kaw ajmul,) (sek oj scha,) (heb’ sk'inal.)"},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Kaw manh ki chamk’ojlej smasnil tas ay a tik, yujto, kaw oj lajwok wal ek'i. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ki masnil' ka'k och wal ki k'ojl a ki Kolmal, sek oj kan ki pixn a junk'ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Waj Mamin, oj hin at, (waj Mamin,) (oj hin at,) Wall hab'xil, a smasnil, heb' anma'; (wall ab'xil,) (a smasnil,) (heb' anma';) maysch'olnil, "},{"id":6,"tag":null,"isDisplayed":null,"text":"sek 'oj scha heb' sk'inal. (kaw ajmul,) (sek oj scha,) (heb’ sk'inal.)"},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Heb' anma satnkto wal a skal maysch'olnil, hax Jesús kaw wan sayn ek' heb' jun. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Tznib'j Jesús tzkolchj el heb' a skal niwkil yailal, sek oj k'och heb' wal a satcha'anh."},{"id":0,"tag":1,"isDisplayed":null,"text":"Waj Mamin, oj hin at, (waj Mamin,) (oj hin at,) Wall hab'xil, a smasnil, heb' anma'; (wall ab'xil,) (a smasnil,) (heb' anma';) maysch'olnil, "},{"id":7,"tag":null,"isDisplayed":null,"text":"sek 'oj scha heb' sk'inal. (kaw ajmul,) (sek oj scha,) (heb’ sk'inal.)"}]},{"id":74,"title":"Win Ilm Kalnelu","guid":"DlQ24rRZLUC9Z/X3uvlLsw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"74   Win Ilm Kalnelu\n \n C.S.G   Visión Pastoral."},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mt. 18:10-14; Lc. 15:1-10; Jn. 10: 1-15 \n \nK’ilnlok ay junk mach ay junk howink skalnelu, toto tzsat junk no’…tz’at saynk ek’ win jun no tzsat cha. Mt.18:12</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ay howink kalnelu, ayk’ no a yol skolal, kaw yel tanhb’il he no, yuj jun yilmal cha. Hax wal a yemk’ual, kaw ix sb’is win he no'. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw wal ix sat jun no', kaw wal ix sat jun no', kaw ix kus winak. B’alnhlajnhyowinak no xkan a jun a’lik, kaw ix at win say jun no ix satkn cha. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yik x’ilchj no yuj winak, kaw wal tz’ok’ no b’i’an, kaw wal lajwnak no’, kaw xb’ox no yuj winak, ix sme’ kot win no’."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Hanhjtona jun ab’x tik, kaw, tzyal yuj heb’ anma, kaw wal ay heb’ anma satnk a skal smul, kaw kusk’ojlal wal yaj heb’ a sat lumlum tik, "},{"id":4,"tag":null,"isDisplayed":null,"text":"kaw may Dios a spixn heb’, kaw may Dios a spixn heb’, ma oj kolchjok heb’. Ha heb’ schekb’ Dios kaw aych wal a snab’en heb’, sayn ek’ wal heb’ satnak, sek oj kolchjok heb’. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ha yik oj ilchjok heb’, kaw oj ijxok kot heb’. A jun b’e kaw wal wach’, a jun b’e kaw wal yel, a Cristo Jesús."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Toto ay ha yail, yet’ pax ha kusk’ojlal
