d":3,"tag":null,"isDisplayed":null,"text":"Tzki na kot yik xkulsaxi, yik ix cham ki wach' Kolmal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ha yik tzki wan jun pan tik, tzki na kot sniwnal Kajlil, Ix yab' syal sniwnal kujek, yik ix el ton wal schik'il."},{"id":4,"tag":null,"isDisplayed":null,"text":" Tzin chamk'ojlej hin Kolmal, yujto manb'iln el yu'uj."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ha yik tzku'n yechl schik’il, tzyak’ ki na kot wal schamlil, ha wal schik'l honh mann eli, yuj wal cha honh kolchj kani. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Smasnil tas yab’jnak syail, kaw oj ki naknhej koti."},{"id":5,"tag":null,"isDisplayed":null,"text":"4      Yuj wal ha chamlil Jesús, oj in at a satcha'anh. Yuj cha tzwak' hin b'a ayach, yujto ix hak' hin k'inal. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kaw wal tzin b'itnej ha b'i, tzach hin chamk'ojlej Mamin."}]},{"id":292,"title":"Yiklum Hohn Ha A Cheknb'il","guid":"DDf4JuIhdkSPIduL61wQBA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"292      Yiklum Hohn Ha A Cheknb'il\n \nC. S. G. # 517. Obediente A Tu Mandato\n        Lajn sjajl yet’ # 96"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>1 Cor. 11:23-29; Mat. 26:26-29; Mar. 14:22-26\n \n Ha jun tzo’nh kuynb’il yik cena waljnak ayex, a Kajlilek a’jnak ayin. 1 Co. 11:23</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Tzyiklx wal ha cheknb'il jun, tik tzjaw heb' hek xo tiknek. Yechl ha niwnal yet’ ha chik’il, tzki chaj wal yet’ tzaljk'ojlal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Jantknhej yailal ix hab’i, yet’ pax wal ha chamk’ojlal, Kaw oj kal heb’ smasnil honh jun, hach kajlil ki wach’ kolmal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      kaw tzki na kot ha kusk'ojlal, ix och pitz'n ha a pixan. Ix ajx hok' jun tas kaw wal k'a, yuj wal smasnil heb' ajmul. "},{"id":4,"tag":null,"isDisplayed":null,"text":"A Golgota ix hab’ syail, kaw wal ma ix ha na’a. Tza’ch wal k’asn k’ojlal ayonh, yik tzonh och tza’n wal ho’oj."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Kaw tzkak' yuj diosal aych Jesús, yuj wal ha chamk'ojlal jun. kaw tzkak' yuj diosal wal ayach, yuj ha niwnk'ojlal ayonh. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yik hach cham wal a te kulus, ix hak' wal ki junk'ojlal. Halx kab' wach' paxti wal aych jun, tiknek, a smasnil k’inal. Amén."}]},{"id":293,"title":"A Belén Ix Alj Jesús","guid":"1I1r4QRwtEWVAEGrKmLgrQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"293  A Belén Ix Alj Jesús\n \nC. S. G. # 135  En Belén Nació Jesús"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>I Co. 15:1-10; Jn. 12:44-46; Mt. 2:1-6\n \n Ha a chonhb’ Belén a yol yik Judea, hata aljnak Jesús. Mt. 2:1</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      A Belén aljnak Jesús, aleluya; Kaw ix yijkot sakk’inal, alelulya."},{"id":0,"tag":1,"isDisplayed":null,"text":"Halx kab' wach' paxti a Dios, aleluya; Halx kab' wach' paxti a Dios, aleluya."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Kaw kujnhej ix alj Jesús, aleluya; Yet’ yipal Dios pitzwnak, aleluya."},{"id":0,"tag":1,"isDisplayed":null,"text":"Halx kab' wach' paxti a Dios, aleluya; Halx kab' wach' paxti a Dios, aleluya."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ha Jesús kaw Kolwjum, aleluya;a'ch ha k'ojl a hin Kolmal, aleluya."},{"id":0,"tag":1,"isDisplayed":null,"text":"Halx kab' wach' paxti a Dios, aleluya; Halx kab' wach' paxti a Dios, aleluya."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Oj hin pax a satcha'anh, aleluya;oj waj yet' hin wach' Kolmal, aleluya."},{"id":0,"tag":1,"isDisplayed":null,"text":"Halx kab' wach' paxti a Dios, aleluya; Halx kab' wach' paxti a Dios, aleluya."}]},{"id":294,"title":"Aljnak Hin Kolmal A Belén","guid":"Orc0nXsB7UC0gv2JuBi04A","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"294  Aljnak Hin Kolmal A Belén\n \nA.J. # 63. El Salvador Nació En Belén"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Hch. 1:6-11;  Jn. 1:1-5 \n \nHax yik ayk’ heb’ a Belén ix jaw stiempoal yalj jun unn cha. Luc. 2: 6</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Aljnak hin wach' Kolmal a chonhb' Belén, icha meb'a ixta ix aj yalji."},{"id":3,"tag":null,"isDisplayed":null,"text":" Ha wal aj tzwa no chej ix alj Jesús, Kaw o'ltak x'aj yalji."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal wach' snab'en hin Kolmal, Wujnhej wali xkot a satcha'anh. "},{"id":4,"tag":null,"isDisplayed":null,"text":"O'ltak ix aj yek' a skal heb’ anma’ yuj wal schamk'ojlilal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Wulnk ek' Jesús a skal heb’ anma’, yab'jnak syail yik swulk’ jaye hab'il. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Xlajw cha ix pax k'e a satcha'anh, wach' snab'en hin Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal wach' snab'en hin Kolmal, Wujnhej wali xkot a satcha'anh. "},{"id":5,"tag":null,"isDisplayed":null,"text":"O'ltak ix aj yek' a skal heb’ anma’ yuj wal schamk'ojlilal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ayk' xon Jesús hin Kolmal a pekti',yet' yipalil sb'o yolyib’nhk'inal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Aljnak Jesús kaw yel Dios pax wali, wach' snab'en hin Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal wach' snab'en hin Kolmal, Wujnhej wali xkot a satcha'anh. "},{"id":6,"tag":null,"isDisplayed":null,"text":"O'ltak ix aj yek' a skal heb’ anma’ yuj wal schamk'ojlilal."}]},{"id":295,"title":"Ha Yik Jun Ak'wal, A Belén","guid":"iMk6KRUygEqIIkHrYNU2Gw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"295  Ha Yik Jun Ak'wal, A Belén\n \nV. C. # 35 \tA Media Noche En Belén"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Lc. 2:8-20; Is. 9:1-7;    \n \n¡Halxkab' wach' paxti a Dios a satcha'anh! ¡ Hax a yolyib’nhk’inl tik, ay kab’ junk’ojlal! Lc. 2:14</f></i>"},{"id":3,"tag":null,"isDisplayed":null,"text":"1     Ha yik jun ak'wl a chonhb' Belén, x'alj Jesús ki Kolmalek ta'. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha heb' ángel kaw wal ix tzalj heb', ix b'itn heb' a tzalk'ojlal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw ix halx wal wach' paxti a Dios, ix b'itnax wal jun b'it ha a. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Junk'ojlal yet’ swach'k'ojlal ki Dios,ix halx wal a heb’ anma’."},{"id":2,"tag":null,"isDisplayed":null,"text":"2     Ha jun b’it sb'itnej heb' ángel cha,  kaw ix ab'x wal sb'itnax yuj heb’. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ha wal jun kaw wach' ab'x tik tzalni,  to kaw yel tzin kolchj kani. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Toto tzki chaj kab' jun wach' ab'x tik,  yet' smasnil heb' anma tz’ab’ni. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw oj ki cha junk'ojlal yet’ heb’, a Cristo ki wach' kolmal."},{"id":3,"tag":null,"isDisplayed":null,"text":"3     Ha smasnil heb’ anma satnkto, to ayk’ heb’ a skal skusk’ojlal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Toto tzjaw heb’ a Jesucristo,  kaw oj kolchjok ton wal heb’. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Jun wach' ab'x yik Yunnal ki Mam Dios,  yowlal oj halxok kan eli. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw oj yojkok el wal heb' anma', to xyak' Dios jun Kolwjum."},{"id":4,"tag":null,"isDisplayed":null,"text":"4     Hex anma to ay he chab’k’ojlal, ayx ek’ a skal he somk’ojlal, kusk'ojlal ton yaj wal he pixan,  yujto matz he chaj Jesús. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kotnhek wal a Jesús ki Kolmal,  kaw chajek wal jun he k’inal. Iltek, tze maklni he yab'i',  jun b'it x'och a satcha'anh."},{"id":5,"tag":null,"isDisplayed":null,"text":""}]},{"id":296,"title":"Ha Aj Tzwa No Chej","guid":"2vYscpydvEe76jMs/8N66g","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"296 Ha Aj Tzwa No Chej \n \nC. S. G. # 129   Allá En El Pesebre"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Lc. 2:1-7; Jn. 12:44-46; Sal. 42: 8 \n \nHa ta x’alj jun sb’ab’l une ix…xlajw cha, sk’otn ek’ ix a yol sjukb’ no chej aj tzwa no’.  Lc. 2: 7</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ha wal aj tzwa no chej ix alj el Jesús, a yol sjukb' no', ha ta ix ek' k'otan. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Jun k'anal xch'oxn el yaljub'al a heb' xkot ha aj tzk'el k'u, x'em kumn heb' sk'och wal ha a."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ha heb' waymtam kalnelu kaw ix xiw heb', yik ix yiln heb' jun sakk'inl tziktzni yilxi. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ix at heb' yil aj ix alj nene Jesús, ha aj tzwa no chej ha ta ix alj Jesús"},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Hach Cristo tzki k'an ha yaxil a kib'anh, tzki k'an wal ayach to tza pak ki lesal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Hach Cristo kaw tza ch'ox ton ha chamk'ojlal, yuj cha kaw tzach ki chamk'ojlej wal tiknek."}]},{"id":297,"title":"Ha Wal A Jun Ak'wal Ix Alj Jesús","guid":"yHt7R3yT4ESMG9a62J+vnQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"297   Ha Wal A Jun Ak'wal Ix Alj Jesús\n \nC. S. G. # 131  Santa La Noche"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Is. 7:13-14; Lc. 4:17-21; Is. 49:6-11,13 …\n \nYuj cha ha jun unn oj aljok cha yiknhej Dios oj ajok. Lc. 1:35</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kaw wach’ jun ak’wal yik tziktzni yilx k'anal, jun ak'wal yik ix alj ki Kolmalek. Kaw kusk'ojlal yaj wal smasnil heb' anma’, "},{"id":3,"tag":null,"isDisplayed":null,"text":"yuj wal cha ix yak' kot Dios jun Kolwjum. Kaw yel tzkolchj kan heb' anma yuj Jesús jun, may junk xo mach oj stak' wal skoln el heb'."},{"id":4,"tag":null,"isDisplayed":null,"text":" Tzaljkoyk tiknek, kalk wach' paxti a Dios jun, tzonh emk kumn wal yet' smasnil heb' yangel jun. Tzonh b'itn a Dios, yujto aljnak Jesús."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Tzonh k’och a Jesús yet’ ki jichk’ojlal jun, Oj kilk Jesús kajlil ki wach’ kolmal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Icha heb' mago ix kot wal ha aj tzk’el k’u, xyil heb' jun k'anal yik wal junk'ojlilal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw emmkilal x'aj yalj ki Kolmal Jesús Yuj cha tznachj el ki somk’ojlal yu’uj. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Dios ayk' ket'ok, yuj cha kaw wal tzonh tzaljek, tzonh b'itnek a Cristo Kajlil ki wach' Kolmal. Kaw tzaljkoyek yujto ix alj Jesús."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Tzonh skuyk Jesús ki chamk’ojlan ki b’a jun, Yujto kaw ay schamk'ojlal wal aynhek. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Xyak' junk'ojlal a heb' kaw ay skusk'ojlal, tiknek kaw kolb'ilx heb' yuj ki wach' Kolmal. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Yuj cha tzaljk'ojlal tzonh b'itnek a Cristo, yujto Jesús Syajlil wal heb' yajal. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Kaw yet' tzaljk'ojlal tzonh b'itnek a Jesús, ki ch'oxk el yipal ki Kolmal a heb' anma'. Tzkalnek wach' paxti a Dios ki wach’ Kolmal."},{"id":5,"tag":null,"isDisplayed":null,"text":""}]},{"id":298,"title":"Heb' Mago Xit’ Ilnok Jesús","guid":"2dHKyLlA8UKwjSEJaZ2HyA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"298  Heb' Mago Xit’ Ilnok Jesús\n \nC. S. G. # 138  Tras Hermoso Lucero"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mt. 2:1-11;Ro. 11:33-12:1; Mr. 12:29-33\n \n Ha aj tzk’el k’u, hata xkil sk’el jun sk’analil honh, ha tzch’oxni to ix alj Jesús, yuj cha tzwul kak’ ejm ki ba’ a honh.       Mt.2:2</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ha heb' mago x'och tza'n yuj jun niwkil k'analtzna heb' to tziktzni aj wan sk'och heb'. Yet' pax wal heb' siylab' a kajlil Jesús cha, yik tzwul yi'nk ejm sb'a wal heb' ha a. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Xk'och heb' a chonhb' Belén kaw wach' yilxi, kaw ix yil wal heb' stziktznil jun k'anal. Kaw xyak' jun sakk'inal aj ayk' Kajlil Jesús, wal ha aj tzwa no chej x'alj Jesús."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ha wal a jun ak'wal, ha heb' ilm kalnelu,xyil heb' jun sakk'inal to yik Dios. X'eml jun ángel a heb', cheb’kb'il yuj ki Mam Dios, yaljub'al Jesús xwul yal a heb'. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha heb' ángel kaw xyal heb' wach' paxti', xyal heb' wach' paxti  yuj kajlil Jesús. Ha heb' ilm kalnelu kaw ix sayk' heb' Jesús, ix ilchj yuj heb' ha aj tzwa no chej."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Yet' heb' mago siylab' yik tzsiyn heb' a Jesús,kaw ix siyj heb' wal a tzaljk'ojlal. Ha heb' ilm kalnelu ix tzalj heb' yuj Jesús, yujto ha ki Mam Dios ay schekab'. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Tiknek hach hin Jesús xach hin cha'aj, tiknek hach hin Jesús tzach hin b'itnej. Smasnil hin k'ojol tzach hin chamk'ojlej Mamin, yik tza'n yajlil ha ayn hach Jesús."}]},{"id":299,"title":"Ix Alj Jesús A Belén","guid":"MQ42ukg1f0W0Rj8jppYfVw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"299                Ix Alj Jesús A Belén\n \nAutor: Chepe Diego"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Lc. 2:1-7; Mt. 2:1-6, 13-23\n \n Ha a Belén, a schonhb’ kan win rey David… ha ta x’alj jun he Kolmal k’ik’i hatn Cristo Kajlil.   Lc. 2:11</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ix alj Jesús hin Kolmal, wal a sat lum lum tik. Ix alj el a ix Malin, aj tzwa no chej ix alji. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw emmkilal ix yutj sb'a, yujto ay schamk'ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw ay schamk'ojlal ayin, kaw ay schamk'ojlal, Wal ayn a smasnil k'inal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw tzwal wach' paxti a sb'i, kaw oj hin b'itnok wal sb'i a smasnil k'inal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Yiktax ix alj el Jesús, kaw matz tzalj heb' yet'ok. Ix snib'j wal heb' smil chamok, yuj cha ix el a Belén."},{"id":4,"tag":null,"isDisplayed":null,"text":" Kaw ma ix nachj el yuj heb', to Kolwjum Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw ay schamk'ojlal ayin, kaw ay schamk'ojlal, Wal ayn a smasnil k'inal."},{"id":5,"tag":null,"isDisplayed":null,"text":" Kaw tzwal wach' paxti a sb'i, kaw oj hin b'itnok wal sb'i a smasnil k'inal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Tzki nak kot wal yaljub'al Jesús, ki wach' Kolmal.Kalk wach' paxti a Jesús, yujto kaw ki Kolmalek. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Tzalj koyk a smasnil k'inal, yujto yunnalnhek Dios."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw ay schamk'ojlal ayin, kaw ay schamk'ojlal, Wal ayn a smasnil k'inal."},{"id":6,"tag":null,"isDisplayed":null,"text":" Kaw tzwal wach' paxti a sb'i, kaw oj hin b'itnok wal sb'i a smasnil k'inal."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Kaw a'ch ha k'ojl a Jesús, kaw hojnhej ix alji. Kaw a'ch ha k'ojl a Jesús, yujto hojnhej ix chami."},{"id":6,"tag":null,"isDisplayed":null,"text":"Chaj Cristo ha kolmalok, sek oj ha kolchj kani."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw ay schamk'ojlal ayin, kaw ay schamk'ojlal, Wal ayn a smasnil k'inal. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Kaw tzwal wach' paxti a sb'i, kaw oj hin b'itnok wal sb'i a smasnil k'inal."}]},{"id":300,"title":"Ix Eml Hin Dios","guid":"/n4IPOW3HECkm2MxfFsTcA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"300   Ix Eml Hin Dios\n \n Cantemos # 24 Dios Descendió"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>1 Ti. 3:16; Jn. 6:31; 3:1-7 \n \n Ha Dios a’jnak kojkok el tas yaj ki kuynb’il. Wal yel, kaw niwn ye’lch jun tzo’nh ch’oxb’il yuj ayonh.  1 Ti. 3:16</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ay jun k'ual aj matz sat hin k'ojol, sk'ual yik tzaljk'ojlilal. Kaw ayn at wal a skal hin somk'ojlal, hin kolchj elt yuj hin Jesús. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Niwn wal swachk'ojlal hin Cristo ayin, ayx hin junk'ojlal yet'ok. Yel tox hin yij kan el a skal maysch'olnil, tiknek oj hin yiklk Spaxti'."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ix eml hin Dios, yuj cha hin kolchj kani; yuj swach'k'ojlal, yuj cha xb'o hin b'eyb'al. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ayn at a skal hin mul, ix o'ch wal sk'ojl ayin, ix eml hin Dios, yuj cha hin kolchj kani."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Kaw tox hin alj el wal a scha'ejmal, tox hin kan wal yet' hin Dios. Kaw wal ix yak' ton swach'k'ojlal ayin, ayx wal hin tzaljk'ojlilal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kojxnhej a Jesús kaw oj wal hin b'a, haxnhej wal a hin Diosal. Yik hin xo ton wal hin Cristo tiknek, yuj cha oj wi’ chanh sb'i hin Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ix eml hin Dios, yuj cha hin kolchj kani; yuj swach'k'ojlal, yuj cha xb'o hin b'eyb'al. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ayn at a skal hin mul, ix o'ch wal sk'ojl ayin, ix eml hin Dios, yuj cha hin kolchj kani."}]},{"id":301,"title":"Ix Haktj Kan Ha tziktznial","guid":"rHJYQ7BIkkaskdQJ3Z1HmA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"301   Ix Haktj Kan Ha tziktznial\n \nC.S.G. 139 Tu Dejaste Tu Trono \t\n \n(coro # 40 V.C.)"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Fil. 2:1-11; Mt. 8:16-20; Mr. 10: 35-45\n \n Ha ta x’alj jun sb’ab’l une ix. Sb’a’n och ix nip a jun unn cha. Xlaj wcha, sk’otn ek’ ix  a yol sjukb’ no chej aj tzwa no’, yujto kaw manhx a aj x’aj heb’ a mesón. Lc.2:7</f></i>"},{"id":3,"tag":null,"isDisplayed":null,"text":"1     Hach Jesús ix haktj kan ha tziktznil a satcha’anh yik hach wul aljok a chonhb’ Belén."},{"id":4,"tag":null,"isDisplayed":null,"text":" Ma ix ilchj wal junk nha ajtil hach alj yuj ha nun, yuj cha aj tzwa no chej hach alji."},{"id":0,"tag":1,"isDisplayed":null,"text":"Til wal tzalk’ojlal yik hach alji, hach Jesús aychnhej ek’ wal ket’ok. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yuj cha tzkal yuj diosal aych ki Jesús, kaw wal wach’ hach a jun ejmnhej."},{"id":2,"tag":null,"isDisplayed":null,"text":"2     Ha heb’ ángel tzach b’itnan wal a tzaljk’ojlilal,yik tzyaln heb’ wach’ paxti wal ayach. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw emmkil hach wulk’ a yolyib’nk’inl hach hin Jesús, yik xak’ skolnb’il smasnil heb’ ajmul."},{"id":0,"tag":1,"isDisplayed":null,"text":"Til wal tzalk’ojlal yik hach alji, hach Jesús aychnhej ek’ wal ket’ok. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yuj cha tzkal yuj diosal aych ki Jesús, kaw wal wach’ hach a jun ejmnhej."},{"id":3,"tag":null,"isDisplayed":null,"text":"3     He no nok’ ay snha k’en he no ajtil wach’ tzmol sb’a,yet’ pax he no ch’ik ay so’ he no’. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Hach Jesús Yunnal Dios kaw wal may pax junk hatut, Kaw may ye’lch pax ajtil hach wayi."},{"id":0,"tag":1,"isDisplayed":null,"text":"Til wal tzalk’ojlal yik hach alji, hach Jesús aychnhej ek’ wal ket’ok. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yuj cha tzkal yuj diosal aych ki Jesús, kaw wal wach’ hach a jun ejmnhej."},{"id":4,"tag":null,"isDisplayed":null,"text":"4      Tik hach jaw hach Mamin yet’ ha yaxil kaw niwan,yik tza’n ki kolnb’il yet’ ki k’inal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"hach smil cham wal heb’ anma’ yuj wal yajk’ojlal heb’, wach’xam xyil wal heb’ ha wach’k’ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Til wal tzalk’ojlal yik hach alji, hach Jesús aychnhej ek’ wal ket’ok. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Yuj cha tzkal yuj diosal aych ki Jesús, kaw wal wach’ hach a jun ejmnhej."},{"id":5,"tag":null,"isDisplayed":null,"text":"5      Tzaljk’ojlal oj b’itnok heb’ ángel a satcha’anh, yik oj ha meltzj a yolyib’nhk’inal. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Skal asun oj el haw, kotnhek a hin tz’ey xa chi, koln tzex aj wet’ a hin tziktznial."},{"id":0,"tag":1,"isDisplayed":null,"text":"Til wal tzalk’ojlal yik hach alji, hach Jesús aychnhej ek’ wal ket’ok. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Yuj cha tzkal yuj diosal aych ki Jesús, kaw wal wach’ hach a jun ejmnhej."}]},{"id":302,"title":"Jun B'it Tz'och A Satcha'anh","guid":"xnua6Dk+lEOxD+8fkkpreQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"302  Jun B'it Tz'och A Satcha'anh\n \nC. S. G. # 126  Oíd Un Son En Alta Esfera"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 89:15-18; Jn 1:14-18; Is. 40:21-26\n \n !Smoj yalx wach’ paxti a Dios a satcha’anh! Lc. 2:14</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ay jun b'it x'och a satcha'anh: “¡Yuj yalx wach' paxti a Dios! ¡Yuj yaljub'al ki wach' Kolmal! Kaw xalx wach’ paxti a Dios.” "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kalk wach' paxti a ki Mam Dios,  ha Kajlil tzki b'itnejek sb'i. Kalk wach’ paxti a ki Dios, yujto ayk’ a smasnil k’inal."},{"id":4,"tag":null,"isDisplayed":null,"text":" Ki b'itnokek sb'i Jesús: ¡Yik tzkalnek wach' paxti a Dios!"},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Kaw Syajlil ton wal heb' yajal, yaj Jesús ki wach' Kolmal. Yuj skoln el wal ton heb' ajmul,  ix ya'n och sb'a anma'il. "},{"id":4,"tag":null,"isDisplayed":null,"text":"¡Kalk wach' paxti a yunnal Dios! Yujto kaw niwkil x'aj e’lchi. ¡Kalk wach' paxti a Jesús, ha Yajl yaj a heb' yajal! "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ki b'itnokek sb'i Jesús:  ¡Yik tzkalnek wach' paxti a Dios!"},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Kaw kojn aych tz'ilchj wal junk'ojlal, tzkal wach' paxti aych Jesús. Yuj ha chamlil a te kulus,  ay ki k'inl a jun ejmnhej."},{"id":5,"tag":null,"isDisplayed":null,"text":" Ix haktj kan het'l a satcha'anh, yik hach alj a yolyib’nhk’inl tik. Yik tzwul ha'nok ki k'inal, yujto hach cham a te kulus."},{"id":6,"tag":null,"isDisplayed":null,"text":" Ki b'itnokek sb'i Jesús:  ¡Yik tzkalnek wach' paxti a Dios!"}]},{"id":303,"title":"Junk'ojlal A Yolyib'nhk'inal","guid":"VeBzEDXE7E2FYqjKQJX+kA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"303   Junk'ojlal A Yolyib'nhk'inal\n \nC. S. G. # 118  Al Mundo Paz"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Is. 49:6-11,13; Is. 11:1-9; Sal. 96:10-13\n \n B’itnkoyk a Jehová yet’ ki tzalk’ojlal. Sal. 98:4</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      ¡Aljnak Jesús ki wach’ Komal! Kaw aljnak ki Yajlil. Kaw ayx ek’ wal jun sakk'inal, wal a ki pixnek tiknek jun."},{"id":3,"tag":null,"isDisplayed":null,"text":" Kaw tzonh tzaljek wal yu'uj, kaw tzonh tzaljek wal yu'uj. Tzaljk'ojlal jun, tzaljk'ojlal wal xo kajk yu'uj."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      ¡Aljnak Jesús ki kolmalek! Kaw oj yak' wal yajlil. Kaw ayx ki tzaljk'ojlal yu'uj, hax heb' oj chanok a spixan. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Oj yak’ niwnk'ojlal a heb’, Jesús kaw ay sniwnk'ojlal. Ha wal Jesús, kaw wal ay sniwnk'ojlal aynhek."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      ¡Oj yak' yajlil sjaw yet yipal! Kaw oj yak’ ton yajlil. oj sch'ox schamk’ojlal a smasnil anma', yik oj ya’nok yajlil "},{"id":5,"tag":null,"isDisplayed":null,"text":"Schamk’ojlal yet' yipalil, schamk’ojlal yet' yipalil. Ay schamk’ojlal, ay schamk’ojlal yet’ yipalil."}]},{"id":304,"title":"Kotnhek Hex Ilm Kalnelu","guid":"OsDS6fOsDU2Gs4UNjXZq4w","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"304   Kotnhek Hex Ilm Kalnelu\n \nC. S. G. # 121  Venid Pastorcillos"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Lc. 2:4-20;   Sal. 105:1-5\n \n ...Hax heb’ mago...Ix em kumn heb’ a jun unn cha, ix ya’n ejm sb’a heb ha a.  Mt. 2: 7, 11</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Hex ilm kalnelu, kotnhek a’k emmkilal. Ha Syajlil satcha'anh ix alj a Judá, "},{"id":3,"tag":null,"isDisplayed":null,"text":"kaw may tas tzk'an aynhek yik tzonh k'ochk wal ha a. Win unn cha tznib'j tzonh k'ochk yet' ki jichk'ojlal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Yol jun pat may ye’lchi, hata ix alj JesúsA yol sjukb’ no chej ha ta x’ek’ k’otan. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ix pichx och nip ha a, kaw may ye’lch x’aj yalji. Xkot a satcha'anh kaw ix och anmail."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Xkot heb' mago aj tzk'el k'u, yet’ wal heb’ siylab’a nene Jesús, kaw Syajlil chonhb’ Judá. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ha jun niwkil k’anal tzyil heb’ yik wan sb’ey heb’, kaw x'em kumn heb' sk'och a nene Jesús cha."}]},{"id":305,"title":"Tzaljk'ojlal Ix Alj Jesús","guid":"QHCpkV99tU+pPRdZH18nCg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"305   Tzaljk'ojlal Ix Alj Jesús\n \n C. S G. # 120 Oh Santísimo, felicísimo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ro. 5:1-11; Lc. 1:46-55; Sal. 68:3-6 \n \n  ¡Halxkab' wach' paxti a Dios a satcha'anh! ¡ Hax a yolyib’nhk’inl tik, ay kab’ junk’ojlal! Lc. 2:14</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     ¡Kaw ay niwkil tzaljk'ojlal yik ix alj ki wach' Kolmal! Wal a jun chonhb' Belén. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Yuj heb' anma maysch'olnil, yuj wal heb' ix alj Jesús. ¡Aleluya, aleluya, x'alj Jesús!"},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ha aj tzwa no chej ix alj ki kolmal Jesús. Wal a jun yune chonhb' Belén. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw x’och b’it a satcha’anh, yik x’alj ki kolmal Jesús. ¡Kalk wach' paxti', kalk wach' paxti a Jesús!"},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Heb’ mago xit’ ilnokaj x’alj nene Jesús. Yet’ pax heb’ siylab' a Jesús."},{"id":5,"tag":null,"isDisplayed":null,"text":" Kaw ix em kumn heb' ha a, siyn heb' siylab' suk’k'i sjab', ¡Aleluya, aleluya x'alj Jesús!"}]},{"id":306,"title":"Tzaljk'ojlal Yik Jun Ak'wal","guid":"XVONWoV1pEmtQ6btA/JKGA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"306  Tzaljk'ojlal Yik Jun Ak'wal\n \nC. S. G # 133 Noche De Paz"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Is. 26:1-9,12; Lv. 26:4-6; Lc. 2:4-20\n \n Palta xyaln jun ángel chi a heb’ ixtik: Manh hex xiwok, yujto ay jun wach’ ab’x tzwul wal ayex.  Lc. 2:10</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    ¡Tzaljk'ojlilal, yik jun ak'wal! Junk'ojlal yet' wach'ilal. Ay wal jun k'anal kaw tziktzni yilxi, sch'oxnb'il yaljub'al ki wach' Kolmal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Jun k'anal yik junk'ojlal jun, tzch'ox yaljub'al ki Kolmal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    ¡Tzaljk'ojlilal, yik jun ak'wal! Ha heb' ilm kalnelu. Xyab' heb' yab'xil yaljub'al ki Kolmal, yaljub'al kajlil Jesús ki kolmal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw ix alj ki kolmal Jesús, ix alj ki kolmal Jesús."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    ¡Tzaljk'ojlilal, yik jun ak'wal! Iltek manhx jantkok swach'il. Kaw ix jaw sakk'inl a skal k'ik'k'inal, ha wal aj tzwa no chej ix alj Jesús."},{"id":5,"tag":null,"isDisplayed":null,"text":" Kaw ix alj ton ki wach' Kolmal, x’alj ki wach' kolmal Jesús."}]},{"id":307,"title":"Tzb'itn Heb' Ángel A Satcha'anh","guid":"nN5VSWjvyE6lbrPEQV7iag","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"307 Tzb'itn Heb' Ángel A Satcha'anh\n \n C. S. G. # 130 Ángeles Cantando Están"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Lc. 2:8-15; Heb. 1:1-9; Sal. 29\n \n …Til wal heb’ ángel xkot a satcha’anh xwul sch’oxnksb’a heb’ yet’ junx ángel cha, xyaln  heb’ wach’ paxti a Dios. Lc. 2:13</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     X'och jun b'it a satcha'anh, yuj wal ton heb' ángel jun. Hax wal lum ch'olktak xta'wi, yik tzb'itnan wal heb' Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"<i><cFF000000>Kalk wach' paxti a Dios, ayk' a satcha'anh, yujto x'alj nene Jesús, kalk wach' paxti a Dios. </c></i>"},{"id":3,"tag":null,"isDisplayed":null,"text":"<i><cFF000000>Ay kab' pax junk'ojlal, a smasnil anma’ yujto x'alj nene Jesús, kalk wach' paxti a Dios jun.</c></i>"},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Xalx wach' paxti a Jesús, yuj wal heb' ilm kalnelu. Yik xyiln heb' nene Jesús, ayk' wal ha aj tzwa no chej."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kalk wach' paxti a Dios, ayk' a satcha'anh, yujto x'alj nene Jesús, kalk wach' paxti a Dios. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ay kab' pax junk'ojlal, a smasnil anma’ yujto x'alj nene Jesús, kalk wach' paxti a Dios jun."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Kotnhek wal a ki kolmal, yik tze chan wal he k’inal. Ha Jesús tz'a'n junk'ojlal, yujto kaw yajl yaji."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kalk wach' paxti a Dios, ayk' a satcha'anh, yujto x'alj nene Jesús, kalk wach' paxti a Dios."},{"id":5,"tag":null,"isDisplayed":null,"text":" Ay kab' pax junk'ojlal, a smasnil anma’ yujto x'alj nene Jesús, kalk wach' paxti a Dios jun."}]},{"id":308,"title":"X'och Wal B'it","guid":"3KhsjbBQ/0WNDLf2g48SZg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"308  X'och Wal B'it\n \nC. S. G. # 114  Suenen Dulces Himnos"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal 96:10-13; Jl. 3:16-18; Ga.4:3-7\n \n Ha yik ojh ex yilkn ocj heb’ lum niwk witz, heb’ lum tzalktak, te niwk te, icha to oj spok’ heb’ sk’ab’ sb’itn chanh yuj tzaljk’ojlal yik oj hex yilnk och heb’.     Is. 55:12</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kaw ix och wal b'it yik x'alj ki wach' Kolmal, ha Jesús ix eml a satcha'anh. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ix alj jun nene Jesús ki wach' kolmal, sek wach' kaw tzonh kolchj kan el yu'uj."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kalk wach' paxti a ki Mam Dios jun, yujto x’alj Jesús ki wach’ kolmal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw x’och wal b’it yik x’alj Jesús a Belén, ki b'itnokek sb'i ki wach' Kolmal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Manhx jantkok ix tzalj heb' ilm kalnelu, yik xyab'n heb' yoch b'it a jun ak'wal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"X'ilchj nene Jesús yuj heb' aj tzwa no chej, yajnhej ix em kumn heb' sk'och ha a."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kalk wach' paxti a ki Mam Dios jun, yujto x’alj Jesús ki wach’ kolmal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw x’och wal b’it yik x’alj Jesús a Belén, ki b'itnokek sb'i ki wach' Kolmal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Tzaljk'ojlal tzonh b'itnek a ki wach' Kolmal, yujto kaw honh sman wal yet' schik'il. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kojxnhej wal Jesús tztak' honh skolnek eli, emmkilal tzkutjek ki b'a ha a"},{"id":0,"tag":1,"isDisplayed":null,"text":"Kalk wach' paxti a ki Mam Dios jun, yujto x’alj Jesús ki wach’ kolmal. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kaw x’och wal b’it yik x’alj Jesús a Belén, ki b'itnokek sb'i ki wach' Kolmal."}]},{"id":309,"title":"Halb'il Kan Yuj Cristo","guid":"gf9Y3cETXE+RcR2h2dt1qg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"309  Halb'il Kan Yuj Cristo\n \nCristo Promete Que Un Día\n Himnos y Coros escogidos #71."},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 14:1-10; 2 Cor. 5:1-10 \n \nIx yaln Jesús a heb’ skuywum ixtik… ha a yatut hin Mam, til wal kajnub’  aj wach’ tzonh k’ochk kajan. Jn 14: 1, 2</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Alb'il kan yuj ki wach' kolmal,  kaw wal yel oj wul honh yik'. Tzaljk'ojlal oj ki atk yet'ok,  oj ki k'ochk a satcha'anh."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ay jun katut a satcha'anh,  kaw wach' yilx jun katut cha. Kaw wal tzaljk'ojlal oj kaj ta',  yet' ki wach' kolmal Jesús."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Yik aynh ek' a skal maysch'olnil,  kusk'ojlal yaj ki pixan. Tiknek tzaljk'ojlal xo kaj jun,  yuj ki wach' kolmal Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ay jun katut a satcha'anh,  kaw wach' yilx jun katut cha. Kaw wal tzaljk'ojlal oj kaj ta',  yet' ki wach' kolmal Jesús."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Manhxa ki kusk'ojlal tiknek,  yujto kaw kojk xo b'i'an. Kaw oj ki k'ochk a satcha'anh,  yet' ki wach'kolmal Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ay jun katut a satcha'anh,  kaw wach' yilx jun katut cha. Kaw wal tzaljk'ojlal oj kaj ta',  yet' ki wach' kolmal Jesús."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Yik ix hin chan Jesucristo, kaw wal hin sb'uch heb' anma'. Ha yik oj jawk wal jun k'ul cha, oj kan smasnil maysch’olnil."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ay jun katut a satcha'anh,  kaw wach' yilx jun katut cha. Kaw wal tzaljk'ojlal oj kaj ta',  yet' ki wach' kolmal Jesús."}]},{"id":310,"title":"Halb’il Kan Wal Yuj Ki Kolmal","guid":"4YEe2p7P2U2+TjwmdJS3DA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"310 Halb’il Kan Wal Yuj Ki Kolmal\n \nV.C. 149  La Tierna Voz"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mt. 15:30; Lc. 4:18,19; Hch. 3:1-10 \n \nTil wal heb’ anma xjaw ha aj ayk’ cha. Ix yij kot heb’ jun tzo’nh heb’ koxo, heb’ matz uj yilni, heb’ matz uj spaxtini, yet’ heb’ wekchjnak.   Mt. 15:30</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Ha wal ki wach’ Kolmal Jesús, kaw tzyal wal aynhek tiknek. Ab’ek tas tzyal wal ki Kolmal, to tzyak’ wal sk’inl heb’ satnak."},{"id":0,"tag":1,"isDisplayed":null,"text":"Smasnilnhej tztak’ wal yuj Jesús, kaw tzyak' b’oxk wal ki yailal. Kaw ay wal swach’k’ojlal ayonh, kaw ki wach’ Kolmal yaji."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     A’ch wal ha k’ojl a schamk’ojlal, oj hach skol a maysch’olnil. Kaw yujnhej wal ha jichk’ojlal, hax sb’ox kan wal ha k’ojol."},{"id":0,"tag":1,"isDisplayed":null,"text":"Smasnilnhej tztak’ wal yuj Jesús, kaw tzyak' b’oxk wal ki yailal. Kaw ay wal swach’k’ojlal ayonh, kaw ki wach’ Kolmal yaji."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ha heb’ kaw wal matz tak’ sb’eyi, ix b'ox kan wal heb' yu'uj. Yet’ heb’ kaw wal matz tak’ yilni, kaw xjakx kan sat heb’ yu’uj’."},{"id":0,"tag":1,"isDisplayed":null,"text":"Smasnilnhej tztak’ wal yuj Jesús, kaw tzyak' b’oxk wal ki yailal. Kaw ay wal swach’k’ojlal ayonh, kaw ki wach’ Kolmal yaji."}]},{"id":311,"title":"Kaw Tz'e’lchnhej Tas Tzala","guid":"JmBG9ibqUk2zm4HTPurl0w","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"311            Kaw Tz'e’lchnhej Tas Tzala\n \nC. S. G. # 59   Grande Es Tu Fidelidad"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 36:5-10; 19:1-6 \n \nYujnhej schamk’ojlal Jehová, yuj cha, matz honh satk eli, yujto tz’o’chnehj sk’ojl Dios aynhek. Lam. 3: 22</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Hach Ki Dios aychnhej ek' yet' ha niwnk'ojlal, may chab’k’ojlal, ha jun tik to kaw yel. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ha a niwnk'ojlal may b'a'nh ay tz'aj yek'i, matz jelmj ha nab'en a smasnil k'inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tz’e’lchnhej tas tzala, kaw tz’e’lchnhej tas tzala. Smasnil k’inal aychnhej ton ek’ wet’ok. "},{"id":4,"tag":null,"isDisplayed":null,"text":"May tas tzyak' palta, smasnil tas tzak' ayin. Niwn he’lch Mamin, yujto tz'e’lch tas tzala."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ha k'u yet' uj yet' ak'wal yet' k'ik'k'inal,yet’ wal smasnil smakb’en yol junjn hab’il, "},{"id":4,"tag":null,"isDisplayed":null,"text":"junxnej wal tzyutj sb’a heb’ yik tzach yi’n cha’anh. Yujto kaw wach’ hach a smasnil k’inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tz’e’lchnhej tas tzala, kaw tz’e’lchnhej tas tzala. Smasnil k’inal aychnhej ton ek’ wet’ok. "},{"id":5,"tag":null,"isDisplayed":null,"text":"May tas tzyak' palta, smasnil tas tzak' ayin. Niwn he’lch Mamin, yujto tz'e’lch tas tzala."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Tzin hak’ niwnk’ojlal tza’n pax hin tzaljk'ojlal,tzin hej b’ey ha a b’e yik junk’ojlal; tzin hak’ iljok, "},{"id":5,"tag":null,"isDisplayed":null,"text":"tza’n wip yet’ hin jichk’ojlal, smasnil k’inal Mamb’il wal haj ayin."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tz’e’lchnhej tas tzala, kaw tz’e’lchnhej tas tzala. Smasnil k’inal aychnhej ton ek’ wet’ok. "},{"id":6,"tag":null,"isDisplayed":null,"text":"May tas tzyak' palta, smasnil tas tzak' ayin. Niwn he’lch Mamin, yujto tz'e’lch tas tzala."}]},{"id":312,"title":"Kaw Wach' Tas Halb'il Kani","guid":"xeWbfIj9W02YiP2fHFQ0eQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"312  Kaw Wach' Tas Halb'il Kani\n \nV. C. # 187. Dulces Promesas Son Las Del Señor"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 3:16-21; 7:37-39; 2 Corr. 1:20-22 \n \n …Sek wach’  jantknhej heb’ tzin a’n och a sk’ojol, ma oj satnk el heb’, palta  ay sk’inl heb’ a jun ejmnhej.  Jn. 3:16</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kaw wach' tas halb'il kan yuj ki Kolmal, jun wach’ ab’x yik schamk’ojlal Dios ix wul yalkni. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ha Jesucristo kaw yel may jak smul, kaw wal niwn schamk’ojlal ix sch’ox aynhek wal jun."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj hin at wal yet'ok, hin kolmal Jesús. (//Oj hin at wal yet'ok. //) "},{"id":4,"tag":null,"isDisplayed":null,"text":"Oj hin at wal yet'ok, oj hin b'o icha tznib'ej. (//Oj hin b'o 'icha tznib'ej. //)"},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Kaw ay schamk'ojlal ki Kolmal aynhek, kaw wal ix cham a te kuls yuj ya’n ki k’inlek. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha mach ajmul oj ajxok niwnk’ojlal, hax Jesús yilmal heb’ ay schamk’ojlal ha a."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj hin at wal yet'ok, hin kolmal Jesús. (//Oj hin at wal yet'ok. //) "},{"id":5,"tag":null,"isDisplayed":null,"text":"Oj hin at wal yet'ok, oj hin b'o icha tznib'ej. (//Oj hin b'o 'icha tznib'ej. //)"},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Hach anma awtb'il hach yuj ki Kolmal,toto k’unb’nakch yuj ha mul oj hach yak’ iljok."},{"id":5,"tag":null,"isDisplayed":null,"text":" Kaw yel ton tzyal spaxti ki wach' Kolmal, tznib’j tzyak’ tzaljk’ojlal yet’ junk’ojlal wal ayach."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj hin at wal yet'ok, hin kolmal Jesús. (//Oj hin at wal yet'ok. //) "},{"id":6,"tag":null,"isDisplayed":null,"text":"Oj hin at wal yet'ok, oj hin b'o icha tznib'ej. (//Oj hin b'o 'icha tznib'ej. //)"}]},{"id":313,"title":"Smasnil Tas Halb’il Kan Yuj Jesús","guid":"Sn+/+3lkY0u7jeK128jqIA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"313 Smasnil Tas Halb’il Kan Yuj Jesús\n \nC.S.G. 273 Todas Las Promesas"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>2 P. 1:2-11; 2 P. 3:8-14; 2 Co. 1:18-22 \n \nYujto ha Dios oj a’nk jun ki maklek, hatn jun molb’il yuj a satcha’anh. 1 P. 1:4</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ha smasnil tas halb’il kan yuj hin Kolmal, halb’il kani, sek wach’ kaw  ay hin te’nal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Yuj cha kaw tzwak’ ip hin sayn ek’ sakk’inlal,  tzwa’ch hin nab’en a tas ix yalkni."},{"id":3,"tag":null,"isDisplayed":null,"text":"Coro.\nKaw yel, (Kaw wal yel tzyal spaxti Dios) jun tik, (Kaw wal yel tzyal spaxti Dios) Tzin chaj wab’ tas yaljnak kan wal jun hin Kolmal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw yel, (Kaw wal yel tzyal spaxti Dios) jun tik, (Kaw wal yel tzyal spaxti Dios). Ha smasnil tas ix yala kaw wal yel."},{"id":4,"tag":null,"isDisplayed":null,"text":"2     Ha smasnil tas halb’ilkan yuj ki kolmal, yel oj e’lchok wal tas halb’ilkan yu’uj. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yuj wal cha kaw tzwa’ch ton wal hin k’ojl ha a. Junk’ojlal oj waj yet’ hin Jesús."},{"id":3,"tag":null,"isDisplayed":null,"text":"Coro.\nKaw yel, (Kaw wal yel tzyal spaxti Dios) jun tik, (Kaw wal yel tzyal spaxti Dios) Tzin chaj wab’ tas yaljnak kan wal jun hin Kolmal."},{"id":4,"tag":null,"isDisplayed":null,"text":" Kaw yel, (Kaw wal yel tzyal spaxti Dios) jun tik, (Kaw wal yel tzyal spaxti Dios). Ha smasnil tas ix yala kaw wal yel."},{"id":5,"tag":null,"isDisplayed":null,"text":"3      Ha smasnil tas halb’ilkan yuj ki Mam Dios, ha oj a’nok smasnil ki tzaljk’ojlilal."},{"id":6,"tag":null,"isDisplayed":null,"text":" Ha tzonh koln el wal a skal smasnil stual, yuj cha oj ki k’och yet’ ki Mam Dios."},{"id":3,"tag":null,"isDisplayed":null,"text":"Coro.\nKaw yel, (Kaw wal yel tzyal spaxti Dios) jun tik, (Kaw wal yel tzyal spaxti Dios) Tzin chaj wab’ tas yaljnak kan wal jun hin Kolmal."},{"id":4,"tag":null,"isDisplayed":null,"text":" Kaw yel, (Kaw wal yel tzyal spaxti Dios) jun tik, (Kaw wal yel tzyal spaxti Dios). Ha smasnil tas ix yala kaw wal yel."}]},{"id":314,"title":"Ix Yak' Dios Syaxil Ayonh","guid":"G0WCz8v0y06AHS80yluNFw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"314 Ix Yak' Dios Syaxil Ayonh\n \nC. S. G. # 251. Lluvias De Gracia"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Hch. 1:1-8; Ef. 4:1-13; Gá. 5:16-25 \n \nIx yiln heb’ jun tzo’nh tas icha snich k’a’k, xpuktkb’t a skal heb’. Ix ejm a yib’nh junjn heb’.  Hch. 2:3</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ya’jnak ki Mam Dios sti aynh jun, niwn wach’k’ojlal tzyak’ ayonh. Siylab’ oj a’nok ki te’nal, niwn yaxilal tzyak’ ayonh."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha wal swach’ k’ojlal,  kaw lajn icha wal yaxnhab’. A’kot a kib’nh hach ki Diosal, jun wach’k’ojlal may slajub’."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Cristo xyak' e’lchok sti aynh jun, xyak' kot jun a’m niwnk'ojlal. tzya’ junk’ojlal a ki pixan,yuj ki’nek chanh ton wal sb’i."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha wal swach’ k’ojlal,  kaw lajn icha wal yaxnhab’. A’kot a kib’nh hach ki Diosal, jun wach’k’ojlal may slajub’."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Ha wal a smasnil heb’ heko’, ch’ox yil heb’ ha chamk’ojlal. Ha aych tzkot yich smasnil wach'il, b'utnh yet' ha junk'ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha wal swach’ k’ojlal,  kaw lajn icha wal yaxnhab’. A’kot a kib’nh hach ki Diosal, jun wach’k’ojlal may slajub’."},{"id":5,"tag":null,"isDisplayed":null,"text":"4      Kaw ak’ sjelnal heb’ ha chekab’, yaln el ha paxti Mamin.Ak’ ki jelnal het’ hach Mamin, yik tzki kuyn ha cheknb’il."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha wal swach’ k’ojlal,  kaw lajn icha wal yaxnhab’. A’kot a kib’nh hach ki Diosal, jun wach’k’ojlal may slajub’."}]},{"id":315,"title":"!Niwn Xo Syaxilal Dios Tzyak’ Ayach!","guid":"oyoovOxUlUq3XQgDoUnTVw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"315 !Niwn Xo Syaxilal Dios Tzyak’ Ayach!\n \nC.S.G. 436 ¡Bendiciones, Cuantas Tienes!"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 40:1-5, 16; 103:1-5; 136:1-9 \n \nTzwal hin wach’ paxti ha a, ha swach’k’ojlal ayin may b’a’nh oj at sat k’ojlal wu’uj. Sal.103:2</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ha yik tzjaw somk’ojlal aych yuj kusk’ojlal, kaw tza na to manhxa wal ha tzaljk’ojlal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Na kot wal spak hek molb’ilx a satcha’anh, kaw yajnhej hax sjaw ha tzaljk’ojlal b’ian."},{"id":0,"tag":1,"isDisplayed":null,"text":"Til wal swach’k’ojlal Dios tzyak’ ayach, swach’k’ojlal Dios kaw wal may slajub’. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Swach’k’ojlal Dios, kaw wal satjub’tak. Yik oj helnok smasnil tas tzyak’ Dios ayach."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      ¿Aym aj tzjaw ha kusk’ojlal yuj yailal? ¿Tzam ha na to nab’anhej tzach munlj a Dios? "},{"id":4,"tag":null,"isDisplayed":null,"text":"Nakot smasnil tas halb’il kan a spaxti’. Ixta oj aj sjaw ha tzaljk’ojlal b’ian."},{"id":0,"tag":1,"isDisplayed":null,"text":"Til wal swach’k’ojlal Dios tzyak’ ayach, swach’k’ojlal Dios kaw wal may slajub’. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Swach’k’ojlal Dios, kaw wal satjub’tak. Yik oj helnok smasnil tas tzyak’ Dios ayach."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ay heb’ tu sb’eyb’al kaw ay tas ay a heb’. Hach xo kob’ tza nib’j wal tzach och tza’n yuj heb’. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Nakot smasnil tas ja cha yuj jichk’ojlal, kaw niwn spak hek oj ha cha a satcha’anh."},{"id":0,"tag":1,"isDisplayed":null,"text":"Til wal swach’k’ojlal Dios tzyak’ ayach, swach’k’ojlal Dios kaw wal may slajub’. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Swach’k’ojlal Dios, kaw wal satjub’tak. Yik oj helnok smasnil tas tzyak’ Dios ayach."}]},{"id":316,"title":"Tzaljk’ojlal Yaj Hin Pixan","guid":"/XxN83L32U2FEIbd/fFlvg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"316 Tzaljk’ojlal Yaj Hin Pixan\n \n V.C 27  El Placer De Mi Alma."},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 6:35, 47;  Jn. 4:13-14 \n \nManh jankok schamk’ojlal Dios a heb’ anma a yolyib’nhk’inl tik. Jn. 3:16</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kaw may junk mach oj stak’ yi’n ek’, syaxilal wal Dios ayin. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kojn Cristo yet’ swach’k’ojlal, tztak’ ya’n sniwnal hin k’ojol"},{"id":3,"tag":null,"isDisplayed":null,"text":"Coro .\nHin wach’ Kolmal Jesucristo, ha wal tz’a’n hin tzaljk’ojlal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Hin wach’ kolmal kaw wach’ snab’en, Kaw ay schamk’ojlal ayin."},{"id":4,"tag":null,"isDisplayed":null,"text":"2     Ha schamk’ojlal hin wach’ Kolmal, kaw wal may b’anh ay slajub’. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ha jun siylab’ ix yak’ ayin, yelxo niwn ye'lch’ a hin mul."},{"id":3,"tag":null,"isDisplayed":null,"text":"Coro .\nHin wach’ Kolmal Jesucristo, ha wal tz’a’n hin tzaljk’ojlal."},{"id":4,"tag":null,"isDisplayed":null,"text":" Hin wach’ kolmal kaw wach’ snab’en, Kaw ay schamk’ojlal ayin."},{"id":5,"tag":null,"isDisplayed":null,"text":"3     Tox hin sman Jesús yet’ schik’il, matz nachj el tas tzwutj walni. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Ha xchik’l hin wach’ Kolmal Jesús, ha ix koln el hin pixan.\nEstrofa 3\nCoro .\nHin wach’ Kolmal Jesucristo, ha wal tz’a’n hin tzaljk’ojlal."},{"id":7,"tag":null,"isDisplayed":null,"text":" Hin wach’ kolmal kaw wach’ snab’en, Kaw ay schamk’ojlal ayin."},{"id":6,"tag":null,"isDisplayed":null,"text":"4     Ha wal hin wach’ kolmal Jesús, ha tz’a’n tas ay tz’och wu’uj. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Ha Jesús kaw yik xo waji, yuj cha ayx hin tzaljk’olal."},{"id":3,"tag":null,"isDisplayed":null,"text":"Coro .\nHin wach’ Kolmal Jesucristo, ha wal tz’a’n hin tzaljk’ojlal."},{"id":4,"tag":null,"isDisplayed":null,"text":" Hin wach’ kolmal kaw wach’ snab’en, Kaw ay schamk’ojlal ayin."},{"id":7,"tag":null,"isDisplayed":null,"text":""}]},{"id":317,"title":"Wach’ Yik Heb’ Yunnal Xo Dios","guid":"y/SZz4ovkEGzppSRTQbmIA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"317 Wach’ Yik Heb’ Yunnal Xo Dios\n \nH. de G. 152 Bienaventurados Los De Limpio Corazón."},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mt. 5:8; Sal 4: 6 \n \nHa heb’ may jak maysch’olnil ay a spixan, kaw wach’ yik heb’,  yujto oj yil heb’ Dios. Mt. 5:8</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Wach’ kik hanh yik honhk xo Dios, yujto sakx yaj ki pixan. Yujto matz ki nib’j tzki say tas ay a tik. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Yujto wan ki ch’oxn eli, junk’ojlal yet’ chamk’ojlal. Yujto oj ki k’och wal kajn a satcha’anh."},{"id":3,"tag":null,"isDisplayed":null,"text":"Coro .\nKi b’itnokek ¡Aleluya!(Aleluya) Yet’ wal smasnil ki pixan.(ki pixan) "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yuj sniwnal ye’lch ki Kolmal, yuj cha tzki b’itnejk wal sb’i. A smasnil k’inal jki b’itnok schamk’ojlal."},{"id":4,"tag":null,"isDisplayed":null,"text":"2     Kaw yel niwn ton swach’k’ojlal, to ix yak’ wal ki Kolmal. Yujto ix el wal schik'l hin Kolmal Jesús. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Smasnil k’inl tanhb’iln yu’uj, yujto aych hin k’ojl ha a. Yuj cha tzin tzalji to yik hin sak k’inal."},{"id":6,"tag":null,"isDisplayed":null,"text":"Coro .\nKi b’itnokek ¡Aleluya!(Aleluya) Yet’ wal smasnil ki pixan.(ki pixan)"},{"id":7,"tag":null,"isDisplayed":null,"text":" Yuj sniwnal ye’lch ki Kolmal, yuj cha tzki b’itnejk wal sb’i. A smasnil k’inal jki b’itnok schamk’ojlal."},{"id":5,"tag":null,"isDisplayed":null,"text":"3      Aych Yespíritu ayin, yuj cha yiklum hin ha a. Yujto kaw ayx ek’ wal sakk’inlal ayin, yuj wal sniwkil chamk’ojlal."},{"id":6,"tag":null,"isDisplayed":null,"text":" Xya cham sb’a yuj heb’ ajmul, yuj cha oj hin b’itnok sb’i hin wach’ Kolmal."},{"id":7,"tag":null,"isDisplayed":null,"text":"Coro .\nKi b’itnokek ¡Aleluya!(Aleluya) Yet’ wal smasnil ki pixan.(ki pixan) "},{"id":8,"tag":null,"isDisplayed":null,"text":"Yuj sniwnal ye’lch ki Kolmal, yuj cha tzki b’itnejk wal sb’i. A smasnil k’inal jki b’itnok schamk’ojlal."},{"id":6,"tag":null,"isDisplayed":null,"text":"4      Kaw wal ay hin junk’ojlal manhxa tas tzin na tiknek, yujto kajn och wal Jesús a hin pixan."},{"id":7,"tag":null,"isDisplayed":null,"text":" Ha hin wach’ kolmal Jesús ayx och schamk’ojlal ayin. Yuj cha oj hin b’itnok a smasnil k’inal."},{"id":8,"tag":null,"isDisplayed":null,"text":"Coro .\nKi b’itnokek ¡Aleluya!(Aleluya) Yet’ wal smasnil ki pixan.(ki pixan) "},{"id":9,"tag":null,"isDisplayed":null,"text":"Yuj sniwnal ye’lch ki Kolmal, yuj cha tzki b’itnejk wal sb’i. A smasnil k’inal jki b’itnok schamk’ojlal."}]},{"id":318,"title":"B’o Icha Tza Nib’ej","guid":"krVbUmlyEk6c3slTUHr6IQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"318  B’o Icha Tza Nib’ej\n \nC.S.G. 384 Haz lo que quieras."},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jer. 18:1-6; Ro. 9:20-23; 2 Ti 2:15-22 \n \nMamin Jehová, hach tik ki Mam haj honh, hanh xo tik honh lum honhnhej, hach tz’akjnaknh yet’ lum lu’um, kaw hach b’ojnak honh. Is. 64:8</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     B’o icha tza nib’j ayn hach Mamin. Hach tzin ha tz’aka, yujto lum hin. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw emmkilal tzin nib’j tzwutj hin b’a. Ak’ e’lchok tas tza nib’j wal ayin."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     B’o icha tza nib’j ayn hach Mamin. Ilt och hin b’eyb’al yet’ hin pixan. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Tzej el smasnil hin maysch’olnilal, sek yel to hek hin hach hin Diosal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     B’o icha tza nib’j ayn hach Mamin. Kolwjanh wet' ha ajtil tzwab’ sya’il. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ay hepalil hach hin wach’ Kolmal, tzak’ b’oxk hin k’ojol yet’ hepalil."},{"id":5,"tag":null,"isDisplayed":null,"text":"4    B’o icha tza nib’j ayn hach Mamin, sek oj yil heb’ anma ha wach’il. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Manhx wiko’ok hin b’a hin ch’okoj, yujto ha Cristo kajn och ayin."}]},{"id":319,"title":"Jun Xajmb’al Pitzan","guid":"ERNKsh66+0my1UltRQqDGg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"319 Jun Xajmb’al Pitzan\n \nV.C. 134  Un Sacrificio Vivo."},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ro. 12: 1-2; Heb. 13:13-15; 1 P. 1:5 \n \nHex wutak, hex wanab’… Tzin tew at ayex, to tze ya’ch he b’a a yol sk’ab’.  Icha junk xajmb’al  pitzan. Ro. 12:1</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ix ha say Junk’ojlal yet’ pax tzaljk’ojlilal, kaw ix ha’ch wal ha k’ojl a ki Dios. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Yuj cha kaw smoj tzak’ wal ha niwnal yiko’ok, icha junk xajmb’al tzak’ a Dios."},{"id":0,"tag":1,"isDisplayed":null,"text":"Hal tiknek kaw wal yunnalchxo ki Mam Dios, yikxo Dios haj wal a smasnil k’inal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ixta tzotj ha b’a jun, oj hach yak’ wal iljok, oj ha cha pax jun sniwn chamk’ojlal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Yik tzonh b'eyk' yet’ Jesús, oj ki cha tzalk’ojlal, ma tzonh xiw wal a maysch’olnilal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ij kot wal ha siylab’ a yatut ki Mam Dios, ha tas tzyak’ wal ayach, ak’ ha a."},{"id":0,"tag":1,"isDisplayed":null,"text":"Hal tiknek kaw wal yunnalchxo ki Mam Dios, yikxo Dios haj wal a smasnil k’inal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ixta tzotj ha b’a jun, oj hach yak’ wal iljok, oj ha cha pax jun sniwn chamk’ojlal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Manhx tzak nachj el ku’uj, swach’k’ojlal ki Mam Dios, kaw wal wach’ smasnil tas tzyak’ ayonh."},{"id":5,"tag":null,"isDisplayed":null,"text":" Tzaljk’oklal xo kaji yuj schamk’ojlal Jesús, kaw wal may tas ix kak’ wal ha a."},{"id":0,"tag":1,"isDisplayed":null,"text":"Hal tiknek kaw wal yunnalchxo ki Mam Dios, yikxo Dios haj wal a smasnil k’inal. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Ixta tzotj ha b’a jun, oj hach yak’ wal iljok, oj ha cha pax jun sniwn chamk’ojlal."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Tzaljk’ojlal xo haji, ay  wal ha junk’ojlal, jun ha chamk’ojlal kaw may slajub’."},{"id":6,"tag":null,"isDisplayed":null,"text":" Oj hel  swach’k’ojal Dios, yik ja k’och aj ayk’i, toto tza’ch wal a k’ojl a Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"Hal tiknek kaw wal yunnalchxo ki Mam Dios, yikxo Dios haj wal a smasnil k’inal. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Ixta tzotj ha b’a jun, oj hach yak’ wal iljok, oj ha cha pax jun sniwn chamk’ojlal."}]},{"id":320,"title":"Yiklum Tzin Nib’j Tzwutj Hin B’a","guid":"4d1ZfrUPR0iIlJq3wHsq2g","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"320  Yiklum Tzin Nib’j Tzwutj Hin B’a\n \nC.S.G. 416 Cristo Fiel Te Quiero Ser."},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ef. 4:1-13; Ap. 2:8-11; 2 Ti. 2:1-9 \n \nManh hex xiw yuj tzo’nh yailal oj jawk a he yib’anh… Palta yiklumnhej tze yutj he b’a masnto oj he chami. Ap. 2:10</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Yiklum tzin nib’j tzwutj wal hin b’a, wal aych Mamin, ak’ hin jelnal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ha het’ok tzin nib’j tzin b’eyk’i. Manh tonhjok tzwal wal aych Mamin."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw oj woch tza’n wal hoj Mamin. B’ab’l hach wu’uj, tza’n hin ho oj. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha yik oj jawk tas kaw ay smay, tzak’ yip hin jichk’ojlal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Tzin nib’j tzin paxtin yet’ Jesús. Hanhj wal yet’ok, hanhj wal yet’ok."},{"id":4,"tag":null,"isDisplayed":null,"text":" Ha junk’ojlal tzyak’ wal ayin. Yuj yiklum hin, yuj yiklum hin."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw oj woch tza’n wal hoj Mamin. B’ab’l hach wu’uj, tza’n hin ho oj. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ha yik oj jawk tas kaw ay smay, tzak’ yip hin jichk’ojlal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ak’ hin tzaljk’ojlal hach Mamin, yet’ chamk’ojlal, yet’ chamk’ojlal."},{"id":5,"tag":null,"isDisplayed":null,"text":" Hax wal Espiritu Mamin, tzin i’n b’eyok, tzin i’n b’eyok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw oj woch tza’n wal hoj Mamin. B’ab’l hach wu’uj, tza’n hin ho oj. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Ha yik oj jawk tas kaw ay smay, tzak’ yip hin jichk’ojlal."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Junjn k’u tzin nib’j tzin yiklej, wal ha nib’b’en, wal ha nib’b’en. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Oj wi’ chanh wal ha b’i Mamin, a emmkilal, a emmkilal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw oj woch tza’n wal hoj Mamin. B’ab’l hach wu’uj, tza’n hin ho oj. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Ha yik oj jawk tas kaw ay smay, tzak’ yip hin jichk’ojlal."}]},{"id":321,"title":"Yik Tzonh B'eyk' Yet' Dios","guid":"2VRH6wpJ6EWz2QnDsyzjdQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"321  Yik Tzonh B'eyk' Yet' Dios\n \nC. S. G. # 394 Cuado Andamos Con Dios"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Pr. 3:1-8; Ef. 5:1-10; 2 P. 3:8-14 \n \n…Tzin tew at ayex, kaw wach’ tze yutj he b’eyb’al.  Ef. 4:1</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Yik tzohn b'eyk' yet' ki Dios, ha yik tzkab'n spaxti’; tzaljk'ojlal oj aj wal ki pixan. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ki cha kab’ scheknb’il, yujto Kajlil yaji. Ha xchamk’ojlal tzonh i’nek b’eyok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ki yiklkek, a Jesús ki Kolmal. Hatn b’e ch’oxnb’il ayonh, yik tzonh b’eyk a swach’il."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Yik ix cham ki Kolmal, xyij el ki kusk’ojlal. Kalk el wal yab’xil ki wach’ Kolmal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ay pax tzaljk’ojlilal, yuj schamk’ojlal Kajlil, a heb’ tzjaw a emmkilal ha a."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ki yiklkek, a Jesús ki Kolmal. Hatn b’e ch’oxnb’il ayonh, yik tzonh b’eyk a swach’il."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Kaw wal matz tak’ ki chan, swach’k’ojlal ki Mam Dios, toto hanhj ijnok ki b’on stu’al. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw tzki chaj tzaljk’ojlal, yuj schamk’ojlal ayonh, toto yiklum honh wal a spaxti’."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ki yiklkek, a Jesús ki Kolmal. Hatn b’e ch’oxnb’il ayonh, yik tzonh b’eyk a swach’il."}]},{"id":322,"title":"Ha Ki Mam Dios Kaw Ay Yip","guid":"7PQWWiBgR0eUTqWXbKeF2g","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"322  Ha Ki Mam Dios Kaw Ay Yip\n \nC. S. G. # 45  Castillo Fuerte"},{"id":3,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 46; 18:1-6; Lc. 21:12-18\n \n Ha Dios aych kenhlokek, ha pax aych kipkek, ha tz’och pax ket’ek yik ay ki somk’ojlal. Sal. 46.1</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ha ki Mam Dios kaw wal tztak’ yuj smasnil, ha tzonh koln el a skal tas ay smay, "},{"id":3,"tag":null,"isDisplayed":null,"text":"kaw wal ha yet’ yipal oj honh skolek, a skal smasnil tas tzjaw a kib’anh. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha wal win Satanás, kaw tznib'j tzonh yak' telwok; kaw tznib'j tzki b'o stu'al, ay sjelnal kob’ yalni, yujto yajl maysch’olnil yaji."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Kaw may wal jab’ok ke’lch a Satanás, smasnil tas kaw may ye’lch a winak. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw yuj heb' tzya'ch sk'ojl a ki wach’ Kolmal; yuj wal heb' tzya'n Dios howl yet'ok."},{"id":5,"tag":null,"isDisplayed":null,"text":" Ha Jesús yunnal Dios, ix cham a te kulus, kaw wal yuj ki mulek, yuj cha ix yab' syail. Kaw ix kan chaml a yalnh yu’uj."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Wach'xam to kaw niwn heb’ ajk'ojl aynhek, matz’ honh xiwek aych wal Dios ket’ek. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Wach’ kab’ tzch’ox smasnil sjelnal wal aynhek, ha ki Mam Dios kaw aychnhej ket'ek."},{"id":6,"tag":null,"isDisplayed":null,"text":"Toxnhej ay tztak’ yu’uj, Satanás a howal, manhx oj stak’ honh yixtni, yujto manhxa ye’lchi, yuj wal spaxti ki Mam Dios tiknek."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Ha spaxti ki Mam Dios tz'ib’b'il kani, kaw matz nib’j heb’ anma tzchaj yab’i. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Palta yuj Yespíritu ki Mam Dios, ayk'nhej wal ket’ a smasnil k'inal. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Wach’xam tzyij wal ek’ heb’, smasnil tas ay ayonh, toxnhej tzonh cham yuj heb’. Palta oj ka’k yajlil, yet' ki Mam Dios a smasnil k'inal."}]},{"id":323,"title":"Ij Honh Chanh Mamin","guid":"s451D5Y/rkujAcALmgdTLA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"323  Ij Honh Chanh Mamin\n \nV. C. # 308 Avívanos Señor \n Coro CSG 497"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 119:30-37; Hab. 3:2,17-19; 2 T. 1:6-13 \n  \n…Ha yik tzjaw jun tzo’nh tzannhj  tas to ay smay ayex, kaw tzaljanhk si’mb’il. Stg. 1:2</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ij honh chanh wal het' hach Mamin, yet’ smasnil hepalil. Ha Espíritu Santo kajn och wal ayonh, ha tzch’oxn aj tzonh b’eyi"},{"id":0,"tag":1,"isDisplayed":null,"text":"Ij honh chanh wal hach Mamin, ak’ a yaxilal ayonh. Ak' niwtjok ha chamk’ojlal a spixn heb’ to tzach a’n och wal a sk’ojol."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Ij honh chanh wal het' hach Mamin, kaw tzki nib'j ha kolwal. Ha wal smasnil ha yaxilal hek hach Mamin, ak’ kot wal ha ayonh"},{"id":0,"tag":1,"isDisplayed":null,"text":"Ij honh chanh wal hach Mamin, ak’ a yaxilal ayonh. Ak' niwtjok ha chamk’ojlal a spixn heb’ to tzach a’n och wal a sk’ojol."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ij honh chanh wal het' hach Mamin,Kaw tzak’ ki chamk’ojlal. Yik tzkaln yab’ heb’ to satnkto ek’ a skal mul, sek wach' oj kolchjok heb'.ç"},{"id":0,"tag":1,"isDisplayed":null,"text":"Ij honh chanh wal hach Mamin, ak’ a yaxilal ayonh. Ak' niwtjok ha chamk’ojlal a spixn heb’ to tzach a’n och wal a sk’ojol."}]},{"id":324,"title":"Cristo X’el Schik’il","guid":"YtI2fse0V0miSuh+lp7POg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"324  Cristo X’el Schik’il\n \nV.C.A. 147  Yo Confío En Jesús"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Lc. 23:43; Mt. 27:45-55\n \n Yujto tzka’k och a ki k’ojol, yuj cha, yunalnhek xo Dios, junxnhej kajk yet’ Cristo Jesús ki masnil. Gá. 3:26</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Tzwa’ch hin k’ojl a hin Jesús, yuj cha hin kolchji. Yujto xcham a te kulus, oj hin k’och yet’ok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Cristo xel schik’il, xyak’ chamsb’a wu’uj. Yuj ix cham wal a te kulus, ha Jesús xa’n hin k’inal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Xlajw kan hin mul yu’uj, manhxa tas xkani. Oj hin at a satcha'anh, yujto xcham wu’uj."},{"id":0,"tag":1,"isDisplayed":null,"text":"Cristo xel schik’il, xyak’ chamsb’a wu’uj. Yuj ix cham wal a te kulus, ha Jesús xa’n hin k’inal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Hach Jesús hin kolmal hach, xwa’ch hin k’ojl ayach. Hin ha man yet’ ha chik’il, yet’ ha sakk’inlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Cristo xel schik’il, xyak’ chamsb’a wu’uj. Yuj ix cham wal a te kulus, ha Jesús xa’n hin k’inal."}]},{"id":325,"title":"Ha Dios Sakk'inal","guid":"STbqZIncEEW23BWgy2HIUA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"325  Ha Dios Sakk'inal\n \nC. S. G. # 52 Jehová Es Mi Luz y Salvación"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 27; Sal. 56:1-4;  Isa. 60:1-3, 18-22\n \n Jehová tz’a’n sak k’inl ayin hin Kolmal paxi.\nSal. 27:1</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"Ha Dios kaw sakk'inl yaj ayin, ha Dios kaw hin Kolmal ton yaji. // May aj tzin xiwi. // "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ha ki Mam Dios kaw tzwa’ch yipk hin k’ojol. Ha ki Mam Dios kaw tzwa’ch yipk hin k’ojol. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Tiknek kaw may mach ajtil tzin xiwi. Tiknek kaw may mach ajtil tzin xiwi."},{"id":3,"tag":null,"isDisplayed":null,"text":"A’ch Dios yipk ha k’ojol. A’ch Dios yipk ha k’ojol. Kaw tzak' hep tiknek yet’ smasnil wal ha pixan. Kaw a’ch Dios yipk ha k’ojol"},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha Dios kaw sakk'inl yaj ayin, ha Dios kaw hin Kolmal ton yaji. // May aj tzin xiwi. //"}]},{"id":326,"title":"Junjn K’u","guid":"vYl2hFW+rkm9lDcmu+e/MQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"326 Junjn K’u\n \nC.S.G. 368  Día En Día"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>2 Cr. 12:9-10; Sal. 55: 16-23; Hch. 18:1-10 \n \nKalk wach’ paxti a Kajlil, hatn ki Diosalek, ki Kolmalek paxi. Sal. 68:19</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Junjn k’u ayk’ hin wach’ Kolmal wet’ok, tzyak’ hin te’nal yik ay hin yail. Kaw wal aych hin k’ojl a Jesucristo, ha tiknek kaw manhxtzak hin xiwi. "},{"id":3,"tag":null,"isDisplayed":null,"text":"A wal smasnil tas maysch’olnil tiknek, kaw manhxa wal hin nib’b’en ha a, kaw wal wach’ jun schamk’ojal hin Kolmal, ayk’nhej wal wet’ a smasnil k’inal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Junjn k’u tzin sketz b’ey hin wach’ kolmal, kaw wal junk’ojlal xo waj yet’ok. Kaw wal yel tanhb’iln yuj Jesucristo, yuj cha kojxnhej aj tzwak' hin pixan."},{"id":4,"tag":null,"isDisplayed":null,"text":" Manhx jantkok schamk’ojlal hin wach’ Kolmal, yojknhej smasnil tas tzjaw a wib’anh. Ha tz’a'n smasnil tas kaw ay tz’och wu’uj. Ha Jesús kaw ha tz’a'n hin k’inal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Kolwjanh wal wet’ hach hin wach’ Kolmal, kaw wal manh hin hakkan hin ch’okoj. Kaw oj wal wach’ paxti aych hin Kolmal, yujto kojxnhej aych tzin em kuman, "},{"id":5,"tag":null,"isDisplayed":null,"text":"yet’ wal ha wach’ k’ab’ tzin ha ketz b’eyok, a yik ayn ek' a skal kusk’ojlal. Hach tzak' wal hin te'nal yet’ ha paxti’, kaw tzak' pax wal sniwnal hin k’ojol."}]},{"id":327,"title":"Ketzb’iln Yuj Dios","guid":"yBGWt2nvb0KTirRgl9k2YA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"327 Ketzb’iln Yuj Dios\n \nC. S. G. # 407. Me Guía Él"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 23; 25:1-10 \n \nMamin Jehová, ch’ox wal ayin tas tzwutj hin tojlb’tzan hin b’eyb’al. Ij hin at wal a jun b’eyb’al kaw tojol. Sal. 27:11</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Tzin sketz Jesús yet' schamk'ojlal,  yel ketzb'iln yuj Jesús hin wach' Kolmal."},{"id":3,"tag":null,"isDisplayed":null,"text":" A smasnil k’inal tzin sketza, kaw manhx jantkok schamk’ojlal yik tzin sketzni."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw ketzb’iln yu’uj, kaw ketzb’ilin. Manhx jantkok schamk’ojlal yik tzin sketzni. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Manhxa chab’k’ojlal yet’ xiwk’ojlal, yujto ketzb’iln yuj wal hin wach’ ilmal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Ha wal a skal ki yailal,  yet’ pax wal a yik tzaljk’ojlal kaji. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yik ay junk’ojlal yet’ howal,  kaw wal tzonh sketz Jesús yet’ wal schamk’ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw ketzb’iln yu’uj, kaw ketzb’ilin. Manhx jantkok schamk’ojlal yik tzin sketzni."},{"id":5,"tag":null,"isDisplayed":null,"text":" Manhxa chab’k’ojlal yet’ xiwk’ojlal, yujto ketzb’iln yuj wal hin wach’ ilmal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Tzin nib’j tzin ha ketz hach Mamin, sek wach’ may wal ajtil oj hin telwi. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Tzin b’on yet’ smasnil hin pixan, swach’ilal yet’ smasnil tas wal tza nib’ej."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw ketzb’iln yu’uj, kaw ketzb’ilin. Manhx jantkok schamk’ojlal yik tzin sketzni. Manhxa chab’k’ojlal yet’ xiwk’ojlal, yujto ketzb’iln yuj wal hin wach’ ilmal."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Ha yik oj hin pax het’ Mamin, oj hin k’och’ wal het’ ha a tziktznial."},{"id":6,"tag":null,"isDisplayed":null,"text":" Manhxa chab’k’ojlal yet’ xiwlal,  yujto ketzb’iln yuj wal jun hin Wach’ ilmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw ketzb’iln yu’uj, kaw ketzb’ilin. Manhx jantkok schamk’ojlal yik tzin sketzni. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Manhxa chab’k’ojlal yet’ xiwk’ojlal, yujto ketzb’iln yuj wal hin wach’ ilmal."}]},{"id":328,"title":"Ochnh Wet' Mamin","guid":"2/d1L7jwiUSHk3v2B6Y6lQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"328  Ochnh Wet' Mamin\n \nB.B.D. # 63"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 27; Sal. 62:1-8; Sal. 91 \n \nYujto kojn aych tztak’ skoln sb’a heb’ meb’a, kolwjum haj a heb’ ay skusk’olal, yuj tas ay sk’a’l  tz’och yu’uj. Is. 25:4</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ha a Chamk’ojlal Mamin, tzin i’n el a skal tu’al. Ha a wach’k’ojlal Mamin, Ha wal ta tzin kol hin b’a."},{"id":3,"tag":null,"isDisplayed":null,"text":" Koln el wal het' hach Mamin, a skal smasnil tas ay smay, sek oj hin b'o tza nib'ej, masnto jin k’och het’ok."},{"id":3,"tag":null,"isDisplayed":null,"text":"2    Yipk'ojlal wal haj wu'uj, ¿mach to wal oj hin kolni? Han ay aj chab' hin k'ojol, yuj junk tas tzjaw a wib’anh. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Palta hach ton Wajlil hach, aj tzwij sniwnal hin k’ojol. Yuj cha tzin jaw wal ayach, hach hin wach' kolmal Jesús."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Smasnil tas tz'ilchj wuj ayach, manhxa tas tzin na tiknek. Ha yik ay hin kusk'ojlal, hach xo tzak' wal hin te’nal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ha wal heb' ay syailal, kaw tzb'ox kan sk'ojl heb' ho’oj. Yet’ hin chamk'ojlal Mamin, tzwal wach’ paxti wal ayach. Amén"}]},{"id":329,"title":"Ochnh K'eln A Jesús","guid":"CLZq0eJQ2k6RANaSKmsGkw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"329  Ochnh K'eln A Jesús\n \n V. C. # 300 Mira A Cristo Y Vivirás"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>1 Co. 15:1-14;  Jn. 3:14-15; Heb. 12:1-3 \n \nKa’k at ki nab’en a Jesús, yujto ha tz’a’n ka’k’ och ki k’ojl ha a. Heb. 12:2</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Oj wal yab'xil hin Kolmal, a heb' anma'; jun wach' ab'x yik chamk'ojlilal."},{"id":3,"tag":null,"isDisplayed":null,"text":" Xcham Jesús a te kulus, yuj wal hin mul; yuj wal cha hin kolchj kan el yu'uj."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ochnhek k'eln wal a Jesús, (ochnhek k'eln wal a Jesús,) ha oj a'nok he k’inal."},{"id":4,"tag":null,"isDisplayed":null,"text":" A'k och he k'ojl a spaxti halb'il kani; ay wal ki k'inl a jun ejmnhej."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Jun wach' ab'x yik hin Kolmal, ix yak' ayin; jun wach' ab'x to may wal slajub'. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha Jesús kaw may slajub', tzyak' ki k'inal; ayk'nhej ton wal a smasnil k'inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ochnhek k'eln wal a Jesús, (ochnhek k'eln wal a Jesús,) ha oj a'nok he k’inal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"A'k och he k'ojl a spaxti halb'il kani; ay wal ki k'inl a jun ejmnhej."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ha tiknek chaj ha k'inal, a hin Kolmal; ha Jesús oj yak' ha kolnb'il. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw chaj Jesús ha Kolmalok, wal tiknek; hax ha kan a tzalk'ojlal tiknek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ochnhek k'eln wal a Jesús, (ochnhek k'eln wal a Jesús,) ha oj a'nok he k’inal. "},{"id":6,"tag":null,"isDisplayed":null,"text":"A'k och he k'ojl a spaxti halb'il kani; ay wal ki k'inl a jun ejmnhej."},{"id":5,"tag":null,"isDisplayed":null,"text":"4    Kaw oj wal he yab' tiknek, jun wach' ab'x tik;tas ix aj sjaw hin kolnb'il yuj Dios. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Yujto xwa'ch hin k’ojl a Dios, kaw hin kolchji; yet' wal smasnil hin k'ojol tzwalni."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ochnhek k'eln wal a Jesús, (ochnhek k'eln wal a Jesús,) ha oj a'nok he k’inal."},{"id":7,"tag":null,"isDisplayed":null,"text":" A'k och he k'ojl a spaxti halb'il kani; ay wal ki k'inl a jun ejmnhej."}]},{"id":330,"title":"Manh Wal Hach Xiwok","guid":"ex3dG0SeBUijUHoHDlBx8A","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"330   Manh Wal Hach Xiwok\n \nC. S. G. # 465 No Te Dé Temor"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>2 Ti. 1:6-13; 3:14; 4:8 \n \nHa Dios,  manhok xiwk’ojlal xyak’ ayonh. Palta ha yipalil xyak’a, sek te’n tzkutj ki b’a. 2 Ti.1:7</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Manh hach xiw wal haln yik Jesucristo, hal swach'k'ojlal Dios ayach. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Manh hach xiw haln el mach tzach koln el jun,  yik hachnhej wal ki Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Manh wal hach xiwok,  manh wal hach xiwok, manh hach xiw jab'ok b'i'an. "},{"id":4,"tag":null,"isDisplayed":null,"text":"To ha Cristo ki Kolmal,  yuj wal cha manh hach xiwok."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Manh hach xiw ha b'on yik Jesucristo, smasnil tas wal tztak' ho'oj.  "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yelk'ojlal tzach munlj yet' ha jichk'ojlal, oj spaktzok wal ha munljel."},{"id":0,"tag":1,"isDisplayed":null,"text":"Manh wal hach xiwok,  manh wal hach xiwok, manh hach xiw jab'ok b'i'an. "},{"id":5,"tag":null,"isDisplayed":null,"text":"To ha Cristo ki Kolmal,  yuj wal cha manh hach xiwok."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Manh hach xiw hab'n syal yuj wal ki Cristo,  manh hach xiw hach sb'uchn anma'. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ak' niwnk'ojlal a skal smasnil yail, icha x'aj ki wach' Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Manh wal hach xiwok,  manh wal hach xiwok, manh hach xiw jab'ok b'i'an. "},{"id":6,"tag":null,"isDisplayed":null,"text":"To ha Cristo ki Kolmal,  yuj wal cha manh hach xiwok."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Manh hach xiw ha cham yuj Jesucristo,  a b'e yel yik wal k'inal. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Ha oj he'n at wal a swach'c'ojlal b'i'an, a satchanh yet' ki Mam Dios."},{"id":0,"tag":1,"isDisplayed":null,"text":"Manh wal hach xiwok,  manh wal hach xiwok, manh hach xiw jab'ok b'i'an."},{"id":7,"tag":null,"isDisplayed":null,"text":" To ha Cristo ki Kolmal,  yuj wal cha manh hach xiwok."}]},{"id":331,"title":"Manh He'l Ha Sat Ayn Mamin","guid":"nAFxsMZEcU+SK3CtjSW+hw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"331 Manh He'l Ha Sat Ayn Mamin\n \nV. C. # 311. No Me Pases, No Me Olvides"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 121:1-8; 54:1-7; Fil. 4:4-7\n \n Ha Jehová ha tzonh tanhwni, aj tzonh atek yet’ pax yik tzonh japxek. Sal. 121:8</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kaw manh he'l wal ha sat ayin, hach hin wach' Kolmal. Kaw wal tzwak’ tzaljb’ok hin k’ojol, ab’ wal tas tzwala."},{"id":0,"tag":1,"isDisplayed":null,"text":"Cristo, Cristo, chaj hab' tas tzwala, ak' ha wach'k'ojlal a wib'anh, chaj wal hin lesal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     A yojltak ha wach’k’ojlal, tz’ilchj hin junk’ojlal. May tas wach’ tz’ilchj wuj a tik jun, kojn ha aych Mamin."},{"id":0,"tag":1,"isDisplayed":null,"text":"Cristo, Cristo, chaj hab' tas tzwala, ak' ha wach'k'ojlal a wib'anh, chaj wal hin lesal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Kaw wip yaj wal ha wach'k'ojlal, ak’ sakk’inl ayin. Manh hin ha chab'k’ojlok Mamin, kaw koln wal Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"Cristo, Cristo, chaj hab' tas tzwala, ak' ha wach'k'ojlal a wib'anh, chaj wal hin lesal."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Ak' sniwnal hin k'ojl hach Mamin,   yujto honnal hin. ¿Mach wal junk xo ayk’ wet’ a tik? Kaw kojn hach Mamin."},{"id":0,"tag":1,"isDisplayed":null,"text":"Cristo, Cristo, chaj hab' tas tzwala, ak' ha wach'k'ojlal a wib'anh, chaj wal hin lesal."}]},{"id":332,"title":"Kaw Ma Tzin Xiwi","guid":"ZMO6NF4USUiMg3sbZZE1Ww","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"332  Kaw Ma Tzin Xiwi\n \nNo Tengo Cuidados H. D. G 326"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ro. 8: 30-38; 1 Tes. 4::13-17\n \n ...Kaw aych Dios ket’ek.  Yuj cha, ¿tom ay junk xo mach ek’b’al yip ya’n howl ket’ek? Ro. 8:31</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kaw matz hin xiwi, matz hin och il jab’ok.  Yuj tas to oj jawk a wib’anh.  "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ha hin wach’ Kolmal ha tzwa’ch yipk hin k’ojol, yujto kaw aych il hin yilni."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yipk’ojlal yaj (kaw yipk’ojlal yaj) hin kolmal Jesús (hin kolmal Jesús). "},{"id":4,"tag":null,"isDisplayed":null,"text":"Matz hin xiwi, (matz hin xiwi) kaw wach’ hin Jesús (kaw wach’ hin Jesús). "},{"id":3,"tag":null,"isDisplayed":null,"text":"Skal kusk’ojlal (a skal kusk’ojlal), may aj tzin yakkani (matz hin yakkani). "},{"id":4,"tag":null,"isDisplayed":null,"text":"Tzwa’ch yipk hin k’ojol (tzwa’ch yipk hin k’ojol), kaw tanhb’iln yu’uj (tanhb’iln yu’uj)."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ha yik tzjaw smasnil tas ay smay a wib’anh,  toxnhej ay wal somk’ojlal jun. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Wach’ xam oj hin yakkan heb’ hin wach’ k’ojol, palta Jesús ayk’nhej wet’ok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yipk’ojlal yaj (kaw yipk’ojlal yaj) hin kolmal Jesús (hin kolmal Jesús)."},{"id":5,"tag":null,"isDisplayed":null,"text":" Matz hin xiwi, (matz hin xiwi) kaw wach’ hin Jesús (kaw wach’ hin Jesús). "},{"id":4,"tag":null,"isDisplayed":null,"text":"Skal kusk’ojlal (a skal kusk’ojlal), may aj tzin yakkani (matz hin yakkani). "},{"id":5,"tag":null,"isDisplayed":null,"text":"Tzwa’ch yipk hin k’ojol (tzwa’ch yipk hin k’ojol), kaw tanhb’iln yu’uj (tanhb’iln yu’uj)."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ha swach’l yilx te nich te', ha Dios Tz’a’ni,  tanhb’il pax no tz’unun yu’uj. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kav may xon aj tzin yakkan pax hin ch’okoj. Yujto hin yij och yiko’ok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yipk’ojlal yaj (kaw yipk’ojlal yaj) hin kolmal Jesús (hin kolmal Jesús). "},{"id":6,"tag":null,"isDisplayed":null,"text":"Matz hin xiwi, (matz hin xiwi) kaw wach’ hin Jesús (kaw wach’ hin Jesús). "},{"id":5,"tag":null,"isDisplayed":null,"text":"Skal kusk’ojlal (a skal kusk’ojlal), may aj tzin yakkani (matz hin yakkani). "},{"id":6,"tag":null,"isDisplayed":null,"text":"Tzwa’ch yipk hin k’ojol (tzwa’ch yipk hin k’ojol), kaw tanhb’iln yu’uj (tanhb’iln yu’uj)."},{"id":5,"tag":null,"isDisplayed":null,"text":"4      Kaw oj jawk pax Kajlil wal a schaejmal, Oj honh yi’t yet’ a satcha’anh. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Oj kan kusk’ojlal yet’ smasnil tas ay smay,  Yujto kaw oj ki k’ochk yet’ Dios."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yipk’ojlal yaj (kaw yipk’ojlal yaj) hin kolmal Jesús (hin kolmal Jesús). "},{"id":7,"tag":null,"isDisplayed":null,"text":"Matz hin xiwi, (matz hin xiwi) kaw wach’ hin Jesús (kaw wach’ hin Jesús). "},{"id":6,"tag":null,"isDisplayed":null,"text":"Skal kusk’ojlal (a skal kusk’ojlal), may aj tzin yakkani (matz hin yakkani). "},{"id":7,"tag":null,"isDisplayed":null,"text":"Tzwa’ch yipk hin k’ojol (tzwa’ch yipk hin k’ojol), kaw tanhb’iln yu’uj (tanhb’iln yu’uj)."}]},{"id":333,"title":"Dios Tzex Tanhwni","guid":"FfA5F3LTckKoBpOf0F6zlQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"333 Dios Tzex Tanhwni\n \nC. S. G. # 620. Dios Os Guarde"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Hch. 20:32-38; 2 Cr. 13:11,14; Ro. 11:33-12:1 \n \n Kaw wal ix kus heb’,  yujto xyal a heb’, chajtl to manhxa b’a’nh oj yil sb’a heb’ yet’ok. Hch. 20:38</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Dios tzex tanhwni yet’ schamk'ojlal. Masnto a yik jawk Cristo. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Yik tzonh yi’n at a satcha’anh, oj ki kank yet' a smasnil k'inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yik oj jawk Jesús a scha’ejmal,  yel oj kilk ki b’a a yojltak. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Oj ki yamk ki b'a ki smasnil jun, juxnhej oj kajk yet ki wach’ ilmal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Dios tzex tanhwni yet’ schamk'ojlal,  wal a smasnil tas kaw ay smay.  "},{"id":4,"tag":null,"isDisplayed":null,"text":"Wach'xam ay somk'ojlal a tik, ha Jesús kaw tzyak' he junk’ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yik oj jawk Jesús a scha’ejmal,  yel oj kilk ki b’a a yojltak. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Oj ki yamk ki b'a ki smasnil jun, juxnhej oj kajk yet ki wach’ ilmal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Dios tzex tanhwni yet’ schamk'ojlal, yik tze te'wt
