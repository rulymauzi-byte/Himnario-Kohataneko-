"Munljahn, leslwanh, (leslwanh munljanh a yik ki Mam Dios) yuj wal smunljel ki wach' Kolmal Jesús. (a yik Dios) "},{"id":5,"tag":null,"isDisplayed":null,"text":"Tzin nib'j wal tzin leslwi, tzwa’n pax witz’nb’ok hin b’a, yuj wal smunljel ki Mam Dios."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Tzin nib'j tzin kuy heb' anma a kaw yel, hanhj wal hinKolmal tzwa'ch yipk hin k'ojol. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Mach heb' oj snib’k munjlok sb’a, oj ilchjok munljel yuj heb’, wal a smunljel ki Mam Dios."},{"id":0,"tag":1,"isDisplayed":null,"text":"Munljahn, leslwanh, (leslwanh munljanh a yik ki Mam Dios) yuj wal smunljel ki wach' Kolmal Jesús. (a yik Dios) "},{"id":6,"tag":null,"isDisplayed":null,"text":"Tzin nib'j wal tzin leslwi, tzwa’n pax witz’nb’ok hin b’a, yuj wal smunljel ki Mam Dios."}]},{"id":203,"title":"Munljkoyek, Munljkoyek","guid":"4w54ld0Vxk+8jLtWxuklYw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"203      Munljkoyek, Munljkoyek \n \nV. C. # 261 \tTrabajad, Trabajad"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Col. 1:3-14; Mt. 24:45-51; 1 Cor. 15:58 \n \n…Manh he choyb’tzok he b’a. Yet’ smasnil he k’ojol, tzex munlj a yik Kajlil a smasnil k’inal.  1 Cor. 15:58</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Munlj koyek, munlj koyek, schekb' honhk wal ki Mam Dios; ki tza'wkek cheknb'il ix yal Cristo Jesús."},{"id":3,"tag":null,"isDisplayed":null,"text":" Ha Jesús jyak' yip aynhek a smasnil k'inal, sek oj b’o icha wal tzni’bj Jesús ki Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Munljkoyek, munljkoyek, ki tanhwkek, sjapx, Jesús; kak' wal kip, a lesal Tox oj meltzjok ki wach' kuymal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Munljkoyek, munljkoyek, kal wal yab' heb' to tznib'j, tzchaj wal sk'inl a ki wach' Kolmal Jesús tiknek. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ay heb’ ay syailal tzk’och a ki wach’ kolmal, yujto tzyab’ heb’ to matnil tzchaj heb’ skolnb'il."},{"id":0,"tag":1,"isDisplayed":null,"text":"Munljkoyek, munljkoyek, ki tanhwkek, sjapx, Jesús; kak' wal kip, a lesal Tox oj meltzjok ki wach' kuymal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Mulnjkoyek, munljkoyek, ki k’an kip a Jesús, te'n tzkutj wal ki b'a a skal may sch'olnilal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kal a smasnil heb' anma jun kaw wach' ab'x tik, to yuj Cristo Jesús tiknek ay kolnb'il."},{"id":0,"tag":1,"isDisplayed":null,"text":"Munljkoyek, munljkoyek, ki tanhwkek, sjapx, Jesús; kak' wal kip, a lesal Tox oj meltzjok ki wach' kuymal."}]},{"id":204,"title":"Schekb' Honhk Jesús","guid":"dKKFybqXhU2ddQwpIrO1zA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"204        Schekb' Honhk Jesús\n \nC. S. G. # 528  Siervos de Jesús"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jos. 5:13-15; Ef. 6:10-18; Ro. 8:28-39 \n \n…Yuj cha, tzwal ayex, tzeyak’ heyip, sek’ wach’ oj he cha jun munjel kaw wach’.1 Co. 14:12</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Schekb' honhk wal Jesús, jun ki wach’ Kolmal, ki b’ok icha wal tas tznib’j aynhek. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Sch’oxjnak swach’ko’jlal yet’ wal schamk’ojal, te’n tzkutjek ki b’a a maysch’olnil."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw te'n tzkutjek wal ki b'a ki masnil. Yik tzki ch’oxnek wal el Kajlilek. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Te’nnhej tzkutjek wal ki b’a ki masnil. Ka’k ip ki masnil oj stak’ kujek."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ha ki Yajlilek tox ix stak’ yu’uj, manb’ilnhek xo yuj a te kulus. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ki b’ok wal snib’b’en, ha oj och ket’ek, ha oj ki'n at wal a sakk'inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw te'n tzkutjek wal ki b'a ki masnil. Yik tzki ch’oxnek wal el Kajlilek. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Te’nnhej tzkutjek wal ki b’a ki masnil. Ka’k ip ki masnil oj stak’ kujek."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     May tas oj ki’nek a smunljel Kajlil, yujto tzki b’ok icha wal tznib’ej. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw oj ka’k yajlil, hax ki chanek spak, a jun mach honh mannek yet’ schik’il."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw te'n tzkutjek wal ki b'a ki masnil. Yik tzki ch’oxnek wal el Kajlilek. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Te’nnhej tzkutjek wal ki b’a ki masnil. Ka’k ip ki masnil oj stak’ kujek."}]},{"id":205,"title":"Wanxo Wal Yemk’u","guid":"/d+vmY1VbE+zXGdKMqNh1A","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"205    Wanxo Wal Yemk’u "},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ro. 13:10-14; Ef. 5:15-17 \n \nWojtak, jantnhej tas tze b’o’o.  Wojtak, kaw yelk’ojlal tzex munlji, kaw niwn tze yutj he k’ojol.</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kaw wal wanxo yem k’u jun, ka'k wal ip ki munlji. Hex to tzex munlj a Cristo, manh wal hex iljok. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ha ki k'inlek yajnhej tz'ek'i, tzaljkoyk yet' smasnil kip. Ya' sb'a to kaw te'n honhto, ki’k chanh sb’i Jesús."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Kaw wal wanxo yem k’u jun, ka'k wal ip ki munlji. Yik tzkalnek yab’ heb' anma', Te'n tzkutjek ki b’a."},{"id":4,"tag":null,"isDisplayed":null,"text":" Ha wal ki munljel tzka'k a Dios, oj satnok wal e’lchi. Ha wal yik tzk'ib' ki munljel, kaw oj och wal yip."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Kaw wal wanxo yem k’u jun, ka'k wal ip ki munlji. Hax heb' ajmul to satnak, at kalk wal yab’ heb'. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw wal wan scham heb' a skal smul, manhxa pax wal yip heb'. Wan sjaw jun slajb' k'ual, til wal maysch'olnil."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Kaw wal wanxo yem k’u jun, ka'k wal ip ki munlji. Til wal heb' anma satnak, ka'k scha heb' Jesús."},{"id":6,"tag":null,"isDisplayed":null,"text":" Kaw ki ch'oxk el jun wach' b'eyb'al, manh kixtkek wal eli. Yik oj ki k'ochk a slajub', manhx oj stak' ku'uj."}]},{"id":206,"title":"Kaw Niwn Ye’lch Dios","guid":"eV/u/sJklUmJFXsdroi40A","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"206   Kaw Niwn Ye’lch Dios\n \nC. S. G. # 32 Cuán Grande Es Él"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 8; 145:1-13; 86: 8-13 \n \nMamin Jehová Kajlilh ach honh, kaw niwn ye’lch ha b’i a smasnil yolyib’nhk’inl tik.  Sal.8:9</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Hach hin Diosal tzin k’e k’enl a satcha’anh, tzwiln k'e k'anal kaw wal tziktzni yilxi. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ha yik tzwab'ni kaw how sk'anh k'u yik tzkot nhab', tzwiln pax yem yok k’u a sjolm heb’ lum witz."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzin tzalji, tzin b'itnej hin Diosal, kaw niwn ye’lch sb'i, kaw niwn ye’lch sb'i. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw tzin tzalji, tzin b'itnej hin Diosal, kaw niwn ye’lch sb'i ki Diosal jun."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Ha yik tzin ek' aj ay ch'olan yet' tzalan, ay waymtak, ay pax aj ay nichte'. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha yik tzwab'ni yik tz'ok' smasnil he no ch'ik, yet’ pax a yik tzk’anh sb’ey heb’ ha niwk ha'."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzin tzalji, tzin b'itnej hin Diosal, kaw niwn ye’lch sb'i, kaw niwn ye’lch sb'i. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw tzin tzalji, tzin b'itnej hin Diosal, kaw niwn ye’lch sb'i ki Diosal jun."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ha yik tzin nan kot schamk'ojlal hin Diosal, Kaw wujnhej xcham Jesús a te kulus. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Wujnhej wali xkan yatut a satcha'anh, ix yab' syail, ix cham wal yuj hin mul."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzin tzalji, tzin b'itnej hin Diosal, kaw niwn ye’lch sb'i, kaw niwn ye’lch sb'i. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kaw tzin tzalji, tzin b'itnej hin Diosal, kaw niwn ye’lch sb'i ki Diosal jun."},{"id":5,"tag":null,"isDisplayed":null,"text":"4    Ha yik oj hin pax yet’ Dios a satcha’anh, A jun watut kaw wal tziktzni yilxi. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Oj wi’ chanh sb’i yujto kaw wal niwn ye’lchi, Yujto kaw manhx halchjb’enok schamk’ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzin tzalji, tzin b'itnej hin Diosal, kaw niwn ye’lch sb'i, kaw niwn ye’lch sb'i. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Kaw tzin tzalji, tzin b'itnej hin Diosal, kaw niwn ye’lch sb'i ki Diosal jun."}]},{"id":207,"title":"Tzin Och Schekb'ok Cristo","guid":"VC5vcEfYuEKDMlDcygGiYA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"207         Tzin Och Schekb'ok Cristo \n \nC. S. G. # 511  Gozo Da Servir A Cristo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 100; Heb. 11:32-12:3; Stg. 1:2-4 \n \nHa yik xwul yalnk heb’ ku’tak ayn ho’oj, kaw xjaw hin tzalk’ojlal a tik. 3 Jn. 3</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kaw ay hin tzaljk'ojlal a yik, to tzin schek Jesús Wajlil. Jesucristo hin Kolmal, yel niwn tzaljk'ojlal tzyak' ayin."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzaljk'ojlal tzin och schekb'ok Cristo. Tzaljk’ojlal yaj hin pixan, junjn k'u tzyak' yip ayin, yik tzin yiklj scheknb'il.  Kaw wal tzyak’ jun tzaljk'ojlal, a hin pixan."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Kaw ay hin tzaljk'ojlal a yik, to tzin schek Jesús Wajlil. Smasnil kusk'ojlal yet' yail, tzyij el Cristo hin Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzaljk'ojlal tzin och schekb'ok Cristo. Tzaljk’ojlal yaj hin pixan, junjn k'u tzyak' yip ayin, yik tzin yiklj scheknb'il.  Kaw wal tzyak’ jun tzaljk'ojlal, a hin pixan."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Kaw ay hin tzaljk'ojlal a yik, to tzin schek Jesús Wajlil. Yujto wojtak to ha Jesús, kaw tzyak’ sakk'inlal ayin."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzaljk'ojlal tzin och schekb'ok Cristo. Tzaljk’ojlal yaj hin pixan, junjn k'u tzyak' yip ayin, yik tzin yiklj scheknb'il.  Kaw wal tzyak’ jun tzaljk'ojlal, a hin pixan."}]},{"id":208,"title":"Kaw Wach' Ki Mam Dios","guid":"hoWkiKtUIU+s3YnkuRCSmQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"208        Kaw Wach' Ki Mam Dios\n \n C. S. G. # 3 ¡Santo Santo Grande Eterno Dios!"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Is. 6:1-8; Dan. 7:9-14; 1Ti. 1:15-17 \n \nKotnhek, em koyk kumn yik tzonh ochk emmkilal a Jehová… Yujto ha b’ojnaknhek. Sal. 95:6</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Smasnil k’inal kaw wach’ hach ki Dios; tzach ki b'itnej yet' tzaljk'ojlilal jun, Syajil hach heb' yajl hach ki Diosal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Smasnil tztak' wal hoj hach ki Mam Dios. A emmkilal yet' wal tzaljk'ojlal jun, oj kal ki b'a aych wal hach Kajlil."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw niwkil hach yet’ ha wach’ilal. May junkxo ay sjelnal het’ hach Dios."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     B'itnejek Dios hex aj satcha'anh; b'itnejek Dios hex ayk' a sat lum tik, b'itnanhk wal hex yunnal ki Mam Dios. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw ki b’itkek wal Dios ki masnil. Kaw yel may junk xo mach icha Dios jun, kaw Syajlil yaj wal a heb’ yajal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw niwkil hach yet’ ha wach’ilal. May junkxo ay sjelnal het’ hach Dios."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Kaw yel yajl hach a smasnil k'inal, ayx wal ki k'inal; hoj hach ki Mam Dios, kaw hach ay hek ton wal smasnil tas. "},{"id":5,"tag":null,"isDisplayed":null,"text":"May wal junk xo mach lajn het' hach Dios. Oj hach ki b’itnok a smasnil k’inal, yujto honh ha man yet’ ha chik’il. "},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw niwkil hach yet’ ha wach’ilal. May junkxo ay sjelnal het’ hach Dios."}]},{"id":209,"title":"Manh Jantkok Swach'k'ojlal Dios","guid":"sbkqIVxP9UuB93QZLWxwyA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"209      Manh Jantkok Swach'k'ojlal Dios \n \nC. S. G. # 293 Oh Bondad Tan Infinita"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Tit. 3:3-8; 2 Cr. 6:40-41; Sal. 145:1-13\n \n Kaw niwn ha wach’k’ojlal tzak’ a heb’ ay he’lch ha a. Sal. 31:19</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Kaw manh jantkok swach'k'ojlal Dios, wal a smasnil heb' ajmul. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ha Dios ix ya kot wal yunnal, ix wul sch’oxnok schamk’ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha Jesús (ha Jesús) tz’och ket’ok, (tz’och ket’ok,) yipk'ojlal yaj ki Kolmal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kojn ha a (kojn ha a) tz’ilch wal ku’uj, smasnil swach’k’ojlal ki Dios."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Icha sniwkilal satcha’anh    yet’ wal sniwkilal ha Mar. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ixta swachk’ojlal ki Mam Dios,    xyak’ Jesús a ki pixan."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha Jesús (ha Jesús) tz’och ket’ok, (tz’och ket’ok,) yipk'ojlal yaj ki Kolmal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kojn ha a (kojn ha a) tz’ilch wal ku’uj, smasnil swach’k’ojlal ki Dios."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Wach'xam ha smasnil ha mul jun, kaw tu yilx wal a sat Dios. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Hax schik’l elnk a spenk te kulus, ha oj b’iknok el ha mul."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha Jesús (ha Jesús) tz’och ket’ok, (tz’och ket’ok,) yipk'ojlal yaj ki Kolmal."},{"id":6,"tag":null,"isDisplayed":null,"text":" Kojn ha a (kojn ha a) tz’ilch wal ku’uj, smasnil swach’k’ojlal ki Dios."}]},{"id":210,"title":"Wach' Ha Nab'en Dios","guid":"AU9CEYMXO0+QcQcL6vfPHg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"210     Wach' Ha Nab'en Dios\n \n C. S. G. # 4 Santo, Santo, Santo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Is. 6:1-8; Ap. 4; 1P. 1:13-23\n \n Ha Jehová tzta’nhj yuj smasnil, Dios kaw kojxni. Is. 6:3</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kaw wach’ ha nab'en Dios, kaw tzta’nhj hoj wal a smasnil. Oj wal wach’ paxti aych yet’ smasnil hin k’ojol. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw wach’ ha nab’en Dios, oj woch emmkilal ayach, Dios Oxwnh hanmail, yel wach’ hach hin Diosal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Kaw wach’ ha nab’en Dios, yuj wal cha tzach hin b’itnej. Halx kab' wach' paxti aych yuj heb' honnal Mamin. "},{"id":4,"tag":null,"isDisplayed":null,"text":"A smasnil k’inal oj och heb' a emmkil ayach. A smasnil k'inal oj em kumn heb' wal ayach."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Kaw wach' ha nab'en Dios, tzach sb'itnej wal heb' ángel. Hatn heb' sik’b’il el hoj icha wal ha nib’b’en. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ha wal ha a tziktznil oj em nhojn heb' aych Mamin. Kaw yel Dios ton hach jun, wal a smasnil k'inal."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Kaw wach' ha nab'en Dios, May xon wal b’a’nh tzach tzaktzji. May oxlajnhb’ak’inh tznachj el ha wach’k’ojlal. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kaw wal wach' ha nab’en, a heb’ anma hach Mamin. Yuj wal cha oj yal sb'a, smasnil wal heb' ayach."},{"id":6,"tag":null,"isDisplayed":null,"text":"5     Kaw wach' ha nab'en Dios, ha wal smasnil ha wach’il, tzcheklj el a smasnil tas b’ob’il hoj Mamin. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Kaw wach’ ha nab’en Dios, tz’em nhojn heb’ anma ayach, Dios Oxwnh hanmail yuj cha tz’ijxchanh ha b'i. Amén "}]},{"id":211,"title":"Yalnh Swachk'ojlal Dios","guid":"1v6NA1pBfEGeY7V2zhQgKw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"211    Yalnh Swachk'ojlal Dios \n \nC. S. G. # 347 Bajo Sus Alas"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 61; 91; Is. 51:12-16\n \n Oj honh sk’ub’k el yet’ yipal, sek may tas oj ki’nek. Icha junk no kaxtilnh tzmoy yune’. Sal. 91:4</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Ha wal a yalnh swach'k'ojlal hin Diosal. Ha ta tzin kan wal a smasnil k'inal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw tzin stanhwej yuj cha junk'ojlal waji, ha swach’k’ojlal ha hin koln kan eli."},{"id":0,"tag":1,"isDisplayed":null,"text":"Junk'ojlal waj, a yol sk’ab’ Dios. May tas tzin i’n ek’ a Jesús. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Junk’ojlal waj yuj xchamk’ojlal jun. Kaw tzin skol yet' wal schamk'ojlal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Ha wal a yalnh swach'k'ojlal hin Diosal, kaw tz'ilchj junk'ojlal yuj wal hin pixan. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Toxnhej tzjaw kusk'ojlal yet' pax yailal, kaw tzin skol Cristo yuj wal schamk'ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Junk'ojlal waj, a yol sk’ab’ Dios. May tas tzin i’n ek’ a Jesús. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Junk’ojlal waj yuj xchamk’ojlal jun. Kaw tzin skol yet' wal schamk'ojlal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ha wal a yalnh swach’ k'ojlal hin Diosal, kaw ay tzaljk'ojlal a jun ejmnhej. "},{"id":5,"tag":null,"isDisplayed":null,"text":"May junk maysch'olnilal oj stak' hin yixtni, yuj cha junk'ojlal waj a yol sk'ab' Dios."},{"id":0,"tag":1,"isDisplayed":null,"text":"Junk'ojlal waj, a yol sk’ab’ Dios. May tas tzin i’n ek’ a Jesús. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Junk’ojlal waj yuj xchamk’ojlal jun. Kaw tzin skol yet' wal schamk'ojlal."}]},{"id":212,"title":"Ay Jun Hin B'it Yik Tzaljk'ojlal","guid":"inVO6zHmxUqGmXQHNDi07A","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"212    Ay Jun Hin B'it Yik Tzaljk'ojlal\n \nV. C. # 27 Cantar De El Deseo Yo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 96:1-2; Sal. 100; Col. 3:16-17 \n \nB’itn koyk ha a, tzkalnek ki wach’ paxti ha a; a junjn k’u tzkalnek el yabxil kolnb’il tzyak’a.   Sal. 96:2</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kaw tzin b’itnej Jesús hin wach’ Kolmal yujto hin skolkn eli. Yik Jesús jun b'it wan hin b'itnan tik, yujto hin kolchj kani."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yiktax wal hin kolchj kani, (// yiktax wal in kolchj kani, //) yiktax wal hin kolchj kani, tzaljk'ojlal yaj hin pixan. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Yiktax wal hin kolchj kani, (// yiktax wal in kolchj kani, //) tzaljk’ojlal tzin b’itn a hin Kolmal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2       Tzyak' Jesús junk'ojlal a hin pixan, yet' pax chamk'ojlilal. Tzyak' hin te'nal yik ay hin yailal,  yuj swach'k'ojlal ayin."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yiktax wal hin kolchj kani, (// yiktax wal in kolchj kani, //) yiktax wal hin kolchj kani, tzaljk'ojlal yaj hin pixan. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yiktax wal hin kolchj kani, (// yiktax wal in kolchj kani, //) tzaljk’ojlal tzin b’itn a hin Kolmal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Kaw wojk xo to kaw yel ay hin k'inal, yujto hin kolchj kani. Yuj ton hin mul ix el schik'l hin Jesús, yuj cha hin kolchj kani."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yiktax wal hin kolchj kani, (// yiktax wal in kolchj kani, //) yiktax wal hin kolchj kani, tzaljk'ojlal yaj hin pixan. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yiktax wal hin kolchj kani, (// yiktax wal in kolchj kani, //) tzaljk’ojlal tzin b’itn a hin Kolmal."},{"id":5,"tag":null,"isDisplayed":null,"text":"4    Ha wal ha nib’b’en wal hach hin kolmal, hin nib’b’en hin b’oni. Kaw yuj ha wach’k’ojlal hach hin Jesús, tzin nib’j tzin k’och a cha."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yiktax wal hin kolchj kani, (// yiktax wal in kolchj kani, //) yiktax wal hin kolchj kani, tzaljk'ojlal yaj hin pixan. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Yiktax wal hin kolchj kani, (// yiktax wal in kolchj kani, //) tzaljk’ojlal tzin b’itn a hin Kolmal."}]},{"id":213,"title":"B'itjek Cristo","guid":"xZJvepXH+Uq0LbgwDmmrFQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"213      B'itjek Cristo \n \n C.S.G # 238 Al Señor Jesús loemos."},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 40:1-5; Jn. 20:19-23; Rom. 10:9-10\n \n Ix ya’n hin b’itnok jun ak’ b’it. jun b’it yik alj wach’ paxti a Dios. Sal. 40:3</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Ki b'itkek wal Jesucristo yuj to kaw wal xyab’ syal kujek. Ka’k ki b’a a tzaljk’ojlal a Cristo ki kolmal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Junk'ojlal ay a sb'i Cristo, yujto ha xkoln el heb’ yikxo. May tas tz'i'n heb' ay sjichk'ojlal a ki wach' Kolmal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3       A'ch ha k'ojl a Jesucristo, ha tzonh koln el a maysch’olnil. May mach tztak' honh yi'n ek' a sk'ab', Cristo ki kolmal."},{"id":5,"tag":null,"isDisplayed":null,"text":"4      Ha tas matz kilk wal tiknek jun, kaw oj kilk wal a satcha'anh. Icha tznib'j wal Dios tzonh aj jun, ixta oj kaji."}]},{"id":214,"title":"Oj Hin B'itnok Jun Wach' Ab'ix","guid":"M5Ou1w7N+0Czz7y9Can21w","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"214  Oj Hin B'itnok Jun Wach' Ab'ix\n \nV. C. # 277  Cantaré La Bella Historia"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ef. 1:3-14; 3:14-21;  4:17-30 \n \nKi masnil hanh kajnhok a sat  lum lum tik, b’itn koyk yet’ ki tzalk’ojlal a Dios.   Sal.100:1</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Oj hin b'itnok jun wach' ab'x tik, yik Jesús hin wach' Kolmal. Ha satchanh ix yakkan wu’uj, kaw ix cham a te kulus."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj hin b'itnok jun kaw wach' ab'x tik, yik Jesús hin wach' Kolmal. Yet' heb' kolb'ilx ay a satcha'anh, oj hin b'itnok schamk'ojlal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2        Hin skol Cristo yuj swach'k'ojlal, ha yik ayn a skal hin mul. Tzin sch'ox wal a jun b’e kaw wach’, tojl oj k'och a satcha'anh."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj hin b'itnok jun kaw wach' ab'x tik, yik Jesús hin wach' Kolmal. Yet' heb' kolb'ilx ay a satcha'anh, oj hin b'itnok schamk'ojlal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     B'utn hin pixn yuj ilk'ojlal, palta Cristo tzin kolni. Yuj hin mul kaw lajwnak hin, palta Cristo hin anhtni."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj hin b'itnok jun kaw wach' ab'x tik, yik Jesús hin wach' Kolmal. Yet' heb' kolb'ilx ay a satcha'anh, oj hin b'itnok schamk'ojlal."},{"id":5,"tag":null,"isDisplayed":null,"text":"4      Yuj ton wal yip Jesucristo, matz hin xiw yik tzin chami. Oj waj yet' a smasnil k'inal, yet' heb' kolb'il xo yu'uj."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj hin b'itnok jun kaw wach' ab'x tik, yik Jesús hin wach' Kolmal. Yet' heb' kolb'ilx ay a satcha'anh, oj hin b'itnok schamk'ojlal."}]},{"id":215,"title":"Oj Hin B'itnok Sb'i Dios","guid":"5OlCIMHRzk6sllBw9PCo/w","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"215       Oj Hin B'itnok Sb'i Dios \n \nC. S. G. # 338 \tA Su Nombre Gloria"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Col. 1:15-23; 2:8-15; Ef. 2:11-22 \n \nHax Jesucristo, hatn testigo kaw yel, … ha b’ab’l pitzwnak pax a skal heb’ chamnak... Ix yi’n el ki mulk yet’ schik’il.  Ap 1:5</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ix cham hin wach' Kolmal a te kulus, yujnhej hin mul ix kulsax hin Jesús. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw tzaljk'ojlal xo waj yuj hin Kolmal, oj hin b'itnok wal sb'i."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj hin b'itnok sb’i Jesús, oj hin b'itnok sb'i Jesús, yuj swach'k'ojlal ayx hin kolnb'il tiknek. Oj hin b'itnok wal sb'i."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ix cham Jesús yuj hin ya’n niwnk’ojlal, ha hin pixan kaw sakx yaj yuj schik'il. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Tzin tzalj tiknek, ay pax hin junk’ojlal, oj hin b'itnok wal sb'i."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj hin b'itnok sb’i Jesús, oj hin b'itnok sb'i Jesús, yuj swach'k'ojlal ayx hin kolnb'il tiknek. Oj hin b'itnok wal sb'i."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Hex satnk to chajek Jesús tiknek, kaw tanhb'il he jaw yuj hin wach' Kolmal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw oj he cha schamk'ojlal ki Mam Dios, oj ki b'itnok wal sb'i."},{"id":0,"tag":1,"isDisplayed":null,"text":"Oj hin b'itnok sb’i Jesús, oj hin b'itnok sb'i Jesús, yuj swach'k'ojlal ayx hin kolnb'il tiknek. Oj hin b'itnok wal sb'i."}]},{"id":216,"title":"Ha Dios B'ojnak Smasnil","guid":"i7gRJ0phGUeRanuSshTfXg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"216  Dios B'ojnak Smasnil\n \nCoros Inpiradores"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal.  89:11; Stg. 4:7-20 \n \nHa Jehová ha ay yik yolyibnhk’iln tik yet’ smasnil tas ay a sat.   Sal. 24:1</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1       Ha satcha'anh yet' smasnil lum lum tik, ha ki Mam Dios ix b'on wal smasnil. "},{"id":3,"tag":null,"isDisplayed":null,"text":" // Kaw may junk xo Dios a sat lum lum tik, kojxnhej Dios ayk' a smasnil k'inal //"},{"id":3,"tag":null,"isDisplayed":null,"text":"2   Leslw koyk a tzaljk'ojlal a Dios jun, tzki k'annek swach'k'ojlal a kib'anh. "},{"id":4,"tag":null,"isDisplayed":null,"text":"// Yuj Jesucristo kaw ayx ki k'inlek, kaw tzaljk'ojlal xo yaj ki pixnek. //"},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Yel hanhek tox honh jawk a ki Kolmal, yel yunnalnhek xo wal ki Mam Dios. "},{"id":5,"tag":null,"isDisplayed":null,"text":"// Kaw tanhb’il sjaw pax ki wach’ Kolmalek, tzki chanek sjaw a scha'ejmal jun. //"},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Kaw tanhb'il sjaw hin wach' Kolmal Jesús, kaw yiklum tzwutj hin b'a a spaxti'."},{"id":6,"tag":null,"isDisplayed":null,"text":" // Manhxa hin xiwk'ojlal a jun chamel, kaw oj hin at wal a satcha'anh. // "}]},{"id":217,"title":"Ha Smasnil Sb'ob'en Dios","guid":"XmGTE42flESRLm5EpN72dw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"217   Ha Smasnil Sb'ob'en Dios \n \nC. S. G. # 33 Oh Criaturas Del Señor"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>1 Cro. 16:23-36; Sal. 104:1-9, 31-34; 65 \n  \n¡Halxkab’ wach’ paxti a Jehová, a schanhil satcha’anh! Sal. 148:1</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Heb’ to sb'ob'en wal ki Mam Dios, tzb'itnej heb’ sb'i yet' wach' paxti'. ¡Halk wach’ paxti’! ¡Aleluya! Ha k'u to tzyak' jun sakk'inal."},{"id":3,"tag":null,"isDisplayed":null,"text":"Yet’ pax uj yet' wal stziktznial; ¡Halk wach' paxti'! ¡Aleluya! ¡Halk wach' paxti'! ¡Aleluya! ¡Aleluya!"},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Ha b'eymal ik' yet' k’en che'ew, yet' smasnil asn a satcha'anh, ¡Halk wach' paxti'! ¡Aleluya! Kaw tzaljk'ojlal yik tzsakb'eli. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yujto ha Dios ayk' he yet’ok, ¡Halk wach' paxti'! ¡Aleluya! ¡Halk wach' paxti'! ¡Aleluya! ¡Aleluya!"},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Yet' pax smasnil heb’ ha spak'b'a', tzb'itnej heb’ sb'i mach to b'ojnak. ¡Halk wach' paxti'!, ¡Aleluya! Ha k'ak' kaw wal tzyal swach' paxti'. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yet’ k'u to tzyak' pax sakk'inal. ¡Halk wach' paxti'! ¡Aleluya! ¡Halk wach' paxti'! ¡Aleluya!, ¡Aleluya!"},{"id":5,"tag":null,"isDisplayed":null,"text":"4      Smasnil tas ay a sat lum tik, smasnil tas to wach' yilx ha a, ¡Halk wach' paxti'! ¡Aleluya! Smasnil nichte' to wach' yilxi, tzb'itnej wal heb’ sb'i ki Mam Dios."},{"id":6,"tag":null,"isDisplayed":null,"text":" ¡Halk wach' paxti'! ¡Aleluya! ¡Halk wach' paxti'! ¡Aleluya! ¡Aleluya!"},{"id":6,"tag":null,"isDisplayed":null,"text":"5     A emmkilal yet' chamk'ojlal, tzki b'itnejek sb’i ki masnil. ¡Kalk wach' paxti'! ¡Aleluya! A Dios Mamb'il yet' Unnab'il. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Yet' wal a jun a'm Niwnk'ojlal. ¡Kalk wach' paxti'! ¡Aleluya! ¡Kalk wach' paxti'! ¡Aleluya! ¡Aleluya! Amén."}]},{"id":218,"title":"Ha Schamk’ojlal Dios","guid":"WK/ciy/S9EOpy01cKmxyYQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"218 Ha Schamk’ojlal Dios\n \nC.S.G. 63 Oh Amor De Dios"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Gn. 2:1-3;  Jn. 1:1-3; Col. 1:16 \n \nHa a yik x’el yich sb’o smasnil, ix sb’o Dios satcha’anh yet’ lum lu’um.   Gén. 1:1</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Manh halchjb’enok wal schamk’ojlal Dios, kaw wal matz nachj el xon ku’uj, x’o’ch sk’ojl Dios wal a heb’ ajmul, xya’ cham sb’a Jesús yuj wal smul heb’."},{"id":3,"tag":null,"isDisplayed":null,"text":" Ha yik x’och smul Adán yet’ Eva, ix pechx elt heb’ yuj smul cha, hata yaljnak kan ki Mam Dios,  to ay jun kolwjum oj jawok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha wal schamk’ojlal ki Mam Dios kaw ayk’nhej a smasnil k’inal, kaw lajn icha wal junk ha spak’b’a to may b’a’nh oj tup cha’anh."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Kaw satjub’tak snab’en ki Mam Dios,  yuj wal jun schamk’ojlal aynhek,  ayk’nhej wal ket’ a smasnil k’inal, kaw matz yij el snab’en aynhek. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw wach’ ki Dios ayk’ a satcha’anh,  yujnhej wali pitznonhek,  wach’xam oj lajwok tas ay a tik,  ayk’nhej ki Mam Dios ket’ek."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha wal schamk’ojlal ki Mam Dios kaw ayk’nhej a smasnil k’inal, kaw lajn icha wal junk ha spak’b’a to may b’a’nh oj tup cha’anh."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ha wal smasnil syajlil heb’ chonhab’,  oj ek’ el heb’ a satlum tik,  yet’ pax smasnil heb’ tzb’on maysch’olnil,  oj at heb’ a skal yailal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Hax schamk’ojlal jun ki wach’kolmal, smasnil k’inal kaw ayk’i,  yuj cha kaw wal tzki b’itnejek sb’i jun,  yujto ki Kolmalek yaji."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha wal schamk’ojlal ki Mam Dios kaw ayk’nhej a smasnil k’inal, kaw lajn icha wal junk ha spak’b’a to may b’a’nh oj tup cha’anh."}]},{"id":219,"title":"Kaw Niwn Schamk'ojlal Dios","guid":"+TlaZ5G8MUigcojvihl75Q","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"219   Kaw Niwn Schamk'ojlal Dios \n \nC. S. G. #160 Grande Amor, Sublime Eterno"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Tit. 3:3-8; Jn. 4:6-12; Ap.  21: 21-27\n \n Hax smak slajchwil, lajchwe k’en perla aych ha a… Ha scalleal jun chonhb’ cha, nab’a oro.  Ap. 21:21</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Kaw wal niwkil schamk'ojlal Dios, kaw ek’b’al icha ha mar. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ek’b’al icha wal satcha’anh, may junk xo icha wal Dios."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yuj nhej to xwa’ch hin k'ojl ha a, oj hin k’och a satcha’anh. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw hin yak' niwnk'ojlal Cristo, yujto hin sman yet' schik'il."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Kaw ay schamk'ojlal hin Diosal, yuj wal cha ix kulsaxi. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha Jesús hin wach' Kolmal jun, kaw ix yak' lajwok hin mul."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yuj nhej to xwa’ch hin k'ojl ha a, oj hin k’och a satcha’anh. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw hin yak' niwnk'ojlal Cristo, yujto hin sman yet' schik'il."},{"id":4,"tag":null,"isDisplayed":null,"text":"3       Kaw ay schamk'ojlal hin Diosal, wach’xam to kaw ajmul hin. "},{"id":5,"tag":null,"isDisplayed":null,"text":"To kaw ix o'ch wal sk'ojl ayin, xyab’ syal yunnal hin jelok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Yuj nhej to xwa’ch hin k'ojl ha a, oj hin k’och a satcha’anh. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kaw hin yak' niwnk'ojlal Cristo, yujto hin sman yet' schik'il."}]},{"id":220,"title":"Tiknek Tzaljk’ojlal Waji.","guid":"V2k43ybyl0KUkimJJQeT/g","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"220  Tiknek Tzaljk’ojlal Waji.\n \nC.S.G 387   Dulce Comunión"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 91; 17:1-8;  63:1-8 \n  \nHa ki Diosalek ayk’ a jun ejmnhej, ha aych ki tanhmalok. Dt. 33:27</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Tiknek tzin b’itni, tzaljk’ojlal waji, a yol sk’ab’ Wajlil hin wach’ Kolmal. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw niwn swach’k’ojlal, tzyak’ hin junk’ojlal, kaw niwn schamk’ojlal Dios xyak’ ayin."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kolb’il (kaw kolb’ilinxo)hin xo, (a hin chab’k’ojlal) a maysch’olnil yet’ xiwk’ojlal."},{"id":4,"tag":null,"isDisplayed":null,"text":" Kolb’il(kaw kolb’ilinxo) hin xo, (a hin chab’k’ojlal)  aynhxo ek’ a yol sk’ab’ hin Kolmal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Manhx jantkok swach’il, kaw wal tzin tzalji. A yol sk’ab’ Wajlil hin wach’ Kolmal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha a satcha’anh oj hin k’och yet’ok, yuj wal schamk’ojlal ix yak’ ayin."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kolb’il (kaw kolb’ilinxo)hin xo, (a hin chab’k’ojlal) a maysch’olnil yet’ xiwk’ojlal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kolb’il(kaw kolb’ilinxo) hin xo, (a hin chab’k’ojlal)  aynhxo ek’ a yol sk’ab’ hin Kolmal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Kaw ma tzin xiwi, may hin chab’k’ojlal, a yol sk’ab’ Wajlil hin wach’ Kolmal, "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yuj wal yipalil, kaw tzin skolkn eli,  a yol sk’ab’ win syajlil maysch’olnil."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kolb’il (kaw kolb’ilinxo)hin xo, (a hin chab’k’ojlal) a maysch’olnil yet’ xiwk’ojlal."},{"id":6,"tag":null,"isDisplayed":null,"text":" Kolb’il(kaw kolb’ilinxo) hin xo, (a hin chab’k’ojlal)  aynhxo ek’ a yol sk’ab’ hin Kolmal."}]},{"id":221,"title":"Ay Schamk'ojlal Cristo Ayin","guid":"Su150NCiykaoSpp7cXUlDQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"221      Ay Schamk'ojlal Cristo Ayin \n \nC. S. G. # 572. Cristo Me ama"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ef. 1:3-14; Ro. 8:28-39; Jn. 15:7-11 \n \nIcha tzin schamk’ojlej ki Mam Dios, ixta tzex wutj hex hin chamk’ojlan junxo.  Jn.15:9</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Cristo kaw tzin schamk’ojlej, ixta yaln wal spaxti Dios. Tztak' tzk'och wal heb' unn ha a, yujto kaw wal wach’ snab’en"},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzin schamk'ojlej, Cristo hin Kolmal; kaw tzin schamk'ojlej, ixta yaln wal Spaxti'."},{"id":3,"tag":null,"isDisplayed":null,"text":"2       Yuj schamk'ojlal xcham wu'uj,kaw tzch'ox swach'k'ojlal ayin. Xlajw kan hin mul yu'uj, oj hin yi't a satcha'anh."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzin schamk'ojlej, Cristo hin Kolmal; kaw tzin schamk'ojlej, ixta yaln wal Spaxti'."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Tzin schamk'ojlej hin Jesús,yujto ayk' wet' ha esal. Yik oj jawk wal hin chamel, oj hin at a Satcha’anh."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw tzin schamk'ojlej, Cristo hin Kolmal; kaw tzin schamk'ojlej, ixta yaln wal Spaxti'."}]},{"id":222,"title":"Ha Schamk'ojlal Hin Kolmal","guid":"H3uPLg6V3EO3qTP5n+afAw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"222  Ha Schamk'ojlal Hin Kolmal\n \nC. S. G. # 346 Del Amor Divino"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ro. 8:28-37; Ro. 5:1-11; Sal. 91\n \n May junk tas tzch’oxni, to tzyij el Cristo schamk’ojlal aynhek. Ro. 8:35</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      ¿Mach oj wi'n el a schamk'ojlal hin Kolmal? K'ub'b'iln el yuj Cristo, may tas oj wi’ni. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ha Dios tzin haln wach'il, ¿mach oj waln tu'al? Wuj han tik tztew Cristo, ¿sek may tzin i'ni?"},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha heb’ tzchamk’ojlan Dios, Kaw ha  tzkolwj yet’ heb’. Tzyak’ sniwnal sk’ojl’ heb’ yet’ pax wal ste’nal heb’."},{"id":3,"tag":null,"isDisplayed":null,"text":"2       Wojtak ha smasnil tas, to tz'ek' ayn tiknek. Kaw yuj yoch hin wach’lok, tanhb’iln wal yuj Dios. "},{"id":4,"tag":null,"isDisplayed":null,"text":"May aj tzin yaktj kan ki Mam Dios hin ch'okoj. Manhxa xchab’l hin k’ojol, ha a tzin ilji."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha heb’ tzchamk’ojlan Dios, Kaw ha  tzkolwj yet’ heb’. Tzyak’ sniwnal sk’ojl’ heb’ yet’ pax wal ste’nal heb’."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Aynh ek’ a skal yail yet’ a skal chamel,hax xchamk’ojlal Dios, ha wal tzonh koln eli."},{"id":5,"tag":null,"isDisplayed":null,"text":" May wal junhk simaj oj stak’ ki yamchj yu’uj. Yuj wal skolwal Dios jun, may tas tzonh i'ni."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha heb’ tzchamk’ojlan Dios, Kaw ha  tzkolwj yet’ heb’. Tzyak’ sniwnal sk’ojl’ heb’ yet’ pax wal ste’nal heb’."}]},{"id":223,"title":"Ha Schamk'ojlal Cristo","guid":"CZAdic4FQ0+u86jz+IRDrg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"223     Ha Schamk'ojlal Cristo \n \nC. S. G. # 349 Del Santo Amor De Cristo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jud.  20-25; 1 Jn. 4:10-19; 2 Cor. 5:11-21\n \n Kaw tze yil wal he b’a, sek ma oj heyel a schamk’olal Dios. Jud.  21</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1       Ha wal schamk'ojlal Cristo, may junk lajn yet'ok; siylab' ix yutj ya'n ayin, wal a smasnil k'inal."},{"id":3,"tag":null,"isDisplayed":null,"text":" Ha wal schamk'ojlal tik ayin, niwkil icha wal ha mar; icha yaj k'e satcha'anh, tzaljk'ojlal jin b'itnok."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha wal schamk'ojlal hin Jesús, kaw wal niwkil ton swach'il. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Manhx halchjb'enok wu’uj, may junk lajn yet'ok. Icha schamk'ojlal hin Jesús."},{"id":3,"tag":null,"isDisplayed":null,"text":"2       Yik xwulk' a yolyib'nhk'inl tik, x'och tza'n anma yu'uj; smasnil wal skusk'ojlal heb', ix yal heb' a Jesús. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yuj ton cha kaw x'o'ch sk'ojl a heb', icha wal sb'ey ha niwk ha'; ixta xyutj schamk'ojlan heb', xb'ox kan sk'ojl heb' yu'uj."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha wal schamk'ojlal hin Jesús, kaw wal niwkil ton swach'il. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Manhx halchjb'enok wu’uj, may junk lajn yet'ok. Icha schamk'ojlal hin Jesús."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Ha heb' matz tak' xon yilni, xyak' yil heb' sakk'inal; sakk'inl tzyak' a jun ejmnhej, yik xcham a te kulus."},{"id":5,"tag":null,"isDisplayed":null,"text":" Ha wal spixn smasnil anma', kaw niwn yel'ch x'ajkn yu'uj; yik xya’n swachk’ojlal a heb’ yet' pax wal yipalil. "},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha wal schamk'ojlal hin Jesús, kaw wal niwkil ton swach'il. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Manhx halchjb'enok wu’uj, may junk lajn yet'ok. Icha schamk'ojlal hin Jesús."},{"id":5,"tag":null,"isDisplayed":null,"text":"4       Til wal schamk'ojlal Cristo, niwkil sakk'inl yaji; ha tzch'oxn wal jun b'e wach' aj tznib'j tz'at heb' anma'. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Yik tz'ek' junjn hab'il a yib'nh heb', ha tz'a'n yil wal heb' syaxil; tzyak’ smasnil wach’l a spixn heb’, yet’ pax wal sjunk’ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha wal schamk'ojlal hin Jesús, kaw wal niwkil ton swach'il."},{"id":7,"tag":null,"isDisplayed":null,"text":" Manhx halchjb'enok wu’uj, may junk lajn yet'ok. Icha schamk'ojlal hin Jesús."}]},{"id":224,"title":"¿Tas wach’ Ka’n Stojlok?","guid":"NCtNb3lNAEWc19lhXzDaEA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"224  ¿Tas wach’ Ka’n Stojlok?\n \n C.S.G. # 171. ¿Con Qué Pagaremos?"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>1 Jn. 3:1-3; Sal. 6; Is. 57:15-19 \n \n…To tze ya’ch he b’a a yol sk’ab’. Icha junk xajmb’al pitzan, tz’ajx yiko’ok, ixta tzkutjek ka’n ki b’a ha a.   Ro. 12:1</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Tas tzkutj wal ki paktzan, ha niwkil chamk’ ojlal, ix hak’ wal ha k’inal, yuj wal heb’ ajmul. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Yuj cha chaj hin siylab’, tzwak’ a emmkilal //Jun siylab’ kaw wal wach’, hach hin Kolmal Jesús tzwak’ yet’ hin pixan. //"},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Yik tzjaw hin yailal jun, kolwjan wal wet’ Mamin. Tz’el yal hin sat yu’uj, tzwal hin b’a ayach. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yik tzwiln k’e satcha’anh, kaw tziktzni yilx k’anal. //Wojtak aych ek’ wal ta’, hach hin Kolmal Jesús kaw tanhb’iln ho’oj.//"},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Matz tak’ hin tojn ayach, jun ha chamk’ojlal tik,jun ha xajmb’aj tik, ix hak’ wal wu’uj. "},{"id":5,"tag":null,"isDisplayed":null,"text":"May tas wach’ tzwak’ ayach, yuj tzin ha chamk’ojlej, //Kaw chaj jun hin b'it tik, tzwak’ aych a tzaljk’ojlal yet’ wal hin pixan.//"}]},{"id":225,"title":"Tzin Nib'j Tzwal Hab'i'","guid":"Jx7BM5O9gUyrve44drqZJw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"225      Tzin Nib'j Tzwal Hab'i' \n \nC. S. G. # 170 Yo Quisiera Hablarte"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ef. 2:1-10; Ef. 3:14-21; Ro. 5:1-11         \n \nPalta ha Dios, kaw niwn x’o’ch sk’ojl aynhek. Manhx jantkok schamk’ojlal aynhek. Ef. 2:4</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Tzin nib'j tzwal hab' schamk'ojlal hin kolmal Cristo, ha Jesús hin wach' k'ojol kaw yel tzyala. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Yuj wal swach'k'ojlal kaw ix sjel wal hin nab'en, yuj cha kojxnhej wal ha a oj wak' serwil."},{"id":0,"tag":1,"isDisplayed":null,"text":"May mach tzin chamk'ojlan icha Cristo, kaw wal ay schamk’ojlal hin Jesús. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha Jesús hin koln a skal hin maysch’olnilal, yuj wal schamk’ojlal ayin."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ha hin pixan kaw kusk’ojlal yaj yuj hin mul,kaw meb'a in, kaw ay pax hin yailal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Palta hax hin Cristo hin koln el a hin mul, kaw hin yij och a jun b'e yik chamk'ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"May mach tzin chamk'ojlan icha Cristo, kaw wal ay schamk’ojlal hin Jesús. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ha Jesús hin koln a skal hin maysch’olnilal, yuj wal schamk’ojlal ayin."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      A junjn k'u kaw wal tzyak' ste'nal hin nab'en,kaw wal tzyak' pax junk'ojlal a hin pixan. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Manhx jantkok schamk’ojlal hin wach’ kolmal ayin, kaw oj wil yilxi yik oj hin k'och yet’ok."},{"id":0,"tag":1,"isDisplayed":null,"text":"May mach tzin chamk'ojlan icha Cristo, kaw wal ay schamk’ojlal hin Jesús."},{"id":6,"tag":null,"isDisplayed":null,"text":" Ha Jesús hin koln a skal hin maysch’olnilal, yuj wal schamk’ojlal ayin."}]},{"id":226,"title":"Tzin Schamk'ojlej Cristo","guid":"f3GMex8TfEecwhwgme4qvw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"226 Tzin Schamk'ojlej Cristo\n \n C. S. G. # 245 ¡ Oh Cuanto Le Amo!"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>1 Jn. 4:10-19; Jn. 14:12-24; Ro. 5:1-11\n \n Ay ki chamk’ojlalek a Dios tiknek, yujto ha honh b’ab’l chamk’ojlanek. 1 Jn. 4: 19</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Ha Cristo xcham wal a te kulus, ix yij wal el smasnil ki mul. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Kaw wal xyab' syal hin wach' Kolmal, hin kolchj kan wal el yu'uj."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal tzin chamk'ojlej, kaw wal yel tzin chamk'ojlej. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw wal tzin chamk'ojlej, yujto ix cham wal wu'uj."},{"id":3,"tag":null,"isDisplayed":null,"text":"2        May wal junk xo icha wal Jesús,kaw wach' snab'en a heb' yunnal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kalk wach' paxti a yik tzonh b'itnek, yik tzkaln wach' paxti a Dios."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal tzin chamk'ojlej, kaw wal yel tzin chamk'ojlej. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw wal tzin chamk'ojlej, yujto ix cham wal wu'uj."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Ayk' Cristo wet' a smasnil k'inal, ix yak' wal hin junk'ojlal jun. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yujto kaw ayk’nhej ton wal wet’ok, yuj cha kaw matz hin xiwi."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal tzin chamk'ojlej, kaw wal yel tzin chamk'ojlej."},{"id":6,"tag":null,"isDisplayed":null,"text":" Kaw wal tzin chamk'ojlej, yujto ix cham wal wu'uj."},{"id":5,"tag":null,"isDisplayed":null,"text":"4       Ha yik kaw ay wal hin kusk'ojlal, tzyak' Jesús sniwnal hin k'ojol. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Ha wal Jesús tzyak' wal yip ayin, tzin yij at a sakk'inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw wal tzin chamk'ojlej, kaw wal yel tzin chamk'ojlej."},{"id":7,"tag":null,"isDisplayed":null,"text":" Kaw wal tzin chamk'ojlej, yujto ix cham wal wu'uj."}]},{"id":227,"title":"Ay Jun Mach Ix Cham Yuj Hin Mul","guid":"fN/iaU3Wlkip+SZqwqX62w","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"227  Ay Jun Mach Ix Cham Yuj Hin Mul \n \nV. C. # 41 \tHubo Quien Por Mis Culpas"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 19:17-30; 1P. 1:13-23 \n \nYujto xcham Cristo yet’ sniwnal kujek. Ixta x’aj schami, sek tzonh yijek och yiko’ok. Col. 1:22</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Ha Jesús ix cham yuj hin mul a te kulus, maysch’olnil hin nab’en kaw tu in. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Tzin tzalji yujto hin sman Jesús yet’ schik’il yuj wali ix satkn el wal hin mul."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ix yij el wal hin mul, a te kuls ix chami, kaw yel niwkil xyab’ syal hin Jesús."},{"id":4,"tag":null,"isDisplayed":null,"text":" O'ltak wal ix aji yuj wal jun hin kolnb'il, hin Jesús ix cham yuj wal hin mul."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Ha Jesús kaw ay sniwnk'ojlal a heb' anma',yuj schik'il yuj cha x'el wal smul heb'. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha Jesús kaw ix sch'ox wal junk'ojlal ayin, hax tiknek manhxa yowl sk'ojl ayin."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ix yij el wal hin mul, a te kuls ix chami, kaw yel niwkil xyab’ syal hin Jesús. "},{"id":5,"tag":null,"isDisplayed":null,"text":"O'ltak wal ix aji yuj wal jun hin kolnb'il, hin Jesús ix cham yuj wal hin mul."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Yelk'ojlal tzin b’o icha snib’b’en hin Jesús,ha Jesús ix sch'ox wal emmkilal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yelk'ojlal ix yak' cham sb'a yuj wal heb’ anma’ a te kuls ix stojkn el wal hin mul."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ix yij el wal hin mul, a te kuls ix chami, kaw yel niwkil xyab’ syal hin Jesús. "},{"id":6,"tag":null,"isDisplayed":null,"text":"O'ltak wal ix aji yuj wal jun hin kolnb'il, hin Jesús ix cham yuj wal hin mul."}]},{"id":228,"title":"A Sti El Chonhb' Jerusalén","guid":"WSlsoeg28UaR0E23CNWXEg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"228   A Sti El Chonhb' Jerusalén\n \nV. C. # 46 Un Monte Hay"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mt. 27:27-44;  Jn. 19:17-30;  Col. 2:11 \n \nHa  aj ix t’unhxk’e cha, ha ta ay a sti el chonhab’. Jn. 19:20</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      A sti el chonhb' Jerusalén, ix kulsax ki Kolmal. Kujnhej ix ma'x ki wach’ Kolmal, ix kumkn ek' wal yuj heb'."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw yel ay schamk'ojlal Jesús, kaw smoj tzki chamk'ojlej. Kaw yet' wal smasnil ki k'ojlek, tzki b'ok icha wal tznib'ej."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Satjub’tak schamk’ojlal Jesús, xyak’ cham sb’a yuj ki mul. Tzki chaj kab’i’, to ha Jesús, xcham kuj a te kulus."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw yel ay schamk'ojlal Jesús, kaw smoj tzki chamk'ojlej. Kaw yet' wal smasnil ki k'ojlek, tzki b'ok icha wal tznib'ej."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Kaw yujnhej ki maysch'olnilal, yuj cha xyab' syal sniwnal. A spatk te kuls ix el schik'il, yuj cha honh kolchj kani."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw yel ay schamk'ojlal Jesús, kaw smoj tzki chamk'ojlej. Kaw yet' wal smasnil ki k'ojlek, tzki b'ok icha wal tznib'ej."},{"id":5,"tag":null,"isDisplayed":null,"text":"4    Kaw yet' schamk'ojlal ki Kolmal, ix stoj ki mul smasnil. Oj ki atk yet' a satcha'anh, yujto kolb'ilnhek xo."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw yel ay schamk'ojlal Jesús, kaw smoj tzki chamk'ojlej. Kaw yet' wal smasnil ki k'ojlek, tzki b'ok icha wal tznib'ej."}]},{"id":229,"title":"Ha A Te Kulus","guid":"n4e2Pl0WzkG78mFFOV+ELw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"229    Ha A Te Kulus \n \nC. S. G. # 210 En La Cruz"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>I Cor. 1:17-24; 15:1-10; Jn. 14:15-26 \n \n…In to ha ki yailalek, ha ix ajx och a yib’anh, ha ix ya’b syal ki jelok.  Is.53:4</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     To satnk hin a skal hin mul, kaw kusk’ojlal waji. May hin ch'olnil tu hin nab'en, Jesús hin schamk’ojlej."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha Jesús, ha Jesús, ha ix b'ikn el hin pixan; ha smasnil hin mul ix yij el a wib'anh. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ha tiknek wojk xo to kolb'iln yu'uj, kaw tzaljk’ojlal xo waj yuj tiknek."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Ha hin Kolmal ix el schik'il, ix cham a te kulus. Yuj wal hin mul ix yab' syail, yuj cha hin kolchj kani."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha Jesús, ha Jesús, ha ix b'ikn el hin pixan; ha smasnil hin mul ix yij el a wib'anh. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha tiknek wojk xo to kolb'iln yu'uj, kaw tzaljk’ojlal xo waj yuj tiknek."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Ix k'ewan a skal heb' chamnak, ix pax a satcha'anh. Ha Dios pitz'n och a hin k'ojol, maj hin xiw hin chami."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha Jesús, ha Jesús, ha ix b'ikn el hin pixan; ha smasnil hin mul ix yij el a wib'anh. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ha tiknek wojk xo to kolb'iln yu'uj, kaw tzaljk’ojlal xo waj yuj tiknek."},{"id":5,"tag":null,"isDisplayed":null,"text":"4    Ix at Jesús ix schek kot sjel, yik wach' tz'och kajn ayin. Ix jaw Espíritu ayin, ha x’a’n hin chamk’ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha Jesús, ha Jesús, ha ix b'ikn el hin pixan; ha smasnil hin mul ix yij el a wib'anh. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Ha tiknek wojk xo to kolb'iln yu'uj, kaw tzaljk’ojlal xo waj yuj tiknek."}]},{"id":230,"title":"Hal Yab’xil Cristo Ayin","guid":"DpRMPyG0P0a4xnSt8VKIvg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"230     Hal Yab’xil Cristo Ayin\n \nC. S. G. # 173 Dime La Historia De Cristo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 20:26-31; Hch. 8:26-39; Lc. 24:14-32 \n \nHax Felipe… ix syamn och yaln yab’xil Jesucristo a winak.  Hch. 8:35</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Hal jun ab'x yik Cristo ayin, kan kab' wal a hin pixan. Hal jun kaw wal wach' ab'x tik an, kaw wal manhx jantkok swach'il. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Hal yab'xil chajtl x'aj yalji, heb' ángel yet' swach' paxti'. Junk'ojlal ay a sat lum tik, yet' pax wal a satchanh aj ay Dios."},{"id":0,"tag":1,"isDisplayed":null,"text":"Hal wal yab'xil Cristo ayin, kan kab' wal a hin pixan. Ha satjub'takl wal yab'xil, kaw manhx jantkok wal swach'il."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Ha wal a yik ix ek' sch'okoj, a kusltak ix ek'i. Hax Satanás snib’j xyixtj paxti’, hax yet' sjelnal sta’n yu’uj. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Tzin nib'j ha sjelnal tzyak' ayin, yujto xkusi xyab' syail. May wal junk mach tzpatkilj eli, ixta wal ix aj yek' hin Kolmal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Hal wal yab'xil Cristo ayin, kan kab' wal a hin pixan. Ha satjub'takl wal yab'xil, kaw manhx jantkok wal swach'il."},{"id":4,"tag":null,"isDisplayed":null,"text":" 3     Ha yik xkulsax ki wach' Kolmal, xyak' wal cham sb'a ton ku'uj. Ix och wal sello aj xmukxi, kaw wal ix pitzw paxi. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Ha yab'xil ayk'nhej wal tiknek, yuj wal schamk'ojlal ayonh. Yujto honh sman yet' wal schik'il, jun ki wach' Kolmal Jesucristo."},{"id":0,"tag":1,"isDisplayed":null,"text":"Hal wal yab'xil Cristo ayin, kan kab' wal a hin pixan. Ha satjub'takl wal yab'xil, kaw manhx jantkok wal swach'il."}]},{"id":231,"title":"Hin Wach' Kolmal Aj K'inl Ayin","guid":"fw7jkULv2kyfYP6/YyGQLA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"23  Hin Wach' Kolmal Aj K'inl Ayin  \n \nC. S. G. #518 Rey De Mi Vida"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Heb. 12:1-3; Jn. 20:1-10; Mt. 10:32-39 \n \nHa yab’xil schamlil Cristo a spenk kulus, may ye’lch a sat heb’ anma wan satk’i. 1 Cor. 1:118</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1        Kaw hin Yajlil xo haj tiknek: yuj cha tzach hin b’itnej; Tzin na kot ha chamlil Jesús, yujto xab’ syal wu’uj."},{"id":0,"tag":1,"isDisplayed":null,"text":"Toto tz’at satk’ojlal wu’uj, ha yailal a te kulus, yet’ wal ha niwkil chamk’ojlal kaw tzak’ hin na koti."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Yuj jichk’ojlal tzwojkan eli,to pitzwnak hach xo; tanhwxnak ha niwnal hach Jesús, yuj wal heb' yangel Dios."},{"id":0,"tag":1,"isDisplayed":null,"text":"Toto tz’at satk’ojlal wu’uj, ha yailal a te kulus, yet’ wal ha niwkil chamk’ojlal kaw tzak’ hin na koti."},{"id":4,"tag":null,"isDisplayed":null,"text":"3       Kaw tzach hin chamk’ojlej Jesús,yujto hin ha mana. Kaw ix hak’ cham ha b’a wu’uj, yiklum oj wutk hin b’a."},{"id":0,"tag":1,"isDisplayed":null,"text":"Toto tz’at satk’ojlal wu’uj, ha yailal a te kulus, yet’ wal ha niwkil chamk’ojlal kaw tzak’ hin na koti."},{"id":5,"tag":null,"isDisplayed":null,"text":" \n4       Kaw oj hin b'o wal tza nib'ej,hach hin Kolmal Jesús. Tzaljk'ojlal oj wab' syal het'ok, yujto hach cham wu’uj."},{"id":0,"tag":1,"isDisplayed":null,"text":"Toto tz’at satk’ojlal wu’uj, ha yailal a te kulus, yet’ wal ha niwkil chamk’ojlal kaw tzak’ hin na koti."}]},{"id":232,"title":"Hin Wach' Kolmal Wal Jesús","guid":"kuOfZjdJI0qQOL17wUwWIg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"232    Hin Wach' Kolmal Wal Jesús\n \nC. S. G. # 386  Cristo Es Mi Dulce Salvador"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Jn. 15:5-15; Col. 1:15-23; Ef. 2:11-22 \n \nMamin Jehová, kojn hach tzach wa’ch yip hin k’ojol. Sal. 31.1</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1       Hin wach' Kolmal Jesús xjawi,  hin junk'ojlal yaji, kaw ix sch'ox schamk’ojlal  ayin,  yik ix cham a te kulus. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ha yik kaw ay hin kusk'ojlal,  ha tz'a’n wal sniwnal hin k'ojol. Kaw wal tzyak' sniwnal hin k’ojol, hin Jesús."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Hin wach' Kolmal Jesús xchami, ha schik'l hin mann eli, yujto ix yab’ syal yuj hin mul yuj cha xin chaj sjunk'ojlal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw wal oj wak' yajlil yet'ok,  a satcha'anh a jun ejmnhej. Oj hin k’och kajn a satcha'anh yet’ Jesús."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Hin wach' Kolmal Jesús xpaxi,  ha wal hin mann eli. Kaw wal niwkil schamk'ojlal jun,  kaw wal matz techj hin tojni. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Tza'n hin och yuj wal skuynb'il,  Matz hin xiw wab'n syal tiknek. Kaw matz hin xiw wab’n syail, yuj Jesús."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Kaw yuj hin wach' kolmal Jesús,  yuj cha hin kolchj kani, yuj ton wal cha matz hin xiwi,  yujto aych yipk hin k'ojol. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kaw oj wak' yajlil yet' Jesús,  a satchan a jun ejmnhej. Oj wak' yajlil yet' hin Jesús hin kolmal."}]},{"id":233,"title":"Hojnhej Xwak' Hin K'inal","guid":"fCNJyPw/AUCB9PISmpsP8w","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"233  Hojnhej Xwak' Hin K'inal \n \nC. S. G. #198  Mi Vida Di Por Ti"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>2 Corr. 5:11-21;  Fil. 2:1-11;  Jn. 10:1-15 \n \nHatn Cristo ix cham ki jelk ki masnil. 2 Cor. 5:15</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1       Hojnhej ix wak' hin k'inal, ix el wal hin chik'il. Hojnhej kaw ix wab' syail, yuj cha tzach kolchj kan wali. "},{"id":3,"tag":null,"isDisplayed":null,"text":"//Ho'oj ix wab' syal a te kulus, ¿Aym tas ix hak' wal ayin? // "},{"id":3,"tag":null,"isDisplayed":null,"text":"2      Ix wakkan wal jun satcha'anh, yet' wal hin tziktznial. Yik tzwul hin kolnk heb' ajmul, ay a yolyib'nhk'inal."},{"id":4,"tag":null,"isDisplayed":null,"text":" //Ho'oj ix wakkan smasnil wiko', ¿Aym tas ix hakkan wu'uj? // "},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Ho'oj ix wak' b'ilk'ojlal, b'ajwal yet' pax yail. Manh jantkok ix wab' syail, hin och a spatk te kulus. "},{"id":5,"tag":null,"isDisplayed":null,"text":"//Manh jantkok b'ajwal ix wab' ho'oj, ¿Aym aj xab'syal wuj hach tik? // "},{"id":5,"tag":null,"isDisplayed":null,"text":"4      Ix wij kot wal a satcha'anh, jun siylab' kaw niwan. Yuj schamk'ojlal hin Mam jun, tiknek ay ha kolnb'il."},{"id":6,"tag":null,"isDisplayed":null,"text":" // Kaw niwn jun siylab' ix wak' ayach, ¿Tas junk siylab' tzak' ayin? //"}]},{"id":234,"title":"Ix Jat Te Nip","guid":"5rJIFQBii02GwmMyPAW4Pw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"234  Ix Jat Te Nip\n \nV. C. # 122  Rasgóse El Velo"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mt. 27:51-54; Heb. 10:11-25; Heb. 9:24-28 \n \nYajnhj wal cha, ix jat snanhl jun te nip aych smaklok snanhl yatut Dios. Mt. 27:51</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Ix jat te nip yuj hin wach' Kolmal, yik xcham wal a te kulus. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Hin och a junk’ojlal yet’ Dios, Yuj cha tztak’ waln hin b’a ha a."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ix jat te nip, ix jaw sak k’inal, yuj cha tzwojkan el hin Dios. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Jesús ch’oxjnak el Dios aynhek, yuj cha tzin b’ey a sak k’inal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Ix jat tenip yuj cha xjaw kolnb’il. aw sakx waj yuj tiknek jun, "},{"id":5,"tag":null,"isDisplayed":null,"text":"manhxa hin xiwk’ojlal tiknek, yujto kaw ayx hin kolnb’il."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Yik xjat te nip kaw tzch'ox wal yechel, yik oj hin k'och yet' hin Dios."},{"id":6,"tag":null,"isDisplayed":null,"text":" Ix k'och Jesús a satcha'anh, yuj wal cha oj hin k'och yet'ok."}]},{"id":235,"title":"Iltek Ki Wach' Kolmal Jesús","guid":"Zc3bhjEFOUqBqm2szyNEBg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"235      Iltek Ki Wach' Kolmal Jesús \n \nC. S. G. # 197  Mirad Al Salvador Jesús"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mt. 27:35-51;  Is. 53;  Heb. 9:24-28 \n \nIx lajw sniwnal yuj ki mulek, xyab’ syal sniwnal chi yuj ki tu’al. Is. 53:5 </f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Iltek ki wach' kolmal Jesús, ix sch'ox wal schamk'ojlal jun. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Wujnhej ix cham a te kulus, wujnhej yuj may hin ch'olnil."},{"id":0,"tag":1,"isDisplayed":null,"text":" Ix sch'ox sb'a schamk'ojlal Jesús, a yik ix cham a te kulus. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Wujnhej, (wunhej) wujnhej yel, (wujnhej) wujnhej ix cham Jesús."},{"id":3,"tag":null,"isDisplayed":null,"text":"2  Ix och k'ik'k'inl a k'u a yik,ix cham Jesús hin Kolmal. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Ha k'en k'e'en ix jat a yik, x'el spixn hin kolmal Cristo."},{"id":0,"tag":1,"isDisplayed":null,"text":"  Ix sch'ox sb'a schamk'ojlal Jesús, a yik ix cham a te kulus. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Wujnhej, (wunhej) wujnhej yel, (wujnhej) wujnhej ix cham Jesús."},{"id":4,"tag":null,"isDisplayed":null,"text":"3  Tzin nakot ha chamlil Jesús, kaw tzkus hin k'ojl ho’oj. "},{"id":5,"tag":null,"isDisplayed":null,"text":"To tzwak' hin b'a aych hin Jesús, wujnhej ix hak' ha k'inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ix sch'ox sb'a schamk'ojlal Jesús, a yik ix cham a te kulus. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Wujnhej, (wunhej) wujnhej yel, (wujnhej) wujnhej ix cham Jesús."}]},{"id":236,"title":"Ix Cham Jesús A Te Kulus","guid":"03ahxceilUCUU/PK/WQB+g","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"236  Ix Cham Jesús A Te Kulus\n \nC. S. G. # 199 En La Vergonzosa Cruz"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>1 P. 2:21-25; 1 Co. 15:1-10; 1 Co. 1:17-24 \n \n…To ha Cristo ix cham yuj ki mulek, icha yaj stz’ib’x kan a ch’anh hu’unh. 1 Co. 15:3</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Xcham Jesús a te kulus, yuj hin mul ix yab' syail. Kaw ix el schik'l hin Kolmal, yuj cha kaw hin kolchj kani. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Yuj wal schik'l hin wach' kolmal, kaw ix el smasnil hin mul. Ix kulsax hin wach' kolmal, ix el schik'l a te kulus."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ix cham Jesús,(ix cham Jesús) a te kulus; (a te kulus) kaw wujnhej xcham hin Kolmal. Yuj cha kaw ay hin k'inal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ay schamk'ojlal hin Jesús, yuj cha xcham a te kulus. Ix yij el hin maysch'olnil, yuj cha kolb'iln xo tiknek."},{"id":4,"tag":null,"isDisplayed":null,"text":" Hach hin Cristo Wajlil hach, tzwak' hin niwnal tik ayach. Ya' sb'a ayn ek’ wal a tik, kaw tzin ha’ch wal yiklumal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ix cham Jesús,(ix cham Jesús) a te kulus; (a te kulus) kaw wujnhej xcham hin Kolmal. Yuj cha kaw ay hin k'inal."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Han tik yik hin xo Jesús, kaw oj woch tza'n wal yu'uj. Yujto manb’iln xo yu’uj, oj wak' serwil hin Diosal."},{"id":5,"tag":null,"isDisplayed":null,"text":" Kajn och wal a hin pixan, yuj cha ay hin tzaljk'ojlal. Yuj schamlil a te kulus, yuj cha ay hin junk’ojlal."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ix cham Jesús,(ix cham Jesús) a te kulus; (a te kulus) kaw wujnhej xcham hin Kolmal. Yuj cha kaw ay hin k'inal."}]},{"id":237,"title":"Kaw Ix Yab’ Jesús Syail","guid":"LXSdrb+ItEW7EKDBzqhB2Q","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"237      Kaw Ix Yab’ Jesús Syail \n \nV. C. # 54  Levantado Fue Jesús"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mt. 26:28; Mt. 27:32-56; Hch. 2:22-38 \n \nHax Jesús, toxn ix skuch skulsal. Ix at a sti el chonhab’, hatn a gólgota a hebreo. Jn. 19:17</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Kaw ix yab' Jesús syail, yik ix cham a te kulus. Yik hin kolchj kan el yu’uj, aleluya yel wach' Cristo."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Kaw wal yel may hin ch'olnil, palta Cristo hin kolni. Ix yak' cham sb'a hin jelok, aleluya kaw wach' Cristo."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Yuj wal hin maysch’olnilal, yuj cha aych chaml a wib’an. Palta Cristo xcham wu’uj ¡Aleluya! Yel wach' Cristo."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Tox ix sman wal hin kolnb'il, ix b’o e’lch smasnil yu’uj. Dios hin chan och yiko ok, aleluya yel wach' Cristo."}]},{"id":238,"title":"Tas Wach' Tztak' Hin Skolni","guid":"X+qmXPNerEKZ9m/k1enovw","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"238    Tas Wach' Tztak' Hin Skolni\n \nC. S. G. # 298 ¿Qué Me Puede Dar Perdón?"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>1 Jn. 1; Heb. 9:13-22; Tit. 2:11-15\n \n …May junk mach tzlajw kan smul, toto may chik’ tz’el yuj smul cha. He. 9:22</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     ¿Tas wach' tztak' hin skoln eli? kojn schik'l Jesucristo. ¿Tas tz’aj ya’tb’i hin pixan? Kojn schik'l Jesucristo. "},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw yel wach' hin Cristo, to kaw wal tzb'ikl hin pixan. May wal junk ha ixta', kojn schik'l Jesucristo."},{"id":3,"tag":null,"isDisplayed":null,"text":"2      May tas tztak' yi'n el hin mul, kojn schik'l Jesucristo. Xyak junk’ojlal yet’ swach’il, kojn schik'l Jesucristo."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw yel wach' hin Cristo, to kaw wal tzb'ikl hin pixan. May wal junk ha ixta', kojn schik'l Jesucristo."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Ix chax wal jun hin k'inal, kojn schik'l Jesucristo. Ix yak' wal hin tzaljk'ojlal, kojn schik'l Jesucristo."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw yel wach' hin Cristo, to kaw wal tzb'ikl hin pixan. May wal junk ha ixta', kojn schik'l Jesucristo."},{"id":5,"tag":null,"isDisplayed":null,"text":"4      Kaw tzin b'itn a yojltak, kojn schik'l Jesucristo. Smoj yijx chanh sb’i hin kolmal, kojn schik'l Jesucristo."},{"id":0,"tag":1,"isDisplayed":null,"text":"Kaw yel wach' hin Cristo, to kaw wal tzb'ikl hin pixan. May wal junk ha ixta', kojn schik'l Jesucristo."}]},{"id":239,"title":"Tzaljk'ojlal Yik Tzin Nan Te kulus","guid":"53JUwOXvc06EssU8Qx9oeg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"239   zaljk'ojlal Yik Tzin Nan Te kulus\n \nC. S. G. # 326  La Hermosa Visión De La Cruz\n "},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Col. 1:15-23; Ef. 2:11-22; Gl. 6:11-15\n \n Yujto xcham Cristo yet’ sniwnal kujek. Ixta x’aj schami, sek tzonh yijek och yiko’ok. Col. 1:22</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Kaw wal najtl hin b’ojnak maysch'olnilal pekti', kaw kusk'ojlal wal yaj hin pixan. "},{"id":3,"tag":null,"isDisplayed":null,"text":"A jun b'e yik chamel, hata wan hin b'eyi, wan hin k'och a jun niwkil yail."},{"id":0,"tag":1,"isDisplayed":null,"text":"A skal k’ak’ ha ta wan hin ati,(skal k’ak’  tzin ati) yuj cha ix hin sayn ek’ wal Jesús. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Kaw yajnhej xwa’ch hin k’ojl a Jesús,(hin kolchji) manhx jin at a skal yailal tiknek."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Yuj hin Kolmal Jesús tzaljk'ojlal xo waji,kaw wal manhxa hin kusk'ojlal jun. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yuj cha xjelmj hin nab’en, yujto xin chaj Jesús tzin schamk'ojlej a smasnil k'inal."},{"id":0,"tag":1,"isDisplayed":null,"text":"A skal k’ak’ ha ta wan hin ati,(skal k’ak’  tzin ati) yuj cha ix hin sayn ek’ wal Jesús."},{"id":5,"tag":null,"isDisplayed":null,"text":" Kaw yajnhej xwa’ch hin k’ojl a Jesús,(hin kolchji) manhx jin at a skal yailal tiknek."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      He masnil hex anma', nak he b'a wal tiknek,yujto kusk'ojlal yaj he pixan. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw wal al he yaji, yuj he maysch'olnilal, kotnhek a hin wach' kolmal Jesús."},{"id":0,"tag":1,"isDisplayed":null,"text":"A skal k’ak’ ha ta wan hin ati,(skal k’ak’  tzin ati) yuj cha ix hin sayn ek’ wal Jesús. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Kaw yajnhej xwa’ch hin k’ojl a Jesús,(hin kolchji) manhx jin at a skal yailal tiknek."}]},{"id":240,"title":"Tzki Na Kot Schamlil Cristo","guid":"KquIcee/qk6JA/ofxZqG9w","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"240    Tzki Na Kot Schamlil Cristo\n \nB. B. D. # 170."},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mt. 26:36-46; Jn. 13: 21-27; Jn. 19:31-37\n \n ...Tox ix b’o e’lch smasnil, xchi. Xlajwxoj cha, ix em nhojnjok, ix chami’. Jn. 19: 30</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Hach ki Kolmal tzki na kot wal ha chamlil Mamin, kujnhej hach cham a te kulus, yuj ha chamk'ojlal."},{"id":3,"tag":null,"isDisplayed":null,"text":" Kaw yel ix hab' syail, yuj wal ki maysch'olnilal, hach hin Jesús hach leslwi a Getsemaní."},{"id":3,"tag":null,"isDisplayed":null,"text":"2       Ha yik aych ek' a Getsemaní kaw hach kusi hata hach em kuman, yik hach leslwi Mamin."},{"id":4,"tag":null,"isDisplayed":null,"text":" Kaw til wal ix hab' syail, yuj cha kaw ix el hep, yel icha yem niwk tz'uj, ixta x'aj yel halil ta'."},{"id":4,"tag":null,"isDisplayed":null,"text":"3       Kaw hach schonh win Judas a yol sk'ab' heb'maysch'olnil, tikni kaw Dios hach Mamin, hach sb'uch pax heb' anma'."},{"id":5,"tag":null,"isDisplayed":null,"text":" A yojltak Pilato ix awj chanh heb' anma'. ¡Och kab' win a spenk kulus, manh ki Reylok! Xchi heb'."},{"id":5,"tag":null,"isDisplayed":null,"text":"4      Yik hach kulsax Mamin, kaw niwkil ton xab’ syail, smasnil ki maysch’olnil honh xa chaj och a heb’anh. "},{"id":6,"tag":null,"isDisplayed":null,"text":"Yuj ton wal ki mul honh, yuj cha x’och chaml a heb’anh, yuj ki maysch'olnilal honh, ixta wal hach aji."},{"id":6,"tag":null,"isDisplayed":null,"text":"5      Kaw tzki na kot jun ak' lajti yuj wal ha chik'il, yuj cha manhx tzak ha na kot ki maysch'olnilal honh. "},{"id":7,"tag":null,"isDisplayed":null,"text":"Ha yik tzki chan jun Cena, tzki nan kot ha chamlil, masnto yik oj ha japx a skal ha tziktznial."}]},{"id":241,"title":"Tzkus Hin K'ojol Xchi Jesús","guid":"z3n2/2xg5UytYaJPNfjLLg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"241   Tzkus Hin K'ojol Xchi Jesús \n \nM. D. B. # 34 La Oración De Jesús"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Mt. 26:36-46; Lc. 22:39-46  \n \nYuj cha, xyaln ixtk a heb’: Ijn wal tzin cham yuj kusk’ojlal, kannhek a tik. Pitzn hex kab’ wet’ok, xchi a heb’. Mt. 26:38</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1    Tzkus hin k'ojol, kaw tzkus hin pixan, xchi ki Kolmal a heb’ skuywum jun. Ix at Jesús a Getsemaní, Ix em kuman wal a ki Mam Dios "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ox ejm ix leslwi ki Kolmal, hax heb skuywum kaw ix kot swaynh heb'. Kaw ix skuch Jesús wal skulsal jun, kaw al xyab'i, kaw ix yab' syail."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     A yoxl k'u xpitzw pax Jesús, kaw ix k'ewan a skal heb' chamnak. Chawink to k'u ix to b'eyk' Jesús, kaw ix sch'oxsb'a a heb' skuywum jun. "},{"id":4,"tag":null,"isDisplayed":null,"text":"A skal asun ix pax k'e Jesús, tzaljk'ojlal ix k'och a satcha'anh. Oj jawk Jesús icha letz'lo'om, kaw oj och b'it skot a satcha'anh."},{"id":4,"tag":null,"isDisplayed":null,"text":"3    Jun mil hab'il kaw oj yak' Yajlil, hin wach' Kolmal a Jerusalén. Hanh yunnalnhek oj ka'k yajlil jun, jun mil hab'il yet' ki wach' Kolmal. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Kaw manhxa kuslal, manhxa howal, manhxa chamel, manhxa yailal. Kaw tzaljk'ojlal oj kajk yet' Jesús, smasnil k'inal oj ki kank yet'ok."}]},{"id":242,"title":"Wach' Jun Spak'b'ail K'inal","guid":"ctQubMgxK0mzL4pgVaEkkg","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"242   Wach' Jun Spak'b'ail K'inal\n \nC. S. G. # 524 Hay Un Precioso Manantial"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Is. 1:16-19; Ap. 7:9-17; Lc. 23:32-46\n \n Ha wal a yik jun k’ul cha oj jakwk jun ha pak’b’a, sek wach’ oj stak’ sb’ikx el smul yet’ maysch’olnilal heb’ yinhtl David. Zac. 13:1</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1       Kaw yel wach' jun spak'b'ail k'inal, Ha schik’il Jesús x'el a kulus. Ha tzb'ikn el smasnil maysch’olnilal, heb’ to tzya’ch wal sk’ojl ha a’. "},{"id":3,"tag":null,"isDisplayed":null,"text":" Ha tzb’ikn el smasnil maysch'olnilal, heb’ to tzya’ch sk’ojl a ki Kolmal. Ha tzb'ikn el kan wal smasnil ki mul, yet’ smasnil maysch’olnilal."},{"id":3,"tag":null,"isDisplayed":null,"text":"2       Jun ajmul ix kulsax yet' Jesús, ix yil yel wal schik'l a spatk kulus. Kaw yajnhej ix el wal smul yu'uj, yujto xya'ch sk’ojl a Jesús. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Yujto xya'ch wal sk'ojl a ki Kolmal, Yuj cha, ix el smul a yib’anh. Kaw yajnhej ix el wal smul yu'uj, yujto xya'ch sk'ojl a Jesús."},{"id":4,"tag":null,"isDisplayed":null,"text":"3       Ha pekti' ayn at a skal tu'al, yuj wal cha ayn ek’ a k'ik'k'inal. Hal tiknek hin sb'ik wal yet' schik'il, yuj wal cha xjaw hin nab'en. "},{"id":5,"tag":null,"isDisplayed":null,"text":"Yuj cha tzwal wach’ paxti a Jesús, tox ix jaw wal hin nab'en jun. Al tiknek hin sb'ik wal yet' schik'il, tzin b’itnej a tzaljk’ojlal."},{"id":5,"tag":null,"isDisplayed":null,"text":"4        Ha wal schamk’ojlal ki wach’ Kolmal, lajn wal icha junk b’eymal ha’.  Ha tzb’ikn el smasnil smaysch’olnilal, heb’ to tzya'ch wal sk’ojl ha a.  "},{"id":6,"tag":null,"isDisplayed":null,"text":"Heb’ to tzya'ch wal sk’ojl a ki Kolmal, heb’ to tzya’ch ton wal sk’ojl ha a, ha tzb’ikn el smasnil smaysch’olnilal, heb’ to tzya’ch wal sk’ojl ha a."}]},{"id":243,"title":"Ha Heb' Tz'el Yal Sat","guid":"LEoeibVjrEm/gfW66SFKoQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"243     Ha Heb' Tz'el Yal Sat \n \nC. S. G. # 471. Los Que Con Lágrimas"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 126; Jer. 31:15-17;  Jn. 4:31-38 \n \nHa heb’ tz’aw yet’ skusk’ojlal, hax yik oj smolnok chanh heb’ sat yawb’en cha, kaw oj tzaljok heb’.  Sal. 126:5</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Smasnil heb' kaw tzyab' syal yuj yik Dios, kaw tzaljk'ojlal oj scha heb' spak. "},{"id":3,"tag":null,"isDisplayed":null,"text":"Ha wal ajtil ix el yal sat heb', kaw oj satnok wal spaxti Dios. "},{"id":0,"tag":1,"isDisplayed":null,"text":"Ay aj tzkus heb’, (ay aj tzkus heb’,) ay aj tz'ok' heb’, (ay aj tz'ok' heb’,) kaw tzaljk'ojlal oj meltzjok heb’."},{"id":4,"tag":null,"isDisplayed":null,"text":" Ay aj tzkus heb’, (ay aj tzkus heb’,’) ay aj tz'ok' heb’,(ay aj tz'ok' heb’,) kaw tzaljk'ojlal oj scha heb’ spak."},{"id":3,"tag":null,"isDisplayed":null,"text":"2       Ha yik oj yilnok wal spak smunljel, kaw oj sb'itnok wal sb'i ki Dios. "},{"id":4,"tag":null,"isDisplayed":null,"text":"Maj satl smasnil tas ix yawej, palta kaw niwn oj aj e’lchi."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ay aj tzkus heb’, (ay aj tzkus heb’,) ay aj tz'ok' heb’, (ay aj tz'ok' heb’,) kaw tzaljk'ojlal oj meltzjok heb’."},{"id":5,"tag":null,"isDisplayed":null,"text":" Ay aj tzkus heb’, (ay aj tzkus heb’,’) ay aj tz'ok' heb’,(ay aj tz'ok' heb’,) kaw tzaljk'ojlal oj scha heb’ spak."}]},{"id":244,"title":"Ch'oxn Hach Wajlil","guid":"CNgV6qFyykCiOWnpdO7zXA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"244    Ch'oxn Hach Wajlil\n \nV. C. # 188  Guíame Oh Salvador"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Ro. 8:14; Jn. 16:13; Sal. 27:11 \n \nMamin Jehová, cho’x wal ayin tas tzwutj hin tojlbtzan hin b’eyb’al. Sal. 27:11</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1      Ch’ox hin hach Wajlil Mamin, yik tzin b'ey a tzaljk’ojlal. May xiwk’ojlal ha a tz’ey, tzaljk’ojlalnhej wal ay ta."},{"id":0,"tag":1,"isDisplayed":null,"text":"Cristo, Cristo, manh hin hakkan hach Wajlil Mamin. Tzin ha ch'ox wal ha a b'e, tzaljk'ojlal oj hin k'ochi."},{"id":3,"tag":null,"isDisplayed":null,"text":"2  Manh hin hakkan hach Mamin, ya’sb’a kaw wal pitzn hin to. Sek wach' may aj tzin xiwi, a yik tzk'och sk’ul hin chami."},{"id":0,"tag":1,"isDisplayed":null,"text":"Cristo, Cristo, manh hin hakkan hach Wajlil Mamin. Tzin ha ch'ox wal ha a b'e, tzaljk'ojlal oj hin k'ochi."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Hach Mamin hin wach' Kolmal, koln a smasnil hin yail. Ha yik tzin yawtj maysch’olnil, ak' wip sek ma tzin telwi."},{"id":0,"tag":1,"isDisplayed":null,"text":"Cristo, Cristo, manh hin hakkan hach Wajlil Mamin. Tzin ha ch'ox wal ha a b'e, tzaljk'ojlal oj hin k'ochi."}]},{"id":245,"title":"Ha A Paxti Mamin","guid":"+u3PdkaiSEmLtzSacOnbgA","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"245  Ha A Paxti Mamin \n \nC. S. G. # 276  Padre, Tu Palabra"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Sal. 119:43-56; Sal. 119: 97-105; Sal. 119:129-135\n \n Ketzn b’ey yet’ ha  paxti’, manh hin a cha telwok yuj maysch’olnil. Sal. 119:133</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ha a paxti hach Mamin, ha wal tz’a'n hin tzaljk’ojlal. Tzin yijb’eyk aj tzin ek’i, tzyak’ junk’ojlal wal ayin."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha wal ha paxti', tzch'oxn ha b'e ayin, may b’a'nh oj lajwok swach’il, ha tzin ketzn at a swach’il."},{"id":3,"tag":null,"isDisplayed":null,"text":"2     Ha yik ix wab’n ha paxti', ix ilchj wach'k'ojlal wu'uj. Kaw wal te'n nhej tzwutj hin b'a, yik tzin b'ey aj tza nib'ej."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha wal ha paxti', tzch'oxn ha b'e ayin, may b’a'nh oj lajwok swach’il, ha tzin ketzn at a swach’il."},{"id":4,"tag":null,"isDisplayed":null,"text":"3      Ha wal ha paxti Mamin, kaw wal tzyak' ton hin te'nal. A skal smasnil maysch'olnil, tzyak' sjunk'ojlal hin pixan."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha wal ha paxti', tzch'oxn ha b'e ayin, may b’a'nh oj lajwok swach’il, ha tzin ketzn at a swach’il."},{"id":5,"tag":null,"isDisplayed":null,"text":"4     Ha wal tas tzyal ha paxti', hatn tz'a'n hin tzalk'ojlal. Kolwjanh wet' hach Mamin, sek wach' yiklum hin ayach."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha wal ha paxti', tzch'oxn ha b'e ayin, may b’a'nh oj lajwok swach’il, ha tzin ketzn at a swach’il."}]},{"id":246,"title":"Ha A Paxti' Kaw Yel","guid":"1u9iZPxfmE6/bdl5yR5ecQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"246     Ha A Paxti' Kaw Yel\n \nManh Cheklok Aj Kotnk Jun B´it Tik"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>Hch. 17:10-15; Heb. 4:12; 2 Ti. 3:16 \n \nHax a junjn k’u, skuy heb’ Ch’anh Hunh aj tz’ib’b’il kan spaxti Dios cha, yik tzyiln heb’ toto yel tzyal Pablo yet’ Silas cha.  Hch. 17: 11</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1        Hach ki Diosal yamn honh wal xo, yuj ki kuyn ha paxti'. Ha a paxti' til wal swach'il, yel xo chi wal tzwab'i."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha a paxti' kaw yel toni, may es a skal yuj hek toni. Yel xo chi icha wal no yalchab' jun, "},{"id":3,"tag":null,"isDisplayed":null,"text":"xchi David a ch'anh Salmo ix stz'ib'ej; ek'b'al icha espada kaw chab' ye, yuj cha ak' ki nib'ok."},{"id":3,"tag":null,"isDisplayed":null,"text":"2       Ha a paxti tzonh i'n b'eyok, wal a tas tza nib’ej. Tzonh stench wa'an a ki tu'al, yik tu tzkutj wal ki b'a."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha a paxti' kaw yel toni, may es a skal yuj hek toni. Yel xo chi icha wal no yalchab' jun, "},{"id":4,"tag":null,"isDisplayed":null,"text":"xchi David a ch'anh Salmo ix stz'ib'ej; ek'b'al icha espada kaw chab' ye, yuj cha ak' ki nib'ok."},{"id":4,"tag":null,"isDisplayed":null,"text":"3     Hach ki Diosal, hach Kajlilal, jak wal ki nab'en jun. Ak' k'asnb'ok ki nab’en honh, yik tzkiln wal ha paxti'."},{"id":0,"tag":1,"isDisplayed":null,"text":"Ha a paxti' kaw yel toni, may es a skal yuj hek toni. Yel xo chi icha wal no yalchab' jun, "},{"id":5,"tag":null,"isDisplayed":null,"text":"xchi David a ch'anh Salmo ix stz'ib'ej; ek'b'al icha espada kaw chab' ye, yuj cha ak' ki nib'ok."}]},{"id":247,"title":"Ha Ch'anh Biblia","guid":"fFBo7UOA8UugwpMoGb+bkQ","verses":[{"id":null,"tag":null,"isDisplayed":null,"text":"247 Ha Ch'anh Biblia \n \nC. S. G. # 270 Santa Biblia"},{"id":2,"tag":null,"isDisplayed":null,"text":"<i><fMicrosoft Himalaya>2 P. 1:16-21; Sal. 119:9-24 \n \nTzin mol ha paxti’ a hin nab’en, sek matz och hin mul ayach. Sal. 119:11</f></i>"},{"id":2,"tag":null,"isDisplayed":null,"text":"1     Ha wal spaxti ki Mam Dios kaw wal yel xo niwn ye’lchi. Yujto yelnhej tas tzyala, ha snib’b’en Dios tzyal aynhek. "},{"id":3,"tag":
